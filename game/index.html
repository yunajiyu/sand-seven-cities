<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모래 아래의 일곱 도시</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b14; overflow: hidden; }

  </style>
</head>

  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
