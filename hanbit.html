<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재개발 예정 단지</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{
  /* 도트 팔레트(16색 계열) — 밝은 테마 */
  --bg:#e9e2cf; --panel:#f6f1e1; --ink:#1a1c2c; --muted:#4a5874; --line:#333c57;
  --accent:#257179; --accent2:#3b5dc9; --hl:#8a5a00; --danger:#b13e53; --ok:#2d8a4a; --warn:#b8541f;
  --on-accent:#f4f4f4; --edge:#1a1c2c;
  --shadow:3px 3px 0 var(--edge);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c2c; --panel:#262b44; --ink:#f4f4f4; --muted:#94b0c2; --line:#566c86;
    --accent:#a7f070; --accent2:#73eff7; --hl:#ffcd75; --danger:#ff6f7d; --ok:#a7f070; --warn:#ef7d57;
    --on-accent:#1a1c2c; --edge:#0b0c14;
    --shadow:3px 3px 0 var(--edge);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c2c; --panel:#262b44; --ink:#f4f4f4; --muted:#94b0c2; --line:#566c86;
  --accent:#a7f070; --accent2:#73eff7; --hl:#ffcd75; --danger:#ff6f7d; --ok:#a7f070; --warn:#ef7d57;
  --on-accent:#1a1c2c; --edge:#0b0c14;
  --shadow:3px 3px 0 var(--edge);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Galmuri11','Galmuri9','DotGothic16','Noto Sans KR',monospace;font-size:15px;line-height:1.6;-webkit-font-smoothing:none;font-smooth:never}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:0;padding:7px 14px;box-shadow:var(--shadow)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
button:hover:not(:disabled){background:var(--bg);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--ink);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.12)}
button.small{padding:4px 10px;font-size:13px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:0;padding:8px 10px;width:100%;box-shadow:inset 2px 2px 0 rgba(0,0,0,.25)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:3px solid var(--ink);outline:2px solid var(--line);outline-offset:-7px;border-radius:0;padding:20px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:500;margin:12px 0 4px}
h4{margin:10px 0 6px}

/* title */
#title{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
#title h1{font-size:34px;margin:0 0 8px;color:var(--accent);letter-spacing:1px;text-shadow:3px 3px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge)}
#title .skyline{display:block;width:288px;max-width:80vw;height:auto;margin:0 auto 14px;image-rendering:pixelated;shape-rendering:crispEdges}
#title .sub{color:var(--muted);margin-bottom:28px;word-break:keep-all;padding:0 20px}
#title .btns{display:flex;flex-direction:column;gap:10px;width:240px;margin:0 auto}

/* game — 미연시 화면: 상태바 / 장면 / 스크립트창 / 선택지 */
#game{position:relative;display:flex;flex-direction:column;height:100vh;height:var(--vvh,100dvh);overflow:hidden;background:#05070d;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.topbar{background:#1a1c2c;border-bottom:3px solid #f4f4f4;padding:3px 10px 4px;color:#f4f4f4;flex:0 0 auto;z-index:3}
.tb{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.stats{display:flex;gap:0 12px;font-size:12.5px;line-height:1.5;flex:1;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats .st{flex:0 0 auto}
.stats .low{color:#ff6f7d}
.topbar button.small{padding:0 9px;font-size:15px;line-height:1.5;background:#262b44;color:#f4f4f4;border-color:#f4f4f4;box-shadow:2px 2px 0 #0b0c14}
#goal{max-width:860px;margin:0 auto;font-size:11.5px;line-height:1.45;color:#ffcd75;line-height:1.35}
#goal::before{content:'🎯 '}
#saveWarning{padding:8px 10px;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border-bottom:3px solid var(--danger);z-index:3}
#scene{position:relative;flex:1 1 0;min-height:0;overflow:hidden;cursor:pointer}
#sceneBg{position:absolute;inset:0}
#cast{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:0 8px}
.pt{width:192px;height:192px;max-width:44vw;max-height:44vw;image-rendering:pixelated;object-fit:contain;transition:filter .2s,opacity .2s}
.pt.dim{filter:brightness(.4);opacity:.75}
#placeLabel{position:absolute;left:10px;top:10px;font-size:12px;color:#f4f4f4;background:#1a1c2c;border:2px solid #f4f4f4;padding:1px 9px;pointer-events:none}
#choices{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2;max-width:560px;margin:0 auto}
#choices button{text-align:left;font-size:calc(15px*var(--fs,1));line-height:1.4;padding:11px 13px 11px 30px;background:#1a1c2c;color:#f4f4f4;border:3px solid #f4f4f4;box-shadow:inset 0 0 0 2px #566c86,3px 3px 0 #0b0c14;position:relative}
#choices button::before{content:'▶';position:absolute;left:10px;top:11px;color:#a7f070;font-size:12px;line-height:1.7;opacity:.35}
#choices button:hover:not(:disabled),#choices button:focus-visible{background:#333c57;border-color:#a7f070}
#choices button:hover:not(:disabled)::before,#choices button:focus-visible::before{opacity:1}
#script{position:relative;flex:0 0 auto;height:min(32dvh,280px);min-height:148px;background:#1a1c2c;border-top:4px solid #f4f4f4;box-shadow:inset 0 4px 0 #566c86;padding:22px 16px calc(12px + env(safe-area-inset-bottom));color:#f4f4f4;cursor:pointer;z-index:2}
#scriptInner{max-width:560px;margin:0 auto;height:100%;overflow-y:auto}
#nameTag{position:absolute;left:14px;top:-18px;background:#a7f070;color:#1a1c2c;border:3px solid #f4f4f4;font-size:14px;padding:0 14px;line-height:1.6;display:none;box-shadow:3px 3px 0 #0b0c14}
#scriptText{font-size:calc(16px*var(--fs,1));line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
#scriptText.n{color:#94b0c2}
#scriptText.d{color:#f4f4f4}
#scriptText.s{color:#ffcd75;font-size:calc(14px*var(--fs,1))}
#nextMark{position:absolute;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));color:#a7f070;font-size:13px;opacity:0;animation:blink 1s steps(2) infinite}
#nextMark.on{opacity:1}
@keyframes blink{50%{opacity:.25}}
.entry{word-break:keep-all;overflow-wrap:anywhere;margin:0 0 10px;font-size:calc(15px*var(--fs,1));line-height:1.6}
.entry.n{color:var(--muted)}
.entry.d b{color:var(--accent);margin-right:8px}
.entry.action{color:var(--accent2);font-weight:500;font-size:calc(13px*var(--fs,1))}
.entry.action::before{content:'▸ '}
.entry.s{color:var(--warn);font-size:calc(13px*var(--fs,1))}
.logbox{max-height:62vh;overflow-y:auto}
.zmap{width:100%;height:auto;max-height:60vh;display:block;margin:0 auto;shape-rendering:crispEdges}
.zedge{stroke:var(--line);stroke-width:3;stroke-dasharray:6 4}
.znode{cursor:default;outline:none}
.znode rect{fill:var(--panel);stroke-width:3}
.znode.r1 rect{stroke:var(--ok)}
.znode.r2 rect{stroke:var(--hl)}
.znode.r3 rect{stroke:var(--warn)}
.znode.r4 rect{stroke:var(--danger)}
.znode.adj{cursor:pointer}
.znode.adj rect{fill:var(--bg)}
.znode.far{opacity:.55}
.znode.cur rect{fill:var(--accent)}
.znode:focus-visible rect{stroke:var(--accent2);stroke-width:4}
.znode .ic{font-size:17px;text-anchor:middle;dominant-baseline:central}
.znode .lb{font-size:11px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:miter}
.znode .rk{font-size:8px;text-anchor:middle;fill:var(--muted);letter-spacing:1px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#zoneCard{font-size:13px;color:var(--muted);margin-top:4px}
#zoneCard b{color:var(--ink)}

/* modal · toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,12,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--panel);border:3px solid var(--ink);outline:2px solid var(--line);outline-offset:-7px;border-radius:0;box-shadow:5px 5px 0 var(--edge);max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;border-bottom:3px solid var(--line)}
.modal header h3{margin:0}
.modal .body{padding:12px 16px;overflow-y:auto}
.sbtn{display:flex;flex-direction:column;gap:6px}
.lex{border:2px solid var(--line);border-radius:0;padding:10px;margin-bottom:8px;background:var(--bg)}
.lex .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lex .cat{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border:3px solid var(--edge);border-radius:0;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:.95}
.fsLabelM{min-width:42px;text-align:center}
@media (max-width:520px){ #title h1{font-size:28px} }
</style>
</head>

width="2" height="2" fill="#1a1c2c"/><rect x="68" y="19" width="2" height="2" fill="#1a1c2c"/><rect x="72" y="19" width="2" height="2" fill="#1a1c2c"/><rect x="60" y="23" width="2" height="2" fill="#1a1c2c"/><rect x="64" y="23" width="2" height="2" fill="#1a1c2c"/><rect x="68" y="23" width="2" height="2" fill="#1a1c2c"/><rect x="72" y="23" width="2" height="2" fill="#ffcd75"/><rect x="60" y="27" width="2" height="2" fill="#1a1c2c"/><rect x="64" y="27" width="2" height="2" fill="#1a1c2c"/><rect x="68" y="27" width="2" height="2" fill="#ffcd75"/><rect x="72" y="27" width="2" height="2" fill="#1a1c2c"/><rect x="80" y="13" width="14" height="19" fill="#333c57"/><rect x="80" y="13" width="14" height="1" fill="#566c86"/><rect x="92" y="14" width="2" height="18" fill="#262b44"/><rect x="82" y="16" width="2" height="2" fill="#ffcd75"/><rect x="86" y="16" width="2" height="2" fill="#1a1c2c"/><rect x="82" y="20" width="2" height="2" fill="#1a1c2c"/><rect x="86" y="20" width="2" height="2" fill="#1a1c2c"/><rect x="82" y="24" width="2" height="2" fill="#1a1c2c"/><rect x="86" y="24" width="2" height="2" fill="#1a1c2c"/><rect x="82" y="28" width="2" height="2" fill="#1a1c2c"/><rect x="86" y="28" width="2" height="2" fill="#1a1c2c"/><rect x="0" y="30" width="96" height="2" fill="#0b0c14"/></svg>

<section id="create" class="hidden">

    <div class="card">
      <h2 style="margin-top:0">이름</h2>

<!-- 게임 -->
<section id="game" class="hidden">
  <div class="topbar">
    <div class="tb">
      <div class="stats" id="stats"></div>
      <button class="small" onclick="openMenu()" aria-label="메뉴" title="메뉴">☰</button>
    </div>
    <div id="goal"></div>
  </div>
  <div id="saveWarning" role="alert" style="display:none"><span>⚠ 자동 저장에 실패했습니다. 현재 진행을 파일로 보관해 주세요.</span><button class="small" onclick="exportSave()">저장 내보내기</button></div>
  <div id="scene" onclick="tapAdvance(event)">
    <div id="sceneBg"></div>
    <div id="placeLabel"></div>
    <div id="cast"></div>
    <div id="choices"></div>
  </div>
  <div id="script" onclick="tapAdvance(event)">
    <div id="nameTag"></div>
    <div id="scriptInner"><div id="scriptText" class="n" aria-live="polite"></div></div>
    <div id="nextMark">▼</div>
  </div>
</section>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   재개발 예정 단지 — 게임 스크립트 (좀비 아파트 탈출 + 연애 시뮬레이션)

   읽는 순서
     1. 데이터 ............ 구역·길·물건·탈출 경로·시간대 같은 고정 값
     2. 상태·저장·설정
     3. 공용 도구
     4. 엔진 .............. 훅(Hook) · AI 호출 · 사용량
     5. 구역 규칙 ......... 이동·목표 한 줄·선택지 목록 (코드가 판정)
     6. 화면 · 설정 창 · 시작

   원칙
     - 위치·수치·엔딩 조건은 코드가 정한다. AI는 장면 묘사와 대사만 쓴다.
     - 선택지는 코드가 만든 목록에서만 고른다(템플릿 문구, AI 추가 호출 없음).
     - 새 기능은 on(point,순서,fn)으로 훅에 등록하고, 행동은 ACTIONS 표에 한 줄 추가한다.
         on('choices', 순서, fn)  선택지 목록을 만들 때(목록 배열을 고침)
         on('render',  순서, fn)  화면을 그린 뒤
         on('after',   순서, fn)  한 행동이 끝난 뒤
     - 순서 숫자가 작을수록 먼저 실행됩니다.
   ========================================================================== */

/* =========================================================
   1. 데이터

/* strict=false: 나중에 추가된 선택 항목이 비어 있어도 통과(migrate가 채운다). 설치 전에는 항상 strict로 다시 검사 */
function validateSaveData(g,strict=true){
 const opt=k=>!strict&&!!g&&g[k]===undefined;
 const obj=x=>!!x&&typeof x==='object'&&!Array.isArray(x), finite=x=>typeof x==='number'&&Number.isFinite(x);
 if(!obj(g)||g.v!==2) throw Error('이 게임의 저장 파일이 아닙니다.');
 if(!obj(g.char)||typeof g.char.name!=='string'||!g.char.name.trim()||g.char.name.length>20) throw Error('캐릭터 정보가 없거나 손상됐습니다.');
 if(!Number.isInteger(g.day)||g.day<1||g.day>LAST_DAY||!Number.isInteger(g.slot)||g.slot<0||g.slot>=TIMES.length||typeof g.loc!=='string'||!own(ZONE,g.loc)) throw Error('날짜·시간·위치 정보가 손상됐습니다.');
 if(!['hp','maxhp','food','water'].every(k=>finite(g[k]))||(!opt('meds')&&!finite(g.meds))||g.maxhp<=0||g.hp<0||g.hp>g.maxhp||g.food<0||g.water<0||g.meds<0) throw Error('체력·자원 정보가 손상됐습니다.');
 if(!opt('items')&&(!Array.isArray(g.items)||g.items.some(x=>typeof x!=='string'||!own(ITEMS,x)))) throw Error('도구 정보가 손상됐습니다.');
 if(!opt('infection')&&g.infection!==null&&(!obj(g.infection)||!Number.isInteger(g.infection.left)||g.infection.left<0||g.infection.left>INFECT_SLOTS)) throw Error('감염 정보가 손상됐습니다.');
 if(!opt('route')&&g.route!==null&&(typeof g.route!=='string'||!own(ROUTES,g.route))) throw Error('탈출 경로 정보가 손상됐습니다.');
 if(!opt('ending')&&g.ending!==null&&typeof g.ending!=='string') throw Error('엔딩 정보가 손상됐습니다.');
 if(!obj(g.zs)||!obj(g.noise)||!obj(g.zombies)) throw Error('구역 정보가 손상됐습니다.');
 for(const z of ZONES){
   if(!obj(g.zs[z.id])||!finite(g.zombies[z.id])||g.zombies[z.id]<0||!finite(g.noise[z.id])||g.noise[z.id]<0||g.noise[z.id]>NOISE_MAX) throw Error('구역 정보가 손상됐습니다: '+z.id);
 }
 if(!obj(g.comp)||!obj(g.comp.yumin)||!obj(g.surv)) throw Error('동행자 정보가 손상됐습니다.');
 if(!opt('log')&&(!Array.isArray(g.log)||g.log.some(x=>!obj(x)||typeof x.type!=='string'||typeof x.text!=='string'))) throw Error('기록 정보가 손상됐습니다.');
 return g;
}
function prepareSavedGame(text){
 if(typeof text!=='string'||text.length>16*1024*1024) throw Error('저장 파일 크기를 확인하세요.');
 let candidate; try{ candidate=JSON.parse(text.replace(/^﻿/,'')) }catch{ throw Error('올바른 게임 저장 JSON 파일을 선택하세요.') }
 const visit=(x,depth=0)=>{ if(depth>100) throw Error('저장 정보가 너무 복잡합니다.'); if(x&&typeof x==='object') for(const k of Object.keys(x)){ if(['__proto__','prototype','constructor'].includes(k)) throw Error('안전하지 않은 저장 정보가 포함돼 있습니다.'); visit(x[k],depth+1) } };
 visit(candidate);
 validateSaveData(candidate,false);
 const previous=G;
 try{ G=candidate; migrate(); validateSaveData(G); return G }finally{ G=previous }
}

/* 게임 분위기에 맞는 확인 창 (브라우저 기본 confirm 대신) — Promise<boolean> */
function askConfirm(msg,okLabel='확인'){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.style.zIndex=50;
    bg.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-label="확인" style="max-width:420px"><div class="body"><p style="white-space:pre-line;margin:4px 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="small" data-r="0">취소</button><button class="small primary" data-r="1">${esc(okLabel)}</button></div></div></div>`;
    const prev=document.activeElement;
    const done=v=>{ document.removeEventListener('keydown',key,true); bg.remove(); try{ prev&&prev.focus&&prev.focus() }catch(e){} res(v) };
    const key=ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); done(false) } };
    document.addEventListener('keydown',key,true);
    bg.addEventListener('click',ev=>{ if(ev.target===bg) done(false); const b=ev.target.closest('button[data-r]'); if(b) done(b.dataset.r==='1') });
    document.body.appendChild(bg);
    const ok=bg.querySelector('[data-r="1"]'); if(ok) ok.focus();
  });
}

async function vertexImport(text){
 if(!globalThis.crypto?.subtle)throw new Error('JSON 키 연결은 HTTPS 사이트에서 지원됩니다.');
 let raw;try{raw=JSON.parse(String(text).replace(/^\uFEFF/,''))}catch{throw new Error('올바른 JSON 파일을 선택하세요.')}
 if(raw?.type!=='service_account'||!/^\S+@\S+\.iam\.gserviceaccount\.com$/.test(raw.client_email||'')||!/^[a-z][a-z0-9-]{4,61}[a-z0-9]$/.test(raw.project_id||'')||typeof raw.private_key!=='string')throw new Error('서비스 계정 JSON 키 파일을 선택하세요.');
 const match=raw.private_key.match(/^-----BEGIN PRIVATE KEY-----\s*([A-Za-z0-9+/=\s]+)\s*-----END PRIVATE KEY-----\s*$/);
 let key;try{if(!match)throw Error();key=await crypto.subtle.importKey('pkcs8',Uint8Array.from(atob(match[1].replace(/\s/g,'')),c=>c.charCodeAt(0)),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);if(key.algorithm.modulusLength<2048)throw Error()}catch{throw new Error('JSON 파일의 RSA 비공개 키 형식을 확인하세요.')}
 return {key,email:raw.client_email,project:raw.project_id,keyId:String(raw.private_key_id||''),token:null,pending:null};
}

const VERTEX_TIMEOUT_MS=120000;
function timeoutSignal(ms){
  if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function') return AbortSignal.timeout(ms);
  if(typeof AbortController==='undefined') return undefined;
  const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal;
}
async function vertexBrowserToken(state){
 if(state.token&&state.token.expires>Date.now()+60000)return state.token.value;
 if(state.pending)return state.pending;
 state.pending=(async()=>{
  const enc=o=>vertexB64(new TextEncoder().encode(JSON.stringify(o))),iat=Math.floor(Date.now()/1000);
  const unsigned=enc({alg:'RS256',typ:'JWT',...(state.keyId?{kid:state.keyId}:{})})+'.'+enc({iss:state.email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat,exp:iat+3600});
  const signature=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',state.key,new TextEncoder().encode(unsigned));
  let r,d;try{r=await fetch(VERTEX_TOKEN_URL,{method:'POST',credentials:'omit',referrerPolicy:'no-referrer',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+vertexB64(signature)}).toString(),signal:timeoutSignal(20000)});d=await r.json()}catch{throw new Error('Google 인증에 연결하지 못했습니다. 네트워크 또는 브라우저 연결 제한을 확인하세요.')}
  if(!r.ok&&[400,401,403].includes(r.status)&&vertexAuthRejected(state))throw new Error('기억된 JSON 키 연결이 거절되어 지웠습니다. AI 설정에서 JSON 파일을 다시 선택하세요.');
  if(!r.ok||!d||typeof d.access_token!=='string'||!d.access_token||!(Number(d.expires_in)>0)||String(d.token_type).toLowerCase()!=='bearer')throw new Error('Google 인증 실패: JSON 키의 유효성과 PC 시각을 확인하세요.');
  state.token={value:d.access_token,expires:Date.now()+Number(d.expires_in)*1000};return state.token.value;
 })();
 try{return await state.pending}finally{state.pending=null}
}

/* 「이 기기에서 연결 기억하기」: 추출 불가 CryptoKey와 서명에 필요한 공개 정보만 IndexedDB에 둔다.
   PEM·JSON 원문은 어디에도 저장하지 않는다. IndexedDB를 못 쓰면 조용히 메모리만 쓴다. */
const VERTEX_DB='hanbit_vertex',VERTEX_STORE='conn',VERTEX_REC='browser',VERTEX_TOKEN_URL='https://oauth2.googleapis.com/token';
function vertexDB(){
 return new Promise(res=>{
  try{
   if(typeof indexedDB==='undefined'||!indexedDB)return res(null);
   const q=indexedDB.open(VERTEX_DB,1);
   q.onupgradeneeded=()=>{try{if(!q.result.objectStoreNames.contains(VERTEX_STORE))q.result.createObjectStore(VERTEX_STORE)}catch(e){}};
   q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null);
  }catch(e){res(null)}
 });
}
async function vertexStoreOp(mode,fn){
 const db=await vertexDB();if(!db)return null;
 return new Promise(res=>{
  try{
   const tx=db.transaction(VERTEX_STORE,mode),req=fn(tx.objectStore(VERTEX_STORE));
   tx.oncomplete=()=>{try{db.close()}catch(e){}res(req?req.result:true)};tx.onerror=tx.onabort=()=>{try{db.close()}catch(e){}res(null)};
  }catch(e){try{db.close()}catch(_){}res(null)}
 });
}
function vertexRemember(state){
 if(!state?.key||state.key.extractable!==false)return Promise.resolve(null);   // 꺼낼 수 있는 키는 절대 저장하지 않는다
 return vertexStoreOp('readwrite',st=>st.put({v:1,key:state.key,email:state.email,project:state.project,keyId:state.keyId,tokenUrl:VERTEX_TOKEN_URL},VERTEX_REC));
}
function vertexForget(){return vertexStoreOp('readwrite',st=>st.delete(VERTEX_REC))}

 vertexForget();if(VERTEX_BROWSER===state){VERTEX_BROWSER=null;vertexConnectionStatus('기억된 연결이 더 이상 유효하지 않아 지웠습니다 · JSON 파일을 다시 선택하세요.');try{if(document.getElementById('game')?.classList.contains('hidden'))refreshTitle()}catch(e){}}

   if(attempt===0){await new Promise(res=>setTimeout(res,1500));continue}   // 모바일 회선 전환·일시 끊김은 한 번 더 시도
   throw new Error('Vertex AI에 연결하지 못했습니다. 휴대폰에서는 화면이 꺼지거나 다른 앱으로 전환하면 연결이 끊길 수 있으니 화면을 켠 채 다시 시도해 주세요. (그래도 안 되면 Wi-Fi·VPN·광고 차단 설정을 확인하세요)');
  }

function vertexRelayBase(raw=SET.vertexRelayUrl){

/* AI 요청 공통: 응답이 없으면 115초 뒤 끊고(게임이 '기다리는 중'에 멈추지 않게), 일시 오류(429·502·503·504·접속 끊김)는 한 번만 다시 시도하며, JSON이 아닌 응답은 알아볼 수 있는 안내로 바꿉니다. */
async function aiRequest(url,init){
  let r=null,d=null,fail=null;
  for(let attempt=0;attempt<2;attempt++){
    fail=null;
    try{ r=await fetch(url,{...init,signal:timeoutSignal(115000)}) }
    catch(e){ fail=e&&(e.name==='TimeoutError'||e.name==='AbortError')?'AI 응답이 115초 안에 오지 않아 요청을 멈췄습니다. 잠시 뒤 다시 시도해 주세요.':'AI 서버에 연결하지 못했습니다. 인터넷 연결과 주소를 확인해 주세요.'; if(e&&(e.name==='TimeoutError'||e.name==='AbortError'))break }
    if(!fail){
      try{ d=await r.json() }catch{ d=null }
      if(![429,502,503,504].includes(r.status)||attempt) break;
    }
    await new Promise(res=>setTimeout(res,1500));
  }
  if(fail) throw new Error(fail);
  if(d===null&&r.ok) throw new Error('AI 서버가 올바른 응답을 주지 않았습니다. 잠시 뒤 다시 시도해 주세요.');
  return {r,d};
}
/* opt.cache: 시스템 프롬프트(매 턴 같은 앞부분)를 캐시 — 서술 턴에서만 씀 (짧거나 한 번뿐인 호출에 붙이면 쓰기 비용만 늘어남) */

async function callAIRaw(system,user,maxTokens=1200,role='story',opt){
  opt=opt||{};

  if(c.provider==='vertex'){
    if(vertexMode()==='browser')return callVertexBrowser(system,user,maxTokens,c,role);
    const base=vertexRelayBase();
    if(!key)throw new Error('Vertex AI 중계 접속 토큰을 AI 설정에 입력해 주세요.');
    if(/^\s*\{/.test(key)||/PRIVATE KEY|private_key/.test(key))throw new Error('서비스 계정 JSON 키는 중계 서버에서만 읽습니다. 여기에는 중계 접속 토큰을 입력하세요.');
    let r,d;try{
      r=await fetch(base+'/api/vertex/generate',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify({model:c.model,system,user,maxTokens,role,effort:c.effort||'low'}),...(typeof AbortSignal!=='undefined'&&AbortSignal.timeout?{signal:AbortSignal.timeout(115000)}:{})});
      d=await r.json();
    }catch{throw new Error('Vertex AI 중계 서버에 연결하지 못했습니다. 서버 실행·주소·허용 Origin을 확인하세요.')}
    if(!r.ok)throw new Error(d?.error?.message||'Vertex AI 중계 오류 (HTTP '+r.status+')');
    if(!d||typeof d.text!=='string'||!d.text.trim())throw new Error('Vertex AI가 빈 응답을 반환했습니다.');

  }

  }
  const errMsg=(d,r)=>(d&&d.error&&d.error.message)||(Array.isArray(d)&&d[0]&&d[0].error&&d[0].error.message)||('HTTP '+r.status);
  if(c.provider==='anthropic'){
    // Claude 5 계열은 생각(adaptive thinking) 토큰도 max_tokens에 포함되므로 여유를 둡니다.
    const is5=/claude-(sonnet|opus|fable|mythos)-5/.test(c.model);
    const body={model:c.model,max_tokens:is5?maxTokens+2000:maxTokens,system:opt.cache?[{type:'text',text:system,cache_control:{type:'ephemeral'}}]:system,messages:[{role:'user',content:(opt.cache&&opt.stable>0&&opt.stable<user.length)?[{type:'text',text:user.slice(0,opt.stable),cache_control:{type:'ephemeral'}},{type:'text',text:user.slice(opt.stable)}]:user}]};
    if(is5) body.output_config={effort:c.effort||'low'};
    const hdr={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    if(SET.wsId) hdr['anthropic-workspace-id']=SET.wsId;
    const send=()=>aiRequest('https://api.anthropic.com/v1/messages',{method:'POST',headers:hdr,body:JSON.stringify(body)});
    let {r,d}=await send();
    if(!r.ok&&body.output_config&&/output_config|effort/i.test(errMsg(d,r))){ delete body.output_config; ({r,d}=await send()) }
    if(!r.ok) throw new Error(errMsg(d,r));
    try{ const u=d.usage||{}; trackUsage(role,c.model,u.input_tokens,u.output_tokens,u.cache_read_input_tokens,u.cache_creation_input_tokens) }catch(e){}
    return (d.content||[]).map(x=>x.text||'').join('');
  }
  const base=(c.provider==='custom'?(SET.baseUrl||''):(PRESETS[c.provider]&&PRESETS[c.provider].baseUrl)||'').replace(/\/$/,'');
  const body={model:c.model,max_tokens:maxTokens,temperature:0.9,messages:[{role:'system',content:system},{role:'user',content:user}]};
  if(c.provider==='gemini'){ body.max_tokens=Math.max(maxTokens*2,3000); body.reasoning_effort=c.effort||'low' }
  const send=()=>aiRequest(base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify(body)});
  let {r,d}=await send();
  if(!r.ok&&body.reasoning_effort&&/reasoning|thinking/i.test(JSON.stringify(d))){ delete body.reasoning_effort; ({r,d}=await send()) }
  if(!r.ok) throw new Error(errMsg(d,r));
  try{ const u=d.usage||{}, ct=(u.prompt_tokens_details&&u.prompt_tokens_details.cached_tokens)||0; trackUsage(role,c.model,u.prompt_tokens,(u.total_tokens&&u.prompt_tokens)?Math.max(u.total_tokens-u.prompt_tokens,u.completion_tokens||0):u.completion_tokens,0,0,ct) }catch(e){}
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
}

function priceOf(model){   // 100만 토큰당 [입력, 출력] 달러. 없는 모델은 비용 "?"
  const m=String(model||'');
  if(m.startsWith('vertex/'))return null; // Vertex 요금은 Cloud Billing에서 확인하며 다른 제공자 단가를 재사용하지 않는다.
  if(/claude-sonnet-5/.test(m)) return [2,10];
  if(/claude-opus-5/.test(m)) return [4,20];
  if(/claude-opus-4-6/.test(m)) return [5,25];
  if(/claude-haiku-4-5/.test(m)) return [1,5];
  if(/gemini-3\.8-flash/.test(m)) return Date.now()<Date.parse('2027-01-01T00:00:00+09:00')?[0.75,3.75]:[1.5,7.5];
  if(/gemini-3\.5-flash-lite/.test(m)) return [0.30,2.50];
  if(/gemini-3\.5-flash/.test(m)) return [1.5,9];
  return null;
}

/* cr: 캐시에서 읽은 입력(단가 0.1배) · cw: 캐시에 새로 쓴 입력(1.25배) — Anthropic은 둘 다 inTok과 따로 옴

const CACHE_READ=0.1, CACHE_WRITE=1.25;
function trackUsage(role,model,inTok,outTok,cr,cw,cg){
  inTok=+inTok||0; outTok=+outTok||0; cr=+cr||0; cw=+cw||0; cg=+cg||0;
  const p=priceOf(model), cost=p?((inTok+cr*CACHE_READ+cw*CACHE_WRITE)*p[0]+outTok*p[1])/1e6:0;
  const r=USAGE.roles[role]||(USAGE.roles[role]={calls:0,in:0,out:0,cost:0,unk:0});
  r.calls++; r.in+=inTok+cr+cw; r.out+=outTok; r.cost+=cost; if(!p) r.unk++;
  r.cr=(r.cr||0)+cr+cg; r.cw=(r.cw||0)+cw;
  USAGE_TURN.cr=(USAGE_TURN.cr||0)+cr+cg;
  inTok+=cr+cw;
  USAGE_TURN.in+=inTok; USAGE_TURN.out+=outTok; USAGE_TURN.cost+=cost; if(!p) USAGE_TURN.unk=true;
  saveUsage(); updateUsageChip();
}
function usageTotal(){
  const t={calls:0,in:0,out:0,cost:0,unk:0};
  for(const k in USAGE.roles){ const r=USAGE.roles[k]; t.calls+=r.calls; t.in+=r.in; t.out+=r.out; t.cost+=r.cost; t.unk+=r.unk }
  return t;
}
function updateUsageChip(){
  const el=document.getElementById('usageChip'); if(!el) return;
  const t=usageTotal();
  if(!t.calls){ el.textContent='💰 사용량'; el.title='토큰 사용량 (눌러서 자세히 보기)'; return }
  el.textContent=`💰 이번 턴 ${fmtCost(USAGE_TURN.cost)} · 누적 ${fmtCost(t.cost)}${t.unk?'+':''}`;
  el.title=`이번 턴 입력 ${USAGE_TURN.in} · 출력 ${USAGE_TURN.out} 토큰 (눌러서 자세히 보기)`;
}


/* =========================================================
   5. 구역 규칙 — 이동 · 목표 한 줄 · 선택지 목록
   (1단계: 위치와 상태까지. 시간 경과·소음·판정은 2단계에서 이 함수들을 감싼다)
   ========================================================= */
function neighbors(id){ return own(ADJ,id)?ADJ[id]:[] }
function canMove(from,to){ return neighbors(from).includes(to) }
function timeLabel(){ return `${G.day}일차 ${TIMES[G.slot]}` }
function hasItem(id){ return !!G&&G.items.includes(id) }
function routeMissing(id){ return ROUTES[id].need.filter(x=>!hasItem(x)) }
function routeReady(id){ return routeMissing(id).length===0 }
function noiseHere(){ return G.noise[G.loc]||0 }

/* 화면 위에 항상 보이는 목표 한 줄 */
function goalLine(){
  if(G.ending) return '이야기가 끝났다.';
  if(!G.route) return '단지를 빠져나갈 길을 정하자 — 정문(차량) · 후문(열쇠) · 옥상(신호)';
  const r=ROUTES[G.route], miss=routeMissing(G.route);
  if(!miss.length) return `${r.n}으로 나갈 준비가 됐다 — ${ZONE[r.at].s}에서 결행하자`;
  const names=miss.map(x=>ITEMS[x].n), last=names[names.length-1];
  return `${r.verb} ${names.join('·')}${josa(last,'이','가')} 필요하다`;
}

function addLog(type,text,extra){
  const e={type,text:String(text)}; if(extra) Object.assign(e,extra);
  G.log.push(e);
  if(G.log.length>200) G.log.splice(0,G.log.length-200);
}

/* 행동 표: 선택지 id의 앞부분('move:stairs'의 move)에 맞는 함수. 새 행동은 여기에 한 줄 */
const ACTIONS={ move:id=>goZone(id) };

function goZone(id){
  if(!G||G.ending||busy) return false;
  if(typeof id!=='string'||!own(ZONE,id)||!canMove(G.loc,id)){ toast('그쪽으로는 바로 갈 수 없습니다'); return false }
  const from=ZONE[G.loc], to=ZONE[id], first=!G.zs[id].seen;
  G.loc=id; G.zs[id].seen=true;
  addLog('action',`${from.s}에서 ${to.s}${josa(to.s,'으로','로')} 이동한다`);
  say({t:'n',text:first?to.desc:`${to.n}에 다시 왔다. (위험 ${RISK_LABEL[to.risk]})`});
  run('after','move',id);
  save(); render();
  return true;
}

/* 선택지 목록: 코드가 만든다(템플릿 문구). 이후 단계에서 탐색·휴식·대화가 훅으로 붙는다 */
function buildChoices(){
  if(!G||G.ending) return [];
  const list=neighbors(G.loc).map(id=>{
    const z=ZONE[id];
    return {id:'move:'+id,label:`${z.icon} ${z.s}${josa(z.s,'으로','로')} 이동 · 위험 ${RISK_LABEL[z.risk]}`};
  });
  run('choices',list);
  return list;
}
function pick(cid){
  if(busy||!G||!queueIdle()) return;   // 줄이 남아 있는 동안은 선택할 수 없다
  const c=buildChoices().find(x=>x.id===cid); if(!c) return;   // 지금 목록에 없는 선택은 무시
  const i=cid.indexOf(':'), k=i<0?cid:cid.slice(0,i), arg=i<0?'':cid.slice(i+1);
  if(own(ACTIONS,k)) ACTIONS[k](arg);
}

/* =========================================================
   6. 화면 — 미연시: 상태바 · 장면 · 스크립트창 · 선택지 · 로그
   줄 하나(LINE)= {t:'n'|'d'|'s', who, emo, text}. say()가 줄을 로그에 적고 화면 큐에 넣는다.
   큐는 화면 진행용이고 저장하지 않는다(로그가 기록의 원본).
   ========================================================= */
const LINE_MAX=80;                                      // 한 줄 최대 글자 수(넘으면 문장 단위로 나눈다)
const EMOS=['neutral','smile','fluster','sad','tense','relieved'];   // 표정 키는 여기서만 정의
const CAST={                                            // 등록된 인물 id (대사의 who는 이 안에서만)
  me:{n:()=>G&&G.char?G.char.name:'나'},
  yumin:{n:()=>'유민'}, guard:{n:()=>'경비원 아저씨'}, pharm:{n:()=>'상가 약사'}, rider:{n:()=>'배달 라이더 청년'},
};
const SPEEDS=[{k:'fast',n:'빠름',ms:14},{k:'mid',n:'보통',ms:30},{k:'slow',n:'느림',ms:60},{k:'off',n:'즉시',ms:0}];
const UI_KEY='hanbit_ui';
let UI=(function(){ try{ const o=JSON.parse(localStorage.getItem(UI_KEY)||'{}')||{}; return {speed:SPEEDS.some(s=>s.k===o.speed)?o.speed:'mid',auto:o.auto===true} }catch(e){ return {speed:'mid',auto:false} } })();
function saveUi(){ try{ localStorage.setItem(UI_KEY,JSON.stringify(UI)) }catch(e){} }
function speedMs(){ const s=SPEEDS.find(x=>x.k===UI.speed); return s?s.ms:30 }

/* 구역 → 배경 (조회 함수 뒤에 둔다. 지금은 단색 그라데이션, 나중에 그림으로 교체) */
const BG={
  room:['#2b2540','#12101c'], stairs:['#2a3140','#10131c'], shop:['#3a3226','#17130d'], office:['#26373a','#0e1719'],
  garage:['#2a2a31','#0a0a0e'], roof:['#1d3358','#0b1428'], garden:['#24392b','#0d1710'], gate:['#3b2a2a','#150d0d'],
};
function bgFor(zoneId){   // 도트 느낌: 부드러운 그라데이션 대신 6단 색 띠 + 바닥 띠 + 가는 가로줄
  const c=BG[zoneId]||['#1a2030','#080a10'], hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const a=hx(c[0]), b=hx(c[1]), N=6, bands=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1), col='#'+a.map((v,k)=>Math.round(v+(b[k]-v)*t).toString(16).padStart(2,'0')).join('');
    bands.push(`${col} ${Math.round(i*100/N)}% ${Math.round((i+1)*100/N)}%`);
  }
  return `linear-gradient(0deg,rgba(0,0,0,.35) 0 16%,transparent 16% 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px),linear-gradient(180deg,${bands.join(',')})`;
}
/* 인물+표정 → 이미지 (C단계에서 도트로 교체. 지금은 자리표시자가 없다) */
function portraitFor(who,emo){ return null }

const Q={pending:[],cur:null,pos:0,typing:false,timer:0,autoT:0};

function splitLine(text,max=LINE_MAX){
  text=String(text??'').replace(/\s+/g,' ').trim(); if(!text) return [];
  if(text.length<=max) return [text];
  const parts=text.match(/[^.!?。…]+(?:[.!?。…]+["'”’」』)]*)?\s*/g)||[text];
  const out=[]; let cur='';
  const push=x=>{ x=x.trim(); if(x) out.push(x) };
  for(let sent of parts){
    sent=sent.trim(); if(!sent) continue;
    while(sent.length>max){
      let cut=sent.lastIndexOf(' ',max); if(cut<max*0.5) cut=max;
      if(cur){ push(cur); cur='' }
      push(sent.slice(0,cut)); sent=sent.slice(cut).trim();
    }
    if(!sent) continue;
    if(cur&&(cur+' '+sent).length>max){ push(cur); cur=sent } else cur=cur?cur+' '+sent:sent;
  }
  push(cur); return out;
}
/* 줄 검수: 모르는 t는 서술로, 허용되지 않은 who는 서술로, 허용되지 않은 emo는 neutral로 바꾼다 */
function normLine(l){
  if(typeof l==='string') l={t:'n',text:l};
  if(!l||typeof l!=='object'||typeof l.text!=='string') return null;
  const text=l.text.trim(); if(!text) return null;
  let t=l.t==='d'||l.t==='s'?l.t:'n';
  if(t==='d'&&!(typeof l.who==='string'&&own(CAST,l.who))) t='n';
  const o={t,text};
  if(t==='d'){ o.who=l.who; o.emo=EMOS.includes(l.emo)?l.emo:'neutral' }
  return o;
}
function nameOf(who){ return own(CAST,who)?CAST[who].n():'' }

function logType(l){ return l.t==='d'?'dialog':l.t==='s'?'sys':'scene' }
function say(lines){
  if(!G) return;
  const list=(Array.isArray(lines)?lines:[lines]).map(normLine).filter(Boolean);
  const idle=!Q.typing&&!Q.pending.length;
  for(const l of list) for(const text of splitLine(l.text)){
    const one={...l,text};
    addLog(logType(one),text,one.t==='d'?{who:one.who,emo:one.emo}:null);
    Q.pending.push(one);
  }
  if(idle&&Q.pending.length) nextLine();
}
function queueIdle(){ return !Q.typing&&!Q.pending.length }
function resetQueue(){ clearTimeout(Q.timer); clearTimeout(Q.autoT); Q.pending=[]; Q.cur=null; Q.pos=0; Q.typing=false }

function nextLine(){
  clearTimeout(Q.timer); clearTimeout(Q.autoT);
  const l=Q.pending.shift();
  if(!l){ Q.typing=false; paintMark(); renderChoices(); return }
  Q.cur=l; Q.pos=0; paintName(); renderCast();
  const ms=speedMs();
  if(!ms){ Q.pos=l.text.length; paintText(); doneTyping(); return }
  Q.typing=true; paintText(); paintMark();
  const step=()=>{ Q.pos++; paintText(); if(Q.pos>=l.text.length) doneTyping(); else Q.timer=setTimeout(step,ms) };
  Q.timer=setTimeout(step,ms);
}
function finishTyping(){ clearTimeout(Q.timer); if(Q.cur) Q.pos=Q.cur.text.length; paintText(); doneTyping() }
function doneTyping(){
  Q.typing=false; paintMark(); renderChoices();
  if(UI.auto&&Q.pending.length) Q.autoT=setTimeout(()=>{ if(!Q.typing&&Q.pending.length) nextLine() },900+(Q.cur?Q.cur.text.length*45:0));
}
/* 화면 탭: 글자가 나오는 중이면 즉시 완성, 완성됐으면 다음 줄 */
function tapAdvance(ev){
  if(ev&&ev.target&&ev.target.closest&&ev.target.closest('button')) return;
  if(!G||document.getElementById('modalRoot').innerHTML) return;
  if(Q.typing) finishTyping();
  else if(Q.pending.length) nextLine();
}

function paintName(){
  const tag=document.getElementById('nameTag'), l=Q.cur;
  const nm=l&&l.t==='d'?nameOf(l.who):'';
  tag.textContent=nm; tag.style.display=nm?'block':'none';
  const tx=document.getElementById('scriptText'); tx.className=l?l.t:'n';
}
function paintText(){
  const el=document.getElementById('scriptText'), l=Q.cur;
  el.textContent=l?l.text.slice(0,Q.pos):'';
  const inner=document.getElementById('scriptInner'); if(inner) inner.scrollTop=inner.scrollHeight;
}
function paintMark(){
  const m=document.getElementById('nextMark'); if(!m) return;
  m.classList.toggle('on',!Q.typing&&Q.pending.length>0);
}
/* 저장을 불러온 직후처럼 큐가 비어 있을 때는 로그의 마지막 줄을 그대로 보여 준다 */
function paintStatic(){
  const last=[...G.log].reverse().find(x=>x.type==='scene'||x.type==='dialog'||x.type==='sys');
  Q.cur=last?{t:last.type==='dialog'?'d':last.type==='sys'?'s':'n',who:last.who,emo:last.emo,text:last.text}:null;
  Q.pos=Q.cur?Q.cur.text.length:0; paintName(); paintText(); paintMark();
}

function renderStats(){
  const st=(txt,low)=>`<span class="st${low?' low':''}">${txt}</span>`;
  const parts=[
    st(`${TIME_ICON[TIMES[G.slot]]} ${timeLabel()}`),
    st(`❤ ${G.hp}/${G.maxhp}`,G.hp<=3),
    st(`🍙 ${G.food}`,G.food<=1),
    st(`💧 ${G.water}`,G.water<=1),
    st(`🔊 ${noiseHere()}`,noiseHere()>=NOISE_MAX-2),
  ];
  if(G.meds>0) parts.push(st(`💊 ${G.meds}`));
  if(G.items.length) parts.push(st(G.items.map(i=>ITEMS[i].i).join('')));
  if(G.infection) parts.push(st(`☣ 감염 ${G.infection.left}시간대`,true));
  document.getElementById('stats').innerHTML=parts.join('');
}
function renderGoal(){ document.getElementById('goal').textContent=goalLine() }

/* 장면: 구역 배경과 인물. 대화 중인 인물은 밝게, 말하지 않는 인물은 어둡게 */
function renderScene(){
  const z=ZONE[G.loc];
  document.getElementById('sceneBg').style.background=bgFor(G.loc);
  document.getElementById('placeLabel').textContent=`${z.icon} ${z.n} · 위험 ${RISK_LABEL[z.risk]}`;
  renderCast();
}
function renderCast(){
  const el=document.getElementById('cast'); if(!el||!G) return;
  el.innerHTML='';   // 인물이 없으면 초상화를 그리지 않는다 (C단계에서 채운다)
}

function renderChoices(){
  const el=document.getElementById('choices');
  if(!queueIdle()){ el.innerHTML=''; return }          // 줄이 남아 있는 동안은 선택지를 숨긴다
  const list=buildChoices();
  el.innerHTML=list.length
    ? list.map(c=>`<button onclick="pick('${c.id}')"${busy?' disabled':''}>${esc(c.label)}</button>`).join('')
    : '';
}
function render(){
  if(!G) return;
  renderStats(); renderGoal(); renderScene(); renderChoices();
  if(!Q.cur&&queueIdle()) paintStatic();
  run('render');
}

/* ----- 로그 · 지도 · 메뉴 ----- */
function logEntryHTML(l){
  if(l.type==='dialog') return `<div class="entry d"><b>${esc(nameOf(l.who)||'???')}</b>${esc(l.text)}</div>`;
  if(l.type==='action') return `<div class="entry action">${esc(l.text)}</div>`;
  if(l.type==='sys') return `<div class="entry s">${esc(l.text)}</div>`;
  return `<div class="entry n">${esc(l.text)}</div>`;
}
function shownLog(){ return G.log.slice(0,G.log.length-Q.pending.length) }   // 아직 보지 않은 줄은 빼고 보여 준다
function openLog(){
  modal('📜 지난 이야기',`<div class="logbox" id="logBox">${shownLog().map(logEntryHTML).join('')||'<p class="muted">아직 기록이 없습니다.</p>'}</div>`);
  const b=document.getElementById('logBox'); if(b) b.scrollTop=b.scrollHeight;
}
function mapHTML(){
  const adj=neighbors(G.loc);
  const edges=EDGES.map(([p,q])=>`<line class="zedge" x1="${ZONE[p].x}" y1="${ZONE[p].y}" x2="${ZONE[q].x}" y2="${ZONE[q].y}"/>`).join('');
  const nodes=ZONES.map(z=>{
    const cur=z.id===G.loc, isAdj=adj.includes(z.id), cls=`znode r${z.risk}${cur?' cur':''}${isAdj?' adj':''}${!cur&&!isAdj?' far':''}`;
    const aria=cur?`${z.n}, 현재 위치`:isAdj?`${z.n}으로 이동, 위험 ${RISK_LABEL[z.risk]}`:`${z.n}, 위험 ${RISK_LABEL[z.risk]}`;
    const act=isAdj?` role="button" tabindex="0" onclick="mapTap('${z.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();mapTap('${z.id}')}"`:'';
    return `<g class="${cls}"${act} aria-label="${esc(aria)}"><rect x="${z.x-20}" y="${z.y-20}" width="40" height="40"/><text class="ic" x="${z.x}" y="${z.y+1}">${z.icon}</text><text class="lb" x="${z.x}" y="${z.y+33}">${esc(z.s)}</text><text class="rk" x="${z.x}" y="${z.y+43}">${'●'.repeat(z.risk)}${'○'.repeat(4-z.risk)}</text></g>`;
  }).join('');
  const z=ZONE[G.loc];
  return `<svg class="zmap" viewBox="0 0 360 256" role="group" aria-label="단지 구역 지도">${edges}${nodes}</svg>
    <div id="zoneCard">📍 <b>${esc(z.n)}</b> · 위험 ${RISK_LABEL[z.risk]} · ${esc(z.role)} · 얻을 것: ${esc(z.gives)}</div>
    <p class="muted" style="margin:6px 0 0">${queueIdle()?'이웃한 구역을 누르면 이동합니다.':'이야기를 끝까지 본 뒤에 이동할 수 있습니다.'}</p>`;
}
function openMap(){ if(G) modal('🗺 단지 지도',mapHTML()) }
function mapTap(id){
  if(!G||!canMove(G.loc,id)) return;
  if(!queueIdle()) return toast('이야기를 끝까지 본 뒤에 이동할 수 있습니다');
  document.getElementById('modalRoot').innerHTML='';
  pick('move:'+id);
}
function openMenu(){

    <button onclick="closeModal();openMap()">🗺 지도</button>

  </div>`);
}
function cycleSpeed(){ const i=SPEEDS.findIndex(s=>s.k===UI.speed); UI.speed=SPEEDS[(i+1)%SPEEDS.length].k; saveUi(); openMenu() }
function toggleAuto(){ UI.auto=!UI.auto; saveUi(); openMenu() }
function openSaves(){
  let backup=false; try{ backup=!!localStorage.getItem(SAVE_BACKUP_KEY) }catch(e){}

    <p class="muted" style="margin-top:8px">진행은 행동할 때마다 이 브라우저에 자동 저장됩니다.</p>`);
}
/* 화면 시험용 더미 스크립트 (AI 호출 없음) */
const DUMMY_SCRIPT=[
  {t:'n',text:'복도 끝의 비상등이 한 번 깜빡이고 꺼졌다. 어디선가 낮게 끌리는 소리가 이어진다.'},
  {t:'d',who:'yumin',emo:'tense',text:'……방금 그 소리, 들었어요? 아래층에서 나는 것 같은데.'},

function installImportedGame(candidate,backup=true){
 const previous=G;let previousDisk;
 try{
  previousDisk=localStorage.getItem(SAVE_KEY);
  if(backup&&(previous||previousDisk))localStorage.setItem(SAVE_BACKUP_KEY,previous?JSON.stringify(previous):previousDisk);
  // A failed write leaves both the active game and original disk save intact.
  localStorage.setItem(SAVE_KEY,JSON.stringify(candidate));
 }catch{saveStatus(false);toast('가져오기를 완료하지 못했습니다. 기존 진행은 유지됩니다. 저장 공간을 확인하고 현재 진행을 다운로드해 주세요.');return false}
 saveStatus(true);openLoadedGame(candidate);return true;
}
function restoreSaveBackup(){
 if(busy)return toast('현재 행동을 마친 뒤 복구해 주세요.');
 try{const text=localStorage.getItem(SAVE_BACKUP_KEY);if(!text)return toast('가져오기 이전의 백업이 없습니다.');if(installImportedGame(prepareSavedGame(text),false))toast('가져오기 이전 저장을 복구했습니다.')}catch(e){toast('백업을 읽을 수 없습니다. '+e.message)}
}
function importSave(){
  if(busy)return toast('현재 행동을 마친 뒤 가져와 주세요.');
  const previous=G;
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;if(f.size>16*1024*1024)return toast('저장 파일은 16MB 이하만 선택하세요.');const r=new FileReader();
    r.onload=()=>{ if(busy||G!==previous)return toast('게임 상태가 바뀌었습니다. 파일을 다시 선택해 주세요.');try{if(installImportedGame(prepareSavedGame(r.result)))toast('저장 파일을 불러왔습니다.')}catch(e){toast('파일을 불러오지 못했습니다. '+e.message)} };
    r.onerror=()=>toast('저장 파일을 읽지 못했습니다. 다른 파일을 선택해 주세요.');
    r.readAsText(f) };
  inp.click();
}

/* 시작: 화면 설정 적용 · 공용 이벤트 */
vertexRestore().catch(()=>{});   // 기억된 Vertex 연결이 있으면 복원(없거나 IndexedDB를 못 쓰면 아무것도 하지 않음)
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&document.getElementById('modalRoot').innerHTML) closeModal();
});
applyFontScale(); applyTheme(); updateUsageChip();
if(window.visualViewport){ window.visualViewport.addEventListener('resize',fitViewport); fitViewport() }
show('title');

</script>
