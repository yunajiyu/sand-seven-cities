/* =========================================================
   37. 효과음 — 파일 없이 Web Audio로 만든 짧은 소리
   - sfx('이름') 하나로 재생. 브라우저는 사용자가 한 번 누른 뒤부터 소리를 허용하므로 첫 클릭 전에는 조용함
   - 음량: 끔 · 작게 · 보통 · 크게 (상단 🔊 버튼, 브라우저에 저장)
   - 나중에 실제 효과음 파일로 바꾸려면 SFX[이름]만 파일 재생으로 교체하면 됨
   ========================================================= */
const SFX_LV=[['끔',0],['작게',0.3],['보통',0.6],['크게',1]];
let _ac=null, _master=null, _sfxDay=null, _sfxLast={};
function sfxVol(){ const v=SET.sfxVol; return v==null?0.6:+v }
function sfxLabel(){ const v=sfxVol(), l=SFX_LV.find(x=>x[1]===v)||SFX_LV[2]; return (v?'🔊 ':'🔇 ')+l[0] }
function updateSfxBtn(){ document.querySelectorAll('.sfxBtn').forEach(b=>{ b.textContent=sfxLabel(); b.title='효과음 크기 바꾸기 (끔 → 작게 → 보통 → 크게)' }); if(_master) _master.gain.value=sfxVol() }
function cycleSfx(){
  const i=SFX_LV.findIndex(x=>x[1]===sfxVol());
  SET.sfxVol=SFX_LV[(i+1)%SFX_LV.length][1]; saveSettings(); updateSfxBtn();
  sfx('coin');
}
function sfxCtx(){
  if(!_ac){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    _ac=new C(); _master=_ac.createGain(); _master.gain.value=sfxVol(); _master.connect(_ac.destination);
  }
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
/* 음 하나: 시작 t, 길이 d, 파형, 세기 g, 끝 주파수 f2(있으면 미끄러짐) */
function tone(c,t,f,d,type,g,f2){
  const o=c.createOscillator(), a=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+0.008); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(a); a.connect(_master); o.start(t); o.stop(t+d+0.02);
}
/* 서서히 커졌다 줄어드는 음: 출석부·결말 같은 화음용 (d 길이의 앞 40%는 커지는 구간) */
function swell(c,t,f,d,g){
  const o=c.createOscillator(), a=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f,t);
  a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+d*0.4); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(a); a.connect(_master); o.start(t); o.stop(t+d+0.02);
}
/* 형광등 웅웅거림: 저주파 험(60Hz와 배음)에 아주 느린 떨림 — 형광등이 켜져 있는 복도의 소리 */
function hum(c,t,d,g){
  const a=c.createGain(); a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+Math.min(0.25,d*0.3)); a.gain.setValueAtTime(g,t+d*0.7); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=7.3; lg.gain.value=g*0.25; lfo.connect(lg); lg.connect(a.gain);
  [[60,'sawtooth',1],[120,'sine',0.6],[180,'sine',0.25]].forEach(([f,ty,k])=>{ const o=c.createOscillator(), og=c.createGain(); o.type=ty; o.frequency.value=f; og.gain.value=k;
    const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=420; o.connect(og); og.connect(fl); fl.connect(a); o.start(t); o.stop(t+d+0.05) });
  a.connect(_master); lfo.start(t); lfo.stop(t+d+0.05);
  noise(c,t,0.03,g*0.5,'highpass',4000);   // 켜질 때 딱 하는 소리
}
/* 학교 종·띵동 차임: 사인에 비정수배 배음을 얹어 길게 울림 */
function bell(c,t,f,d,g){
  [[1,1],[2.76,0.35],[5.4,0.12]].forEach(([m,k])=>{ const o=c.createOscillator(), a=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(f*m,t);
    a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g*k,t+0.01); a.gain.exponentialRampToValueAtTime(0.0001,t+d/(m>2?2:1));
    o.connect(a); a.connect(_master); o.start(t); o.stop(t+d+0.02) });
}
/* 끊기는 교내 방송 노이즈: 지직거리다 끊기는 정적 + 가라앉는 신호음 */
function pa(c,t,g){
  [0,0.1,0.17,0.33,0.4,0.62].forEach((x,i)=>noise(c,t+x,0.05+(i%2)*0.03,g,'bandpass',1400+Math.random()*1800));

}
/* 유민의 노래: 짧은 허밍 몇 음(떨림) + 끝에 전자 글리치 */
function songHum(c,t){
  [[392,0],[440,0.22],[349,0.44],[392,0.66]].forEach(([f,x])=>{ const o=c.createOscillator(), a=c.createGain(), v=c.createOscillator(), vg=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t+x); v.frequency.value=5.5; vg.gain.value=f*0.012; v.connect(vg); vg.connect(o.frequency);
    a.gain.setValueAtTime(0.0001,t+x); a.gain.exponentialRampToValueAtTime(0.1,t+x+0.05); a.gain.exponentialRampToValueAtTime(0.0001,t+x+0.34);
    o.connect(a); a.connect(_master); o.start(t+x); o.stop(t+x+0.36); v.start(t+x); v.stop(t+x+0.36) });
  [0,0.04,0.07,0.12,0.15,0.21].forEach((x,i)=>tone(c,t+0.95+x,300+Math.random()*2200,0.035,i%2?'square':'sawtooth',0.07));
}
/* 갈색 잡음(저음이 센 부드러운 잡음) 한 번 */
function brown(c,t,d,g,f){
  const n=Math.max(1,Math.floor(c.sampleRate*d)), buf=c.createBuffer(1,n,c.sampleRate), ch=buf.getChannelData(0);
  let last=0; for(let i=0;i<n;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; ch[i]=last*3.5 }
  const s=c.createBufferSource(); s.buffer=buf;
  const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f||400;
  const a=c.createGain(); a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+d*0.2); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl); fl.connect(a); a.connect(_master); s.start(t);
}
/* 잡음 한 번: 주사위·망치·바람 같은 소리 */
function noise(c,t,d,g,type,f,f2){
  const n=Math.max(1,Math.floor(c.sampleRate*d)), buf=c.createBuffer(1,n,c.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=buf;
  const fl=c.createBiquadFilter(); fl.type=type||'bandpass'; fl.frequency.value=f||1500; if(f2){ fl.frequency.setValueAtTime(f||1500,t); fl.frequency.exponentialRampToValueAtTime(f2,t+d) }
  const a=c.createGain(); a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl); fl.connect(a); a.connect(_master); s.start(t);
}

   주사위 소리는 판정 결과와 한 쌍이라 따로 세지 않음. 클릭음은 항상 바로 냄 */
const SFX_PRI={collapse:0,ending:0,roster:0,fightstart:0,win:0,lose:0,bandit:0,alert:0,song:1,fragment:1,keepsake:1,levelup:1,
  success:2,partial:2,fail:2,coin:3,spend:3,hurt:4,heal:4,calm:4,eat:4,build:4,travel:4,arrive:4,shelter:4,newday:5,scene:6,notify:6,error:5};
let _sfxQ=[], _sfxTimer=null;
function sfx(name,delay){
  if(!sfxVol()||!SFX[name]) return;
  const now=Date.now(); if(_sfxLast[name]&&now-_sfxLast[name]<60) return; _sfxLast[name]=now;   // 같은 소리는 연달아 겹치지 않게
  if(name==='click') return sfxPlay(name,0);
  _sfxQ.push({name,delay:delay||0});
  if(!_sfxTimer) _sfxTimer=setTimeout(sfxFlush,60);
}
function sfxFlush(){
  _sfxTimer=null;
  const q=_sfxQ; _sfxQ=[];
  const main=q.filter(x=>x.name!=='dice').sort((a,b)=>(SFX_PRI[a.name]??9)-(SFX_PRI[b.name]??9)).slice(0,2);
  const diceIt=q.find(x=>x.name==='dice');
  if(diceIt&&main.some(x=>['success','partial','fail'].includes(x.name))) sfxPlay('dice',diceIt.delay);
  main.forEach(x=>sfxPlay(x.name,x.delay));
}
function sfxPlay(name,delay){
  try{ const c=sfxCtx(); if(c) SFX[name](c,c.currentTime+(delay||0)) }catch(e){}
}
/* 기록(addLog)의 효과 줄에서 알맞은 소리를 고름 — 위에서부터 처음 맞는 것 하나 */
function sfxLog(type,text){
  if(type==='scene') return sfx('scene');
  if(type==='sys'&&/🎵 유민이 노래를 부르기/.test(String(text||''))) return sfx('song');
  if(type!=='fx') return;
  const t=String(text||'');
  if(/🎵 유민의 노래/.test(t)) return sfx('song');
  if(/★ 교표 조각/.test(t)) return sfx('fragment');
  if(/📦.*얻었습니다/.test(t)) return sfx('keepsake');
  if(/💪|❤ 최대 체력|성장 포인트/.test(t)) return sfx('levelup');
  if(/체력 -|🩸|공포에 숨이|방전되어|🌑|차오른 물|길을 잃음|빼앗김|낚아챘/.test(t)) return sfx('hurt');
  if(/캐시 \+|💳.*\+|환불/.test(t)) return sfx('coin');
  if(/캐시 -|보트 대여료|통행세|💳.*-|정가 결제|확장 —/.test(t)) return sfx('spend');
  if(/체력 \+|충전 거치대/.test(t)) return sfx('heal');
  if(/🔋|사용 → 배터리/.test(t)) return sfx('eat');
  if(/🫧|사용 → 공포|공포 −/.test(t)) return sfx('calm');
  sfx('notify');
}

   G.leads=[{id,name,hint,pos,day}] (최대 LEAD_MAX개, 넘치면 오래된 것부터 지움)

const LEAD_MAX=6;
function leadKnown(name){
  const n=String(name||'').replace(/\s+/g,'');
  if(!n) return true;
  const same=x=>String(x||'').replace(/\s+/g,'')===n;
  if(['중앙 캠퍼스 지구','라쿠나 구역'].some(same)||Object.values(DISTRICTS).some(d=>same(d.n))||same(G.home&&G.home.name)||(G.wards||[]).some(c=>c.found&&same(c.name))) return true;
  return (G.leads||[]).some(l=>same(l.name))||MAP_PLACES.some(p=>same(p.n))||Object.values(HOODS).some(t=>same(t.n))
    ||(G.pausedZones||[]).some(d=>same(d.name))||(G.mapDone||[]).some(d=>same(d.name))||(G.site&&same(G.site.name));
}
function addLead(name,hint,quiet){
  if(!G) return false;
  name=String(name||'').trim().slice(0,14); hint=String(hint||'').trim().slice(0,80);
  if(name.length<2||leadKnown(name)) return false;
  if(!Array.isArray(G.leads)) G.leads=[];
  G.leads.push({id:'l'+(G.leadN=(G.leadN||0)+1),name,hint,pos:pickPos(),day:G.day});
  while(G.leads.length>LEAD_MAX) G.leads.shift();
  upsertLex(name,'장소',`${hint||'가는 길을 알게 된 곳.'} (소문으로 알게 된 장소 — 지도에 표시됨)`);
  G.chronicle.push({day:G.day,text:`「${name}」으로 가는 길을 알게 되었다`});
  if(!quiet){
    addLog('sys',`🗺 「${name}」이(가) 지도에 표시되었습니다 — 중앙 캠퍼스 지구 정문이나 지구의 「📍 소문의 장소」에서 찾아갈 수 있습니다.`);
    toast(`🗺 「${name}」이(가) 지도에 표시되었습니다`);
  }
  _sigM=''; return true;
}

  G={
    v:1,
    char:{name,age:17,origin:'한빛학원 2학년 7반 전학생',region:HOME_REGION,reason,stats,traits:draft.traits.map(id=>TRAITS.find(t=>t.id===id).n),bio:document.getElementById('cBio').value.trim()},
    hp:maxhp,maxhp,calm:5,battery:CAP_BASE,torch:3,cash:30,
    items:['오래된 출석부'],
    demerit:0,access:1,ledger:[],
    fragments:0,act:1,day:1,time:'낮',loc:'campus',steps:0,
    site:null,sitesDone:0,
    secret:null,rumors:[],heardRumors:[],
    chronicle:[],lexicon:[],summary:'',recent:[],
    log:[],choices:[],
  };
  migrate();
  show('game'); renderLogAll();
  addLog('sys','전학 서류를 정리하는 중입니다… (숨겨진 것의 정체와 각 지구의 소문을 정하고 있습니다)');
  busy=true; render();
  await genWorld();
  busy=false;
  G.log=G.log.filter(l=>!(l.type==='sys'&&/^전학 서류를 정리하는 중입니다/.test(l.text))); renderLogAll();
  enterCampus(true);
}
async function genWorld(){
  const regions=[HOME_REGION,HOODS.east.n,HOODS.south.n,HOODS.north.n];
  const prompt=`새 게임의 숨겨진 설정을 정하라.
1) 오래된 출석부가 가리키는 '학원도시가 숨긴 것'의 진짜 정체를 네가 정하라(이 프롬프트에 정답은 없다). 지워진 일곱 구역, 교표, 한빛 교육특구의 역사와 이어지는 구체적 사연 2~3문장을 붙여라.
2) 다음 네 지역 사람들은 그 정체를 각기 다르게 믿는다. 지역마다 그 지역 사람들 사이에 도는 소문을 2문장으로 써라. 어떤 소문은 진실의 조각을, 어떤 소문은 오해를 담게 하라: ${regions.join(', ')}
3) 플레이어 캐릭터: ${G.char.name} (${G.char.age}세, ${G.char.origin}). 중간 전학 이유: ${G.char.reason||'미정 — 네가 정해 entry_reason에 한 문장으로 적고, opening에서는 서서히 암시만'}. 배경: ${G.char.bio||'없음'}
출력은 JSON만:
{"truth":"정체 한 줄","detail":"구체 사연","rumors":[{"region":"지역명","belief":"소문"}],"entry_reason":"중간 전학 이유 한 문장(위에 이미 있으면 그대로)","opening":"전학 첫날 아침, 조례 직전 한빛학원 2학년 7반 교실 문 앞의 첫 장면 서술 2~3문단, 2인칭 현재형(\"너는 ~한다\"). 담임 선생님을 기다리며 문 너머 아이들의 웅성거림이 들리고, 서류 사이에 섞여 든 오래된 출석부를 발견하는 순간을 담을 것. 아직 교실에 들어가기 전이므로 유민을 포함한 반 친구와의 만남은 쓰지 말고, 플레이어 배경을 엮을 것"}`;
  let w=null;
  try{ w=parseJSON(await callAI(SYS_BASE,prompt,1500,'world')) }catch(e){ if(e.message!=='NO_KEY') addLog('sys','AI 연결 실패: '+e.message+' (기본 설정으로 진행합니다)') }
  if(!w||!w.truth){
    w={truth:'',detail:'',rumors:regions.map(r=>({region:r,belief:`${r}에서는 지워진 구역에 대한 엇갈린 소문이 돈다.`})),opening:null};
  }
  G.secret={truth:w.truth,detail:w.detail};
  if(!G.char.reason&&w.entry_reason) G.char.reasonAI=String(w.entry_reason).slice(0,80);
  G.rumors=(w.rumors||[]).map(r=>({region:r.region,belief:r.belief}));
  const home=G.rumors.find(r=>r.region===G.char.region)||G.rumors[0];
  if(home){ addLex({name:`${home.region}의 괴담`,cat:'괴담',desc:home.belief},true); G.heardRumors.push(home.region) }
  addLex({name:'라쿠나 구역',cat:'장소',desc:'저수지 아래 잠겼다 드러난다는 첫 번째 지워진 구역. 오래된 출석부가 다른 구역들을 ???로 가리킨다고 한다.'},true);
  addLex({name:'중앙 캠퍼스 지구',cat:'장소',desc:'한빛학원과 상점가, 급식실이 있는 생활 지구. 공식 지도에 나오는 유일한 구역.'},true);
  G.openingText=w.opening;
}
function continueGame(){
  try{ G=JSON.parse(localStorage.getItem(SAVE_KEY)) }catch(e){ G=null }
  if(!G) return toast('저장된 게임이 없습니다');
  migrate(); busy=false; show('game'); setTitle(G.act>=3); renderLogAll(); render();
}
function toTitle(){ save(); show('title') }
function exportSave(){
  const blob=new Blob([JSON.stringify(G,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`출석부에없는구역_${G.char.name}_${G.day}일.json`; a.click();
}
function importSave(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const g=JSON.parse(r.result); if(!g||!g.char) throw 0; resetUndo(); G=g; migrate(); save(); busy=false; show('game'); setTitle(G.act>=3); renderLogAll(); render() }catch(e){ toast('파일을 읽을 수 없습니다') } };
    r.readAsText(f) };
  inp.click();
}

/* 시작: 화면 설정 적용 · 공용 이벤트 */
document.addEventListener('toggle',ev=>{
  const d=ev.target;
  if(!(d instanceof HTMLDetailsElement)||!d.dataset.n||!d.closest('#sideR')) return;
  const n=d.dataset.n;
  if(d.open){ openLexSet.add(n); const e=G&&G.lexicon.find(x=>x.name===n); if(e&&e.isNew){ e.isNew=false; save(); render() } }
  else openLexSet.delete(n);
},true);
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape') return;
  if(document.getElementById('modalRoot').innerHTML) closeModal(); else closeSides();
});
window.addEventListener('resize',()=>{ applySides(); if(G&&!document.getElementById('game').classList.contains('hidden')){ _sigM=''; renderMapPanel() } });
applyFontScale(); applyTheme(); applyTopFold(); applyDock(); applySides(); updateUsageChip(); updateUndoBtn();
show('title');

</script>
