    return `<div class="shop-row" style="gap:8px;align-items:center;flex-wrap:wrap"><span>${CAP_ICON[t]} ${CAP_NAME[t]} <span class="muted">(${G[key]}/${cap})</span>${mb}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="small" ${fill>0?'':'disabled'} onclick="fillSupply('${key}')">가득 채우기${fill>0?` +${fill} 💳${fp}`:''}</button>
      ${max?'<span class="muted">최대 용량</span>':`<button class="small ${G.cash>=price?'primary':''}" onclick="buyCap('${t}')">확장 ${lv*CAP_STEP+CAP_BASE}→${lv*CAP_STEP+CAP_BASE+CAP_STEP} 💳${price}</button>`}</span></div>`;
  };
  let mt=`<h4 style="margin:14px 0 4px">탈것 매장</h4>`;
  if(G.ride){
    const d=RIDES[G.ride.type];
    mt+=`<div class="shop-row"><span>🚲 ${esc(G.ride.name)} <span class="muted">(${d.n})</span></span><button class="small" onclick="sellMount()">팔기 💳${Math.floor(d.price/2)}</button></div><p class="muted">탈것은 하나만 둘 수 있습니다. 다른 것으로 바꾸려면 먼저 파세요.</p>`;
  }else if(!has('bikerack')) mt+=`<p class="muted">아지트에 <b>자전거 보관대</b>를 들여야 자전거나 전동 스쿠터를 둘 수 있습니다. (아지트 꾸미기 → 자전거 보관대)</p>`;
  else mt+=Object.entries(RIDES).filter(([k,d])=>!d.locked||hasBranch(d.locked)).map(([k,d])=>`<div class="shop-row" style="gap:10px;align-items:flex-start"><div><b>${d.n}</b><br><span class="muted">${d.desc}<br>충전: 조사 외출마다 배터리 ${d.feed}</span></div><button class="small ${G.cash>=ridePrice(k)?'primary':''}" onclick="buyMount('${k}')">캐시 ${ridePrice(k)}${ridePrice(k)<d.price?' (할인)':''}</button></div>`).join('');
  const sells=G.items.map((it,i)=>(consKind(it)||SNACKS[it])?'':isKeyItem(it)?`<div class="shop-row"><span>🔒 ${esc(it)} <span class="muted">(이야기 물건 · 팔 수 없음)</span></span></div>`:`<div class="shop-row"><span>${esc(it)}${itemFlag(it)==='goods'?'':' <span class="muted">(팔기 전에 확인)</span>'}</span><button class="small" onclick="sellItem(${i})">팔기 💳${itemSellPrice(it)}</button></div>`).join('');
  modal('상점가',`<p class="muted">캐시: <b id="shopCash">${G.cash}</b></p>${goods}
    <h4 style="margin:14px 0 4px">휴대 용량</h4>${capRow('w')}${capRow('f')}${capRow('t')}
    <p class="muted" style="font-size:12px">공포 한계·배터리·손전등은 용량까지만 유지되고 초과분은 사라집니다.${G.loc==='hood'?` ${curHood().n}: ${curHood().perk}.`:''} 가격(개당) — 중앙 캠퍼스 지구·아지트: 진정 음료 💳${PRICE_HOOD.calm} · 배터리 💳${PRICE_HOOD.battery} · 손전등 💳${PRICE_HOOD.torch}. 뒷길에서 가끔 만나는 이동 행상(🧭 버튼)이나 이야기 속 상인에게 사면 진정 음료·배터리 💳${PRICE_ROAD.calm} · 손전등 💳${PRICE_ROAD.torch}.</p>
    ${mt}
    ${decorShopHTML()}
    <h4 style="margin:14px 0 4px">물건 팔기</h4>${sells||'<p class="muted">팔 수 있는 물건이 없습니다.</p>'}
    <p class="muted">팔면 사전의 같은 이름 「물건」 항목도 함께 지워집니다. 따뜻한 차·보조배터리 같은 소모품은 소지품에서 "사용"하세요.</p>`);
}

  { const fr=Math.min(HOME_FEAR_RECOVER,fearNow()); if(fr>0){ G.calm+=fr; addLog('fx',`🫧 아지트에서 쉬며 공포 −${fr} → ${fearNow()}`) } }

/* 유실물 감정·판매: 아지트 작업실(정가) 또는 재개발지구 고물상(20% 더) */
function keepsakePrice(g){ const m=(G.loc==='hood'&&curHood().keepsakeBuy||1)*(hasBranch('depot')?1.25:1); return Math.round(KEEPSAKE_GRADES[g].p*m) }
function appraise(){
  keepsakeSync();
  if(G.mat.keepsake<1) return toast('감정할 유실물이 없습니다');
  const where=G.loc==='hood'?`${curHood().n}의 고물상`:'작업대';
  modal('📦 유실물 감정',`<p class="muted">${where}에서 유실물을 감정해 팝니다. 등급이 높을수록 값이 오릅니다.${G.loc==='hood'?' (작업대보다 20% 더 쳐 줍니다)':''}</p>`+
    KEEPSAKE_GRADES.map((r,g)=>`<div class="shop-row"><span>📦 ${r.n} <span class="muted">(보유 ${G.keepsakeG[g]})</span></span><button class="small ${G.keepsakeG[g]?'primary':''}" ${G.keepsakeG[g]?'':'disabled'} onclick="sellKeepsake(${g})">팔기 💳${keepsakePrice(g)}</button></div>`).join('')+
    `<p class="muted" style="font-size:12px">시설을 지을 때나 선물할 때는 흔한 유실물부터 씁니다.</p>`);
}
function sellKeepsake(g){
  keepsakeSync();
  if(!(G.keepsakeG[g]>0)) return;
  const p=keepsakePrice(g);
  G.keepsakeG[g]--; G.mat.keepsake--; G.cash+=p;
  addLog('fx',`📦 ${KEEPSAKE_GRADES[g].n}을(를) 감정해 넘겼습니다 (캐시 +${p})`);
  save(); render(); appraise();
}
/* 교표 조각의 위치 단서 한 줄 (연구실·수업·땡땡이가 함께 씀). 줄 단서가 없으면 '' */
function fragClue(){
  let clue='';
  const pr=(G.pausedZones||[]).find(d=>d.rooms.some(r=>r.fragment&&!r.fragTaken)&&!d.clued);
  if(pr){ const room=pr.rooms.find(r=>r.fragment&&!r.fragTaken); pr.clued=true; clue=`중단한 구역 「${pr.name}」의 「${room.name}」 쪽에 교표 조각이 있다` }
  else if(G.nextZoneFrag==null){ G.nextZoneFrag=Math.random()<0.5; clue=G.nextZoneFrag?'다음에 찾아갈 구역 어딘가에 교표 조각이 있다':'다음에 찾아갈 구역에는 교표 조각이 없다. 다른 곳에서 찾아야 한다' }
  return clue;
}
/* ---------- 수업 듣기 · 땡땡이 (교실, 낮에만) ----------
   낮은 학교 일과 9칸(SCHOOL): 조례 → 1교시 → 쉬는 시간 → 2교시 → 점심시간 → 3교시 → 쉬는 시간 → 4교시 → 종례. 행동 1번(tick)이 한 칸.
   수업 듣기: 일정 확률로 단서(조사 보드·교표 조각 위치) / 땡땡이: 확률로 성공하면 몰래 쉬며 단서를 얻을 수도 있지만 들키면 벌점 */
const CLASS_CLUE_P=0.3, CLASS_ACTIONS=3;   // 수업 한 교시 = 행동 CLASS_ACTIONS번 (마지막 행동 뒤에 종이 울림)
const SKIP_CATCH_P=0.35, SKIP_CATCH_STEP=0.1, SKIP_CATCH_WARN=0.15, SKIP_DEMERIT=2, SKIP_FIND_P=0.25;
/* 과목마다 단서의 성격(hint)과 교표 조각 위치 단서가 섞일 확률(frag)이 다름. 시간표는 날짜로 정해져 미리 알 수 있음 */
const SUBJECTS=[

/* 구역 생성: 구조(방) + 사연(구역 연혁 시대) + 교표 조각 배치 */
/* AI가 준 방 목록 정리: id 보정, 양방향 연결, 고립된 방 잇기, 입구에서의 깊이(lv) 계산 */
function normRooms(list,max){
  const rooms=list.slice(0,max).map((r,i)=>({id:String(r.id||('r'+(i+1))),name:r.name||('공간 '+(i+1)),desc:[r.desc,r.hook].filter(Boolean).join(' / '),floor:r.floor?String(r.floor).slice(0,12):undefined,exits:Array.isArray(r.exits)?r.exits.map(String):[],danger:clamp(+r.danger||0,0,3),visited:false}));
  const ids=new Set(rooms.map(r=>r.id));
  rooms.forEach(r=>{ r.exits=r.exits.filter(x=>ids.has(x)&&x!==r.id) });
  rooms.forEach(r=>r.exits.forEach(x=>{ const o=rooms.find(y=>y.id===x); if(!o.exits.includes(r.id)) o.exits.push(r.id) }));
  const start=rooms[0], seen=new Set([start.id]), q=[start]; start.lv=0;
  while(q.length){ const c=q.shift(); c.exits.forEach(x=>{ if(!seen.has(x)){ seen.add(x); const o=rooms.find(y=>y.id===x); o.lv=c.lv+1; q.push(o) } }) }
  rooms.forEach((r,i)=>{ if(!seen.has(r.id)){ const p=rooms[i-1]||start; r.exits.push(p.id); p.exits.push(r.id); r.lv=(p.lv||0)+1; seen.add(r.id) } });
  return rooms;
}

/* 지도 위치 */
function onLand(x,y){
  try{
    if(!onLand.p){ onLand.p=new Path2D(EDGE_D); onLand.c=document.createElement('canvas').getContext('2d') }
    return [[0,0],[12,0],[-12,0],[0,12],[0,-12]].every(([dx,dy])=>onLand.c.isPointInPath(onLand.p,x+dx,y+dy));
  }catch(e){ return true }
}
function pickPos(){
  if(G&&G._resumeZone!=null&&G.pausedZones&&G.pausedZones[G._resumeZone]) return G.pausedZones[G._resumeZone].pos;
  const C=basePos();
  const fixed=[CAMPUS_POS,HOME_POS,LACUNA_POS,hoodPos('pierW'),hoodPos('pierE'),...MAP_PLACES,...UNKNOWN_SPOTS,...HILLS.map(([x,y])=>({x,y})),...(G.mapDone||[]),...(G.leads||[]).map(l=>l.pos)];
  let fallback=null;
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2, r=34+Math.random()*34;   // 대부분 1~2일 거리
    const x=Math.round(C.x+Math.cos(a)*r*1.25), y=Math.round(C.y+Math.sin(a)*r*0.85);
    if(x<24||x>376||y<24||y>244||!onLand(x,y)) continue;
    if(fixed.every(f=>Math.hypot(f.x-x,f.y-y)>26)) return {x,y};
    fallback=fallback||{x,y};
  }
  return fallback||{x:C.x+(C.x>300?-70:70),y:C.y+(C.y>150?-30:30)};
}
function dunPos(){ if(!G.site.pos) G.site.pos=pickPos(); return G.site.pos }
function outsideZone(){ return !!G&&G.loc==='road'&&!!G.site }
function playerPos(){
  if(G.loc==='home') return HOME_POS;
  if(outsideZone()){ const p=dunPos(); return {x:p.x+11,y:p.y+9} }
  if(G.loc==='road'&&G.trip){ const a=G.trip.fromPos||CAMPUS_POS, b=G.trip.dest.pos; return {x:(a.x+b.x)/2,y:(a.y+b.y)/2} }
  if(G.loc==='hood') return hoodPos(G.hood);
  if(G.loc==='road'){ const b=basePos(), t=G.nextPos||{x:b.x+60,y:b.y-40}; return {x:(b.x+t.x)/2,y:(b.y+t.y)/2} }
  if((G.loc==='site'||G.loc==='shelter')&&G.site) return dunPos();
  return CAMPUS_POS;
}

/* 손전등 0 · 밤눈 특성이 없으면 '어둠' — 이동 2걸음 · 넘어질 위험 · 단서·조각 못 찾음 · 판정 -2 */
const DARK_STUMBLE=0.35;
const SHELTER_BLOCK_DANGER=4;   // 방 위험도가 이 값 이상이면 임시 쉼터 불가 (위험도 최대 3이므로 4면 어디서든 임시 쉼터 가능)
function inDark(){ return !!G&&G.loc==='site'&&G.torch<=0&&!hasTrait('밤눈') }
function moveTo(id){
  if(busy) return;
  const d=G.site; let r=d&&d.rooms.find(x=>x.id===id); if(!r) return;
  const gate=wardMoveGate(d,r); if(gate.stop) return;   // 출석부가 가리키는 구역: 수위·등반·신기루·소음
  if(gate.id&&gate.id!==r.id){ r=d.rooms.find(x=>x.id===gate.id)||r; id=r.id }
  const first=!r.visited;
  r.visited=true; d.cur=id; d.depth=r.lv||0; G._yuminHere=false;
  G._mv=(G._mv||0)+1; if(G._mv%(d.terrain==='tunnel'?3:MOVE_STEPS.torch)===0&&G.torch>0) G.torch--;   // 배수 터널 구역은 손전등이 빨리 닳음
  tick();
  if(inDark()){   // 손전등 없이: 더듬어 가느라 걸음이 두 배, 넘어질 위험
    tick();
    let note='[어둠 속 이동] 손전등 없이 벽을 더듬어 이동했다.';
    if(Math.random()<DARK_STUMBLE){ G.hp=Math.max(0,G.hp-1); addLog('fx','🌑 어둠 속에서 발을 헛디뎠습니다 (체력 -1)'); note+=' 도중에 발을 헛디뎌 다쳤다(체력 -1은 코드가 반영함, effects의 체력은 0).'; pend(note,{checkHP:true}) }
    else pend(note);
    addLog('sys','🌑 손전등이 없어 더듬어 이동합니다 (2걸음)');
  }
  let ev='';
  if(first&&yuminEventReady()&&Math.random()<0.2) ev=' '+yuminEventText(`구역 「${d.name}」의 ${r.name}`);
  aiTurn(`「${r.name}」(으)로 이동한다`,(first?'[처음 들어서는 공간이다. 공간의 모습과 첫인상, 눈에 띄는 것을 묘사하라.]':'[이미 와 본 공간이다. 짧게 묘사하라.]')+ev);
}
function shelterHere(){
  if(busy) return;
  const where=G.loc==='site'?curRoom():null;
  if(where&&where.danger>=SHELTER_BLOCK_DANGER) return toast('이곳은 너무 위험해서 임시 쉼터를 만들 수 없습니다');
  sfx('shelter');
  const from=G.loc;
  const fed=G.calm>0&&G.battery>0;
  if(!isDarkTime()) addDemerit(1,'점호 누락');   // 야간 전에 밖에서 쉬어 버리면 점호에 빠진 것
  if(G.calm>0) G.calm--; if(G.battery>0) G.battery--;
  const heal=fed?Math.ceil(G.maxhp*0.4):1;
  G.hp=clamp(G.hp+heal,0,G.maxhp);
  G.time='야간'; G.dayStep=0; G.loc='shelter'; if(from!=='shelter') G._shelterFrom=from;
  wardShelterReset();
  addLog('sys',`임시 쉼터를 마련했습니다. 공포 +1, 배터리 -1, 체력 +${heal}${fed?'':' (공포 여유나 배터리가 부족해 거의 회복하지 못했습니다)'}`);
  let ex='[임시 쉼터 장면] 구역 속이나 뒷길의 임시 쉼터. 랜턴 불빛, 환풍기 소리, 생각. 30% 확률로 작은 사건(방문자, 이상한 소리, 꿈, 점호 방송의 잡음)이 생긴다. 사건이 있으면 선택지로 대응하게 하라. 체력 effects는 0으로 두라(회복은 코드가 처리함).';
  if(G.comp&&G.comp.joined){ changeAff(3,null); ex+=' [유민과의 임시 쉼터] 랜턴 불빛 곁에서 유민과 나누는 대화가 장면의 중심이다. 호감도 단계에 맞게: 낮으면 농담과 가벼운 노래, 중간이면 플레이어의 몸 상태를 챙기며 진심 한 조각, 높으면 플레이어의 여정을 담은 노래와 유민 자신의 숨겨온 이야기. 선택지에 유민에게 하는 말을 포함하라.'+relArmText('유민',0.7)+(G.relEvt?'':yuminArcArm(0.7)) }
  else if(yuminEventReady()&&Math.random()<0.35) ex+=' '+yuminEventText('랜턴 불빛을 보고 찾아온 임시 쉼터');
  aiTurn('랜턴을 켜고 임시 쉼터를 마련한다',ex,false);
}
/* 아침: 임시 쉼터를 시작한 곳(구역 안 / 한빛시 뒷길 / 구역 입구 밖)으로 돌아감 */
function breakCamp(){
  const from=G._shelterFrom; G._shelterFrom=null;
  G.time='낮'; G.dayStep=0; G.day++;
  if(from==='road'){ G.loc='road'; if(!G.site) addLog('sys',G.trip?`🔦 다시 ${G.trip.dest.name}${josa(G.trip.dest.name,'으로','로')} 향하는 한빛시 뒷길에 오릅니다.`:'🔦 다시 구역을 향한 한빛시 뒷길에 오릅니다.') }
  else G.loc=G.site?'site':'campus';
  addLog('sys',`날이 밝았습니다. (${G.day}일째)`);
  if(G.loc==='road') rollPeddler('morning');
  G.choices=[]; save(); render();
}
function exitZone(){
  if(busy||!G||G.loc!=='site'||!G.site) return;
  const d=G.site, steps=Math.min(3,Math.max(1,d.depth||0));
  for(let i=0;i<steps;i++) tick();
  d.exitSteps=steps;
  G.loc='road'; G.choices=[]; if(!(G.comp&&G.comp.joined)) G._yuminHere=false;
  addLog('action','구역 밖으로 나간다');
  addLog('sys',`🚪 「${d.name}」 입구 밖으로 나왔습니다 (${steps}걸음). 구역은 그대로 남아 있어 다시 들어갈 수 있습니다.`);
  G.recent.push({role:'scene',text:`플레이어는 「${d.name}」의 입구 밖 한빛시로 나와 있다.`});
  rollPeddler('exit');
  save(); render();
}
function reenterZone(){
  if(busy||!outsideZone()) return;
  const d=G.site, steps=d.exitSteps||1;
  for(let i=0;i<steps;i++) tick();
  G.loc='site'; G.choices=[]; if(G.peddler) G.peddler.here=false;
  const r=curRoom();
  addLog('action','구역 안으로 다시 들어간다');
  addLog('sys',`🏚 다시 「${d.name}」 안으로 들어가 「${r?r.name:'입구'}」까지 돌아왔습니다 (${steps}걸음).`);
  G.recent.push({role:'scene',text:`플레이어는 다시 「${d.name}」 안 「${r?r.name:'입구'}」에 있다.`});
  save(); render();
}
function siteProg(){
  const d=G.site; if(!d||!Array.isArray(d.rooms)) return null;
  const total=d.rooms.length, vis=d.rooms.filter(r=>r.visited).length;
  const seen=new Set(d.rooms.filter(r=>r.visited).map(r=>r.id));
  d.rooms.forEach(r=>{ if(r.visited) r.exits.forEach(x=>seen.add(x)) });
  const found=[...seen].filter(id=>{ const r=d.rooms.find(x=>x.id===id); return r&&!r.visited }).length;
  return {total,vis,found,hidden:total-vis-found,done:vis>=total};
}
/* 귀환 (떠나온 지구 · 중앙 캠퍼스 지구 · 섬은 선착장). skipConfirm: 다른 기능(아지트 이동 등)이 이미 확인을 받은 경우 */
async function returnToCampus(skipConfirm){
  if(busy) return;
  const d=G.site, p=d?siteProg():null, rt=returnRoute();
  const cost=`${needText(travelNeedFed(rt.days))}${rt.reservoir?' · 보트(왕복 대여료에 포함)':''}`;
  const msg=!p?`${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost})`:p.done?`모든 공간을 조사했습니다. ${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost}) 완료한 구역은 다시 올 수 없습니다.`:`아직 ${p.total-p.vis}개 공간이 미탐험입니다 (조사도 ${p.vis}/${p.total}). 돌아가도 나중에 조사 외출로 다시 와서 이어 조사할 수 있습니다. ${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost})`;
  if(skipConfirm!==true&&!(await askConfirm(msg))) return;
  closeModal();
  if(d){
    const done=d.rooms.every(r=>r.visited), vis=d.rooms.filter(r=>r.visited).length;
    const st=Math.max(0,Math.ceil(vis/2)-(d.metalGot||0)); d.metalGot=(d.metalGot||0)+st;   // 이어 조사한 구역은 새로 본 방만큼만
    archiveSite();
    if(done&&!d.big) G.sitesDone++;
    G.chronicle.push({day:G.day,text:`「${d.name}」 조사를 ${done?'마치고':'잠시 중단하고'} ${rt.name}${josa(rt.name,'으로','로')} 발길을 돌렸다`});
    addLog('action',`「${d.name}」을(를) 떠나 ${rt.name}${josa(rt.name,'으로','로')} 돌아간다`);
    const wd=st&&Math.random()<0.5?1:0;
    G.mat.metal+=st; G.mat.ply+=wd;
    if(st||wd) addLog('fx',`구역에서 쓸 만한 자재를 챙겼습니다: 🔩철제 부품 +${st}${wd?' · 🪵합판 +1':''}`);
  }else addLog('action',`발길을 돌려 ${rt.name}${josa(rt.name,'으로','로')} 돌아간다`);
  return beginTrip({kind:rt.hood?'hood':'campus',key:rt.hood||'campus',name:rt.name,pos:rt.pos,reservoir:rt.reservoir,ret:true},rt.days,
    {fromPos:rt.from,fromName:d?d.name:'한빛시 뒷길',keepFed:true,action:false});
}
/* 구역에서 돌아가는 길: 떠나온 지구(없으면 중앙 캠퍼스 지구)까지 지도 거리. 수몰 구역은 배로 그 선착장까지 */
function returnRoute(){
  const d=G.site, from=d?dunPos():playerPos();
  const isl=d&&d.big&&d.terrain==='flooded'&&((G.wards||[]).find(c=>c.id===d.key)||{}).pier;
  const hood=isl||(G.base&&HOODS[G.base]?G.base:null);
  const pos=hood?hoodPos(hood):CAMPUS_POS;
  return {hood,name:hood?HOODS[hood].n:'중앙 캠퍼스 지구',pos,from,reservoir:!!isl,days:travelDays(from,pos)};
}

/* 구역 정리: 다 못 본 구역은 '중단한 구역'(최대 3곳)으로, 다 본 구역은 지도에 ✕ + 사전 정리 + 사연 기록 */
function archiveSite(){
  const d=G.site; if(!d) return;
  if(d.big){ G.bigZones=G.bigZones||{}; if(d.done) delete G.bigZones[d.key]; else G.bigZones[d.key]=JSON.parse(JSON.stringify(d)); return }
  const fin=Array.isArray(d.rooms)&&d.rooms.every(r=>r.visited);
  const prev=(G.pausedZones||[]).map(r=>r.name);
  if(!fin){
    const copy=JSON.parse(JSON.stringify(d));
    if(!copy.pos) copy.pos=dunPos();
    copy.pausedDay=G.day;
    copy.scenes=G.recent.filter(r=>r.role==='scene').slice(-2).map(r=>String(r.text).replace(/\s+/g,' ').slice(0,170));
    G.pausedZones=(G.pausedZones||[]).filter(r=>r.name!==copy.name);
    G.pausedZones.push(copy);
    if(G.pausedZones.length>3){ const old=G.pausedZones.shift(); G.mapDone.push({name:old.name,x:old.pos.x,y:old.pos.y}); if(old.lore) finalizeZone(old) }   // 밀려난 구역도 밝혀낸 만큼 기록
  }else{
    const p=dunPos(); G.mapDone.push({name:d.name,x:p.x,y:p.y}); revealNextPlace(); gainXp(3,'구역 조사 완료');
    purgeZoneLex(d.name);
  }
  const now=new Set((G.pausedZones||[]).map(x=>x.name));
  prev.filter(n=>n!==d.name&&!now.has(n)).forEach(purgeZoneLex);
  if(fin&&d.lore) finalizeZone(d);
}
function revealNextPlace(){
  const c=MAP_PLACES.filter(p=>p.far&&!G.discovered.includes(p.id));
  if(!c.length) return;
  c.sort((a,b)=>Math.hypot(a.x-CAMPUS_POS.x,a.y-CAMPUS_POS.y)-Math.hypot(b.x-CAMPUS_POS.x,b.y-CAMPUS_POS.y));
  const p=c[0]; G.discovered.push(p.id);
  addLex({name:p.n,cat:'장소',desc:`${p.lore||''} (곁가지 구역 — 지금은 소문으로만 아는 곳)`},true,null);
  G.chronicle.push({day:G.day,text:`소문을 통해 「${p.n}」의 이야기를 들었다`});
  toast(`🗺 지도에 「${p.n}」이(가) 나타났습니다`);
}

/* 중단한 구역 */
function resumeZone(i){
  if(busy||!G.pausedZones||!G.pausedZones[i]) return;
  if(G.calm<1||G.battery<1) return toast('조사 외출에는 공포 여유와 배터리가 최소 1씩 필요합니다 (먼저 공포를 가라앉히거나 충전하세요)');
  closeModal(); G._resumeZone=i; startExpedition();
}
async function abandonZone(i){
  const d=G.pausedZones&&G.pausedZones[i]; if(!d) return;
  if(!(await askConfirm(`「${d.name}」 조사를 포기할까요? 포기한 구역은 다시 올 수 없습니다.`))) return;
  G.pausedZones.splice(i,1);
  G.mapDone.push({name:d.name,x:d.pos.x,y:d.pos.y});   // 먼 곳 소문은 끝까지 조사했을 때만 알려짐 (포기·밀려남은 해당 없음)
  purgeZoneLex(d.name);
  if(d.lore) finalizeZone(d);   // 포기해도 밝혀낸 단서만큼은 사연이 남음
  G.chronicle.push({day:G.day,text:`「${d.name}」 조사를 포기했다`});
  save(); render(); openZones();
}
function openZones(){
  const rows=(G.pausedZones||[]).map((d,i)=>{
    const vis=d.rooms.filter(r=>r.visited).length, cur=d.rooms.find(r=>r.id===d.cur), frag=d.rooms.some(r=>r.fragTaken);
    return `<div class="lex"><div class="h"><b>🏚 ${esc(d.name)}</b><span class="cat">${vis}/${d.rooms.length}공간${frag?' · ★':''}${d.raided?' · 🏴 털림':''}</span></div>
      <div class="muted" style="margin:4px 0;font-size:13px">마지막 위치: ${esc(cur?cur.name:'입구')} · ${d.pausedDay?G.day-d.pausedDay>0?`${G.day-d.pausedDay}일 전 중단`:'오늘 중단':'중단'}</div>
      <div class="row" style="justify-content:flex-end;gap:6px"><button class="small" onclick="abandonZone(${i})">포기하기</button><button class="small primary" onclick="resumeZone(${i})">이어서 조사</button></div></div>`;
  }).join('')||'<p class="muted">중단한 구역이 없습니다.</p>';
  modal('중단한 구역',`<p class="muted">이어서 조사하면 일반 조사 외출과 같은 비용(배터리 -1, 하루 경과)이 들고, 마지막으로 있던 공간에서 다시 시작합니다. 최대 3곳까지 보관됩니다.</p>${rows}`);
}
/* 다시 온 구역: 몇 턴 동안 지난 조사 기록을 AI에게 */
function memoText(d){
  const vis=d.rooms.filter(r=>r.visited).map(r=>r.name);
  const got=[...new Set(d.rooms.flatMap(r=>r.gotItems||[]))];
  const frag=d.rooms.some(r=>r.fragTaken), keepsake=d.rooms.some(r=>r.keepsakeTaken);
  const names=[d.name,...d.rooms.map(r=>r.name)].filter(n=>n&&n.length>=2);
  const lex=G.lexicon.filter(e=>names.some(n=>e.name.includes(n)||e.desc.includes(n))).slice(-5).map(e=>`${e.name}: ${e.desc.slice(0,60)}`);
  const chr=G.chronicle.filter(c=>c.text.includes(d.name)).slice(-4).map(c=>`${chronLabel(c)} ${c.text}`);
  return `[이어서 조사 — 지난 조사 기록] 플레이어는 이 구역을 한 번 조사하고 돌아갔다가 다시 왔다. 지난 조사와 모순되게 쓰지 말고, 이미 와 본 곳은 익숙한 곳으로 짧게 묘사하라.\n- 둘러본 공간: ${vis.join(', ')||'입구'}\n- 얻은 것: ${[...got,keepsake?'유실물':'',frag?'교표 조각':''].filter(Boolean).join(', ')||'특별한 것 없음'}`
    +(d.scenes&&d.scenes.length?`\n- 마지막 장면 요약: ${d.scenes.join(' / ')}`:'')
    +(chr.length?`\n- 연대기: ${chr.join(' / ')}`:'')
    +(lex.length?`\n- 사전: ${lex.join(' / ')}`:'');
}

/* ---------- 방 조사 완료: 같은 방을 여러 번 뒤졌거나, 서술이 '더 없다'고 하면 ---------- */
const ROOM_RX={
  SEARCH:/(살[피핀]|살펴|조사|둘러|찾[아는]|더듬|확인|관찰|들여다|뒤[진져]|탐색|수색|귀를 기울)/,
  NOT_SEARCH:/(마신다|마시|먹는다|먹는|임시 쉼터|휴식|쉰다|쉬어|잠[을든]|유민|OOC|\/\/|돌아|귀환|나간다|나가|사용한다|꺼낸다|손전등)/,
  NOTHING:/(더\s*(이상\s*)?(찾을|조사할|살필|얻을|건질)[^.!?\n]{0,12}(없|보이지)|(찾을|조사할|얻을|건질)\s*(것|게|건|만한 것)[^.!?\n]{0,8}(없|보이지)|(남은|더 볼)\s*(것|단서|곳)[^.!?\n]{0,8}(없|보이지))/,
  SRCH_CHOICE:/(살[피핀]|살펴|조사|둘러|찾[아는]|더듬|확인|관찰|들여다|뒤[진져]|탐색|수색)/,
};
on('after',30,T=>{
  const room=(T.loc==='site'&&G.loc==='site'&&G.site&&curRoom()===T.room)?T.room:null;
  if(!room||(room.fragment&&!room.fragTaken)) return;     // 교표 조각이 남은 방은 끝까지 조사 가능
  const act=T.action;
  if(ROOM_RX.SEARCH.test(act)||!ROOM_RX.NOT_SEARCH.test(act)) room.searchN=(room.searchN||0)+(T.flags.viaChoice?0.5:1);
  const limit=(room.keepsakeTaken||(room.gotItems&&room.gotItems.length)||room.fragTaken)?3:5;
  if(!room.exhausted&&(ROOM_RX.NOTHING.test(lastScene())||(room.searchN||0)>=limit)) room.exhausted=true;
});
on('after',35,()=>{ if(G.site&&G.site.memoLeft>0) G.site.memoLeft-- });

/* ---------- 선택지 정리: 위치와 맞지 않는 것 빼기 ---------- */
const LOC_RULES={
  siteExit:{re:/(은신처|구역 (밖|바깥)|(밖|바깥)으로|구역을 (나|떠|벗어)|중앙 캠퍼스 지구(로|에)|귀환|(전동 스쿠터|자전거)[이가]? ?(기다|있는))/,fill:['주변을 더 살핀다','다음 공간으로 이동한다','잠시 숨을 고르며 상황을 정리한다']},
  siteMove:{re:/((내려|올라|나아|들어|건너|지나|넘어|걸어|따라|돌아)[가간]|들어서|향[해한]|이동|빠져나|탈출)/,fill:['주변을 꼼꼼히 살핀다','벽과 바닥을 더듬어 단서를 찾는다','숨을 죽이고 소리에 귀를 기울인다']},
  shelter:{re:/((통로|방|공간)(으로|로|을|를)?\s*(이동|들어|향|나아)|구역\s*(밖|바깥)|중앙 캠퍼스 지구|귀환|깊이\s*(들어|나아))/,fill:['랜턴 불빛 곁에서 쉬며 상황을 정리한다','장비를 점검한다','주변 소리에 귀를 기울인다']},
  road:{re:/((정문|상점가|기숙사|급식실)(으로|에|을)?\s*(들어|간다|도착|돌아)|구역\s*(안|내부|깊)|통로(로|를)\s*(들어|지나))/,fill:['주변 골목을 살핀다','잠시 쉬며 마음을 가라앉힌다','구역 방향을 가늠해 본다']},
  campus:{re:/(구역\s*(안|내부|깊은\s*곳)(으로|에서)|통로(로|를)\s*(들어|지나)|(방|공간)으로\s*(들어|이동))/,fill:['상점가를 둘러본다','사람들의 이야기를 엿듣는다']},
  home:{re:/(구역\s*(안|내부|깊은\s*곳)(으로|에서)|통로(로|를)\s*(들어|지나)|(방|공간)으로\s*(들어|이동))/,fill:['아지트 주변을 둘러본다','잠시 쉬며 생각을 정리한다']},
};
function dropChoices(arr,R){
  const keep=arr.filter(c=>!R.re.test(String(c)));
  return keep.length===arr.length?arr:fillChoices(keep,R.fill);
}
on('choices',10,arr=>G.loc==='site'?dropChoices(arr,LOC_RULES.siteExit):arr);
on('choices',20,arr=>G.loc==='site'?dropChoices(arr,LOC_RULES.siteMove):arr);
LOC_RULES.hood=LOC_RULES.campus;
on('choices',30,arr=>LOC_RULES[G.loc]?dropChoices(arr,LOC_RULES[G.loc]):arr);
on('choices',40,arr=>roomExhausted()?arr.filter(c=>!ROOM_RX.SRCH_CHOICE.test(String(c))):arr);
/* 몰입 규칙: 길이 초과·여러 단계 묶기·언급 안 된 소지품 선택지 제거 (빠지면 채우고, 안 빠졌으면 원본 그대로) */
const CH_MULTI=[/[을를과와]\s*(이용|사용|활용|조합)/,/[을를]\s*써서/,/[을를]\s*삼아/,/하여\s/,/\s뒤\s/,/\s(다음|후)(에)?\s/,/[과와].*[을를]\s*(맞춰|맞추|합쳐|합치|대조)/];
on('choices',45,arr=>{
  const recent=(G.recent||[]).filter(r=>r.role==='action').slice(-3).map(r=>String(r.text)).join(' ');
  const words=(G.items||[]).map(it=>String(it||'').trim().split(/\s+/)[0]).filter(w=>w.length>=2);
  const keep=arr.filter(c=>{
    c=String(c);
    if(c.replace(/\s*\(💳[^)]*\)\s*$/,'').length>22) return false;
    if(CH_MULTI.some(rx=>rx.test(c))) return false;
    if(words.some(w=>c.includes(w)&&!recent.includes(w))) return false;
    return true;
  });
  if(keep.length===arr.length) return arr;
  const fill=G.loc==='site'?['주변을 천천히 살핀다','가까이 다가가 들여다본다','잠시 멈춰 귀를 기울인다']:(LOC_RULES[G.loc]||LOC_RULES.campus).fill;
  return fillChoices(keep,fill);
});

/* ---------- 장면 설명: 위치 고정 · 조사 상태 ---------- */

    if(G.site&&G.site.rooms.some(r=>r.fragTaken)) s+='\n[이미 획득] 이 구역의 교표 조각은 이미 얻었다. 교표 조각을 또 발견하거나 얻는 서술·선택지를 만들지 말 것. effects의 교표조각은 false.';

    if(roomExhausted()) s+='\n[조사 완료] 이 공간에서는 더 찾을 것이 없다. 관찰·조사·수색 선택지를 만들지 말고, 대화·장치·위험 대처처럼 정말 할 만한 다른 행동이 없으면 choices를 빈 배열 []로 두라. 서술에서도 더 얻을 것이 없음을 분명히 하라.';
    if(G.site&&G.site.memoLeft>0) s+='\n'+memoText(G.site);
  }
  else if(isHood()) s+='\n[위치 고정] 플레이어는 지금 구역 밖(지구/아지트)에 있다. 구역 내부를 조사하는 서술이나 선택지를 만들지 말 것(조사 외출은 고정 버튼으로 시작한다).';

  else if(G.loc==='road'){
    s+='\n[위치 고정] 플레이어는 지금 한빛시 뒷길 위에 있다. 구역 내부나 지구 안으로 들어가는 서술·선택지를 만들지 말 것(길을 계속 가는 것은 고정 버튼으로 한다).';
    if(outsideZone()) s+=`\n[현재 위치] 구역 「${G.site.name}」의 입구 밖 뒷길이다. 구역 안의 공간은 지금 묘사하지 말 것(다시 들어가는 것은 플레이어가 버튼으로 한다).`;
    if(G.peddler&&G.peddler.here) s+=`\n[근처] 「${G.peddler.name}」이(가) 잠시 쉬어 가고 있다. 대화나 배경으로 등장시켜도 된다.`;
  }
  return s;
});
on('facts',20,o=>{ const p=G.loc==='site'?siteProg():null; if(p) o.구역조사도=`${p.vis}/${p.total}공간 조사`+(p.done?' (모든 공간 조사 완료 — 새 방·통로를 더 만들지 말 것)':'') });


/* =========================================================
   15. 교표 조각
   ========================================================= */
const FRAG_RX={
  FOUND:/[^.!?\n]*교표[^.!?\n]*조각[^.!?\n]*(발견|손에 넣|집어|집었|주워|주웠|줍|획득|얻|챙|손끝에 걸)[^.!?\n]*/,
  LEFT:/(구역(을|에서)\s*(빠져나|벗어났|벗어나|나왔|나섰|떠났)|구역\s*(밖|바깥)(으로|에)\s*(나|서)|입구를\s*(빠져나|나서)|(밖|바깥)으로\s*(빠져나|나왔|나섰)|은신처(로|에)\s*(돌아|도착|들어)|중앙 캠퍼스 지구(로|에)\s*(돌아|도착))/,
};
FRAG_RX.NEG=/(아니었|아니다|않았|않는|못했|못한|없었|없다|흔적만|가짜|모조|비슷한|닮은|착각|줄 알았|인 줄)/;
/* 조각을 얻었다는 문장이 있는지 — "…발견했지만 조각은 아니었다" 같은 부정 문장은 빼고 */
function fragFoundIn(text){ return String(text||'').split(/(?<=[.!?\n])/).some(x=>FRAG_RX.FOUND.test(x)&&!FRAG_RX.NEG.test(x)) }
const needFrag=()=>G.fragments<FRAG_GOAL;
const fragAtRisk=()=>G.act<2&&!G.actDone;   // 조각을 빼앗길 수 있는 때 — 1막을 마치면(조각 완성) 더는 잃지 않음
function fragGain(where){
  G.fragments++;
  G.chronicle.push({day:G.day,text:`${where} 교표 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
  addLog('fx',`★ 교표 조각 ${G.fragments}/${FRAG_GOAL}`);
  save(); render(); checkState();
}
/* 서술에는 조각을 얻었다고 썼는데 effects의 교표조각을 빠뜨린 경우 */
on('after',50,T=>{
  if(inDark()||G.loc!=='site'||!G.site||G.fragments!==T.frags||!fragFoundIn(lastScene())) return;
  const cur=curRoom(), real=G.site.rooms.find(r=>r.fragment&&!r.fragTaken);
  if(!real||!cur) return;
  if(real!==cur){ real.fragment=false; cur.fragment=true }
  cur.fragTaken=true; G.fragments++;
  addLog('fx',`★ 교표 조각 ${G.fragments}/${FRAG_GOAL} (서술에서 획득을 확인해 반영)`);
  G.chronicle.push({day:G.day,text:`「${G.site.name}」에서 교표 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
  checkState();
});
/* 한빛시 뒷길·임시 쉼터에서 아주 가끔(조사 외출마다 한 번만 굴림) 우연히 */
on('before',20,T=>{
  if(needFrag()&&['road','shelter'].includes(G.loc)&&!G._fragTriedTrip&&Math.random()<0.04){
    G._fragTriedTrip=true; G._fragPending=true;
    T.extra+=' [우연한 발견] 이 장면에서 길가나 임시 쉼터 근처의 부서진 간판, 먼지에 덮인 짐, 누군가 흘린 물건 같은 곳에서 교표 문양이 새겨진 금속 조각(교표 조각)을 발견하게 하라. 플레이어가 손에 넣으면 effects의 교표조각=true.';
  }
});
on('after',55,T=>{
  if(G._fragPending){
    G._fragPending=false;
    if(G.fragments===T.frags&&needFrag()&&fragFoundIn(lastScene())) fragGain('길 위에서');
  }
  if(isHood()) G._fragTriedTrip=false;
});
/* 서술상 구역을 빠져나왔으면 → 입구 밖으로 */
on('after',90,()=>{
  if(G.loc!=='site'||!G.site) return;
  const t=lastScene(); if(!FRAG_RX.LEFT.test(t)||G._leaveAsked===t) return;
  G._leaveAsked=t;
  askConfirm('서술상 구역 밖으로 나온 것 같습니다.\n구역 입구 밖으로 나온 것으로 처리할까요?\n(구역은 그대로 남고, 중앙 캠퍼스 지구로 가려면 입구 밖에서 귀환 버튼을 누르세요)').then(ok=>{ if(ok) exitZone() });
});
/* 숫자에 반영되지 않았을 때 OOC 창에서 수동 반영 */
async function fragManual(){
  if(G.fragments>=FRAG_GOAL) return toast('이미 조각이 모두 모였습니다');
  if(!(await askConfirm('교표 조각을 +1 수동으로 반영할까요? (소지품의 교표 조각 아이템은 제거됩니다)'))) return;
  G.fragments++;
  G.items=G.items.filter(n=>!(/교표/.test(n)&&/조각/.test(n)));
  if(G.site){ const real=G.site.rooms.find(r=>r.fragment&&!r.fragTaken); if(real) real.fragTaken=true }
  G.chronicle.push({day:G.day,text:`교표 조각을 얻었다 (${G.fragments}/${FRAG_GOAL})`});
  addLog('fx',`★ 교표 조각 ${G.fragments}/${FRAG_GOAL} (수동 반영)`);
  closeModal(); save(); render(); checkState();
}
/* 상점가의 수상한 상인 */
function openMerchant(){
  const m=G.fragMerchant; if(!m) return;
  const ok=G.cash>=m.price;
  modal('수상한 상인',`<p>골목 안쪽 노점에서 상인이 금속 조각을 손바닥에 올려 보인다. 새겨진 문양이 교표 조각과 닮았다.</p>
    <p class="muted">캐시: ${G.cash}</p>
    <div class="shop-row"><span>교표 조각으로 보이는 금속 조각</span><button class="small ${ok?'primary':''}" ${ok?'':'disabled'} onclick="buyFragment()">캐시 ${m.price}</button></div>
    <p class="muted" style="font-size:12px">${ok?'':'캐시가 부족합니다. 상인은 한동안 상점가에 머뭅니다. '}거절하고 떠나도 상인은 상점가에 남아 있습니다.</p>`);
}
function buyFragment(){
  const m=G.fragMerchant; if(!m||G.cash<m.price) return;
  G.cash-=m.price; G.fragMerchant=null; G.merchantSold=(G.merchantSold||0)+1;
  closeModal(); fragGain('상점가의 수상한 상인에게서');
}

/* 상태 확인: 쓰러짐 → 구조 / 조각 FRAG_GOAL개 → 1막 완료 */
function checkState(){
  if(G.hp<=0){
    sfx('collapse');
    const keep=rideRescueKeep();
    addLog('sys',`출석부에서 네 이름이 지워졌다… 잠시 의식을 잃었다가 ${keep>0.5?G.ride.name+'의 도움으로 ':'순찰 중이던 직원에게 '}구조되어 ${baseName()}${josa(baseName(),'으로','로')} 돌아옵니다. 캐시의 ${keep>0.5?'4분의 1':'절반'}을 잃었습니다.`);
    G.chronicle.push({day:G.day,text:'조사 외출 중 쓰러져 순찰 직원에게 구조되었다'});
    G.cash=Math.floor(G.cash*keep); G.hp=Math.ceil(G.maxhp/2); G.calm=Math.max(G.calm,2); G.battery=Math.max(G.battery,2);
    archiveSite();
    G.site=null; G.trip=null; if(G.base&&HOODS[G.base]){ G.loc='hood'; G.hood=G.base } else { G.loc='campus'; G.district='gate' } G.day+=2; G.time='낮'; G.dayStep=0; G.choices=[];
  }
  if(G.fragments>=FRAG_GOAL&&G.act===1&&!G.actDone){ G.actDone=true; const w=()=>{ if(busy) return setTimeout(w,300); actComplete() }; setTimeout(w,0) }   // 진행 중인 턴이 끝난 뒤 실행 (겹침 방지)
}
async function actComplete(){
  addLog('sys','교표 조각이 모두 모였습니다.');
  await aiTurn(`모은 교표 조각 ${FRAG_GOAL}개를 맞추어 본다`,'[특별 장면] 조각들이 맞물려 하나의 교표가 되고, 그 문양 위로 지도에 없는 라쿠나 구역의 입구 위치가 겹쳐 보인다. 섬뜩하면서도 장엄하게 그려라. 마지막 문장은 다음 여정을 향한 기대감으로 끝내라.',false);
  G.chronicle.push({day:G.day,text:'교표를 완성해 라쿠나 구역의 입구 위치를 알아냈다 — 1막 완료'});
  addLog('sys','🌙 1막 완료. 중앙 캠퍼스 지구 정문(또는 다른 지구)에서 ✨ 라쿠나 구역으로 떠날 수 있습니다.');
  save(); render();
}


/* =========================================================
   16. 구역의 사연 · 구역 연혁
   - 첫 구역 때 세계의 구역 연혁 시대 5~6개를 정함
   - 구역마다 시대 하나 + 사연 + 방마다 단서(📝 조사 수첩)
   - 조사를 마치면 사전에는 「구역 이름」(사연 요약)과 「시대」(구역 목록) 두 줄만 남음
   ========================================================= */
let ancientBusy=null;
async function ensureAncient(){
  if(!G||(Array.isArray(G.ancient)&&G.ancient.length)) return;
  if(ancientBusy) return ancientBusy;
  ancientBusy=(async()=>{
    let eras=null;
    try{

function attachLore(era,j,hasFrag){
  const d=G.site; if(!d||d.lore) return;
  const fb=fallbackLore(era,d,hasFrag);

  let clues=(j&&Array.isArray(j.clues)?j.clues:[]).map(c=>({room:String(c&&c.room||''),text:String(c&&c.text||'').trim()})).filter(c=>c.text);
  if(clues.length<3) clues=clues.concat(fb.clues.slice(clues.length).map(t=>({room:'',text:t}))).slice(0,4);
  clues=clues.slice(0,4);
  const order=[...d.rooms].sort((a,b)=>(a.lv||0)-(b.lv||0));
  clues.forEach(c=>{
    let r=d.rooms.find(x=>x.id===c.room&&!x.clue);
    if(!r) r=order.find(x=>!x.clue&&x.id!==d.rooms[0].id)||order.find(x=>!x.clue);
    if(r) r.clue={t:c.text,got:false};
  });
  d.lore={era:era.id,eraName:era.name,fig:era.fig,who:String(L.who||fb.who),what:String(L.what||fb.what),fate:String(L.fate||fb.fate),lacuna:String(L.lacuna||fb.lacuna),record:String(L.record||fb.record),recorded:false};
  d.journal=[];
}

  if(hoodish&&G.campusCalmDay===G.day) return toast('오늘은 이미 공용 휴게 공간에서 공포를 가라앉혔습니다'), false;
  const need=capW()-G.calm; if(need<=0) return toast('공포가 이미 0입니다'), false;
  G.calm=capW(); w.used=true; if(hoodish) G.campusCalmDay=G.day;
  if(viaStory!==true) tick();
  addLog('fx',`🫧 「${w.name}」에서 공포를 가라앉혔습니다 (−${need}${viaStory===true?'':', 1걸음'})`);
  if(viaStory!==true){ save(); render() }
  return true;
}
/* "차를 따라 마신다"·"심호흡으로 마음을 가라앉힌다" 같은 글·선택지로 진정 장소에서 공포를 가라앉히려 하면 실제로 공포를 낮춤 (그 장소가 지금 곁에 있을 때만) */
function calmFillIntent(t){
  t=String(t||'');
  if(!G||RX.NEG.test(t)||!/((?:따뜻한\s*)?(?:차|음료)[을를]?\s*(?:한\s*잔\s*)?(?:따른다|따라|받는다|받아|뽑는다|뽑아|우려)|(?:심호흡|숨)[을를]?\s*(?:고른다|가다듬|크게)|마음을\s*(?:가라앉|진정)|공포를\s*(?:가라앉|달랜|누그러))/.test(t)) return false;
  /* 아지트 티 코너(하루 3~6회)·동부 저수지 공원 휴게 정자(하루 1번)는 시설이 정한 무료 규칙을 그대로 따름 — 티 코너라는 말이 없어도 (아지트에서 "차를 따라 마신다") */
  if(!BUY_VERB.test(t)&&((G.loc==='home'&&has('tea'))||(G.loc==='hood'&&curHood().lounge))){
    const home=G.loc==='home', refuse=m=>{ toast(m); pend(` [진정 불가] ${m} effects의 공포·배터리·캐시·체력은 0.`,{zeroSupply:true,noMoney:true}); return true };
    if(home?teaLeft()<=0:G.hoodLoungeDay===G.day) return refuse(home?`오늘은 티 코너를 ${teaMax()}번 다 썼습니다.`:'오늘은 이미 휴게 정자에서 쉬었습니다.');
    const need=capW()-G.calm; if(need<=0) return refuse('공포가 이미 0입니다.');
    G.calm=capW(); if(home) G.home.teaN=(G.home.teaN||0)+1; else G.hoodLoungeDay=G.day;
    addLog('fx',home?`🫧 티 코너에서 따뜻한 차를 마시며 공포를 가라앉혔습니다 (−${need}, 무료 · 오늘 ${teaLeft()}회 남음)`:`🫧 동부 저수지 공원의 휴게 정자에서 공포를 가라앉혔습니다 (−${need}, 무료)`);
    pend(' [진정 처리 완료] 코드가 이미 플레이어의 공포를 가라앉혔다(무료). 마음이 가라앉는 장면만 짧게 서술하고 effects의 공포·캐시·체력은 0.',{zeroSupply:true,noMoney:true});
    return true;
  }
  clearStaleEvents();   // 다른 곳으로 옮긴 뒤 남은 낡은 휴게 공간 사건은 먼저 지움
  const hoodish=G.loc==='campus'||G.loc==='hood';
  // AI가 진정 장소 사건을 내지 않았어도, 지구에서 휴게 공간·티 코너에서 쉬며 공포를 가라앉힌다는 글이면 공용 휴게 공간으로 처리 (산다·구입이 들어가면 구매)
  if(!G.calmSrc&&hoodish&&NEED_RX.SOURCE.test(t)&&!BUY_VERB.test(t))
    G.calmSrc={name:'공용 휴게 공간',loc:G.loc,room:null,dist:G.loc==='campus'?G.district:null,hood:G.loc==='hood'?G.hood:null,used:false};
  if(!G.calmSrc||G.calmSrc.used) return false;
  if(hoodish&&G.campusCalmDay===G.day){   // 오늘 이미 가라앉혔으면 더 못 하고, AI가 공포를 내려 주지도 못하게
    toast('오늘은 이미 공용 휴게 공간에서 공포를 가라앉혔습니다');
    pend(' [진정 불가] 플레이어는 오늘 이미 이 휴게 공간에서 공포를 가라앉혔다. 더 가라앉히지 못한다. effects의 공포·배터리·캐시·체력은 0.',{zeroSupply:true,noMoney:true});
    G.calmSrc=null;
    return true;
  }
  const ok=fillCalmSrc(true);
  if(ok) pend(' [진정 처리 완료] 코드가 이미 플레이어의 공포를 가라앉혔다. 마음이 가라앉는 장면만 짧게 서술하고 effects의 공포·체력은 0.',{zeroSupply:true});
  return ok;
}
/* 자리를 떠나면 사라지는 것들 (화면 그리기 전에 정리) */
function clearStaleEvents(){
  const c=G.peddler;
  if(c&&c.here){ const L=c.loc||'road'; if(!(G.loc===L||(L==='road'&&G.loc==='shelter'))||(L==='site'&&G.site&&c.room&&c.room!==G.site.cur)) c.here=false }
  const w=G.calmSrc;
  if(w&&(w.used||w.loc!==G.loc||(w.room&&G.site&&w.room!==G.site.cur)||(w.dist&&w.dist!==G.district)||(w.hood&&w.hood!==G.hood))) G.calmSrc=null;
}

  return `
플레이어(${G.char.name})와의 호감 레벨: Lv.${yuminLv()} — ${t.name} 단계: ${t.how}

지금 함께 있음: ${yuminHere()?'예 — 장면에 유민의 대사나 행동을 1~2번 자연스럽게 넣어라. 외형은 처음 등장하거나 인상적인 순간에만 한두 가지 특징으로 짧게 묘사하고 매번 반복하지 말 것':'아니오 — 등장시키지 말 것'}
규칙: 유민은 처음 만난 날부터 쌓인 관계만큼만 친하다. 오래 알던 사이처럼 굴지 않는다. 플레이어가 유민의 과거나 감정을 캐물으면 회피 패턴으로 반응하되, 호감도가 높을수록 회피 사이로 진심이 조금 더 새어 나온다. 이런 장면에서 진심 어린 반응을 이끌어 내면 호감도를 올리고, 무례하게 몰아붙이면 내린다. 유민이 함께 있을 때만 effects의 유민호감로 호감도 변화(-5~+5)를 제안하라.`;
}
/* 이번 장면에 유민 정보를 통째로 보낼지: 함께 있거나, 최근 장면·행동에서 이름이 나올 때만. 아니면 한 줄 */

/* ---------- 유민의 위치: 하루 단위로 중앙 캠퍼스 지구 안 장소 · 손님방 · 중앙 캠퍼스 지구 밖을 옮겨 다님 ---------- */
function spotHere(){ if(G.loc==='hood'&&G.hood==='south') return 'alley'; return G.loc==='campus'?curDistrict():(G.loc==='home'&&has('sofa'))?'sofaroom':'road' }
function nearPlayer(){
  if(G.loc==='campus') return curDistrict();
  if(G.loc==='home') return has('sofa')?'sofaroom':'market';
  if(G.loc==='hood'&&G.hood==='south') return 'alley';
  return 'road';
}
/* 유민은 일과를 따라 움직임: 평일 수업 칸엔 교실, 쉬는 시간엔 복도·매점, 점심엔 급식실, 방과 후엔 이곳저곳, 소등 후엔 기숙사, 주말엔 상점가·운동장 등. 같은 칸에서는 위치가 고정됨 */
function yKey(){ return `${G.day}:${G.time==='낮'?'s'+slotIdx():G.time}` }
function yHash(str){ let h=0; for(const ch of String(str)) h=(h*31+ch.charCodeAt(0))>>>0; return h }
function setYuminSpot(k){ const c=G.comp; c.spot=k; c.spotDay=G.day; c.spotKey=yKey() }
function yuminScheduleSpot(){
  const h=yHash(yKey()+'유민'), pick=a=>a[h%a.length], i=slotIdx(), we=isWeekend();
  if(G.time==='야간'||G.time==='새벽') return 'dorm';
  if(G.time==='낮'){
    if(!we){
      if(CLASS_SLOTS.includes(i)||i===0||i===8) return 'classroom';
      if(i===4) return 'canteen';
      return pick(['hall','snack','hall','snack','classroom']);
    }
    if(i===0||i===8) return 'dorm';
    if(i===4) return 'canteen';
    if(has('sofa')&&h%100<20) return 'sofaroom';
    return pick(['market','market','ground','library','music','roof','bank']);
  }
  const lv=yuminLv();
  if(has('sofa')&&h%100<(lv>=30?40:lv>=10?20:10)) return 'sofaroom';
  return pick(['market','bank','ground','library','hall','gate','canteen','music']);
}
function updateYuminSpot(){
  if(!G||!G.comp||!G.comp.met) return;
  apptSync();
  const c=G.comp;
  if(c.joined){ c.spot='with'; c.spotDay=G.day; c.spotKey=yKey(); return }
  if(!YUMIN_SPOTS[c.spot]){ c.spot=(c.spot==='with')?nearPlayer():'market'; c.spotDay=G.day; c.spotKey=yKey(); return }
  if(c.spotKey==null){ c.spotKey=yKey(); return }
  if(c.spotKey===yKey()) return;
  c.spotKey=yKey(); c.spotDay=G.day;
  c.spot=yuminScheduleSpot();
}
function yuminWhereText(){ const s=YUMIN_SPOTS[G.comp.spot]; if(!s) return '어딘가'; return s.kind==='wild'?`중앙 캠퍼스 지구 밖 「${s.n}」`:s.kind==='home'?`아지트의 「${s.n}」`:`중앙 캠퍼스 지구의 「${s.n}」` }

/* ---------- 약속: 스토리·문자에서 누구와 어디서 언제 만나기로 하면 그 때 그 사람이 그곳에 있음. 놓치면 서운해함 ----------
   G.appts=[{name,where('campus:지점'|'home'|'hood:south'),ord,text,arrived,met}] */
function apptOrd(){ return G.day*20+(G.time==='낮'?Math.max(0,slotIdx()):G.time==='방과 후'?10:G.time==='야간'?11:12) }
function apptNextOrd(){ const o=apptOrd(); if(G.time==='낮'&&slotIdx()<8) return o+1; return G.time==='방과 후'?G.day*20+11:G.time==='야간'?G.day*20+12:(G.day+1)*20 }
function apptWhen(t){
  t=String(t||''); const o=apptOrd(), d=G.day, tom=/내일|다음\s*날|이튿날/.test(t);
  const base=tom?(d+1)*20:d*20;
  let x=null;
  if(/점심|급식/.test(t)) x=base+4;
  else if(/쉬는\s*시간|쉬는시간/.test(t)) x=tom?base+2:(G.time==='낮'&&slotIdx()<2?d*20+2:d*20+6);
  else if(/조례|아침|등교/.test(t)) x=tom||(G.time!=='낮')?(tom?base:(d+1)*20):null;
  else if(/방과\s*후|종례|수업\s*(?:끝|마치)|끝나고|하교/.test(t)) x=base+10;
  else if(/저녁|밤|야간|소등|점호/.test(t)) x=base+11;
  else if(/새벽/.test(t)) x=base+12;
  else if(tom) x=base+10;
  if(x==null||x<=o) x=apptNextOrd();   // 이따·곧·때 불명 → 다음 시간 칸
  return x;
}
function apptWhenText(x){ const d=Math.floor(x/20), r=x%20; const dd=d===G.day?'':(d===G.day+1?'내일 ':d+'일째 '); return dd+(r<=8?SCHOOL[r]:r===10?'방과 후':r===11?'야간':'새벽') }
function apptWhereName(w){ return w==='home'?'아지트':w==='hood:south'?'학원가 골목':(DISTRICTS[String(w).slice(7)]||{n:'학교'}).n }
/* 글 속 장소를 약속 장소로: 가장 나중에 나온 곳. 학교 안 지점 · 아지트 · 학원가 골목 */
function apptPlaceKey(t){
  t=String(t||''); let best=null, bi=-1;
  const hit=(w,re)=>{ const g=new RegExp(re.source,'g'); let m; while((m=g.exec(t))){ if(m.index>=bi){ bi=m.index; best=w } if(m[0].length===0) g.lastIndex++ } };
  for(const [k,re] of IX.DIST_KEYS) hit('campus:'+k,re);
  hit('home',/아지트|동아리실/); hit('hood:south',/학원가/);
  if(best&&best.startsWith('campus:')){ const k=fixHall(best.slice(7),t); best='campus:'+k }
  return best;

[유민 능력 자동 발동] 유민이 노래를 불러 소리와 교내 방송, 전자기기를 흔든다. 버릇대로 과하게 써서 상황이 크게 뒤집힌다(적이 흠칫 물러나거나, 잠긴 문의 전자 자물쇠가 풀리거나, 꺼진 형광등이 일제히 깜빡이는 등 예상 못한 부작용 포함). ${crisis?'플레이어가 위기에 처해 있으니 결과적으로 플레이어를 구하는 방향으로.':''} 노래 가사 한두 줄을 직접 지어 넣어라. 발동 직후 유민다운 농담 한마디.`;

  if(G.steps-(G.comp.lastHelp==null?-99:G.comp.lastHelp)<4||Math.random()>0.35) return '';
  const nexts=r.exits.map(id=>d.rooms.find(x=>x.id===id)).filter(x=>x&&!x.visited), opts=[];

    ai:`[유민의 경고] 유민이 귀를 기울이다 "${risky.name}" 방향에서 위험한 기척(함정·수호자·무너질 바닥 등 위험도 ${risky.danger}/3에 맞는 것)을 감지하고 짧게 경고한다. 직접적 사실을 다 말하지는 말고 유민답게 농담 섞어 한두 마디.`});
  if(r.fragment&&!r.fragTaken&&!r.exhausted) opts.push({log:'🎵 유민이 이 공간 어딘가에서 이상한 울림을 느낍니다',
    ai:'[유민의 직감] 유민이 이 공간의 어딘가(벽, 바닥, 천장 중 하나)에서 노래가 이상하게 울린다며 가리킨다. 교표 조각이 있다는 말은 하지 말고, 조사할 만한 곳을 한 곳 짚어 주는 식으로.'});
  if(r.exhausted) opts.push({log:'🎵 유민이 이 공간은 더 볼 게 없다고 말합니다',ai:'[유민의 조언] 유민이 이 공간은 이미 다 뒤진 것 같다며 다른 방으로 가자고 한다.'});
  if(nexts.length) opts.push({log:'🎵 유민이 아직 안 가 본 길을 가리킵니다',
    ai:`[유민의 길 안내] 유민이 아직 가 보지 않은 통로 중 한쪽(${nexts.map(x=>x.name).join(', ')} 중 하나)을 가리키며 노래의 울림이 그쪽에서 다르게 돌아온다고 말한다. 확실한 정보는 아니고 유민의 감이다.`});
  if(!opts.length) return '';
  const o=risky?opts[0]:rand(opts);
  G.comp.lastHelp=G.steps;
  addLog('sys',o.log);
  return '\n'+o.ai;
}

const GIFT_ACC=/반지|목걸이|팔찌|귀걸이|장신구|비녀|머리핀|브로치|노리개|펜던트/;
const GIFT_NOT=/이야기|인사|질문|노래|농담|위로|미소|눈길|시선|한마디|소식|웃음|안부|눈물|부탁|조언|^말$|^손$|^마음$/;
/* 글로 쓴 선물: "유민에게 부채를 사 준다" / "유민에게 우정 팔찌를 선물한다" → {kind,idx|name,cost} 또는 null */
function giftParse(t){
  t=String(t||''); if(!G||!G.comp||!G.comp.met||!/유민/.test(t)) return null;
  const m=t.match(/유민(?:에게|한테|께)\s*(?:(?:상점가에서|여기서|가게에서)\s*)?(.+?)\s*(?:을|를)?\s*(?:선물|사\s*주|사\s*준|사주|사서|사다\s*주|건네|건넨|내민|쥐여|전한|준다|주었|줄게|드린|드릴)/);
  if(!m) return null;
  let name=m[1].replace(/^["'「『]|["'」』]$/g,'').trim(); if(!name||name.length>16||GIFT_NOT.test(name)) return null;
  const buy=/사\s*주|사\s*준|사주|사서|사다\s*주|구입|구매|산다/.test(t);
  if(!buy){
    const i=G.items.findIndex(it=>it&&!consKind(it)&&(name.includes(it)||String(it).includes(name)));
    if(i>=0) return {kind:'i',idx:i,name:G.items[i]};
    if(/유실물/.test(name)&&G.mat.keepsake>0) return {kind:'r',name:'오래된 유실물'};
    if(/우정 팔찌|반지|팔찌/.test(name)) return {kind:'b',name:'우정 팔찌',cost:40};
    return null;
  }
  const k=likeOf(name);
  return {kind:'x',name,cost:k?YUMIN_LIKES[k].buy.cost:GIFT_ACC.test(name)?40:15};
}
function giftByText(t){
  const g=giftParse(t); if(!g) return;
  if(!canMeetHere('유민')) return toast('유민이 지금 이 자리에 없습니다. 먼저 "유민 만나러 가기"로 만나세요');

  }

}
function giveYumin(kind,i){
  if(busy||G.comp.lastGiftDay===G.day) return;
  migrate();
  const L=G.comp.likes, ACC=GIFT_ACC;
  let name='', v=3, k=null, paid=0;

  else if(kind==='r'){ if(G.mat.keepsake<1) return; G.mat.keepsake--; name='오래된 유실물'; v=4 }

  else return;

  aiTurn(`유민에게 ${name}${josa(name,'을','를')} 선물한다`,
    `[선물] 플레이어가 유민에게 ${name}${josa(name,'을','를')} 건넨다. ${k?`이것은 유민이 유난히 좋아하는 ${YUMIN_LIKES[k].story}이다. 평소의 농담 가면이 잠깐 깨질 만큼 기뻐하며, 왜 좋아하는지 사연을 한 줄 흘린다.`:'유민은 어색해하며 농담으로 넘기려 한다.'} 호감 단계(${affTier().name})에 맞는 진심이 조금 새어 나온다. 코드가 이미 호감도 +${v}를 반영했으니 effects의 유민호감은 0으로 둘 것. 캐시·소지품은 이미 정리했으니 effects의 캐시와 items_remove도 비울 것. 선물은 이제 유민의 소지품이 되었다.`);

   19. 인연 — 호감 · 관계 단계 · 우정 · 평생 친구

function getRel(name){
  if(!G.rel) G.rel={};
  return G.rel[name]||(G.rel[name]={aff:10,stage:0,adult:name==='유민'?true:undefined,cool:0});
}
function relAff(name){ return name==='유민'?G.comp.aff:getRel(name).aff }
function relLv(name){ return affInfo(relAff(name)).lv }
function affPct(name){ return affInfo(relAff(name)).pct }
function addAffTo(name,d){ if(name==='유민') changeAff(d,null); else { const r=getRel(name), b=affInfo(r.aff).lv; r.aff=clamp(r.aff+Math.round(d*AFF_RATE),0,AFF_MAX); lvNotice(name,b,affInfo(r.aff).lv) } }
function otherPartner(name){ return Object.entries(G.rel||{}).some(([n,r])=>n!==name&&r.stage>=4) }
function spouseName(){ const e=Object.entries(G.rel||{}).find(([n,r])=>r.stage===6); return e?e[0]:null }
function relCheck(name){
  const r=getRel(name);
  for(;;){
    const nx=STAGES[r.stage+1];
    if(!nx||nx.event||relLv(name)<nx.lv) break;
    r.stage++;
    G.chronicle.push({day:G.day,text:`${name}${josa(name,'과','와')} ${nx.msg}`});
    toast(`🤝 ${name}: ${nx.n}`);
  }
}
function hasGift(){ return G.items.some(i=>/반지|목걸이|팔찌|귀걸이/.test(i))||G.mat.keepsake>=1 }
function takeGift(){
  const i=G.items.findIndex(x=>/반지|목걸이|팔찌|귀걸이/.test(x));
  if(i>=0) return G.items.splice(i,1)[0];
  G.mat.keepsake--; return '오래된 유실물';
}
function relConds(name){
  const r=getRel(name), nx=STAGES[r.stage+1];
  if(!nx) return {nx:null,c:[],note:'가장 깊은 인연에 이르렀습니다.'};
  if(nx.romance&&r.adult===false) return {nx,c:[],note:'이 인물과의 관계는 우정까지만 이어집니다.'};
  const c=[];
  if(nx.lv) c.push([`호감 레벨 Lv.${nx.lv} 이상 (현재 Lv.${relLv(name)})`,relLv(name)>=nx.lv]);
  if(nx.romance&&r.adult===undefined) c.push(['이 인물을 좀 더 알아야 함',false]);
  if(nx.event==='heart'||nx.event==='confess') c.push([`이벤트: ${EVT_LABEL[nx.event]} (함께 시간을 보내다 보면 일어남)`,false]);
  if(nx.event==='propose'){ c.push(['아지트가 있을 것',has('clubroom')]); c.push(['선물: 팔찌·장신구, 또는 유실물 1개',hasGift()]) }
  if(nx.event==='wedding'){ c.push([`약속 후 3일이 지날 것 (${Math.max(0,G.day-(r.engagedDay||G.day))}일 지남)`,G.day-(r.engagedDay||G.day)>=3]); c.push(['맹세 기념 비용 캐시 100',G.cash>=100]) }
  if(r.cool&&G.day<r.cool) c.push([`사이가 잠시 어색함 (${r.cool}일째에 풀림)`,false]);
  return {nx,c,note:''};
}
function relArmed(name){
  const r=getRel(name), nx=STAGES[r.stage+1];
  if(!nx||!nx.event||nx.manual||G.relEvt) return false;
  if(r.cool&&G.day<r.cool) return false;
  if(relLv(name)<nx.lv) return false;
  if(nx.romance&&r.adult!==true) return false;
  return true;

function yuminRomanceNote(type){

/* =========================================================
   20-1. 떡밥 장부 — 아직 풀리지 않은 이야기
   - 사전 추출(3장면마다) 때 같은 AI가 새 떡밥을 적고, 풀린 떡밥을 닫음 (호출이 늘지 않음)
   - 서술 AI에게는 매 턴 2~3개를 '자연스러우면 회수'로 넘김 (억지로 풀지 않게)
   - G.threads=[{id,text,day,status:'open'|'closed',closedDay,shown}]
   ========================================================= */
const THREAD_MAX=12, THREAD_PROMPT=3;
function threadsOpen(g){ g=g||G; return (g.threads||[]).filter(t=>t.status==='open') }
function threadsRequest(g){
  const open=threadsOpen(g);
  return `
[조사 보드 정리 — 사전과 별도]
'조사 보드'는 플레이어가 장면에서 직접 보거나 들은 것 중 아직 풀리지 않은 것이다: 인물이 한 약속이나 부탁, 답이 나오지 않은 수수께끼, 인물의 미해결 사정, 예고된 위협, 다시 만나자고 한 사람. 사소한 묘사·이미 끝난 일·플레이어가 모르는 비밀은 넣지 않는다.
- threads_new: 이번 장면들에서 새로 생긴 조사 보드(최대 2개, 각 40자 이내, 누가·무엇을이 드러나게). 아래 목록과 겹치면 넣지 말 것. 없으면 [].
- threads_closed: 아래 목록 중 이번 장면들에서 분명히 풀렸거나 끝난 것의 id. 없으면 [].
[현재 조사 보드 목록]
${open.map(t=>`${t.id}: ${t.text}`).join('\n')||'(없음)'}`;
}
function applyThreads(g,r){
  if(!g.threads) g.threads=[];
  const closed=new Set((Array.isArray(r.threads_closed)?r.threads_closed:[]).map(String));
  let nc=0, nn=0;
  g.threads.forEach(t=>{ if(t.status==='open'&&closed.has(t.id)){ t.status='closed'; t.closedDay=g.day; nc++ } });
  (Array.isArray(r.threads_new)?r.threads_new:[]).slice(0,2).forEach(x=>{
    const text=String(x&&(x.text||x)||'').trim().slice(0,60); if(text.length<4) return;
    if(threadsOpen(g).some(t=>t.text===text)) return;
    g.threadN=(g.threadN||0)+1;
    g.threads.push({id:'t'+g.threadN,text,day:g.day,status:'open',shown:0}); nn++;
  });
  // 너무 많이 쌓이면 가장 오래된 것부터 '흐지부지'로 닫음
  const open=threadsOpen(g);
  if(open.length>THREAD_MAX) open.slice(0,open.length-THREAD_MAX).forEach(t=>{ t.status='faded'; t.closedDay=g.day });
  g.threads=g.threads.filter(t=>t.status==='open'||g.day-(t.closedDay||g.day)<=30).slice(-40);   // 닫힌 기록은 한 달만 보관
  if(nn) toast(`🧵 조사 보드 ${nn}개가 적혔습니다`);
  if(nc) toast(`🧵 조사 보드 ${nc}개가 풀렸습니다`);
}
/* 이번 턴에 서술 AI에게 넘길 것: 지금 장면에 이름이 나온 것 → 오래 언급 안 된 것 순 */
function pickThreads(text){
  const open=threadsOpen(); if(!open.length) return [];
  const hit=t=>t.text.split(/[\s,·.()「」'"]+/).filter(w=>w.length>=2).some(w=>text.includes(w));
  return [...open].sort((a,b)=>(hit(b)-hit(a))||((a.shown||0)-(b.shown||0))||(a.day-b.day)).slice(0,THREAD_PROMPT);
}
function threadsBlock(text){
  const list=pickThreads(text); if(!list.length) return '';
  list.forEach(t=>t.shown=(t.shown||0)+1);
  return `\n[조사 보드 — 아직 풀리지 않은 것. 지금 장면과 자연스럽게 이어질 때만 하나를 이어 가거나 매듭지어라. 억지로 끌어오지 말고, 이번 장면과 무관하면 무시해도 된다. 목록이 있다는 사실은 서술에 드러내지 말 것]\n${list.map(t=>'- '+t.text).join('\n')}`;
}
function closeThread(id){ const t=(G.threads||[]).find(x=>x.id===id); if(!t) return; t.status='closed'; t.closedDay=G.day; _sigR=''; save(); renderSides(); if(document.getElementById('thrList')) openThreads() }
function reopenThread(id){ const t=(G.threads||[]).find(x=>x.id===id); if(!t) return; t.status='open'; delete t.closedDay; _sigR=''; save(); renderSides(); openThreads() }
function addThread(){
  const el=document.getElementById('thrNew'); const v=(el&&el.value||'').trim().slice(0,60); if(!v) return;
  applyThreads(G,{threads_new:[{text:v}]}); _sigR=''; save(); renderSides(); openThreads();
}
function threadsSideHTML(){

function openThreads(){

    <div id="thrList">${open.map(t=>`<div class="shop-row" style="gap:8px"><span><span class="muted">${t.day}일 ·</span> ${esc(t.text)}</span><button class="small" onclick="closeThread('${t.id}')">✓ 닫기</button></div>`).join('')||'<p class="muted">조사 보드가 없습니다.</p>'}</div>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="thrNew" placeholder="직접 적기 (예: 하킴이 은화를 갚겠다고 했다)" maxlength="60"><button class="small" onclick="addThread()">추가</button></div>
    ${done.length?`<h4 style="margin:14px 0 4px">최근에 닫힌 것</h4>${done.map(t=>`<div class="shop-row muted" style="gap:8px"><span>${t.status==='faded'?'💨':'✓'} ${esc(t.text)}</span><button class="small" onclick="reopenThread('${t.id}')">다시 열기</button></div>`).join('')}`:''}`);
}

/* =========================================================
   20. 사전 — 별도 AI가 정리 (3턴마다 한 번, 또는 장소를 옮길 때)
   ========================================================= */
const LEX_CATS=['인물','장소','괴담','물건','세력'];
/* zoneName: 이 항목이 생긴 구역 이름 (조사를 마치면 인물·세력·즐겨찾기 말고는 정리됨 — 장소·괴담은 합치고 물건은 삭제).
   undefined면 지금 구역 안에 있을 때 그 구역으로 표시 */
function addLex(e,silent,zoneName){
  if(!e||!e.name||!e.desc) return;
  const cat=LEX_CATS.includes(e.cat)?e.cat:'괴담';
  const ex=G.lexicon.find(x=>x.name===e.name);
  if(ex){
    if(ex.desc.includes(e.desc)) return;
    ex.desc=(ex.desc+' '+e.desc).slice(-500); ex.isNew=true;
    if(ex.cat==='세력'){ ex.sumPending=(ex.sumPending||0)+1; if(ex.desc.length>FACTION_SUM_LEN||ex.sumPending>=4) summarizeFaction(ex) }   // 세력 기록이 길어지면 한 문단으로 요약
    if(!silent) toast(`📜 괴담 사전 갱신: ${e.name}`);
    return;
  }
  const x={name:e.name,cat,desc:e.desc,isNew:!silent};
  const rn=zoneName!==undefined?zoneName:((G.site&&(G.loc==='site'||G.loc==='shelter'))?G.site.name:null);
  if(rn) x.zone=rn;
  G.lexicon.push(x);
  if(!silent) toast(`📜 괴담 사전에 새 항목: ${e.name}`);
}
/* 사전 추출 대기열 — G._lexQ = {key, zone, items:[{a:행동, n:서술}]} (저장에 함께 남음) */
function lexKey(){ if(G.site&&['site','shelter','road'].includes(G.loc)) return 'zone:'+G.site.name; return G.loc==='hood'?'hood:'+G.hood:G.loc }
function queueLex(narr,action){
  if(!G) return;
  const key=lexKey();
  if(G._lexQ&&G._lexQ.items.length&&G._lexQ.key!==key) flushLex();
  if(!G._lexQ||G._lexQ.key!==key) G._lexQ={key,zone:key.startsWith('zone:')?G.site.name:null,items:[]};
  G._lexQ.items.push({a:String(action||'').slice(0,200),n:String(narr||'')});
  if(G._lexQ.items.length>=LEX_EVERY) flushLex();
}
/* 장소를 옮겼으면(화면을 그릴 때 확인) 이전 장소에서 쌓인 장면을 정리 */
function lexMovedCheck(){ const q=G&&G._lexQ; if(!busy&&q&&q.items.length&&q.key!==lexKey()) flushLex() }
function flushLex(){
  const q=G&&G._lexQ; if(!q||!q.items.length) return;
  G._lexQ={key:q.key,zone:q.zone,items:[]};
  extractLex(q).catch(e=>console.warn(e));
}
async function extractLex(q){
  const g=G;
  const names=g.lexicon.map(e=>e.name).slice(-80).join(', ')||'(없음)';
  const scenes=q.items.map((x,i)=>`(${i+1}) 플레이어: ${x.a}\n${x.n}`).join('\n\n');
  const prompt=`다음은 텍스트 탐험 게임의 최근 장면들이다. 이 장면들에서 새로 등장했거나 새로 알게 된 인물, 장소, 괴담, 물건, 세력만 뽑아 사전 항목으로 정리하라.
- 이미 사전에 있는 대상이면 반드시 같은 이름을 쓰고, desc에는 이번에 새로 알게 된 내용만 쓴다.
- 플레이어 캐릭터(${g.char.name}) 자신은 넣지 않는다. 몬스터·동물은 '인물'로 넣지 않는다.${q.zone?`
- 이 장면들은 구역 「${q.zone}」 안의 일이다. 방 이름·문양·사소한 물건은 넣지 말고, 인물과 오래 간직할 만한 물건, 세계의 괴담에 이어지는 것만 넣는다.`:''}
- 새 정보가 없으면 빈 배열. 최대 6개.
[이미 있는 항목 이름] ${names}
[관련 항목]
${relevantLex(scenes)}
[장면]
${scenes}
${threadsRequest(g)}
JSON만 출력: {"lexicon":[{"name":"이름","cat":"인물|장소|괴담|물건|세력","desc":"플레이어가 알게 된 내용 1~2문장"}],"threads_new":[{"text":"조사 보드 한 줄"}],"threads_closed":["t1"]}`;
  let r=null;
  try{ r=parseJSON(await callAI('너는 게임 사전을 정리하는 서기다. JSON 하나만 출력한다.',prompt,1000,'lex')) }catch(e){ return }
  if(G!==g||!r) return;
  applyThreads(g,r);
  if(!Array.isArray(r.lexicon)){ save(); render(); return }
  // 이 장면들의 구역이 아직 진행 중(또는 중단)이면 그 구역 표시, 이미 끝난 구역이면 인물·물건만 남김
  const active=!!q.zone&&((g.site&&g.site.name===q.zone)||(g.pausedZones||[]).some(d=>d.name===q.zone));
  r.lexicon.slice(0,6).forEach(e=>{
    if(!e||!e.name||e.name===g.char.name) return;
    if(q.zone&&!active&&e.cat==='괴담'){ mergeZoneLegend(q.zone,[e]); return }
    if(q.zone&&!active&&e.cat==='장소'){ mergeZonePlaces(q.zone,[e]); return }   // 끝난 구역의 장소 → 「구역 이름」 기록에 합침   // 끝난 구역의 괴담 → 요약 항목에 합침
    if(q.zone&&!active&&!['인물','물건'].includes(e.cat)) return;
    addLex(e,false,q.zone&&active?q.zone:null);
  });
  save(); render();
}
/* 구역 조사를 마치거나 포기하면, 그 구역에서 생긴 항목 정리
   - 인물·세력·즐겨찾기: 그대로 남김 (물건은 삭제)
   - 괴담: 「구역 이름의 괴담」 한 항목으로 요약해 남김 (구역 연혁 시대 항목과 연결)
   - 장소: 「구역 이름」 항목에 '둘러본 곳' 한 줄로 합침
   - 세력: 지움 */
function zoneLegendName(zone){ return `${zone}의 괴담` }
function mergeZoneLegend(zone,list){
  list=list.filter(e=>e&&e.desc); if(!list.length) return null;
  const name=zoneLegendName(zone);
  let x=G.lexicon.find(e=>e.name===name);
  const add=list.map(e=>`${e.name}: ${e.desc}`).filter(t=>!x||!x.desc.includes(t));
  if(!add.length) return x;
  const text=add.join(' / ');
  if(x){ x.desc=trunc(x.desc+' / '+text,400); x.isNew=true; x.sumPending=(x.sumPending||0)+add.length }
  else{ x={name,cat:'괴담',desc:trunc(text,400),isNew:true,zoneLegend:zone,sumPending:add.length}; G.lexicon.push(x) }
  if(x.sumPending>=2) summarizeZoneLegend(x);   // 두 개 이상 모였으면 AI가 한 문단으로 다듬음
  linkLegendEra(zone);
  return x;
}
/* 구역의 장소 항목(방·공간) → 「구역 이름」 항목 끝에 '둘러본 곳: 이름(짧은 설명)' 한 줄로 */
function setPlaceNote(x,note){
  const base=x.placeNote&&x.desc.endsWith(x.placeNote)?x.desc.slice(0,-x.placeNote.length):x.desc;
  x.placeNote=note; x.desc=trunc(base,380)+note;
}
function mergeZonePlaces(zone,list){
  list=list.filter(e=>e&&e.name&&e.name!==zone); if(!list.length) return null;
  let x=G.lexicon.find(e=>e.name===zone);
  if(!x){ x={name:zone,cat:'장소',desc:'한빛시의 구역.',isNew:true}; G.lexicon.push(x) }
  const places=x.places||[];
  list.forEach(e=>{ if(!places.some(p=>p.n===e.name)) places.push({n:e.name,d:trunc(String(e.desc||'').replace(/\s+/g,' '),28)}) });
  x.places=places.slice(-6);
  setPlaceNote(x,` · 둘러본 곳: ${x.places.map(p=>`${p.n}(${p.d})`).join(', ')}`);
  x.isNew=true;
  return x;
}
/* 「구역 이름의 괴담」 ↔ 구역 연혁 시대: 시대 항목에 괴담 이름을 적고, 괴담 항목에 시대를 기록 */
function zoneEra(zone){ return (G.ancient||[]).find(e=>e.zones.some(r=>r.name===zone)) }
function eraEntryDesc(era){

let lexCompacting=false;
async function lexCompact(force){
  if(lexCompacting||!G||!Array.isArray(G.lexicon)) return;
  if(!force&&SET.lexAuto===false) return;
  const g=G;
  const cand=G.lexicon.filter(e=>!e.arch&&!e.fav&&!e.sum&&!e.zone&&['장소','괴담','물건'].includes(e.cat));
  if(!force&&cand.length<=40) return;
  if(force&&cand.length<6) return toast('정리할 오래된 항목이 아직 많지 않습니다');
  const batch=cand.slice(0,force?Math.min(30,cand.length-3):20);
  lexCompacting=true;
  if(force) toast('🧹 사전을 정리하는 중…');
  let merged=0, groups=0;
  try{
    for(const cat of ['장소','괴담','물건']){
      const part=batch.filter(e=>e.cat===cat);
      if(part.length<3) continue;
      const user=`다음은 텍스트 호러 게임의 '${cat}' 사전 항목들입니다. 이야기에 중요한 사실만 남겨 하나의 모음 항목으로 합쳐 주세요.\n\n${part.map(e=>`- ${e.name}: ${e.desc}`).join('\n')}\n\nJSON만 출력: {"name":"모음 항목 이름(15자 이내)","desc":"핵심 사실 요약 350자 이내. 원래 항목 이름을 그대로 언급할 것"}`;
      let r=null;
      try{ r=parseJSON(await callAI('당신은 게임 사전을 정리하는 편집자입니다. 사실을 지어내지 말고 주어진 내용만 요약합니다.',user,900,'lex')) }catch(e){ continue }
      if(G!==g) return;
      if(!r||!r.name||!r.desc) continue;
      g.lexSumN=(g.lexSumN||0)+1;
      const names=part.map(e=>e.name);
      let desc=String(r.desc).slice(0,400);
      if(!names.every(nm=>desc.includes(nm))) desc=(desc+` (포함: ${names.join(', ')})`).slice(0,560);
      part.forEach(e=>{ e.arch=true; e.sumId=g.lexSumN });
      g.lexicon.push({name:`${String(r.name).slice(0,16)} #${g.lexSumN}`,cat,desc,sum:true,isNew:false});
      merged+=part.length; groups++;
    }
    if(merged){ save(); _sigR=''; render(); toast(`📚 사전 ${merged}건을 ${groups}개 모음으로 요약해 보관했습니다`); if(document.querySelector('#modalRoot .lex')) openLex() }
    else if(force) toast('요약할 수 있는 항목이 없었습니다 (AI 키 확인)');
  }finally{ lexCompacting=false }
}

${G.summary||'(없음)'}

JSON만: {"summary":"..."}`;

}
function chronLabel(c){ return (c.tier&&c.to>c.day)?`${c.day}~${c.to}일`:`${c.day}일` }
function chronTierMark(c){ return c.tier==='month'?'월간':c.tier==='week'?'주간':c.tier==='day'?'요약':'' }
async function condenseChron(items,from,to,lim){
  if(items.length===1) return items[0].text;
  const span=from===to?`${from}일차`:`${from}~${to}일차`;
  const prompt=`다음은 ${span}의 연대기 기록이다. 중요한 사건·인물·약속·단서·획득/상실을 남기고 사소한 것은 버려, ${lim}자 이내 한국어 평문 한두 문장으로 합쳐라.
${items.map(x=>'- '+x.text).join('\n')}
JSON만: {"text":"..."}`;
  try{
    const r=parseJSON(await callAI('너는 게임 기록을 정리하는 서기다. JSON만 출력한다.',prompt,400,'chron'));
    if(r&&r.text&&String(r.text).trim()) return String(r.text).trim();
  }catch(e){}
  return items.map(x=>x.text).join(' / ').slice(0,lim+40);
}
function replaceChronGroup(g,grp,digest){
  const arr=g.chronicle, pos=arr.findIndex(c=>grp.includes(c)); if(pos<0) return;
  let ins=0; for(let i=0;i<pos;i++) if(!grp.includes(arr[i])) ins++;
  const keep=arr.filter(c=>!grp.includes(c)); keep.splice(ins,0,digest); g.chronicle=keep;
}
let chronBusy=false;
async function compactChronicle(){
  if(chronBusy||!G||!Array.isArray(G.chronicle)) return;
  chronBusy=true; const g=G; let changed=false;
  try{
    for(let n=0;n<400;n++){   // 지난 날의 개별 기록 → 하루 요약
      const raw=g.chronicle.filter(c=>!c.tier&&c.day<g.day); if(!raw.length) break;
      const d=raw[0].day, grp=raw.filter(c=>c.day===d);
      const text=await condenseChron(grp,d,d,80); if(G!==g) return;
      replaceChronGroup(g,grp,{day:d,to:d,tier:'day',text}); changed=true;
    }
    for(let n=0;n<100;n++){   // 한 주(7일 블록)가 끝나고 한 주 더 지나면 → 주간 요약
      const ds=g.chronicle.filter(c=>c.tier==='day'); let w=null;
      for(const c of ds){ const k=Math.floor((c.day-1)/7); if(g.day>7*(k+2)){ w=k; break } }
      if(w===null) break;
      const grp=ds.filter(c=>Math.floor((c.day-1)/7)===w), from=grp[0].day, to=grp[grp.length-1].to;
      const text=await condenseChron(grp,from,to,120); if(G!==g) return;
      replaceChronGroup(g,grp,{day:from,to,tier:'week',text}); changed=true;
    }
    for(let n=0;n<50;n++){    // 한 달(30일 블록) → 월간 요약
      const ws=g.chronicle.filter(c=>c.tier==='week'); let m=null;
      for(const c of ws){ const k=Math.floor((c.day-1)/30); if(g.day>30*(k+2)){ m=k; break } }
      if(m===null) break;
      const grp=ws.filter(c=>Math.floor((c.day-1)/30)===m), from=grp[0].day, to=grp[grp.length-1].to;
      const text=await condenseChron(grp,from,to,160); if(G!==g) return;
      replaceChronGroup(g,grp,{day:from,to,tier:'month',text}); changed=true;
    }
  }catch(e){ console.warn('연대기 압축 실패',e) }
  finally{ chronBusy=false }
  if(changed&&G===g){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(G)) }catch(e){} render() }
}

function curHood(){ return HOODS[G.hood]||HOODS.east }

function basePos(){ return G&&G.base&&HOODS[G.base]?hoodPos(G.base):CAMPUS_POS }

/* =========================================================
   33. 이동 — 중앙 캠퍼스 지구 · 지구 · 선착장 · 라쿠나 구역 · 출석부가 가리키는 구역 사이의 모든 이동
   - 일수 = 지도 거리 ÷ DAY_DIST (반올림, 최소 1일)
   - 하루마다 공포 +1·배터리 −1 (충전해 둔 전동 스쿠터가 있으면 공포 누적은 절반) + 출발 때 탈것 충전 1회
   - 이틀 이상 걸리는 육로에서는 가끔 길 위의 사건(이동 행상 · 유민 · 불량배) — 길 한가운데서 멈춤
   ========================================================= */
function curPos(){ return G.loc==='hood'?hoodPos(G.hood):G.loc==='home'?HOME_POS:CAMPUS_POS }
function curPlaceName(){ return G.loc==='hood'?curHood().n:G.loc==='home'?(G.home.name||'아지트'):'중앙 캠퍼스 지구' }
/* 날랜 탈것(전동 카트)은 충전을 먹여 원기 왕성할 때만 빠름: 길 위(귀환 포함)에서는 떠날 때 먹인 상태 그대로, 지구에서 떠날 때는 충전 1을 줄 배터리가 있어야 함 */
function rideFast(){ const m=G&&G.ride&&RIDES[G.ride.type]; if(!m||!m.fast||!G._rideFed) return false; return isWild()||G.battery>=m.feed+1 }
function travelDays(a,b){ const f=rideFast()?0.75:1; return Math.max(1,Math.round(Math.hypot(a.x-b.x,a.y-b.y)*f/DAY_DIST)) }
function hoodDays(id){ return travelDays(CAMPUS_POS,hoodPos(id)) }
function travelNeed(days){
  const m=rideDef(), feed=m&&G.battery-days>=m.feed?m.feed:0, scooter=!!(m&&m.noCalm&&feed);
  return {days,calm:scooter?Math.floor(days/2):days,battery:days,feed};
}
/* 이동 도중·귀환길: 탈것은 떠날 때 이미 먹였음 — 충전 없이, 먹인 전동 스쿠터면 물 절반 */
function travelNeedFed(days){ return {days,calm:rideNoCalm()?Math.floor(days/2):days,battery:days,feed:0} }
function needText(n){ return `${n.days}일 · 공포 +${n.calm} · 배터리 -${n.battery}${n.feed?` · 충전 -${n.feed}`:''}` }
/* 걸린 날만큼 소비. keepFed: 이동 도중(두 번째 구간)이라 탈것은 이미 먹였음. 모자라면 그만큼 체력 */
function travelPay(n,keepFed){
  const m=rideDef();
  if(!keepFed){ G._rideFed=false; if(m&&n.feed){ G.battery-=n.feed; G._rideFed=true } }
  const lack=Math.max(0,n.calm-G.calm)+Math.max(0,n.battery-G.battery);
  G.calm=Math.max(0,G.calm-n.calm); G.battery=Math.max(0,G.battery-n.battery);
  if(lack){ G.hp=Math.max(1,G.hp-lack); addLog('fx',`공포와 방전 속에 걸었습니다 (체력 -${lack})`) }
  G.day+=n.days; G.time='낮'; G.dayStep=0;
  G.site=null; G._yuminHere=false; G.choices=[]; G.base=null;
  return `공포 +${n.calm}, 배터리 -${n.battery}${n.feed?`, 충전 -${n.feed}`:''}`;
}
/* 지금 있는 곳에서 갈 수 있는 곳 */
function tripDests(){

  if(here!=='campus') out.push({kind:'campus',key:'campus',name:'중앙 캠퍼스 지구',ic:'🏙',pos:CAMPUS_POS,desc:'한빛학원과 상점가가 있는 생활 지구. 아지트가 가까이 있다.'});

  if(G.actDone&&G.act<3) out.push({kind:'big',key:'lacuna',name:'라쿠나 구역',ic:'✨',pos:LACUNA_POS,desc:'출석부가 처음 가리킨, 저수지 아래 잠겼다 드러나는 지워진 구역. 큰 구역이다.'});
  return out;
}

/* 이동 시작: 사건이 생기면 길 한가운데(한빛시 뒷길)에서 멈추고, 아니면 바로 도착
   dest.kind: campus · hood · big · zone(구역 조사)   dest.ret: 구역에서 돌아가는 길(조용히 도착)
   opt: {fromPos, fromName, keepFed(귀환길 — 충전 없음), event('yumin'|'yuminEvt' 강제 만남), action(행동 기록 문구)} */
function beginTrip(dest,days,opt){
  opt=opt||{};
  const n=opt.keepFed?travelNeedFed(days):travelNeed(days), from=opt.fromName||curPlaceName(), fromPos=opt.fromPos||curPos(), base=G.loc==='hood'?G.hood:null;
  const ev=opt.event||(!dest.reservoir&&n.days>=2&&Math.random()<TRIP_EVENT);
  const first=!ev?n.days:n.days>=2?Math.floor(n.days/2):0;
  const n1={days:first,calm:Math.round(n.calm*first/n.days),battery:first,feed:n.feed};
  sfx('travel');
  if(opt.action!==false) addLog('action',opt.action||`${dest.name}${josa(dest.name,'으로','로')} 길을 떠난다`);
  dest.base=dest.base!==undefined?dest.base:base;
  const cost=travelPay(n1,opt.keepFed);
  G.base=dest.kind==='zone'?dest.base:dest.ret&&dest.kind==='hood'?dest.key:null;   // 길에서 쓰러지면 돌아갈 곳
  const how=dest.reservoir?'🚤 수로로':'🔦 뒷길을 건너';
  if(!ev){ addLog('sys',`${how} ${n.days}일 만에 ${dest.name}${dest.ret?josa(dest.name,'으로','로')+' 돌아왔습니다':'에 도착했습니다'}. (${cost})`); return arriveDest(dest) }
  G.trip={dest,left:n.days-first,calm:n.calm-n1.calm,from,fromPos};
  G.loc='road'; G.nextPos=dest.ret?null:dest.pos;
  addLog('sys',first?`🔦 ${from}에서 ${first}일째 — ${dest.name}까지 ${G.trip.left}일 남았습니다. (${cost})`:`🔦 ${from}${josa(from,'을','를')} 나서자마자 — ${dest.name}까지 ${G.trip.left}일 거리입니다.${n.feed?` (${cost})`:''}`);
  return tripEvent(opt.event);
}
async function continueTrip(){
  const t=G.trip; if(busy||!t||t.bandit) return;
  const n=travelNeedFed(t.left);
  if(!(await askConfirm(`${t.dest.name}${josa(t.dest.name,'으로','로')} 계속 갈까요? (${needText(n)})`))) return;

/* ---------- 글로 쓴 이동 ("학원가으로 간다") ---------- */
const TRAVEL_VERB='(으로|로|에|를|을)?\\s*(간다|가자|가기로|가려|떠난|떠나|향한|향해|돌아간|돌아가|이동|이동|출발)';
const TRAVEL_NAMES=[['campus',/중앙 캠퍼스 지구/],['east',/동부\s*저수지|저수지\s*공원|공원/],['south',/학원가/],['north',/재개발|신시가/],['pierW',/서쪽\s*(저수지\s*)?선착장/],['pierE',/동쪽\s*(배수지\s*)?선착장/],['lacuna',/라쿠나 구역/],
  ['wards',/(수몰\s*구역|배수\s*터널\s*구역|고지대\s*구역|안개\s*구역|출석부의\s*구역|보트로)/],
  ['reading',/대열람실/],['observatory',/천문대/],['pier',/온실\s*정원/],['checkpoint',/서고\s*검문소|검문소/],['herbgarden',/약초원/],['rooftop',/옥상\s*서고/],['depot',/지하\s*반입구|반입구/],['irongate',/온실\s*철문|철문/],
  ['far',/(곁가지\s*구역|오러리|코덱스)/]];
function travelTarget(t){
  const hit=([k,re])=>new RegExp('(?:'+re.source+')[가-힣\\s]{0,8}'+TRAVEL_VERB).test(t);
  const found=(G.wards||[]).find(c=>c.found&&new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[가-힣\\s]{0,8}'+TRAVEL_VERB).test(t));
  if(found) return {kind:'big',key:found.id,name:found.name};
  const e=TRAVEL_NAMES.find(hit); if(!e) return null;
  const k=e[0];
  if(k==='far') return {kind:'far'};
  if(k==='wards') return G.act>=3?{kind:'wards'}:{kind:'far'};
  if(k==='campus') return G.loc==='hood'?{kind:'campus',key:'campus',name:'중앙 캠퍼스 지구',pos:CAMPUS_POS}:null;
  if(k==='lacuna') return G.actDone&&G.act<3?{kind:'big',key:'lacuna',name:'라쿠나 구역',pos:LACUNA_POS}:G.act>=3?null:{kind:'far'};
  if(!hoodOpen(k)) return {kind:'far'};
  if(G.loc==='hood'&&G.hood===k) return null;
  return {kind:'hood',key:k,name:HOODS[k].n,pos:hoodPos(k)};
}

/* =========================================================
   31. 유실물 등급 — 흔한 · 귀한 · 희귀한 · 괴담의
   ========================================================= */
/* 등급별 개수의 합계를 G.mat.keepsake에 맞춤. 시설 짓기·선물로 줄었으면 흔한 것부터 뺌 */
function keepsakeSync(tot){
  if(!G||!G.mat) return;
  if(!Array.isArray(G.keepsakeG)) G.keepsakeG=[0,0,0,0];
  tot=tot==null?(G.mat.keepsake||0):tot;
  let s=G.keepsakeG.reduce((a,b)=>a+b,0);
  if(s<tot) G.keepsakeG[0]+=tot-s;
  for(let g=0;s>tot&&g<4;g++){ const x=Math.min(G.keepsakeG[g],s-tot); G.keepsakeG[g]-=x; s-=x }
}
function keepsakeText(){ keepsakeSync(); return KEEPSAKE_GRADES.map((r,g)=>G.keepsakeG[g]?`${r.s} ${G.keepsakeG[g]}`:'').filter(Boolean).join(' · ') }
/* 방의 위험도가 높을수록, 재개발지구 근처 구역일수록 좋은 등급 */
function keepsakeRoll(){
  const r=curRoom(), odds=KEEPSAKE_ODDS[clamp(r?r.danger:1,0,3)];
  let x=Math.random()*100, g=0;

      return {stop:true};
    }
    pend(note+` [등반] 외벽 비상계단을 올라 「${r.name}」에 닿았다. 거센 바람과 아찔한 높이를 짧게 그려라.`,{checkHP:true});
    return {};
  }
  if(t==='fog'&&first&&Math.random()<MIRAGE_P){
    const note=rollCheck('sur','normal','길을 찾');
    if(rollCheck.last==='fail'){
      const back=d.rooms.filter(x=>x.visited&&x.id!==cur.id);
      const to=back.length?rand(back):null;
      addLog('sys',`🌫 짙은 안개에 홀려 ${to?`「${to.name}」(으)로 되돌아갔습니다`:'제자리를 맴돌았습니다'}`);
      if(!to){ addLog('action',`「${r.name}」 쪽으로 가려 한다`); story(`「${r.name}」 쪽으로 가려 한다`,{extra:note+' [안개] 짙은 안개 속에서 건물의 배치가 뒤틀려 보여 길을 잃고 한참을 헤매다 제자리로 돌아왔다. 다른 공간에 도착한 것처럼 쓰지 말 것.',checkHP:true,noActionLog:true}); return {stop:true} }
      pend(note+` [안개] 플레이어는 「${r.name}」 쪽으로 가려 했지만 짙은 안개에 홀려 이미 와 본 「${to.name}」(으)로 되돌아왔다. 헛걸음의 허탈함과 어른거리는 환영을 그려라.`,{checkHP:true});
      tick(); return {id:to.id};
    }
    pend(note+' [안개] 짙은 안개가 어른거렸지만, 플레이어는 그것이 눈속임임을 알아보고 제 길을 찾았다.',{checkHP:true});
    if(rollCheck.last==='partial') tick();
    return {};
  }
  if(t==='tunnel'){
    let note='';
    if((d.noise||0)>=NOISE_HUNT){
      note=rollCheck('sur','normal','몰래 숨어');
      note+=rollCheck.last==='success'?' [추적자] 뒤를 밟던 무언가를 따돌리고 숨죽여 이동했다.':' [추적자] 어둠 속에서 뒤를 밟던 무언가가 덮쳐 왔다. 정체는 똑똑히 보이지 않게, 짧고 섬뜩하게.';
    }
    if(first&&r.danger>=2) noiseAdd(1,'위험한 공간의 메아리');
    if(note) pend(note,{checkHP:true});
    return {};
  }
  return {};
}

/* =========================================================
   34. 적대 세력 — 날짜가 흐를수록 앞서 나가며 교표 조각을 탈취하려는 악한 무리
   - 정체·동기는 AI가 한 번 정함(플레이어에게는 소문으로만). 진행도는 코드가 관리
   - 하루가 지날 때마다 진행도 +RIVAL_PACE · RIVAL_STEP마다 사건 하나
       1~2막: 중단한 구역을 털어 감(교표 조각·유실물) / 조각을 모아 감 / 근처 폐구역을 뒤짐
       3막:   출석부가 가리키는 구역 하나에 먼저 닿음 → 그 구역은 위험도 +1, 이야기에 그들이 등장
   - 교표 조각이 있는 새 구역에서는 가끔 그들과 '경주' — 늑장 부리면 조각을 빼앗김
   - 소식은 급식실·이동 행상·유민의 노래로 들려옴
   ========================================================= */
const RIVAL_START_DAY=3, RIVAL_PACE=[3,6], RIVAL_STEP=20, RIVAL_WARD_STEP=25, RIVAL_RACE_P=0.35, RIVAL_RACE_TURNS=12, RIVAL_FRAG_CAP=6;
/* 적대 세력은 둘: ① 학생 자치위원회 규율부(학생 쪽) ② 시설관리공단 특수관리팀 '청소반'(어른 쪽).
   진행도·소문·조각 수는 하나로 묶어 관리하고, 사건·마주침·전투마다 한쪽이 나선다.
   G.rival.name / leader / look / motive 는 '지금 나선 쪽'(G.rival.a)을 가리킴 — rivalAct()로 정함 */
const RIVAL_FACTIONS=[{k:'disc',name:'학생 자치위원회 규율부'},{k:'clean',name:'시설관리공단 특수관리팀(청소반)'}];
const RIVAL_FALLBACK={
  disc:{leader:'규율부장',look:'완장을 찬 학생들과 점호 명부를 든 감독 담당들',motive:'겉으로는 학원의 질서와 안전을 내세운다. 진짜 목적은 서서히 드러난다.'},
  clean:{leader:'청소반장',look:'회색 작업복에 방호 마스크를 쓴 직원들과 무전기, 약품 냄새',motive:'겉으로는 노후 시설 정비를 내세운다. 진짜 목적은 서서히 드러난다.'},
};
function rivalAct(k){
  const R=G&&G.rival; if(!R||!Array.isArray(R.factions)) return null;
  if(k==null) k=Math.random()<0.5?0:1;
  if(typeof k==='string') k=R.factions.findIndex(f=>f.k===k);
  R.a=clamp(k<0?0:k,0,R.factions.length-1); return R.factions[R.a];
}
function rivalWire(R){   // name·leader·look·motive를 '지금 나선 쪽'으로 읽게 함 (저장되지 않으므로 불러올 때마다 다시 이음)
  if(!R||!Array.isArray(R.factions)) return;
  const d=Object.getOwnPropertyDescriptor(R,'name'); if(d&&d.get) return;
  ['name','leader','look','motive'].forEach(p=>Object.defineProperty(R,p,{configurable:true,enumerable:false,get(){ const f=R.factions[R.a||0]||R.factions[0]; return f&&f[p] }}));
}
function rivalOn(){ return !!(G&&G.rival&&Array.isArray(G.rival.factions)&&!G.rival.defeated) }

/* 하루가 지날 때마다 (화면을 그릴 때 확인 — 여러 번 불려도 결과가 같음) */
function rivalTick(){
  if(!G||!G.char) return;
  if(G.rival) rivalWire(G.rival);
  if(!G.rival){ if(G.day>=RIVAL_START_DAY) rivalEnsure(); return }
  const R=G.rival; if(R.lastDay==null) R.lastDay=G.day;
  if(G.act>=4||R.defeated){ R.lastDay=G.day; return }
  while(R.lastDay<G.day){
    R.lastDay++;
    const before=R.prog;
    R.prog+=RIVAL_PACE[0]+Math.floor(Math.random()*(RIVAL_PACE[1]-RIVAL_PACE[0]+1));
    const step=G.act>=3?RIVAL_WARD_STEP:RIVAL_STEP;
    if(Math.floor(R.prog/step)>Math.floor(before/step)) rivalEvent();
  }
}
/* 플레이어 몫이던 조각을 그들이 가져감 — 이것만 습격·승리로 되찾을 수 있음 */
function rivalSteal(){ const R=G.rival; R.frags++; R.stolen=(R.stolen||0)+1 }
function rivalReturn(n){ const R=G.rival; n=Math.max(0,Math.min(n,R.stolen||0,FRAG_GOAL-G.fragments)); R.frags-=n; R.stolen-=n; G.fragments+=n; return n }
function rivalNews(text,chron){
  const R=G.rival; R.news.push({day:G.day,text,heard:false,f:R.a}); R.news=R.news.slice(-8);
  R.log.push({day:G.day,text}); R.log=R.log.slice(-20);

}
function rivalEvent(){
  const R=G.rival; rivalAct();
  if(G.act>=3&&G.wards){   // 3막: 아직 못 찾은 구역 하나에 먼저 닿음
    const c=G.wards.filter(x=>!x.found&&!x.rival); if(!c.length) return;
    const t=rand(c); t.rival=G.day; t.rivalF=R.a; R.wards++;
    rivalNews(`「${R.name}」이(가) ${WARD_TYPES[t.terrain].n} 쪽으로 먼저 떠났다는 소문 — 출석부의 한 줄 "${t.riddle}"이 가리키는 곳`,`「${R.name}」이(가) ${WARD_TYPES[t.terrain].n}에 먼저 닿았다는 소문이 돌았다`);
    return;
  }
  const paused=(G.pausedZones||[]).filter(d=>!d.raided);
  const withFrag=paused.filter(d=>d.rooms.some(r=>r.fragment&&!r.fragTaken));
  if(withFrag.length&&Math.random()<0.6){   // 중단한 구역의 교표 조각을 빼앗김
    const d=rand(withFrag), room=d.rooms.find(r=>r.fragment&&!r.fragTaken);
    room.fragment=false; d.raided=G.day; rivalSteal();
    d.rooms.forEach(r=>{ r.keepsakeTaken=true });
    rivalNews(`중단해 둔 구역 「${d.name}」을(를) 「${R.name}」이(가) 털어 갔다 — 깊은 방의 무언가를 챙겨 갔다고 한다`,`「${R.name}」이(가) 「${d.name}」을(를) 먼저 털어 갔다`);
    addLog('sys',`🏴 소식: 중단해 둔 구역 「${d.name}」이(가) 누군가에게 털렸다는 이야기가 들려옵니다`);
    return;
  }
  if(paused.length&&Math.random()<0.4){   // 유실물만 쓸어 감
    const d=rand(paused); d.raided=G.day; d.rooms.forEach(r=>{ r.keepsakeTaken=true });
    rivalNews(`「${R.name}」이(가) 「${d.name}」의 유실물을 쓸어 갔다`,`「${R.name}」이(가) 「${d.name}」의 유실물을 가져갔다`);
    addLog('sys',`🏴 소식: 「${d.name}」의 유실물이 누군가에게 털렸다고 합니다`);
    return;
  }
  if(fragAtRisk()&&R.frags-(R.stolen||0)<RIVAL_FRAG_CAP&&Math.random()<0.5){
    R.frags++;   // 스스로 찾은 조각 (습격으로 되찾을 수 없음)
    rivalNews(`「${R.name}」이(가) 어느 구역에서 교표 조각을 손에 넣었다는 소문`,null);

function rollIntent(){

const easier=dc=>dc==='hard'?'normal':'easy';

const FIGHT_ACTS={
  str:{n:'⚔ 정면으로 맞선다',text:'무기를 들고 정면으로 맞선다',skill:'str',hit:1},

function actDC(k){ const F=G.fight, A=FIGHT_ACTS[k], I=INTENTS_F[F.intent]||{}; let dc=A.dc||F.dc; if(I.good===k) dc=easier(dc); return dc }
function hurt(n,why){ if(n<=0) return; G.hp=Math.max(0,G.hp-n); addLog('fx',`🩸 ${why} (체력 -${n})`) }
function fightAct(k){

        R.hideoutWins=(R.hideoutWins||0)+1; G.cash+=g; loot.push(`캐시 +${g}`); if(n) loot.push(`빼앗겼던 교표 조각 ${n}개`);

      }

      if(kind==='boss'){
        R.leader_st='down'; R.defeated=true;

        loot.push(`우두머리 ${R.leader}이(가) 쓰러짐`);
        rivalNews(`「${R.name}」의 우두머리 ${R.leader}이(가) 쓰러지고 무리가 흩어졌다`,`「${R.name}」의 우두머리 ${R.leader}을(를) 쓰러뜨렸다 — 적대 세력이 흩어졌다`);

    }
    if(kind==='zone'&&d&&d.rival) d.rival.done=true;   // 이기거나 쫓아내면 경주 끝 — 조각은 아직 구역에
    if(kind!=='boss') G.chronicle.push({day:G.day,text:`적대 세력 「${R.name}」을(를) ${result==='win'?'물리쳤다':'물러나게 했다'}${loot.length?` — ${loot.join(', ')}`:''}`});
    addLog('fx',`🏴 ${result==='win'?'승리':'적이 물러남'}${loot.length?' · '+loot.join(' · '):''}`);
    if(loot.length) toast(`🏴 ${loot.join(' · ')}`);
  }else if(result==='lose'){
    if(fragAtRisk()&&G.fragments>0){ G.fragments--; rivalSteal(); loot.push('교표 조각 하나를 빼앗김') }
    if(kind==='zone'&&d&&d.rival){ d.rival.left=0 }
    G.chronicle.push({day:G.day,text:`적대 세력 「${R.name}」에게 졌다${loot.length?' — '+loot.join(', '):''}`});

  }else if(result==='escape'){

      :`플레이어가 이겼다. ${loot.length?`얻은 것: ${loot.join(', ')}. `:''}적이 흩어지거나 쓰러지는 마지막 장면. 우두머리 ${R.leader}은(는) 죽거나 붙잡히지 않는다 — 그 자리에 없었다면 남긴 흔적이나 전갈로, 있었다면 원한 섞인 한마디를 남기고 달아난다.`,
    flee:'적이 물러났다. 언젠가 다시 오겠다는 위협을 남기고 흩어진다.',
    lose:`플레이어가 졌다. ${loot.length?loot.join(', ')+'. ':''}의식이 흐려지는 순간에서 끝내라(구조는 게임이 처리함).`,
    escape:'플레이어가 싸움에서 빠져나와 몸을 숨긴다. 뒤에서 그들의 고함이 멀어진다.',

  pend('',{fightTurn:true});
  story(text,{storyOnly:true,checkHP:true,noActionLog:true,extra:(extra||'')+` [전투 결말 — 코드가 정함] ${how} effects는 모두 0.`});

/* ---------- 성장 — 경험을 쌓아 최대 체력·능력치를 올림 ----------
   경험: 교표 조각(새로 얻을 때) +1 · 구역 끝까지 조사 +3 · 구역 사연을 다 밝힘 +1 · 전투 승리 +2~3(결전 +6) · 출석부 해독·구역의 심장 +4
   GROW_XP마다 성장 포인트 1 → 최대 체력 +HP_GROW(1점) 또는 능력치 +1(STAT_GROW_COST점, 최대 STAT_MAX)
   능력치 '체력'을 올리면 최대 체력도 +2 (캐릭터를 만들 때의 규칙과 같음) */
const GROW_XP=6, HP_GROW=3, STAT_GROW_COST=2, STAT_MAX=10;
function gainXp(n,why){
  if(!G||n<=0) return;
  const before=Math.floor((G.xp||0)/GROW_XP);
  G.xp=(G.xp||0)+n;
  const got=Math.floor(G.xp/GROW_XP)-before;
  addLog('fx',`🌟 경험 +${n} (${why})`);
  if(got>0){ G.growth=(G.growth||0)+got; toast(`🌟 성장 포인트 +${got} — 👤 학생 칸에서 체력·능력치를 올릴 수 있습니다`); G.chronicle.push({day:G.day,text:`조사를 거치며 한층 단단해졌다 (성장 포인트 +${got})`}) }
}
/* 교표 조각: 지금까지 가져 본 최대 개수를 넘을 때만 (빼앗겼다 되찾은 조각은 다시 세지 않음) */
function fragXpCheck(){ if(!G) return; if(G._fragMax==null){ G._fragMax=G.fragments||0; return } if(G.fragments>G._fragMax){ const n=G.fragments-G._fragMax; G._fragMax=G.fragments; gainXp(n,'교표 조각') } }
function growHP(){
  if(busy||G.fight||!(G.growth>=1)) return;
  G.growth--; G.maxhp+=HP_GROW; G.hp+=HP_GROW;
  addLog('fx',`❤ 최대 체력 +${HP_GROW} (${G.maxhp})`); G.chronicle.push({day:G.day,text:`몸을 단련해 최대 체력이 ${G.maxhp}이(가) 되었다`});
  save(); render(); openGrowth();
}
function growStat(k){
  if(busy||G.fight||!(G.growth>=STAT_GROW_COST)||!SK[k]||G.char.stats[k]>=STAT_MAX) return;
  G.growth-=STAT_GROW_COST; G.char.stats[k]++;
  let t=`${SK[k]} +1 (${G.char.stats[k]})`;
  if(k==='str'){ G.maxhp+=2; G.hp+=2; t+=` · 최대 체력 +2 (${G.maxhp})` }
  addLog('fx',`💪 ${t}`); G.chronicle.push({day:G.day,text:`${SK[k]}이(가) 늘었다 (${G.char.stats[k]})`});
  save(); render(); openGrowth();
}

  modal('🌟 성장',`<p>성장 포인트 <b>${p}</b> · 다음 포인트까지 경험 ${x}/${GROW_XP}</p>

function fragDist(){
  const d=G.site, fr=d.rooms.find(r=>r.fragment&&!r.fragTaken);
  if(!fr) return null;
  const dist={[fr.id]:0}, q=[fr];
  while(q.length){ const c=q.shift(); c.exits.forEach(x=>{ if(dist[x]===undefined){ dist[x]=dist[c.id]+1; q.push(d.rooms.find(y=>y.id===x)) } }) }
  return dist;
}

    let s=`<svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
    s+=`<defs><clipPath id="campusclip"><path d="${poly(C)}"/></clipPath></defs>`;
    s+=`<rect x="${VB.x}" y="${VB.y}" width="${VB.w}" height="${VB.h}" style="fill:var(--map-lake)"/>`;
    // 서쪽·동쪽 저수지(물): 점선 윤곽과 물결 — 수몰 구역은 그 안에 놓임
    const lake=(cx,cy,rx,ry)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" style="fill:var(--map-land);fill-opacity:.35;stroke:var(--map-line);stroke-width:1.2;stroke-dasharray:4 3"/><path d="M${cx-rx*.5} ${cy-ry*.35}q${rx*.12} -3 ${rx*.25} 0t${rx*.25} 0M${cx-rx*.4} ${cy+ry*.3}q${rx*.12} -3 ${rx*.25} 0t${rx*.25} 0" style="fill:none;stroke:var(--map-line);stroke-width:.9;stroke-linecap:round"/>`;
    s+=lake(10,112,34,44)+lake(408,178,30,40);
    // 한빛시 외곽선(직선 — 시가지 구획)
    s+=`<path d="${poly(C)}" style="fill:var(--map-land);stroke:var(--map-line);stroke-width:1.4;stroke-linejoin:round"/>`;
    // 도로망 (외곽선 안쪽만)
    let rd=''; for(let x=60;x<=380;x+=40) rd+=`M${x} ${VB.y}V${VB.y+VB.h}`; for(let y=40;y<=240;y+=34) rd+=`M${VB.x} ${y}H${VB.x+VB.w}`;
    s+=`<g clip-path="url(#campusclip)"><path d="${rd}" style="fill:none;stroke:var(--map-line);stroke-width:.7;opacity:.45"/><path d="M${VB.x} ${VB.y+VB.h*.62}L${VB.x+VB.w} ${VB.y+VB.h*.38}" style="fill:none;stroke:var(--map-line);stroke-width:1.6;opacity:.6"/></g>`;
    // 수몰 구역: 저수지 안에 잠긴 단지(작은 사각 구획)
    isl.forEach(p=>{ s+=`<rect x="${f(p.x-8)}" y="${f(p.y-6)}" width="16" height="12" rx="1.5" style="fill:var(--map-land);stroke:var(--map-line);stroke-width:1;stroke-dasharray:3 2"/><path d="M${f(p.x-5)} ${f(p.y-2)}h4M${f(p.x+1)} ${f(p.y-2)}h4M${f(p.x-5)} ${f(p.y+2)}h4M${f(p.x+1)} ${f(p.y+2)}h4" style="stroke:var(--map-line);stroke-width:1"/>` });
    // 건물 블록 기호 — 지명 표식 자리는 비워 둠
    const marks=[CAMPUS_POS,HOME_POS,LACUNA_POS,...MAP_PLACES,...UNKNOWN_SPOTS];
    const free=(x,y)=>marks.every(m=>Math.hypot(m.x-x,m.y-y)>14);
    const sym='fill:none;stroke:var(--map-line);stroke-width:1;stroke-linejoin:round';
    let bl='';
    [...HILLS].forEach(([x,y])=>{ if(!free(x,y)) return; bl+=`M${f(x-4)} ${f(y-3)}h8v6h-8z` });
    let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646 };
    [[560,170,70],[470,300,50],[420,700,60],[290,700,40],[590,640,38],[330,255,30],[1150,175,60],[1330,330,50]].forEach(([cx,cy,r])=>{
      const X=cx*SC, Y=cy*SC, R=r*SC;
      for(let k=0;k<7;k++){ const a=rnd()*Math.PI*2, d=Math.sqrt(rnd())*R, x=X+Math.cos(a)*d, y=Y+Math.sin(a)*d*.8; if(!free(x,y)) continue;
        bl+=`M${f(x-2.5)} ${f(y-2)}h5v4h-5z` }
    });
    s+=`<path d="${bl}" style="${sym}"/>`;
    s+=`<rect x="${VB.x+.6}" y="${VB.y+.6}" width="${VB.w-1.2}" height="${VB.h-1.2}" style="fill:none;stroke:var(--map-line);stroke-width:1.2"/></svg>`;
    cache={key,s}; return s;
  };
})();

function roomSVG(){
  const d=G.site, W=260, H=150;
  const vis=new Set(d.rooms.filter(r=>r.visited).map(r=>r.id)), show=new Set(vis);
  d.rooms.forEach(r=>{ if(vis.has(r.id)) r.exits.forEach(x=>show.add(x)) });
  const lvs=[...new Set(d.rooms.filter(r=>show.has(r.id)).map(r=>r.lv||0))].sort((a,b)=>a-b);
  const groups={}; d.rooms.filter(r=>show.has(r.id)).forEach(r=>{ const k=r.lv||0; (groups[k]=groups[k]||[]).push(r) });
  const pos={}, li={};
  lvs.forEach((k,j)=>{ li[k]=j; groups[k].forEach((r,i)=>{ pos[r.id]={x:lvs.length>1?32+(W-64)*j/(lvs.length-1):W/2,y:26+(H-56)*(i+0.5)/groups[k].length} }) });
  const fd=has('lab')?fragDist():null;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="roomsvg" role="img" aria-label="구역 내부 지도">`;
  d.rooms.forEach(r=>{ if(!show.has(r.id)) return; r.exits.forEach(x=>{ if(r.id<x&&show.has(x)&&(vis.has(r.id)||vis.has(x))){ const a=pos[r.id],b=pos[x]; s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:var(--line);stroke-width:2.5"/>` } }) });
  d.rooms.forEach(r=>{
    if(!show.has(r.id)) return;
    const p=pos[r.id], cur=r.id===d.cur;
    if(!vis.has(r.id)){
      s+=`<circle cx="${p.x}" cy="${p.y}" r="9" style="fill:var(--bg);stroke:var(--muted);stroke-width:1.3;stroke-dasharray:3 3"/>`+svgText(p.x,p.y+4,'?',11,'var(--muted)');
      if(fd&&fd[r.id]!==undefined&&fd[d.cur]!==undefined&&fd[r.id]<fd[d.cur]) s+=svgText(p.x+14,p.y-8,'✧',12,'var(--hl)',700);
    }else{
      const done=!!r.exhausted||r.exits.every(id=>{ const o=d.rooms.find(y=>y.id===id); return !o||o.visited });
      if(cur) s+=`<circle class="pulse" cx="${p.x}" cy="${p.y}" r="9" style="fill:var(--accent)"/>`;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="9" style="fill:${cur?'var(--accent)':(done?'#5a8f5f':'#d49a3a')};stroke:var(--panel);stroke-width:2"/>`;
      if(r.fragTaken) s+=svgText(p.x,p.y+4,'★',11,'#fff',700,'middle',false);
      else if(done&&!cur) s+=svgText(p.x,p.y+4,'✓',11,'#fff',700,'middle',false);
      s+=svgText(p.x,li[r.lv||0]%2?p.y-14:p.y+23,trunc(r.name,6),9);
    }
  });
  return s+`</svg><div class="muted" style="font-size:11px;margin:2px 4px"><span style="color:#5a8f5f">●</span> 조사 완료(더 찾을 것 없음/길 모두 확인) · <span style="color:#d49a3a">●</span> 더 조사 가능 · <span style="color:var(--accent)">●</span> 현재 · ? 미지${fd?' · ✧ 교표 쪽':''}</div>`;
}

function wideMode(){ return window.matchMedia('(min-width:1001px)').matches }
function applySides(){
