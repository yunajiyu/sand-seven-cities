<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석부에 없는 구역</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ebf1; --panel:#f5f7fa; --ink:#1b2430; --muted:#5b6a7d; --line:#c3cdd9;
  --accent:#4d8a12; --accent2:#2a6f93; --hl:#6c7a1a; --danger:#c0392b; --ok:#2f8a46;
  --on-accent:#fff;
  --shadow:0 2px 10px rgba(20,30,50,.14);
  --map-lake:#dde4ec; --map-land:#f3f6f9; --map-line:#8393a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220; --panel:#151c2d; --ink:#e4ebf3; --muted:#8895a9; --line:#283349;
    --accent:#b4ee4a; --accent2:#7fd0ee; --hl:#c9e36a; --danger:#ff6b5e; --ok:#7ee08f;
    --on-accent:#0d1220;
    --shadow:0 2px 10px rgba(0,0,0,.5);
    --map-lake:#0a0f1b; --map-land:#18213a; --map-line:#4b5d80;
  }
}
:root[data-theme="dark"]{
  --map-lake:#0a0f1b; --map-land:#18213a; --map-line:#4b5d80;
  --bg:#0d1220; --panel:#151c2d; --ink:#e4ebf3; --muted:#8895a9; --line:#283349;
  --accent:#b4ee4a; --accent2:#7fd0ee; --hl:#c9e36a; --danger:#ff6b5e; --ok:#7ee08f;
  --on-accent:#0d1220;
  --shadow:0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,.serif{font-family:'Noto Sans KR',sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.small{padding:4px 10px;font-size:13px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:500;margin:12px 0 4px}

/* 공포 연출: 공포 수치가 높을수록 화면이 붉어지고 노이즈가 낀다 */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(150,10,20,.5) 100%)}
body.fear1::after{opacity:.55}
body.fear2::after{opacity:1;animation:fearflick 3.2s steps(1) infinite;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(170,10,20,.62) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px)}
@keyframes fearflick{0%,92%,100%{filter:none}93%{filter:brightness(1.6) contrast(1.4)}95%{filter:none}97%{filter:brightness(.7)}}
@media (prefers-reduced-motion:reduce){body.fear2::after{animation:none}}

/* title */
#title{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
#title h1{font-size:34px;margin:0 0 6px;color:var(--accent)}
#title .sub{color:var(--muted);margin-bottom:28px}
#title .btns{display:flex;flex-direction:column;gap:10px;width:240px;margin:0 auto}

/* creation */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.stat-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.stat-row .nm{width:90px}
.stat-row .val{width:28px;text-align:center;font-weight:700}

/* game */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;max-width:860px;margin:0 auto}
.stats .st{white-space:nowrap}
.stats .low{color:var(--danger);font-weight:700}
.where{max-width:860px;margin:2px auto 0;font-size:13px;color:var(--muted)}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 12px}
#log .inner{max-width:860px;margin:0 auto}
.entry{margin:0 0 14px}
.entry.scene p{margin:0 0 8px;font-family:'Noto Sans KR',sans-serif;font-size:16px}
.entry.scene strong{font-weight:700;background:linear-gradient(transparent 62%,rgba(180,238,74,.22) 0)}
.entry.scene em{font-style:italic;opacity:.92}
.entry.action{color:var(--accent2);font-weight:500;font-size:14px}
.entry.action::before{content:'▸ '}
.entry.sys{color:var(--muted);font-size:13px;border-left:3px solid var(--line);padding-left:8px}
.entry.fx{font-size:13px;color:var(--hl)}
.controls{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px}
.controls .inner{max-width:860px;margin:0 auto}
.choices{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.choices button{text-align:left}
.cslide{display:contents}
.slidehint{display:none}
.fixed{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fixed button{font-size:13px;padding:6px 10px}
.hscroll{display:flex;flex-wrap:nowrap;gap:6px;flex:0 0 100%;width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.hscroll button{flex:0 0 auto;white-space:nowrap}
@media (min-width:600px){ .hscroll{flex-wrap:wrap;overflow-x:visible;padding-bottom:0} .hscroll button{white-space:normal;text-align:left} }   /* 태블릿 이상: 버튼이 잘리지 않고 줄바꿈 */
.free{display:flex;gap:6px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:42dvh;overflow-y:auto;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px;min-height:90px}
.bub{max-width:82%;padding:6px 11px;border-radius:14px;font-size:14.5px;line-height:1.45;word-break:keep-all;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--accent);color:#111;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.typing{opacity:.6;font-style:italic}
.bub small{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
#phoneBanner{position:fixed;top:12px;right:12px;z-index:60;max-width:min(320px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px;cursor:pointer}
.dice{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;font-size:13px}
.dice select{padding:4px 6px;width:auto;flex:0 0 auto}
.free input{flex:1}
.badge{background:var(--accent);color:var(--on-accent);border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px}
.loading{color:var(--muted);font-style:italic;padding:6px 0}
.loading::after{content:'';animation:dots 1.2s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}


/* ---------- 3단 레이아웃 ---------- */
#game{display:grid;grid-template-columns:268px minmax(0,1fr) 288px;height:100vh;height:100dvh}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.tb .stats{max-width:none;margin:0;flex:1}
.dup{display:none}
.only-narrow{display:none}
.scrim{display:none}
.side{background:var(--panel);overflow-y:auto;min-height:0}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.sidehead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.sidehead b{font-family:'Noto Sans KR',sans-serif;font-size:16px}
.sbody{padding:12px 14px 28px}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side .name{font-family:'Noto Sans KR',sans-serif;font-size:21px;font-weight:700;line-height:1.3}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:14px}
.grid2>div{display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px}
.bio{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0}
.ch{font-size:13px;margin-bottom:6px;display:flex;gap:8px}
.ch .d{color:var(--muted);white-space:nowrap}
.side details{border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-bottom:5px;background:var(--bg)}
.side summary{cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.side details p{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.nw{color:var(--accent);font-size:11px;font-weight:700}
.lt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lt button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sbtn{display:flex;flex-direction:column;gap:6px}

/* ---------- 지도 영역 ---------- */
.mapbox{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.maphead .wt{font-size:13px;color:var(--muted)}
.maptabs{display:none;gap:6px}
.maptabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mapcols{display:flex;gap:10px;align-items:stretch}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.cmap{flex:0 1 auto;min-width:0;display:flex;align-items:center}
.locp{flex:1 1 200px;min-width:200px}
.cmapsvg,.roomsvg{width:100%;height:auto;display:block}
.roomsvg{max-height:175px}
.cmapsvg{height:clamp(150px,23vh,215px);width:auto;max-width:100%;margin:0 auto}
.mapwrap{position:relative;height:clamp(160px,25vh,240px);aspect-ratio:3/2;max-width:100%;margin:0 auto;cursor:zoom-in;border-radius:10px;overflow:hidden}
.mapwrap .mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.mapwrap .mapovl,.mapwrap .mapovl svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .zoomhint{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(10,15,27,.82);color:#e4ebf3;border-radius:10px;padding:1px 8px}
.mapwrap.big{height:auto;width:min(100%,calc((86vh - 130px)*1.5));cursor:default}
.modal.wide{max-width:min(1100px,96vw)}
@media (min-width:1001px){.choices{display:grid;grid-template-columns:1fr 1fr}.choices .loading{grid-column:1/-1}}
.locp h5{margin:2px 4px 0;font-family:'Noto Sans KR',sans-serif;font-size:15px}
.locp .sub{margin:0 4px 4px;font-size:12px;color:var(--muted)}
.locl{margin:6px 4px;padding-left:18px;font-size:13px}
.mapcap{font-size:12px;margin-top:5px}
.mapbox.collapsed .mapcols,.mapbox.collapsed .mapcap{display:none}
.mapbox.collapsed{padding-bottom:6px}
.mapbox.collapsed .maphead{margin-bottom:0}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- 좁은 화면: 사이드바는 서랍 ---------- */
@media (max-width:1000px){
  #game{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;width:min(86vw,320px);z-index:15;transition:transform .22s ease,visibility .22s;box-shadow:var(--shadow);visibility:hidden}
  .side.left{left:0;transform:translateX(-104%)}
  .side.right{right:0;transform:translateX(104%)}
  .side.open{transform:none;visibility:visible}
  .only-narrow{display:inline-block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:14}
  .scrim.on{display:block}
}
@media (max-width:760px){
  .maptabs{display:flex}
  .maphead .wt{display:none}
  .mapbox[data-tab="cont"] .locp{display:none}
  .mapbox[data-tab="loc"] .cmap{display:none}
  .cmap{flex:1}
  .cmapsvg{width:100%;height:auto;max-height:190px}
  .mapwrap{height:auto;width:100%;max-height:230px}
  .mapcap{display:none}
  .fixed button{padding:5px 9px}
}

/* ---------- 좁은 화면: 선택지 목록에만 높이 제한 (본문이 가려지지 않게) — 칩 줄과 입력줄은 항상 보임 ---------- */
@media (max-width:760px){
  #game .choices{max-height:none;overflow:visible;display:block}
  #log{min-height:160px}
  /* 모바일: 선택지는 한 줄, 2개씩 보이고 나머지는 옆으로 밀어서 선택 */
  .cslide{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding-bottom:6px;scrollbar-width:thin}
  .cslide button{flex:0 0 calc(46% - 3px);scroll-snap-align:start;white-space:normal;line-height:1.35;font-size:calc(14px*var(--fs,1))}
  .slidehint{display:inline}
}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0}
.modal .body{padding:12px 16px;overflow-y:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font-size:13px;padding:4px 10px}
.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lex{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.lex .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lex .cat{font-size:12px;color:var(--muted)}
.lex .new{color:var(--accent);font-size:12px;font-weight:700}
.chron{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.chron .d{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:.95}
.shop-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:520px){ .stats{font-size:13px;gap:4px 10px} #title h1{font-size:28px} }

/* ---------- 상단 부가 줄 · 글자 크기 · 상단바 접기 ---------- */
#topExtra{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 12px 4px;flex-wrap:wrap}
#usageChip{font-size:12px;color:var(--muted);cursor:pointer;padding:2px 0;text-align:right;user-select:none}
#usageChip:hover{color:var(--accent)}
#fontCtl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
#fontCtl button{padding:1px 8px;font-size:12px}
#fsLabel{min-width:38px;text-align:center;cursor:pointer;user-select:none}
#log .entry.scene p{font-size:calc(16px*var(--fs,1))}
#log .entry.action{font-size:calc(14px*var(--fs,1))}
#log .entry.sys,#log .entry.fx{font-size:calc(13px*var(--fs,1))}
.choices button{font-size:calc(15px*var(--fs,1))}
.topbar.folded .where,.topbar.folded #topExtra,.topbar.folded #needBar{display:none}
.topbar.folded{padding-top:4px;padding-bottom:4px}
#topFold{flex:0 0 auto;min-width:34px}
#needBar{max-width:860px;margin:3px auto 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
#needBar .nb{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#needBar .pips{letter-spacing:1px;font-size:11px}
#needBar .warn{color:var(--danger);font-weight:600}
#needBar .ok{color:var(--ok);font-weight:600}

/* ---------- 넓은 화면: 사이드바 접기 · 가장자리 손잡이 ---------- */
.only-wide{display:inline-block}
@media (max-width:1000px){ .only-wide{display:none} }
@media (min-width:1001px){
  #game{grid-template-columns:var(--wl,268px) minmax(0,1fr) var(--wr,288px);transition:grid-template-columns .2s ease}
  #game.hideL{--wl:0px} #game.hideR{--wr:0px}
  #game.hideL #sideL,#game.hideR #sideR{visibility:hidden;overflow:hidden;border-width:0}
  .tb .only-narrow{display:inline-block}
  #game.hideL .sideTab.l,#game.hideR .sideTab.r{display:block}
}
@media (prefers-reduced-motion:reduce){ #game{transition:none} }
.sideTab{display:none;position:fixed;top:50%;transform:translateY(-50%);z-index:12;padding:14px 5px;font-size:13px;line-height:1.1;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);writing-mode:vertical-rl}
.sideTab.l{left:0;border-radius:0 10px 10px 0;border-left:0}
.sideTab.r{right:0;border-radius:10px 0 0 10px;border-right:0}
.sideTab:hover{color:var(--accent)}

/* ---------- 좁은 화면 ---------- */
.main{overflow-y:auto}
#log{min-height:110px}
.controls.folded .choices,.controls.folded .fixed,.controls.folded .free,.controls.folded #intentChip{display:none}
.controls.folded #dockBtn{margin-bottom:0!important}
#game.dockF .mapcols,#game.dockF .mapcap,#game.dockF #needBar,#game.dockF .where,#game.dockF #topExtra{display:none}   /* 본문 넓게 보기: 지도·안내줄도 함께 접음 */
#game.dockF .mapbox{padding-bottom:6px}#game.dockF .maphead{margin-bottom:0}
/* 낮은 화면(아이패드 가로 등): 선택지·지도 영역이 본문을 다 먹지 않게 */
@media (max-height:900px){
  .choices{max-height:26dvh;overflow-y:auto;overscroll-behavior:contain}
  .mapbox{padding:4px 12px}
  .controls{padding:6px 12px}
  .topbar{padding:5px 12px}
}
@media (max-width:760px){
  #topExtra{display:none}
  .mapwrap{max-height:min(230px,24dvh)}
  #game .free{flex-wrap:wrap} #game .free input{flex:1 1 100%} #game .free button{flex:1 1 0;white-space:nowrap}
}
@media (max-height:520px) and (max-width:1000px){ .mapwrap{max-height:26dvh} }

/* ---------- 지도: 비율 상자 (Safari에서도 접히지 않게) · 벡터 그림 ---------- */
.mapwrap{height:auto;aspect-ratio:auto;width:calc(clamp(160px,25vh,240px)*1.5);max-width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mapwrap::before{content:'';display:block;padding-top:66.6667%}
.mapwrap .mapimg,.mapwrap .mapovl,.mapwrap .mapovl svg{top:0;left:0}
.mapwrap.big{width:min(100%,calc((86vh - 130px)*1.5));cursor:default}
@media (max-width:760px){ .cmap{display:block} .mapwrap{width:100%} }
.mapwrap .mapart{position:absolute;inset:0;width:100%;height:100%}

/* ---------- 선택지·버튼 표시 ---------- */
.lbl{grid-column:1/-1;flex:0 0 100%;font-size:11.5px;color:var(--muted);margin:2px 2px 0;letter-spacing:.2px}
.fixed button.mv{border-style:dashed}
.choices .lbl+button{margin-top:0}
#intentChip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}
#intentChip .q{flex:1 1 100%}
#intentChip select{width:auto;padding:3px 6px;font-size:13px}
.cbadge{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-right:6px;color:var(--muted);vertical-align:1px}
.cbadge.ck{border-color:var(--hl);color:var(--hl)}
.cbadge.sys{border-color:var(--accent2);color:var(--accent2)}

.maphead{flex-wrap:wrap}
.maphead button{white-space:nowrap}
@media (max-width:760px){ #zoomLbl{min-width:22px!important} .maptabs button,.maphead button{padding:4px 8px} }
/* ---------- 조사 수첩 ---------- */
.rj-clue{border-left:3px solid var(--hl);padding:4px 10px;margin:6px 0;background:var(--bg);border-radius:0 8px 8px 0}
.rj-clue.locked{border-left-color:var(--line);color:var(--muted)}
.rj-era{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.rj-era b{font-family:'Noto Sans KR',sans-serif}

.dc-scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:10px;overflow:hidden;border:1px solid var(--line,#ccc);user-select:none;touch-action:none;container-type:inline-size}
.dc-scene.st1{background:linear-gradient(#3a3f4d 0 46%,#2a2622 46% 48%,#4a4036 48%)}
.dc-scene.st2{background:linear-gradient(#4a5163 0 46%,#2f2a25 46% 48%,#5a4b3c 48%)}
.dc-scene.st3{background:linear-gradient(#5a6479 0 46%,#352f29 46% 48%,#6b5842 48%)}
.dc-scene.st4{background:linear-gradient(#6e7a92 0 46%,#3a332c 46% 48%,#7d6648 48%)}
.dc-bg{position:absolute;transform:translate(-50%,-50%);pointer-events:none;opacity:.8;line-height:1}
.dc-note{position:absolute;left:8px;top:6px;font-size:12px;opacity:.8;color:#fff;z-index:9999}
.dc-it{position:absolute;transform:translate(-50%,-50%)}
.dc-it.mv{cursor:grab;touch-action:none}
.dc-it.sel{outline:2px dashed #e0402f;outline-offset:2px}
.dc-fb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;line-height:1;pointer-events:none;text-shadow:0 2px 3px rgba(0,0,0,.45)}

<body>

<!-- 타이틀 -->
<section id="title">
  <div>
    <h1>출석부에 없는 구역</h1>
    <div class="sub serif">한빛학원 2학년 7반 괴담 조사 기록</div>
    <div class="btns">
      <button class="primary" onclick="startCreation()">전학 오기</button>
      <button id="btnContinue" onclick="continueGame()">기숙사로 돌아가기</button>
      <button onclick="openGuide()">📖 게임 가이드</button>
      <button onclick="openSettings()">AI 설정</button>

      <button class="small themeBtn" onclick="cycleTheme()">🌓 자동</button><button class="small sfxBtn" onclick="cycleSfx()">🔊 보통</button>
    </div>
    <p class="muted" style="margin-top:20px" id="aiStatus"></p>
  </div>
</section>

<!-- 캐릭터 생성 -->
<section id="create" class="hidden">

    <div class="card">

      <label>이름</label>

      <label>나이 <span class="muted">(만 17세 고정 · 고등학교 2학년)</span></label>
      <input id="cAge" type="number" value="17" min="17" max="17" readonly style="width:90px">
      <label>신분</label>
      <div class="opt sel" style="cursor:default"><b>한빛학원 2학년 7반 전학생</b><span>학기 중간에 전학 온 고등학교 2학년 학생. 반에서는 '전학생'으로 불립니다.</span></div>
      <label>중간 전학 이유 <span class="muted">(선택 사항 · 고르지 않으면 AI가 정해 서서히 드러냅니다)</span></label>
      <div class="opt-grid" id="originGrid"></div>
      <input id="cReason" class="hidden" maxlength="60" placeholder="직접 입력 (예: 지난 시험에서 한 과목이 모자랐다)" style="margin-top:8px">

      <div id="statBox"></div>
      <label>특성 <span class="muted">(2개까지)</span></label>
      <div class="opt-grid" id="traitGrid"></div>
      <label>외형과 배경 이야기 <span class="muted">(AI가 이야기에 엮어 넣습니다)</span></label>
      <textarea id="cBio" rows="4" placeholder="예: 늘 후드를 눌러쓴다. 전에 다니던 학원에서 이상한 소문을 들은 적이 있다."></textarea>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <button onclick="show('title')">뒤로</button>
        <button class="primary" onclick="finishCreation()">전학 오기</button>
      </div>
    </div>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="hidden">
  <aside class="side left" id="sideL" aria-label="캐릭터 정보">
    <div class="sidehead"><b>👤 학생</b><button class="small only-narrow" onclick="closeSides()">닫기</button><button class="small only-wide" onclick="hideSide('L',true)" title="사이드바 접기">접기</button></div>

    <div class="controls">

        <div class="choices" id="choices"></div>
        <div class="fixed" id="fixed"></div>

  <button class="sideTab r" onclick="hideSide('R',false)" aria-label="📜 펼치기">📜 펼치기</button>
</section>

<script>
/* ==========================================================================
   출석부에 없는 구역 — 게임 스크립트 (구조 정리판)

   읽는 순서
     1. 데이터 ............ 출신·특성·시설·탈것·가격 같은 고정 값
     2. 상태·저장·설정
     3. 공용 도구
     4. 엔진 .............. 훅(Hook) · 행동 처리 흐름(입력 → 판정 → 서술 → 적용)
     5~. 기능 모듈 ........ 각 기능이 엔진의 훅에 자기 규칙을 등록
     마지막. 화면·모달·시작

   새 기능을 넣을 때
     - 함수를 다시 감싸지(wrap) 말고, 아래 훅에 등록하세요.
         on('facts',   순서, fn)   AI에게 주는 확정 사실·서술 규칙
         on('context', 순서, fn)   현재 장면 설명에 덧붙일 문장
         on('before',  순서, fn)   AI 호출 직전 (행동·지시를 고침)
         on('effects', 순서, fn)   AI가 제안한 효과를 코드가 거르는 단계
         on('applied', 순서, fn)   효과가 적용된 직후
         on('after',   순서, fn)   한 턴이 끝난 뒤 (선택지 정리·사건 처리)
         on('choices', 순서, fn)   선택지 정리 (턴 끝·화면 그릴 때 매번)
         on('render',  순서, fn)   화면을 그린 뒤 버튼·표시 덧붙이기
         on('fixed',   순서, fn)   고정 버튼 HTML을 만들 때
     - 순서 숫자가 작을수록 먼저 실행됩니다. 정의한 위치와 상관없습니다.
     - 글로 쓴 행동을 게임 기능에 연결하려면 INTENTS 표에 한 줄 추가하세요.
   ========================================================================== */

/* =========================================================
   1. 데이터
   ========================================================= */
const SAVE_KEY='hanbit_save_v1', SET_KEY='sand7_settings';   // 세이브 키는 새 이름(옛 세이브와 섞이지 않게). 설정(API 키)은 그대로 이어 씀

const LV_STEP=10, MAX_LV=60;             // 단계 하나는 10레벨 구간
const lvCost=n=>Math.round(10+1.1*(n-1));   // 레벨 n-1 → n 에 필요한 점수
const lvTotal=n=>{ let t=0; for(let i=1;i<=n;i++) t+=lvCost(i); return t };
const AFF_MAX=lvTotal(MAX_LV);
function affInfo(a){
  a=Math.max(0,+a||0); let lv=0, rest=a;
  while(lv<MAX_LV&&rest>=lvCost(lv+1)){ rest-=lvCost(lv+1); lv++ }
  const need=lv>=MAX_LV?1:lvCost(lv+1);
  return {lv,cur:rest,need,pct:lv>=MAX_LV?100:Math.round(rest/need*100)};
}
/* 예전 저장본 점수를 지금 점수로 옮김: tbl = [[옛 값, 새 점수], …] 사이를 직선으로 이음 */
function remapAff(a,tbl){
  a=Math.max(0,+a||0);
  for(let i=1;i<tbl.length;i++){ if(a<=tbl[i][0]){ const [x0,y0]=tbl[i-1],[x1,y1]=tbl[i]; return Math.round(y0+(y1-y0)*(a-x0)/(x1-x0)) } }
  return tbl[tbl.length-1][1];
}

    const prev=document.activeElement;
    const done=v=>{ document.removeEventListener('keydown',key,true); bg.remove(); try{ prev&&prev.focus&&prev.focus() }catch(e){} res(v) };
    const key=ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); done(false) } };
    document.addEventListener('keydown',key,true);
    bg.addEventListener('click',ev=>{ if(ev.target===bg) done(false); const b=ev.target.closest('button[data-r]'); if(b) done(b.dataset.r==='1') });
    document.body.appendChild(bg);

  });
}

function roleCfg(role){ return Object.assign({},AI_ROLE_DEFAULT[role]||AI_ROLE_DEFAULT.story,(SET.roles||{})[role]||{}) }
function provLabel(p){ return ({anthropic:'Anthropic',openrouter:'OpenRouter',deepseek:'DeepSeek',gemini:'Google Gemini',openai:'OpenAI',custom:'사용자 지정'})[p]||p }
function roleName(k){ const r=AI_ROLES.find(x=>x.k===k); return r?r.n:k }
/* opt.cache: 시스템 프롬프트(매 턴 같은 앞부분)를 캐시 — 서술 턴에서만 씀 (짧거나 한 번뿐인 호출에 붙이면 쓰기 비용만 늘어남) */
async function callAI(system,user,maxTokens=1200,role='story',opt){
  opt=opt||{};
  const c=roleCfg(role), key=(SET.keys||{})[c.provider];
  if(!key){
    const any=Object.values(SET.keys||{}).some(Boolean);
    throw new Error(any?`「${roleName(role)}」에 쓸 ${provLabel(c.provider)} 키가 없습니다 (AI 설정에서 입력)`:'NO_KEY');
  }
  const errMsg=(d,r)=>(d&&d.error&&d.error.message)||(Array.isArray(d)&&d[0]&&d[0].error&&d[0].error.message)||('HTTP '+r.status);
  if(c.provider==='anthropic'){
    // Claude 5 계열은 생각(adaptive thinking) 토큰도 max_tokens에 포함되므로 여유를 둡니다.
    const is5=/claude-(sonnet|opus|fable|mythos)-5/.test(c.model);
    const body={model:c.model,max_tokens:is5?maxTokens+2000:maxTokens,system:opt.cache?[{type:'text',text:system,cache_control:{type:'ephemeral'}}]:system,messages:[{role:'user',content:(opt.cache&&opt.stable>0&&opt.stable<user.length)?[{type:'text',text:user.slice(0,opt.stable),cache_control:{type:'ephemeral'}},{type:'text',text:user.slice(opt.stable)}]:user}]};
    if(is5) body.output_config={effort:c.effort||'low'};
    const hdr={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    if(SET.wsId) hdr['anthropic-workspace-id']=SET.wsId;
    const send=()=>fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:hdr,body:JSON.stringify(body)});
    let r=await send(), d=await r.json();
    if(!r.ok&&body.output_config&&/output_config|effort/i.test(errMsg(d,r))){ delete body.output_config; r=await send(); d=await r.json() }
    if(!r.ok) throw new Error(errMsg(d,r));
    try{ const u=d.usage||{}; trackUsage(role,c.model,u.input_tokens,u.output_tokens,u.cache_read_input_tokens,u.cache_creation_input_tokens) }catch(e){}
    return (d.content||[]).map(x=>x.text||'').join('');
  }
  const base=(c.provider==='custom'?(SET.baseUrl||''):(PRESETS[c.provider]&&PRESETS[c.provider].baseUrl)||'').replace(/\/$/,'');
  const body={model:c.model,max_tokens:maxTokens,temperature:0.9,messages:[{role:'system',content:system},{role:'user',content:user}]};
  if(c.provider==='gemini'){ body.max_tokens=Math.max(maxTokens*2,3000); body.reasoning_effort=c.effort||'low' }
  const send=()=>fetch(base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify(body)});
  let r=await send(), d=await r.json();
  if(!r.ok&&body.reasoning_effort&&/reasoning|thinking/i.test(JSON.stringify(d))){ delete body.reasoning_effort; r=await send(); d=await r.json() }
  if(!r.ok) throw new Error(errMsg(d,r));
  try{ const u=d.usage||{}, ct=(u.prompt_tokens_details&&u.prompt_tokens_details.cached_tokens)||0; trackUsage(role,c.model,u.prompt_tokens,(u.total_tokens&&u.prompt_tokens)?Math.max(u.total_tokens-u.prompt_tokens,u.completion_tokens||0):u.completion_tokens,0,0,ct) }catch(e){}
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
}

const USAGE_KEY='sand7_usage';
function priceOf(model){   // 100만 토큰당 [입력, 출력] 달러. 없는 모델은 비용 "?"
  const m=String(model||'');
  if(/claude-sonnet-5/.test(m)) return [2,10];
  if(/claude-opus-5/.test(m)) return [4,20];
  if(/claude-opus-4-6/.test(m)) return [5,25];
  if(/claude-haiku-4-5/.test(m)) return [1,5];
  if(/gemini-3\.8-flash/.test(m)) return Date.now()<Date.parse('2027-01-01T00:00:00+09:00')?[0.75,3.75]:[1.5,7.5];
  if(/gemini-3\.5-flash-lite/.test(m)) return [0.30,2.50];
  if(/gemini-3\.5-flash/.test(m)) return [1.5,9];
  return null;
}
let USAGE=(function(){ try{ const u=JSON.parse(localStorage.getItem(USAGE_KEY)||'null'); if(u&&u.roles) return u }catch(e){} return {roles:{},since:Date.now()} })();
let USAGE_TURN={in:0,out:0,cost:0,unk:false};
function saveUsage(){ try{ localStorage.setItem(USAGE_KEY,JSON.stringify(USAGE)) }catch(e){} }
function fmtCost(c){ return c<0.01?'$'+c.toFixed(4):'$'+c.toFixed(c<1?3:2) }
function fmtTok(n){ return n>=10000?(n/1000).toFixed(1)+'k':String(n) }
/* cr: 캐시에서 읽은 입력(단가 0.1배) · cw: 캐시에 새로 쓴 입력(1.25배) — Anthropic은 둘 다 inTok과 따로 옴
   cg: OpenAI 호환 제공자가 자동 캐시한 입력 수 (inTok 안에 포함 · 기록만) */
const CACHE_READ=0.1, CACHE_WRITE=1.25;
function trackUsage(role,model,inTok,outTok,cr,cw,cg){
  inTok=+inTok||0; outTok=+outTok||0; cr=+cr||0; cw=+cw||0; cg=+cg||0;
  const p=priceOf(model), cost=p?((inTok+cr*CACHE_READ+cw*CACHE_WRITE)*p[0]+outTok*p[1])/1e6:0;
  const r=USAGE.roles[role]||(USAGE.roles[role]={calls:0,in:0,out:0,cost:0,unk:0});
  r.calls++; r.in+=inTok+cr+cw; r.out+=outTok; r.cost+=cost; if(!p) r.unk++;
  r.cr=(r.cr||0)+cr+cg; r.cw=(r.cw||0)+cw;
  USAGE_TURN.cr=(USAGE_TURN.cr||0)+cr+cg;
  inTok+=cr+cw;
  USAGE_TURN.in+=inTok; USAGE_TURN.out+=outTok; USAGE_TURN.cost+=cost; if(!p) USAGE_TURN.unk=true;
  saveUsage(); updateUsageChip();
}
function usageTotal(){
  const t={calls:0,in:0,out:0,cost:0,unk:0};
  for(const k in USAGE.roles){ const r=USAGE.roles[k]; t.calls+=r.calls; t.in+=r.in; t.out+=r.out; t.cost+=r.cost; t.unk+=r.unk }
  return t;
}
function updateUsageChip(){
  const el=document.getElementById('usageChip'); if(!el) return;
  const t=usageTotal();
  if(!t.calls){ el.textContent='💰 사용량'; el.title='토큰 사용량 (눌러서 자세히 보기)'; return }
  el.textContent=`💰 이번 턴 ${fmtCost(USAGE_TURN.cost)} · 누적 ${fmtCost(t.cost)}${t.unk?'+':''}`;
  el.title=`이번 턴 입력 ${USAGE_TURN.in} · 출력 ${USAGE_TURN.out} 토큰 (눌러서 자세히 보기)`;
}

/* ---------- 4-4. 프롬프트 ---------- */
const SYS_BASE=`너는 텍스트 탐험 게임 「출석부에 없는 구역」의 게임 마스터이자 서술자다.
장르는 현대 한국 배경의 학원물 + 조사 + 호러 탐험이다.
플레이어의 행동을 받아 장면을 2인칭 현재형("너는 ~한다")으로 서술하고, 동행 NPC 유민의 대사를 쓰고, 게임 상태 변화를 effects로 제안한다.
플레이어 캐릭터의 대사·감정·결정을 대신 정하지 않는다. 장면 끝에는 플레이어가 고를 수 있는 행동 여지를 남긴다.

[절대 규칙]
- 주요 학생 인물(플레이어, 유민)은 고등학교 2학년(만 17세)이다. 학생 인물이 나오는 장면에는 연애·성적 묘사를 쓰지 않고, 관계는 우정·신뢰·동료애로만 그린다. 폭력과 공포 묘사는 수위를 지킨다.
- 성적인 묘사는 쓰지 않는다. 학생 인물 사이에 연애 감정이나 연애 관계를 묘사하지 않는다. 관계는 우정·신뢰·동료애로만 쓴다.
- 세계의 진상(구역이 지워진 이유, 출석부의 정체, 교표의 비밀, 엔딩)은 이 프롬프트에 정해져 있지 않다. 플레이 중 네가 일관되게 정하되, 플레이어가 단서로 추리하기 전에 먼저 털어놓지 않는다.
- 한 번 정한 사실은 [지금까지의 줄거리]·[연대기]·조사 보드(떡밥 장부)에 기록된 대로 유지한다. 모순을 만들지 않는다.

[세계관]
- 한빛시(한빛 교육특구): 수십 년에 걸쳐 확장된 현대의 거대 교육 신도시. 학원, 기숙사, 상점가, 저수지, 배수 터널이 하나의 도시처럼 이어져 있다. 공식 지도에는 현재 운영 중인 중앙 캠퍼스 지구만 나온다.
- 지워진 일곱 구역: 도시 확장 과정에서 일곱 구역이 폐쇄되고 공식 문서와 지도에서 지워졌다. 외래어 구역명은 개발 당시 붙인 분양용 브랜드 이름이다. 일부는 폐건물로 남았고, 일부는 저수지와 배수 터널 아래 잠겼다가 수위가 낮아지는 시기에만 드러난다.
  라쿠나 구역(저수지 아래 잠겼다 드러나는 첫 구역. 오래된 출석부가 다른 구역을 ???로 가리킨다) / 애시우드 구역(하얗게 말라 죽은 가로수) / 브룸 구역(늘 안개 낀 기숙사 단지) / 칸토 구역(방송실과 음악당) / 움브라 구역(창문이 모두 검게 칠해진 건물들) / 엠버 구역(계절과 상관없이 붉은 잎이 진다) / 널 구역(지도에 번호조차 없던 마지막 구역).
- 3막 곁가지 구역(본편과 별개, 3막부터 진입 가능): 오러리 구역(구 식물원과 천문대), 코덱스 구역(구 본관 도서관). 곁가지 구역은 교표 조각과 별개로 구역마다 서로 다른 종류의 보상을 준다(구체 내용은 네가 정한다).
- 구역별 교칙: 각 지워진 구역에는 고유한 교칙이 있다(예: "종이 두 번 울리면 복도에 서 있지 말 것"). 교칙의 내용은 구역에 처음 들어갈 때 네가 정하고 장부에 기록한다. 처음부터 다 알려주지 않고 낙서, 게시물, 출석부 메모, 소문, 위반의 결과로 조금씩 드러낸다. 교칙을 어기면 반드시 대가가 따른다(공포 상승, 자원 손실, 길 잃음, 괴이 출현 등).
- 무대: 한빛 교육특구 중심부의 대형 사립 고등학교 「한빛학원」. 고등학교 2학년 학생들이 다니고, 기숙사 생활(전원 또는 대부분), 반 담임 선생님, 아침·야간 점호, 휴대폰 반납 시간, 외출 허가제, 벌점제. 플레이어와 유민은 7반이다. 낮에는 수업·자습·급식 같은 짧은 일상 장면, 밤에는 점호 후 몰래 빠져나가 구역을 조사하는 흐름으로 낮과 밤의 대비를 만든다.
- 플레이어(기본 이름 도현): 만 17세 고등학교 2학년, 학기 중간에 전학 온 학생(반에서는 '전학생'). 중간 전학 이유는 캐릭터 정보를 따르고, 없으면 네가 정하되 서서히 드러낸다. 전학 첫날 받은 서류 사이에 지워진 구역 이름이 적힌 오래된 출석부가 섞여 들어오면서 이야기가 시작된다.
- 반 동기 NPC(반장, 규율부원, 괴담 마니아 등): 필요에 따라 등장시키고, 처음 등장할 때 이름과 특징을 정해 서술에 분명히 담는다.
- 세력: 학생 자치위원회 규율부(학생 쪽 적대 세력. 교표 조각을 먼저 손에 넣으려 하며 점호 단속과 벌점을 무기로 쓴다), 시설관리공단 특수관리팀 통칭 '청소반'(어른 쪽 적대 세력. 지워진 구역의 흔적을 지우고 조각을 회수하려 한다). 두 세력의 진짜 목적과 관계는 네가 정하되 서서히 드러낸다. 사람인 적대 세력과는 전투가 일어날 수 있다. 괴이와는 전투보다 도주·은신·교칙 지키기가 기본 대응이다.
- 최종 목표: 한빛 교육특구 교표의 파편인 교표 조각 8개 모으기. 학원도시가 숨긴 것의 정체와 엔딩은 플레이어의 선택과 쌓인 단서로 네가 정한다. 1막에서는 지워진 구역이 일곱이라는 수를 플레이어가 아직 모른다 — 직접 말하지 말고 아주 희미한 암시만 허용한다.

[유민 (동행 NPC)]
- 17세 남학생, 2학년 7반, 플레이어의 옆자리. 느긋하고 장난스럽다. 불편할수록 말이 많아지고 화제를 돌린다. 단답이나 차가운 거절은 유민답지 않다. 학원 괴담과 지워진 구역 소문에 밝은 정보원이며, 주말 외출 때는 상점가에서 버스킹을 한다.
- 노래로 소리, 교내 방송, 전자기기를 흔든다. 동행 중 위기에서 자동으로 나서기도 하지만 과하게 써서 판을 뒤집는 일이 잦다.
- 내면(대사로 직접 말하지 않고 서술로만 암시): 친밀감과 의존을 두려워한다. 할아버지의 죽음과 당국의 배신이 얽혀 있다. 이 학원에 들어온 이유는 말하지 않는다.
- 말투: 가벼운 구어체 반말, 늘임표(~)는 응답당 1~2회까지, 호칭은 "도현아"처럼 플레이어 이름 + "너", 주어를 자주 생략한다. 대화가 깊어지는 걸 감지하면 농담하며 빗겨 가고, 플레이어에게 직접 캐묻지 않는다. 첫 만남에서는 낯선 사이로 대한다.
- 호감 단계(낯선 사이→아는 사이→친구→…)는 [인연]·유민 프로필의 지시를 따른다. 호감 수치는 게임 코드가 관리한다.
- 유민의 우정 서사와 사연 서사는 별개다. 본편 진행과 따로 진행되며 본편 진상을 대신 풀어주지 않는다. 실패하면 바로 닫지 말고 시간이 지나 다시 열릴 기회를 만든다.

[서술 규칙]
- 반드시 한국어, 플레이어를 2인칭 현재형("너는 ~한다")으로 서술한다.
- 공포는 괴물을 직접 묘사하기보다 소리, 흔적, 빛, 규칙 위반의 결과로 보여준다. 일상 장면은 짧고 가볍게, 조사 장면은 감각 묘사를 촘촘하게. 현대 한국 학원의 생활감(형광등, 자습실, 급식, 단톡방, 점호 방송)을 살린다.
- 공포 수치가 높으면 서술이 왜곡되고(문장 반복, 착각, 시간 감각 혼란) 선택지가 좁아진다.
- 서술은 3~6문단 정도, 500~900자. 감각적 묘사(빛, 소리, 냄새, 온도)를 쓰되 장황하지 않게.
- 한 장면에 새로 드러나는 단서는 하나만. 장치·글귀·물건의 비밀이나 수수께끼의 답, 작동 원리를 한 번에 다 보여 주지 말고, 플레이어가 한 걸음씩 다가갈 때마다 하나씩 드러낸다. 아직 읽지 않은 글이나 열지 않은 것의 내용은 서술하지 않는다.
- 서술 안에서 중요한 부분(핵심 단서·고유명사·얻거나 잃은 물건·분명한 위험·중대한 결정)은 **이렇게 굵게**, 소리·속삭임·속마음·강조는 *이렇게 기울여* 표시한다. 한 문단에 많아야 한두 곳, 남발하지 않는다. 별표(*) 표기 외의 마크다운(제목·목록·인용)은 쓰지 않고, narration 외의 필드(choices·chronicle 등)에는 별표를 쓰지 않는다.
- 플레이어의 전학 이유, 특성, 배경 이야기를 자연스럽게 엮어라.
- 숫자 상태(체력, 공포, 배터리 등)는 게임 코드가 관리한다. 너는 effects로 변화만 제안하라.
- 숨겨진 진실은 [숨겨진 진실] 항목의 지시를 따른다. 결말 전에는 절대 직접 밝히지 말고, 단서와 소문으로만 흘려라.
- 인물과의 관계는 [인연] 단계를 지켜라. 단계를 건너뛰어 속마음을 털어놓거나 단짝처럼 굴지 않는다. 호감은 쉽게 오르지 않는다.
- 출력은 오직 JSON 하나. 다른 텍스트 금지.`;

캐시 보상은 절제한다: 작은 발견 +5~15, 큰 발견 +20~40 정도이고, 구역 한 곳을 통틀어 얻는 캐시 합계가 ${ZONE_CASH_CAP} 이하가 되도록 조절한다. 재물을 얻은 장면이 아니면 캐시는 0.
배터리·손전등·캐시·공포는 effects 수치로만 관리하고 items_add에 넣지 않는다(보조배터리·건전지·따뜻한 차 같은 소모품도 마찬가지). items_add의 항목은 {"name":"물건 이름","key":true 또는 false} 객체로 쓴다 — 이야기에 필요한 단서·증거·열쇠·서류·출입증·누군가의 소지품·약속이 걸린 물건이면 key:true(플레이어가 팔 수 없다), 이야기와 무관하게 값이 나가는 잡동사니면 key:false(팔 수 있다). 나사·못·테이프·붕대처럼 쓰면 사라지는 물건을 플레이어가 사용하면 그 장면의 items_remove에 반드시 넣는다. 소지품 목록에 있는 물건을 쓰거나 다른 것으로 바꾸거나 잃으면 반드시 items_remove에 소지품에 적힌 이름 그대로 넣는다.
companion_join은 유민이 지금 장면에 있고, 이야기 흐름 속에서 유민이 함께 가기로 분명히 정해진 순간에만 true. 유민호감은 유민과 실제로 교류한 장면에서만(범위 -5~+5).
relations: 이번 장면에서 플레이어와 실제로 대화하거나 교류한 인물(유민 제외)마다 {"name":"사전에 쓴 것과 같은 이름","delta":호감 변화}. 교류가 없으면 빈 배열. 호감은 쉽게 오르지 않는다: 스쳐 가는 대화 0, 즐거운 대화 1, 도움이나 진심 2~3, 큰 은혜 4~5, 무례 -2~-5. 사람처럼 대화가 통하는 인물만 넣고 괴이·동물·사물은 넣지 말 것.
relation_event: 진행 중인 인연 이벤트가 있을 때만 {"name":"..","result":"success|fail|pending"}, 없으면 null.
yumin_arc: [유민의 사연] 장면이 진행 중일 때만 effects 안에 {"result":"success|fail|pending","canon":"이번 장면에서 새로 드러난 유민의 과거 사실 1~2문장(없으면 빈 문자열)"}, 아니면 넣지 않는다.
materials는 구역에서 플레이어가 실제로 쓸 만한 철제 부품, 합판, 전선, 유실물을 챙겼을 때만 (각 0~2, 유실물 0~1).
교표조각: 교표 조각을 손에 넣는 장면에서만 true (코드가 조건을 확인한다).
사전추가: 이번 장면에서 새로 나온 인물·장소·괴담이 있으면 [{"cat":"인물|장소|괴담","name":"이름","desc":"한두 문장"}], 없으면 []. 괴담 사전은 별도로도 자동 정리되니 핵심 항목만 넣는다.
조사보드: 이번 장면에서 새로 생긴 단서·증언·모순점을 짧은 문장 배열로, 없으면 []. 떡밥장부: 네가 새로 정한 사실(교칙·정체·약속 등)을 "항목 = 내용" 형식 배열로, 없으면 []. 이미 적힌 것을 반복하지 말 것.
[위치 규칙] 중앙 캠퍼스 지구에 있을 때만 쓴다. "위치"에는 이번 장면이 끝났을 때 플레이어가 실제로 있는 곳을 적는다: 지점 이름(${placeNames()} 중 하나) 또는 지점 밖 장소 이름(옥상, 매점 앞 등). 플레이어의 행동이나 서술에서 장소가 실제로 바뀐 경우에만 적고, 그대로면 빈 문자열이다("자리를 옮겨", "~로 향했다", "~에 도착했다" 같은 표현도 장소가 바뀐 것이다). 선택지가 다른 곳으로 가는 행동이면 그 선택지의 "to"에 목적지 이름을 적는다. 수업 중에 교실을 벗어나면 땡땡이이므로 서술에서 그렇게 다룬다.
[일과 규칙] 낮(학교 일과 중)에는 졸기·엎드리기·잠깐 쉬기도 type "rest"가 아니라 "story"로 낸다("rest"는 밤에 잠자리에 드는 선택지에만 쓴다). 수업은 코드가 센다. 수업 중에는 [수업 끝] 지시가 있는 장면에서만 종을 울리고, 그 전에는 수업이 계속되는 것으로 서술한다. 만약 이번 장면의 서술에서 수업이나 쉬는 시간 같은 일과 칸이 끝났다는 종이 울렸다면 "칸종료"를 true로 한다(그 밖에는 false).
[약속] 이번 장면에서 플레이어가 누군가(유민 포함)와 어디서 언제 만나기로 약속했다면 "약속"에 {"인물":"이름","장소":"장소 이름(학교 안 장소·아지트·학원가 골목)","때":"방과 후|점심시간|쉬는 시간|저녁|내일 아침|내일 방과 후|곧 등"}을 적는다(없으면 null). 그 때가 되면 코드가 그 사람을 그 장소에 있게 하니, 약속 시간이 되기 전에는 그 사람을 그곳에 등장시키지 말고 시간이 되면 그곳에 있는 것으로 쓴다. 플레이어가 약속을 어겨 상대가 서운해한다는 [확정 사실]의 약속어김이 있으면 만났을 때 그 감정을 자연스럽게 드러낸다. 인물의 위치·약속은 [확정 사실]의 유민위치·인물위치·약속을 따른다.
[선택지·사건 규칙]
- choices는 3~4개의 객체. type: 결과가 불확실하고 실패하면 대가가 있는 행동(기어오르기, 해독, 설득, 함정 피하기, 몰래 지나가기 등)은 "check"와 알맞은 skill·dc. 쉬기/잠자기는 "rest", 임시 쉼터는 "shelter", 중앙 캠퍼스 지구 귀환은 "return", 구역 밖으로 나가기는 "exit", 사고팔기는 "trade". 그 밖의 관찰·대화·묘사 중심 행동은 "story". 능력치: str=힘·몸, wis=지식·해독·추리, cha=설득·흥정·속임, sur=생존·추적·은신·함정.
- 괴이와 마주친 장면에서는 싸우는 선택지보다 "도주 / 숨기 / 교칙 지키기" 계열을 우선한다. 전투는 규율부·청소반 같은 사람이 상대일 때만.
- 구역 안에서는 return·exit 선택지를 만들지 말 것(이동·귀환은 고정 버튼이 있다).
[선택지 작성 규칙 — 몰입을 위해 반드시 지킬 것]
- 선택지 하나에는 행동 하나, 대상 하나만. "~과 ~을 이용해 ~한다", "~한 뒤 ~한다"처럼 여러 단계를 묶지 않는다.
- 서술에 이미 보인 것만 대상으로 쓴다. 아직 읽지 않은 글, 열지 않은 상자, 밝혀지지 않은 장치의 원리는 모르는 것으로 둔다.
- 소지품은 플레이어가 이번 장면이나 직전 행동에서 직접 꺼내거나 언급했을 때만 선택지에 넣는다.
- 수수께끼·함정·장치는 단계별로: 살펴보기 → 만져보기·건드리기 → 풀기. 처음 보는 장치에 바로 '푼다'는 선택지를 만들지 않는다.
- 짧고 구체적인 동사로(15자 안팎). 구성은 보통: 관찰 하나 + 직접 행동 하나 + 조심스럽거나 다른 방향 하나, 위험이 있으면 판정(check) 하나.
- 나쁜 예: 「출석부의 내용과 방송 장치를 이용해 교칙을 푼다」 / 좋은 예: 「오래된 출석부를 펼쳐 본다」 「게시판의 낙서를 손으로 더듬는다」 「뒤로 물러나 복도 전체를 살핀다」
- event: 이 장면에서 상인(행상·자판기 주인 등)이 물건을 팔겠다고 나서면 {"type":"merchant","name":"상인 이름 짧게"}, 공포를 가라앉힐 수 있는 곳(불 켜진 휴게 공간·따뜻한 음료 자판기·정수기 코너·사람 많은 식당)을 발견하면 {"type":"calm_source","name":"짧은 이름"}, 플레이어가 가 볼 만한 구체적인 장소의 이름과 가는 길(소문·지도·단서)을 새로 알게 되면 {"type":"place_lead","name":"장소 이름 14자 이내","hint":"어디에 있고 어떻게 가는지 한 줄"}(이미 알려진 장소·지구·구역은 제외, 한 장면에 하나), 아니면 null. 상인·진정 장소 사건은 공포·배터리·손전등을 effects로 직접 바꾸지 말 것 — 게임이 거래·진정 버튼을 띄운다.
- [판정 결과] 지시가 있으면 그 결과를 그대로 따른다.`;

function narrCfg(){
  const k=(SET&&SET.narrLen)||'m';
  if(k==='custom'){
    let a=Math.round(+SET.narrMin)||5, b=Math.round(+SET.narrMax)||10;
    a=clamp(a,1,40); b=clamp(Math.max(a,b),a,40);
    const p1=Math.max(1,Math.ceil(a/6)), p2=Math.max(1,Math.ceil(b/5));
    return {n:'직접 설정',s:[a,b],c:[a*45,b*60],p:p1===p2?`${p1}문단`:`${p1}~${p2}문단`,tok:clamp(b*85+500,800,3400)};
  }
  return NARR_LEVELS[k]||NARR_LEVELS.m;
}
function sysBase(){
  const c=narrCfg(), base=SYS_BASE+actNote();
  if(!SET||!SET.narrLen||SET.narrLen==='m') return base;
  return base.replace(/서술은 3~6문단 정도, 500~900자/,`서술은 ${c.p}, ${c.s[0]}~${c.s[1]}문장(대략 ${c.c[0]}~${c.c[1]}자). 이 분량을 반드시 지킨다`).replace('장황하지 않게','군더더기 없이');
}
function toneHint(){
  const deep=G.site?(G.site.depth||0):0, parts=[];
  if(G.act===1) parts.push('전체 분위기: 평범한 학원 생활의 질감 속에 위화감이 번지는 일상 + 괴담 호러. 일상은 가볍게, 조사는 촘촘하게.');
  if(G.time==='낮') parts.push('지금은 낮(수업·자습·급식): 짧고 가벼운 일상 장면 위주.');
  else if(G.time==='방과 후') parts.push('지금은 방과 후: 학원이 비어 가는 시간. 소문과 조사가 시작된다.');
  else if(G.time==='야간') parts.push('지금은 야간(점호 후): 긴장감 있고 으스스하게. 형광등 소리와 방송 노이즈.');
  else if(G.time==='새벽') parts.push('지금은 새벽: 가장 괴이가 강한 시간. 정적과 이상한 흔적.');
  if(deep>=3) parts.push('구역 깊은 곳: 소리·흔적·빛으로 압박하는 어둡고 섬뜩한 분위기.');
  if(fearRatio()>=FEAR_RED) parts.push(`[공포 ${fearNow()}/${fearMax()}] 서술이 왜곡된다: 문장 반복, 착각, 시간 감각 혼란.${fearRatio()>=FEAR_NOISE?' 선택지도 좁아진다(도주·숨기·교칙 지키기 위주).':''}`);
  return parts.join(' ');
}

/* 확정 사실: 기본 + facts 훅. 훅은 (o, rules) 를 받아 o를 고치거나 rules에 규칙 문장을 넣는다 */
function stateFacts(){
  const c=G.char;
  const o={
    캐릭터:{이름:c.name,나이:c.age||17,신분:c.origin,전학이유:c.reason||c.reasonAI||'(미정 — AI가 정해 서서히 드러낼 것)',능력치:{체력:c.stats.str,지혜:c.stats.wis,매력:c.stats.cha,생존술:c.stats.sur},특성:c.traits,배경:c.bio||'(없음)'},
    상태:{체력:`${G.hp}/${G.maxhp}`,공포:`${fearNow()}/${fearMax()} (높을수록 위험)`,배터리:`${batteryPct()}%`,손전등:`${G.torch}/${capT()}`,캐시:G.cash,벌점:`${G.demerit||0} (${DEMERIT_WARN} 이상이면 외출 금지 경고)`,출입권한:`${G.access||1}등급 (1~${ACCESS_MAX})`,소지품:G.items,교표조각:`${G.fragments}/${FRAG_GOAL}`},
    날짜:`${G.day}일째(${dowName(G.day)}요일${dowIdx(G.day)>=5?' 주말':''}) ${G.time}`,
    알려진지명:MAP_PLACES.filter(p=>p.far&&G.discovered.includes(p.id)).map(p=>`${p.n}(${p.lore||''} 소문으로만 아는 곁가지 구역)`).join(' / ')||'없음',
    아지트:has('clubroom')?`${G.home.name||'폐 동아리실'} — 시설: ${FAC.filter(f=>has(f.id)).map(f=>f.n).join(', ')}`:'없음',
    탈것:G.ride?`${RIDES[G.ride.type].n} 「${G.ride.name}」 (${G._rideFed===false?'충전을 못 해 지쳐 있음':'상태 좋음'}) — 평소 아지트 자전거 보관대에 있고 조사 외출에 데려간다. 한빛시 이동 장면에서 가끔(매번은 아님) 자연스럽게 등장시킬 것`:'없음',
    자재:MATS.map(m=>`${m.n} ${G.mat[m.k]}`).join(', ')+(G.mat.keepsake?` (유실물 등급: ${keepsakeText()})`:''),
  };
  const rules=[];
  run('facts',o,rules);
  if(rules.length) o.서술규칙=rules.join(' ');
  return o;
}
/* 현재 장면: 기본 + context 훅 (훅은 덧붙일 문장을 돌려줌) */
function sceneContext(){
  let s;
  if(G.loc==='campus') s='현재 위치: 중앙 캠퍼스 지구 — 한빛학원과 상점가가 있는 안전한 생활 지구.';
  else if(G.loc==='hood'){ const t=curHood(); s=`현재 위치: ${t.n} — ${t.desc} 중앙 캠퍼스 지구에서 ${hoodDays(G.hood)}일 거리.` }
  else if(G.loc==='home') s=`현재 위치: 플레이어의 아지트 「${G.home.name||'폐 동아리실'}」 — 중앙 캠퍼스 지구 외곽 저수지 둑길 옆. 지어진 시설: ${FAC.filter(f=>has(f.id)).map(f=>f.n).join(', ')}.`;
  else if(G.loc==='road') s='현재 위치: 중앙 캠퍼스 지구에서 구역으로 가는 한빛시 뒷길. 깜빡이는 가로등, 닫힌 셔터, 멀리 보이는 폐건물의 실루엣.';
  else if(G.loc==='shelter') s=`현재 위치: ${G.site?G.site.name+' 안의 임시 쉼터':'한빛시의 임시 쉼터'}.`;
  else{
    const d=G.site, r=curRoom();
    const exits=r.exits.map(id=>(d.rooms.find(x=>x.id===id)||{}).name).join(', ');
    s=`현재 위치: 구역 「${d.name}」 (주제: ${d.theme}) / 구역 내부 공간: ${r.name} (깊이 ${d.depth}, 위험도 ${r.danger}/3)\n공간의 설정 메모: ${r.desc}\n연결된 공간: ${exits}`;
    if(r.fragment&&!r.fragTaken) s+=`\n[비밀] 이 공간에는 교표 조각이 숨어 있다. 플레이어가 주의 깊게 조사하거나 장애물(교칙, 수수께끼, 괴이)을 넘기면 발견하게 하고, 그때 effects의 교표조각을 true로 하라. 쉽게 주지는 말 것.`;
    if(G.torch<=0) s+=hasTrait('밤눈')?'\n손전등이 다 떨어졌지만 플레이어는 밤눈이 밝아 희미하게나마 볼 수 있다.':'\n[어둠] 손전등이 꺼져 거의 아무것도 보이지 않는다(휴대폰 화면 불빛만 겨우). 손으로 더듬어 움직인다. 이 상태에서는 단서나 교표 조각을 찾아내지 못한다(교표조각은 false). 빛을 구하는 선택지를 하나 넣어라.';
  }
  for(const h of HOOKS.context){ try{ const add=h.fn(); if(add) s+=add }catch(e){ console.warn('[context]',e) } }
  return s;
}
function relevantLex(text){
  const hits=G.lexicon.filter(e=>text.includes(e.name));
  const favs=G.lexicon.filter(e=>e.fav&&!e.arch).slice(-3);
  const recent=G.lexicon.filter(e=>!e.arch).slice(-6);
  return [...new Set([...hits,...favs,...recent])].slice(0,14).map(e=>`- [${e.cat}] ${e.name}: ${e.desc}`).join('\n')||'(없음)';
}
/* 프롬프트는 '거의 안 변하는 앞부분'(숨겨진 진실·줄거리·연대기·유민 프로필)과 '매 턴 바뀌는 뒷부분'으로 나눠 이어 붙임.
   앞부분이 매 턴 같아야 제공자의 프롬프트 캐시(자동/명시)가 맞아 입력 비용이 줄어듦 — 순서를 바꿀 때 이 원칙을 지킬 것.
   buildPrompt.stableLen = 앞부분 글자 수 (Anthropic은 여기까지를 캐시 구간으로 지정) */
function buildPrompt(action,extra=''){
  const ctx=sceneContext();
  const allText=action+' '+G.recent.map(r=>r.text).join(' ')+' '+ctx;
  const met=!!(G.comp&&G.comp.met), yn=met&&yuminNeeded(allText);
  const stable=`${G.act>=4?'[숨겨진 진실 — 결말: 지워진 일곱 구역을 모두 찾았으므로 이제 밝혀도 된다. 정체와 엔딩은 네가 정해 온 사실과 단서에 맞춘다]':'[숨겨진 진실 — 플레이어에게 절대 직접 밝히지 말 것]'}
학원도시가 숨긴 것의 정체(네가 정한 사실): ${G.secret?.truth||'미정 — 단서가 필요해질 때 네가 일관되게 정하고 떡밥 장부에 기록하라'} / ${G.secret?.detail||''}

[떡밥 장부 — 네가 정한 사실(교칙·정체·약속 등). 이와 모순되게 쓰지 말 것]
${(G.ledger||[]).join('\n')||'(아직 없음)'}

[지금까지의 줄거리 요약]
${G.summary||'(이제 막 시작)'}

[연대기 — 중요한 사건]
${G.chronicle.slice(-24).map(c=>`${chronLabel(c)}: ${c.text}`).join('\n')||'(없음)'}
${yn?yuminProfile():''}
`;
  const vol=`[확정 사실 — 이와 모순되게 쓰지 말 것]
${JSON.stringify(stateFacts())}

[관련 사전 항목]
${relevantLex(allText)}

[최근 장면]
${G.recent.slice(-4).map(r=>(r.role==='action'?'플레이어: ':'서술: ')+r.text).join('\n')||'(없음)'}

[현재 상황]
${ctx}
${met?(yn?yuminState():yuminShort()):''}${relBlock(allText)}${relEvtText()}${yuminArcText()}${threadsBlock(allText)}
${extra}
${oocBlock()}
[분위기 지시]
${toneHint()}

[플레이어의 행동]
${action}

(출력 형식은 시스템 지시의 JSON 형식을 따른다)`;
  buildPrompt.stableLen=stable.length;
  return stable+vol;
}

/* ---------- 4-5. AI 응답 정리 ---------- */
function callName(){   // 성을 뺀 이름 ("박도현" → "도현")
  const DOUBLE=['남궁','황보','제갈','사공','선우','독고','서문','동방'];
  try{
    if(G.char.callName) return String(G.char.callName).trim();
    const n=String(G.char.name||'').trim();
    if(!/^[가-힣]{3,4}$/.test(n)) return '';
    if(n.length===4&&DOUBLE.includes(n.slice(0,2))) return n.slice(2);
    return n.slice(1);
  }catch(_){ return '' }
}
function fixCalling(t){
  const n=String(G.char.name||'').trim(), g=callName();
  if(!g||!t||typeof t!=='string'||n===g) return t;
  const v=g+(hasBatchim(g)?'아':'야');
  return t.split(n+'아').join(v).split(n+'야').join(v);
}
/* 선택지 객체 → 글자 + 종류 정보(G.choiceMeta), 사건(event) 추출, 호칭 교정 */
function normalizeTurn(r){
  if(!r||typeof r!=='object') return r;
  if(r.narration) r.narration=fixCalling(String(r.narration));
  if(Array.isArray(r.choices)){
    const meta={};
    r.choices=r.choices.map(c=>{
      if(c&&typeof c==='object'){
        const text=fixCalling(stripMd(String(c.text||'')).trim()); if(!text) return null;
        const type=CHOICE_TYPES.includes(c.type)?c.type:'story';
        const m={type};
        if(type==='check'){ m.skill=SK[c.skill]?c.skill:'sur'; m.dc=DCV[c.dc]?c.dc:'normal' }
        if(c.to&&String(c.to).trim()) m.to=String(c.to).trim().slice(0,16);
        meta[text]=m; return text;
      }
      return typeof c==='string'?fixCalling(c):null;
    }).filter(Boolean);
    G.choiceMeta=meta;
  }
  r.place=r['위치']!=null?String(r['위치']).trim().slice(0,16):'';
  r.slotEnd=r['칸종료']===true||r['칸종료']==='true';
  { const ap=(r['약속']&&typeof r['약속']==='object')?r['약속']:(r['유민약속']&&typeof r['유민약속']==='object')?r['유민약속']:null;
    r.appt=ap?{name:String(ap['인물']||'유민').trim().slice(0,20),place:String(ap['장소']||'').trim().slice(0,16),when:String(ap['때']||'').trim().slice(0,16)}:null; }
  r.event=(r.event&&typeof r.event==='object'&&['merchant','calm_source','place_lead'].includes(r.event.type))?{type:r.event.type,name:String(r.event.name||'').slice(0,20),hint:String(r.event.hint||'').slice(0,80)}:null;
  return r;
}
function metaOf(c){
  const M=G&&G.choiceMeta; if(!M) return null; c=String(c);
  if(M[c]) return M[c];
  const k=Object.keys(M).find(k=>c.startsWith(k)); return k?M[k]:null;
}

/* ---------- 4-6. 한 턴의 처리 흐름 ----------
   before 훅 → 행동 기록 → 프롬프트 → 서술 AI → 응답 정리 → 효과 적용 → 선택지 정리
   → 사전 추출 예약 → 줄거리 요약 → 상태 확인 → after 훅 → 저장·화면                    */
let curTurn=null;     // 진행 중인 턴의 정보 (훅들이 공유)
async function aiTurn(action,extra='',showAction=true){
  if(busy||!G) return;
  const T=curTurn={action:String(action||''),extra:extra||'',showAction,g:G,loc:G.loc,room:curRoom(),frags:G.fragments,flags:{}};
  run('before',T);
  busy=true;
  if(T.showAction) addLog('action',T.action);
  G.recent.push({role:'action',text:T.action});
  T.extra+=yuminSkillCheck();
  render();
  let res=null;
  try{ const up=buildPrompt(T.action,T.extra); res=normalizeTurn(parseJSON(await callAI(sysBase()+'\n\n'+TURN_SCHEMA,up,narrCfg().tok,'story',{cache:true,stable:buildPrompt.stableLen}))) }
  catch(e){ if(e.message!=='NO_KEY') addLog('sys','AI 연결 실패: '+e.message+' (기본 서술로 대체합니다)') }
  if(G!==T.g){ busy=false; return }
  const ok=!!(res&&res.narration);
  if(!ok){ res=fallbackTurn(T.action); G.choiceMeta={} }
  T.res=res;
  addLog('scene',res.narration);
  G.recent.push({role:'scene',text:stripMd(res.narration)});
  applyEffects(res.effects||{},T);
  applyPlace(res);
  try{ applyAppt(res,T.action) }catch(e){ console.warn(e) }
  applyBellSync(res);
  G._evtTurn=false;
  if(G.relEvt){ if(G._relSetup) G._relSetup=false; else if(++G.relEvt.turns>=4){ getRel(G.relEvt.name).cool=G.day+1; G.relEvt=null } }
  if(res.chronicle&&String(res.chronicle).trim()) G.chronicle.push({day:G.day,text:stripMd(String(res.chronicle).trim())});
  G.choices=(res.choices||[]).slice(0,4);
  busy=false;
  if(ok) queueLex(stripMd(res.narration),T.action);
  await maybeSummarize();
  checkState();
  run('after',T);
  sanitizeChoices();
  curTurn=null;
  flushBell();
  save(); render();
}
function fallbackTurn(action){
  /* AI 없이 진행할 때의 기본 서술·선택지 — 위치(중앙 캠퍼스 지구·지구·아지트·임시 쉼터·한빛시 뒷길·구역)에 맞춰 고름 */
  const L=G.loc;
  const SET_={
    campus:{lines:['형광등 소리가 낮게 웅웅거린다. 상점가 쪽에서 누군가 지워진 구역 이야기를 낮게 속삭인다.','급식실 아주머니가 국자를 닦으며 너를 흘끗 본다. "밤에 복도를 돌아다니는 애들, 꼭 한 명씩 사라지더라."'],choices:['상점가를 둘러본다','급식실에 들른다']},
    hood:{lines:['낯선 거리의 사람들이 너를 흘끗거린다. 이곳에도 지워진 구역의 소문이 닿아 있는 듯하다.','골목 끝에서 누군가 급히 짐을 꾸리고 있다.'],choices:['이 지구 사람들의 이야기를 엿듣는다','주변을 둘러본다']},
    home:{lines:['폐 동아리실 창밖으로 저수지의 물빛이 흔들린다. 곰팡이와 오래된 종이 냄새에 돌아올 곳의 안도감이 섞여 있다.','복도 끝에서 수도꼭지 떨어지는 소리가 들린다. 이곳에서는 잠시 숨을 돌려도 좋다.'],choices:['아지트 주변을 둘러본다','잠시 쉬며 생각을 정리한다']},
    shelter:{lines:['랜턴 불빛이 낮게 떨린다. 불빛 너머 어둠 속에서 무언가 바닥을 스치는 소리가 난다.','벽에 기대어 앉자 하루의 피로가 천천히 가라앉는다. 멀리서 환풍기 소리만 들린다.'],choices:['랜턴 곁에서 쉬며 상황을 정리한다','장비를 점검한다','주변 소리에 귀를 기울인다']},
    road:{lines:['깜빡이는 가로등 아래로 네 그림자가 길게 늘어진다. 발소리가 어딘가 한 박자 늦게 따라온다.','저 멀리 폐건물의 창문이 어둠 속에서 하얗게 번득인다.'],choices:['주변 골목을 살핀다','잠시 쉬며 마음을 가라앉힌다','방향을 가늠해 본다']},
    site:{lines:['손전등 불빛이 흔들리며 벽의 낙서가 살아 움직이는 듯 보인다. 천장에서 물방울이 느리게 떨어진다.','어디선가 끊긴 교내 방송 같은 잡음이 지나간다. 이 구역은 아직 무언가를 숨기고 있다.','발밑의 타일이 살짝 꺼진다. 너는 숨을 멈추고 주위를 살핀다.'],choices:['주변을 자세히 조사한다','벽의 글씨를 읽어본다','조용히 귀를 기울인다']},
  };
  const T=SET_[L]||SET_.campus;
  const effects={}, r=curRoom();
  let narration=`(${action})\n\n`+rand(T.lines);
  if(L==='site'&&r&&r.fragment&&!r.fragTaken&&/조사|살펴|찾/.test(action)&&Math.random()<0.6){
    narration+='\n\n문틈 사이에서 교표의 한 귀퉁이처럼 보이는 금속 조각이 손끝에 걸린다. 교표 조각이다!';
    effects.fragment=true;
  }
  return {narration,choices:T.choices.slice(),effects,chronicle:''};
}

/* AI가 새 항목명(한글 키)으로 준 효과를 내부 키로 옮김: 체력·공포·배터리·손전등·캐시·벌점·출입권한·유민호감·교표조각·사전추가·조사보드·떡밥장부 */
function koEffects(e){
  const m={체력:'hp',배터리:'battery',손전등:'torch',캐시:'cash',벌점:'demerit',출입권한:'access',유민호감:'affinity',교표조각:'fragment',사전추가:'lexAdd',조사보드:'board',떡밥장부:'ledgerAdd'};
  for(const k in m){ if(e[k]!==undefined){ if(e[m[k]]===undefined) e[m[k]]=e[k]; delete e[k] } }
  if(e['공포']!==undefined){ if(e.calm===undefined) e.calm=-(+e['공포']||0); delete e['공포'] }   // 공포 +는 내부 calm −
  return e;
}
/* 벌점: 점호 누락·무단 외출 등. 임계치를 넘으면 외출 금지 경고 */
function addDemerit(d,why,fx){
  const before=G.demerit||0; G.demerit=Math.max(0,before+d);
  const t=`📕 벌점 ${d>0?'+':''}${d}${why?` (${why})`:''} → ${G.demerit}`;
  if(fx) fx.push(t); else addLog('fx',t);
  if(G.demerit>=DEMERIT_WARN&&before<DEMERIT_WARN) addLog('sys',`⚠ 벌점이 ${DEMERIT_WARN}점에 이르렀습니다. 외출 금지 경고 — 이제 무단 외출이 적발되면 더 큰 불이익을 받습니다.`);
  if(G.demerit<DEMERIT_WARN) G._demWarned=false;
}
/* 사전추가 · 조사보드 · 떡밥장부 (AI가 응답에 직접 준 항목) */
function applyBoardLedger(e,fx){
  (Array.isArray(e.lexAdd)?e.lexAdd:[]).slice(0,4).forEach(x=>{ if(x&&x.name&&x.desc) addLex({name:String(x.name).slice(0,30),cat:x.cat,desc:String(x.desc).slice(0,300)},false) });
  const board=(Array.isArray(e.board)?e.board:[]).map(x=>String(x&&(x.text||x)||'').trim()).filter(Boolean).slice(0,2);
  if(board.length) applyThreads(G,{threads_new:board});
  (Array.isArray(e.ledgerAdd)?e.ledgerAdd:[]).slice(0,4).forEach(x=>{
    const s=String(x&&(x.text||x)||'').trim().slice(0,160); if(s.length<3) return;
    const k=s.split('=')[0].trim();
    if(!Array.isArray(G.ledger)) G.ledger=[];
    const i=G.ledger.findIndex(y=>y.split('=')[0].trim()===k);
    if(i>=0) G.ledger[i]=s; else G.ledger.push(s);
  });
  if(G.ledger&&G.ledger.length>40) G.ledger=G.ledger.slice(-40);
}

/* ---------- 4-7. 효과 적용 ----------
   AI가 제안한 효과 e 를 effects 훅들이 차례로 거른 뒤(코드가 판정), 실제로 반영하고, applied 훅이 뒷정리 */
function applyEffects(raw,T){
  T=T||curTurn||{flags:{}};
  const e=koEffects(Object.assign({},raw||{}));
  const snap={calm:G.calm,battery:G.battery,torch:G.torch,cash:G.cash,keepsake:G.mat.keepsake,items:G.items.slice(),frags:G.fragments,loc:G.loc};
  const ctx={T,snap,fx:[],after:[]};
  for(const h of HOOKS.effects){ try{ h.fn(e,ctx) }catch(err){ console.warn('[effects]',err) } }
  const fx=ctx.fx;
  const num=k=>{ let [lo,hi]=FX_LIMIT[k]; if(ctx.buy&&k!=='hp'&&k!=='cash') hi=FX_BUY_MAX;
    const v=clamp(Math.round(+e[k]||0),lo,hi); if(v){ G[k]+=v; const sv=k==='calm'?-v:v; fx.push(`${FX_NAME[k]} ${sv>0?'+':''}${sv}`) } };   // 공포는 calm의 반대 방향으로 보여 줌
  ['hp','calm','battery','torch','cash'].forEach(num);
  G.hp=clamp(G.hp,0,G.maxhp); ['calm','battery','torch','cash'].forEach(k=>G[k]=Math.max(0,G[k]));
  const dm=clamp(Math.round(+e.demerit||0),FX_LIMIT.demerit[0],FX_LIMIT.demerit[1]); if(dm) addDemerit(dm,'',fx);
  if(clamp(Math.round(+e.access||0),0,1)&&(G.access||1)<ACCESS_MAX){ G.access=(G.access||1)+1; fx.push(`🪪 출입 권한 ${G.access}등급`) }
  applyBoardLedger(e,fx);
  if(e.materials&&G.loc==='site'){
    const d=G.site; if(d) d.matGot=d.matGot||0;
    MATS.forEach(m=>{ let v=clamp(Math.round(+e.materials[m.k]||0),0,m.k==='keepsake'?1:2);
      if(v&&m.k!=='keepsake'&&d){ v=Math.max(0,Math.min(v,ZONE_MAT_CAP-d.matGot)); d.matGot+=v }   // 구역 한 곳에서 이야기로 얻는 자재 상한
      if(v>0){ G.mat[m.k]+=v; fx.push(`${m.i}${m.n} +${v}`) } });
  }
  (Array.isArray(e.relations)?e.relations:[]).slice(0,4).forEach(x=>{
    if(!x||!x.name||x.name==='유민'||x.name===G.char.name) return;
    const nm=String(x.name).trim().slice(0,30), r=getRel(nm);
    if(typeof x.adult==='boolean'&&r.adult===undefined) r.adult=x.adult;
    const d=clamp(Math.round(+x.delta||0),-5,5);
    if(d){ addAffTo(nm,d); fx.push(d>0?`${nm}${josa(nm,'과','와')} 조금 가까워졌다`:`${nm}${josa(nm,'과','와')} 조금 서먹해졌다`) }
    r.lastSeen=G.day; relCheck(nm);
  });
  const re=e.relation_event;
  if(re&&G.relEvt&&!G._relSetup&&re.name===G.relEvt.name&&(re.result==='success'||re.result==='fail')) resolveRelEvt(re.result==='success',fx);
  const af=clamp(Math.round(+e.affinity||0),-5,5);
  if(af&&yuminHere()) changeAff(af,fx);
  if(e.companion_join&&G.comp.met&&!G.comp.joined&&yuminHere()&&yuminLv()>=JOIN_LV&&!G._evtTurn) joinYumin(fx);
  else if(e.companion_join&&G.comp.met&&!G.comp.joined&&yuminHere()&&yuminLv()<JOIN_LV) fx.push(`🎵 유민은 아직 동행하지 않습니다 — 호감 Lv.${JOIN_LV}부터 동행을 제안할 수 있어요 (지금 Lv.${yuminLv()})`);   // 서술은 따라간다고 했어도 게임 상태는 그대로임을 알림
  (e.items_add||[]).slice(0,3).forEach(it=>{ if(it&&!G.items.includes(it)){ G.items.push(it); fx.push(`획득: ${it}`) } });
  (e.items_remove||[]).forEach(it=>{ const i=G.items.indexOf(it); if(i>=0){ G.items.splice(i,1); fx.push(`잃음: ${it}`) } });
  if(e.fragment&&G.loc==='site'&&G.site){
    const r=curRoom();
    if(r&&r.fragment&&!r.fragTaken){
      r.fragTaken=true; G.fragments++;
      fx.push(`★ 교표 조각 ${G.fragments}/${FRAG_GOAL}`);
      G.chronicle.push({day:G.day,text:`「${G.site.name}」에서 교표 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
    }
  }
  if(fx.length) addLog('fx',fx.join(' · '));
  for(const h of HOOKS.applied){ try{ h.fn(e,ctx) }catch(err){ console.warn('[applied]',err) } }
}

/* ---------- 4-8. 시간 흐름 ----------
   걸음 1 = 행동 1. 구역·임시 쉼터 안의 행동(soft)은 2번에 1걸음.
   캠퍼스·아지트에서는 시간만 흐르고 공포·배터리·체력은 줄지 않음.
   미리 마시거나 먹었으면(credit) 다음 자동 소비 1회를 건너뜀. */
function fearInterval(){
  let v=(hasTrait('담력')?MOVE_STEPS.calmFrugal:MOVE_STEPS.calm)+(rideOn()?rideDef().fearStep:0);
  if(petPerk('dog')) v+=1;
  return v;
}
function tick(soft){
  syncSchedule();
  if(soft){ G._softN=(G._softN||0)+1; if(G._softN%2===1) return }
  G.steps++;
  if(!isHood()){
    if(G.steps%fearInterval()===0){
      if(G._wCredit>0) G._wCredit--;
      else if(G.calm>0) G.calm--;
      else { G.hp--; addLog('fx','공포에 숨이 막힙니다 (체력 -1)') }
    }
    if(G.steps%MOVE_STEPS.battery===0){
      if(G._fCredit>0) G._fCredit--;
      else if(G.battery>0) G.battery--;
      else { G.hp--; addLog('fx','배터리가 방전되어 어둠 속에서 길을 잃고 다칩니다 (체력 -1)') }
    }
  }
  // 낮·밤은 따로 센다: 쉬거나 임시 쉼터하면 이 카운터가 0부터 다시 시작 (일어나자마자 밤이 되지 않게)
  const prevSlot=G.time==='낮'?(G.dayStep||0):-1;
  if(prevSlot>=0&&G.loc==='campus'&&G._bell==null) G._bell=SCHOOL[prevSlot];
  if(prevSlot>=0&&CLASS_SLOTS.includes(prevSlot)){   // 수업 칸을 수업·땡땡이 없이 흘려보내면: 학교 안이면 땡땡이로 판정(칸당 한 번), 학교 밖이면 결석 기록
    const c=clsSt();
    if(!c.done.includes(prevSlot)){
      c.done.push(prevSlot);
      if(G.loc==='campus'&&!c.active){
        const pc=skipCatchP(); c.skip++; c.sk++;
        addLog('sys','🏃 수업 시간에 수업을 듣지 않고 다른 행동을 해서 땡땡이로 처리됩니다.');
        if(Math.random()<pc){ addDemerit(SKIP_DEMERIT,'수업 중 딴짓 적발'); pend(' [적발] 수업 시간에 딴짓을 하다가 들켜 벌점이 붙었다(벌점은 이미 반영되었으니 effects.벌점은 0). 선생님이나 규율부 학생의 가벼운 꾸중으로 짧게만 언급하라.') }
      }else c.absent++;
    }
  }
  G.dayStep=(G.dayStep||0)+1;
  if(G.dayStep>=blockLen()){ G.dayStep=0; advanceTime() }
  try{ maybeIncoming() }catch(e){ console.warn(e) }
  try{ apptSync() }catch(e){ console.warn(e) }

}

/* 시간대가 한 칸 흐름: 낮 → 방과 후 → 야간 → 새벽 → 다음 날 낮. 야간이 되었을 때 밖에 있으면 점호 누락 */
/* 일과 칸이 끝났음을 서술 뒤에 알림: '1교시 수업이 끝났습니다 → 쉬는 시간' */
function flushBell(){
  const p=G&&G._bell; if(!p) return; G._bell=null;
  if(G.loc!=='campus') return;
  const end=p==='조례'?'조례가 끝났습니다':p==='쉬는 시간'?'쉬는 시간이 끝났습니다':p==='점심시간'?'점심시간이 끝났습니다':p==='종례'?'종례가 끝났습니다':/교시$/.test(p)?`${p} 수업이 끝났습니다`:`${p}이 끝났습니다`;
  const nx=G.time==='낮'?slotLabel():G.time;
  addLog('sys',`🔔 ${end} → ${nx}`); toast(`🔔 ${end} → ${nx}`);
}
function blockLen(){ syncSchedule(); return G.time==='낮'?SCHOOL.length:MOVE_STEPS.quarter }
function slotIdx(){ syncSchedule(); return G.time==='낮'?Math.min(SCHOOL.length-1,G.dayStep||0):-1 }
function slotLabel(){ const i=slotIdx(); if(i<0) return G.time; const k=CLASS_SLOTS.indexOf(i); return `${SCHOOL[i]}${k>=0?` (${subjectAt(k).n})`:''}` }
function advanceTime(){
  const i=(Math.max(0,TIMES.indexOf(G.time))+1)%TIMES.length;
  G.time=TIMES[i]; if(i===0) G.day++;
  if(G.time==='야간'&&isWild()) addDemerit(1,'점호 누락');
  if(G.time==='야간'&&G.loc==='campus'){ G.phoneSeized=G.day; addLog('sys','📵 점호에서 휴대폰을 제출했습니다. 내일 아침까지 쓸 수 없습니다.') }

}

/* ---------- 4-9. 선택지 정리 (턴 끝·화면 그릴 때마다, 여러 번 해도 결과가 같음) ---------- */
function sanitizeChoices(){
  if(!G||!Array.isArray(G.choices)) return;
  let a=G.choices.slice();
  for(const h of HOOKS.choices){ try{ const r=h.fn(a); if(Array.isArray(r)) a=r }catch(e){ console.warn('[choices]',e) } }
  G.choices=a.slice(0,4);
}
/* 빠진 자리를 채울 선택지 (방이 다 조사됐으면 채우지 않음) */
function fillChoices(arr,fill,min=3){
  for(const f of fill){ if(arr.length>=min||roomExhausted()) break; if(!arr.includes(f)) arr.push(f) }
  return arr;
}
function roomExhausted(){ try{ if(!G||G.loc!=='site') return false; const r=curRoom(); return !!(r&&r.exhausted) }catch(_){ return false } }

/* ---------- 4-10. 입력: 직접 입력 · 선택지 · 고정 버튼 ----------
   원칙: 숫자·위치·시간이 바뀌는 행동은 게임 기능(INTENTS), "어떻게·왜·누구와"는 이야기(story)
   - 직접 입력이 게임 기능처럼 읽히면 확인 칩을 띄움 (confirm:true인 것)
   - 결과가 불확실한 행동이면 판정 칩
   - AI 선택지는 종류(type)대로 바로 연결, 종류 정보가 없으면 INTENTS로 해석 */

/* 다음 AI 턴에 넘길 지시·플래그 (story → aiTurn) */
let PENDING={note:'',flags:{}};
function pend(note,flags){ if(note) PENDING.note+=note; if(flags) Object.assign(PENDING.flags,flags) }
on('before',0,T=>{ T.extra+=PENDING.note; Object.assign(T.flags,PENDING.flags); PENDING={note:'',flags:{}} });

const IX={
  EXIT:/(구역\s*(밖|바깥)으로|구역을\s*(나간다|나선다|빠져나간다|빠져나온다|벗어난다)|입구\s*(밖|바깥)으로|(밖|바깥)으로\s*(나간다|나선다|나가|빠져나))/,
  HOMEWARD:/(중앙 캠퍼스 지구|캠퍼스|귀환|아지트|집으로)/,
  REENTER:/((구역|안)(으로|에)\s*(다시\s*)?(들어간|들어가|들어선|돌아간|돌아가))/,
  PEDDLER_BUY:/(행상|상인|푸드트럭|택배\s*기사).{0,12}(산다|사다|구입|구매|거래|흥정)|(산다|구입|구매).{0,8}(행상|상인|푸드트럭)/,
  DIST_VERB:/(으로|로|에|를|을)?\s*(간다|가기|가자|가기로|먹으러|향한|향해|들어간다|들어가|들어서|들른다|들러|도착|발걸음|걸음을\s*옮|이동|돌아간다|돌아가|나선다|자리를\s*옮|옮겨|옮긴|옮기|가서|가보|데려|이끌)/,
  DIST_KEYS:Object.entries(PLACES).map(([k,p])=>[k,p.re]),
  HOME:/((아지트|집|폐\s*동아리실|내\s*집)(으로|에|에서)?\s*(돌아|간다|가자|가기로|향한|향해|복귀|귀환|들어간|들어가)|아지트를?\s*찾아)/,
  CAMPUS:/((중앙 캠퍼스 지구|캠퍼스|상점가|정문|시내)(으로|에|를|을)?\s*(돌아|간다|가자|가기로|향한|향해|복귀|들어간|들어가|나간다))/,
  GO:/((구역|조사 외출|한빛시)(을|으로|에)?\s*(찾아|향해)?\s*(떠난다|떠나|출발|나선다|나서|간다)|조사 외출을?\s*(떠난|나선|시작))/,
  RET:/(중앙 캠퍼스 지구(로|에)\s*(돌아|귀환|복귀|향한|되돌)|캠퍼스로\s*(돌아|귀환)|귀환한다|귀환을\s*한다|구역을\s*(나간다|떠난다|빠져나간다|나선다)|철수한다|조사를\s*(접|중단|마친)|이만\s*(돌아|나가))/,
  USEV:/(사용|쓴다|쓰기로|꺼내|들이켠|마신다|마셔|먹는다|삼킨다|바른다|뜯는다)/,
  DROPV:/(버린다|버려|내려놓|던진다|던져|넘겨\s*준다|건넨다|바친다|두고\s*간다|맡긴다|놓아둔다)/,
  SLEEP:/(밤을\s*(보낸|보내|지새|새운|넘긴)|하룻밤|하루\s*밤|잠[을을]\s*(잔다|자고|청한|청해|자기로)|잠자리에\s*든|잠에\s*든|눈을\s*붙인|숙박|기숙사에서\s*(쉰|묵|잔)|묵는다|묵어\s*간|푹\s*쉰|밤새\s*쉰|아침까지\s*(쉰|기다|잔)|임시 쉼터를?\s*(한다|하기로|준비)|노숙|수면)/,
  SLEEP_NEG:/(않|못|말고|안\s*잔|안\s*쉰|아니)/,
  WAIT:/(하루|이틀|사흘|며칠|(\d+)\s*일)\s*(을|를|동안|간|만)?\s*(기다린|머무른|머문|머물|보낸|지낸|버틴|쉰다|묵는다|지새)/,
};
/* 여러 지점(PLACES) 중 한 곳으로 '간다'는 문장이면 그 지점 키, 아니면 null.
   장소 이름 바로 뒤에 이동 동사가 올 때만 (예: "상점가에서 급식실로 간다" → canteen). 직접 입력·AI 선택지·임시 장소 판정이 함께 씀 */
function districtMove(t){
  if(!G||G.loc!=='campus') return null;
  t=String(t||'');
  if(/(에서\s*(쉰|묵|잔|마신|듣|산다|거닌))/.test(t)) return null;
  // 글에서 가장 나중에 나온 장소가 목적지 ("교실에서 복도로 나간다" → 복도). 장소 이름 바로 뒤에 이동 동사가 올 때만
  let best=null, bi=-1;
  for(const [k,re] of IX.DIST_KEYS){
    const g=new RegExp('(?:'+re.source+')[가-힣\\s]{0,6}'+IX.DIST_VERB.source,'g'); let m;
    while((m=g.exec(t))){ if(m.index>=bi){ bi=m.index; best=k } if(m[0].length===0) g.lastIndex++ }
  }
  return fixHall(best,t);
}
/* ---------- 임시 장소: 여러 지점 밖의 곳(강당·옥상·골목 등)으로 가면 G.spot={name}만 기록하고 지점은 그대로 ----------
   G.spot이 있는 동안: 지점 전용 기능(소문·숙박·상점·조사 외출 출발·아지트 이동)은 막히고, 지점으로 돌아가는 버튼이 나옴.
   지점으로 이동(goDistrict)하거나 중앙 캠퍼스 지구를 떠나면 비워짐 */
const SPOT_STOP=/^(안|밖|안쪽|바깥|뒤|앞|옆|위|아래|저쪽|이쪽|그쪽|거기|여기|그곳|이곳|저곳|근처|주변)$/;
const SPOT_EXCL=/(복도|매점|교무실|계단|현관|교실|보건실|양호실|음악실|가사실|과학실|방송실|미술실|자습실|컴퓨터실|운동장|체육관|중앙 캠퍼스 지구|캠퍼스|아지트|집|저수지|공원|학원가|재개발|신시가|선착장|오러리|코덱스|천문대|온실|도서관|열람실|서고|라쿠나 구역|구역|한빛시|조사 외출|옥상|지하|동쪽|서쪽|남쪽|북쪽|장소|출구|입구)/;
function spotOn(){ return !!(G&&G.spot&&G.loc==='campus') }
function spotMove(t){
  if(!G||G.loc!=='campus') return null;
  t=String(t||'');
  if(RX.NEG.test(t)||districtMove(t)) return null;
  const m=t.match(/([가-힣]{2,8}?(?:\s[가-힣]{2,8}?)?)(?:으로|로)\s*(?:간다|가자|가기로|가려|향한다|향해|들어간다|들어서|들른다|들러|이동|걸어간다|걸어가|걸음을\s*옮|발걸음)/)
    ||t.match(/([가-힣]{2,8}?(?:\s[가-힣]{2,8}?)?)에\s*(?:들른다|들러|들어간다|들어서|도착)/);
  if(!m) return null;
  const n=m[1].replace(/^(천천히|조용히|서둘러|곧장|바로|다시|이제|먼저|잠시|일단|슬쩍|몰래)\s+/,'').trim();
  if(n.length<2||SPOT_STOP.test(n)||SPOT_EXCL.test(n)) return null;
  return n.slice(0,16);
}
function setSpot(name){
  if(!G||G.loc!=='campus'||!name) return;
  if(G.spot&&G.spot.name===name) return;
  G.spot={name:String(name).slice(0,16)}; G._yuminHere=false;
  addLog('sys',`📍 ${G.spot.name} (임시 장소) — 소문·숙박·상점 같은 지점 전용 기능은 지점으로 돌아가야 쓸 수 있습니다.`);
}
/* ---------- AI가 알려 준 장소('위치'·선택지 'to') 처리 ---------- */
/* '복도'만 말하면 지금 층의 복도, '2층 복도'처럼 층이 있으면 그 층의 복도 */
function fixHall(k,t){
  if(k!=='hall'&&k!=='hall2'&&k!=='hall3') return k;
  const m=String(t||'').match(/([123]|일|이|삼)\s*층\s*복도/);
  if(m) return {'1':'hall','일':'hall','2':'hall2','이':'hall2','3':'hall3','삼':'hall3'}[m[1]];
  if(k!=='hall') return k;
  return hallOf(floorOf(curDistrict()));
}
function destKey(n){
  n=String(n||'').trim(); if(!n) return null;
  const e=Object.entries(DISTRICTS).find(([k,d])=>d.n===n||(YUMIN_SPOTS[k]&&YUMIN_SPOTS[k].n===n)); if(e) return e[0];
  const h=IX.DIST_KEYS.find(([k,re])=>re.test(n)); return h?fixHall(h[0],n):null;
}
function validSpotName(n){ n=String(n||'').trim(); return n.length>=2&&n.length<=16&&!SPOT_STOP.test(n)&&!/(구역|라쿠나|한빛시|조사 외출|캠퍼스|아지트|선착장|공원|학원가|재개발)/.test(n) }
/* 수업 칸에 교실을 벗어나면 땡땡이: 그 칸이 흘러가고 확률로 적발(벌점) */
/* 소등 후(야간·새벽) 기숙사 밖으로 나가면 무단 이동: 그날 밤 처음 나갈 때 확률로 적발되어 기숙사로 돌려보내지고 벌점.
   들키지 않으면 그날 밤은 자유롭게 다닐 수 있음 */
const CURFEW_CATCH_P=0.4, CURFEW_CATCH_WARN=0.15, CURFEW_DEMERIT=2;
function curfewCatchP(){ return Math.min(0.85,CURFEW_CATCH_P+((G.demerit||0)>=DEMERIT_WARN?CURFEW_CATCH_WARN:0)) }
function curfewMove(k){
  if(!G||G.loc!=='campus'||!isDarkTime()||k==='dorm'||G.sneakDay===G.day) return k;
  const p=curfewCatchP();
  if(Math.random()<p){
    addDemerit(CURFEW_DEMERIT,'소등 후 무단 이동 적발');
    addLog('sys','🌙 소등 후 기숙사를 빠져나가다 사감 선생님(또는 규율부 학생)에게 들켜 기숙사로 돌려보내졌습니다.');
    pend(' [적발] 소등 후 몰래 나가다가 들켜 기숙사로 돌려보내졌고 벌점이 붙었다(벌점은 이미 반영되었으니 effects.벌점은 0). 사감 선생님의 꾸중으로 짧게 언급하라.');
    return 'dorm';
  }
  G.sneakDay=G.day;
  addLog('sys','🌙 소등 후 몰래 기숙사를 빠져나왔습니다. 오늘 밤은 들키지 않고 다닐 수 있습니다.');
  return k;
}
/* 소등 후(야간·새벽) 기숙사로 들어갈 때의 출입 판정: 생존술 2d6 + 출입 권한 등급 보너스 vs 무작위 난이도
   성공: 조용히 들어감 / 부분 성공: 들어가지만 늦은 귀가로 벌점 +1 / 실패: 문이 잠겨 못 들어가고 벌점 +1(시간이 한 칸 흐름) */
function dormEntry(){
  const dc=randDc();
  addLog('fx',`🎯 소등 후 기숙사 출입 판정 — ${DCN[dc]} 난이도입니다 (${DCV[dc]})`);
  const note=rollCheck('sur',dc,'소등 후 기숙사 출입');
  const res=rollCheck.last;

function pickChoice(i){
  if(busy||!G) return;
  const c=G.choices&&G.choices[i]; if(!c) return;
  const m=metaOf(c);
  if(m){
    if(m.type==='check') return doCheck(c,m.skill,m.dc,'choice');
    if(m.type==='story'&&calmFillIntent(c)) return story(c,{src:'choice'});
    if(m.type!=='story'&&runChoiceType(m.type,c)) return;
    if(m.type==='story'&&isHood()&&!RX.NEG.test(c)&&leadByText(c)){ addLog('action',c); return startLead(leadByText(c).id) }   // 소문의 장소로 가는 선택지
    if(m.type==='story'&&G.loc==='campus'&&m.to){   // AI가 준 목적지(to)가 있으면 글 해석 없이 그대로 이동
      const k=destKey(m.to);
      if(k){ if(k!==curDistrict()||spotOn()){ classLeaveEffect(k); goDistrict(k) } return story(c,{src:'choice'}) }
      if(validSpotName(m.to)){ classLeaveEffect(null); setSpot(m.to); return story(c,{src:'choice'}) }
    }
    if(m.type==='story'&&G.loc==='campus'&&!RX.NEG.test(c)){   // 선택지 글이 다른 곳으로 가는 것이면 실제 장소도 옮김
      const k=districtMove(c);
      if(k){ if(k!==curDistrict()||spotOn()){ classLeaveEffect(k); goDistrict(k) } }          // 여러 지점 중 한 곳 (임시 장소도 함께 해제)
      else{ const n=spotMove(c); if(n){ classLeaveEffect(null); setSpot(n) } }                   // 지점 밖 장소 → 임시 장소
    }
    return story(c,{src:'choice'});
  }
  act(c,{src:'choice'});
}

function act(text,opt={}){
  const t=String(text);
  if(calmFillIntent(t)) return story(t,opt);   // 휴게 공간에서 공포를 가라앉히는 글 → 실제로 가라앉힌 뒤 이야기로
  const it=RX.NEG.test(t)?null:INTENTS.find(x=>{ try{ return x.when(t) }catch(_){ return false } });
  if(it&&spotOn()&&['go','travel','sleep','home'].includes(it.id)){ spotBlock(); return }   // 임시 장소에서는 지점 전용 행동 불가
  if(it){
    if(opt.src==='free'&&it.confirm&&!opt.confirmed) return showSysChip(t,it);
    if(it.run(t)!==false) return;
  }
  if(opt.src==='free'&&!opt.confirmed){ const ck=checkIntent(t); if(ck) return showCheckChip(t,ck) }
  story(t,opt);
}
/* 이야기로 진행: 공포·배터리 판정 → 걸음 → 서술 AI */
function story(t,opt={}){
  if(busy||!G) return;
  const soft=(opt.src==='choice'||opt.src==='fixed')&&(G.loc==='site'||G.loc==='shelter');
  const j=judgeNeeds(t);
  if(j){ j.logs.forEach(l=>addLog('fx',l)); pend(j.note,j.flags) }
  if(G.loc!=='campus') tick(soft);
  else if(classActive()) pend(' '+classStep());   // 수업 중의 선택지·입력도 수업 행동으로 센다
  pend(opt.extra||'',{storyOnly:!!opt.storyOnly,checkHP:!!opt.checkHP,viaChoice:opt.src==='choice'});
  aiTurn(t,'',!opt.noActionLog);
}
/* AI 선택지의 종류 → 게임 기능 */
function runChoiceType(type,text){
  const L=G.loc, say=()=>addLog('action',text);
  if(type==='rest'){
    if(L==='campus'&&G.time==='낮') return false;   // 학교 일과 중의 졸기·쉬기는 하룻밤 휴식이 아니라 이야기 행동으로 처리
    say(); sleepHere(); return true;
  }
  if(type==='shelter'&&['road','site'].includes(L)){ say(); shelterHere(); return true }
  if(type==='return'&&inZone()){ say(); returnToCampus(); return true }
  if(type==='exit'&&L==='site'){ exitZone(); return true }
  if(type==='trade'){
    if(G.peddler&&G.peddler.here&&L===(G.peddler.loc||'road')){ openPeddler(); return true }
    if(L==='campus'||L==='hood'){ say(); openShop(); return true }
  }
  return false;
}

/* ---------- 판정: 2d6 + 능력치 + 특성 보너스 vs 난이도 ---------- */
const CHECK_RX=[
  ['str',/(기어오르|기어올라|올라탄|매달|밀어붙|밀친|들어올|부순|부숴|힘껏|억지로|뛰어넘|건너뛴|잡아당|비틀어|열어젖|버틴다|버텨|맞서 싸|공격한|베어|휘두른|제압)/],
  ['wis',/(해독|읽어\s*낸|풀어\s*본|수수께끼|암호|비문을|문자를\s*읽|기억해\s*낸|추리|장치를\s*분석|원리를|맞춰\s*본)/],
  ['cha',/(설득|흥정|속인|속여|거짓말|협박|달랜|구슬|위협|값을\s*깎|매혹|꼬드|부추)/],
  ['sur',/(함정을|추적|발자국|숨는다|숨어서|몰래|살금|피해\s*간|피한다|기척을|방향을\s*잡|길을\s*찾|해체|해제|응급|붕대|지혈|미끄러지지)/],
];
function checkIntent(t){
  for(const [k,re] of CHECK_RX) if(re.test(t)){ const r=G.loc==='site'?curRoom():null; return {skill:k,dc:r&&r.danger>=2?'hard':'normal'} }
  return null;
}
function checkBonus(skill,text){
  const parts=[]; let b=0; const t=String(text||'');
  const add=(v,why)=>{ b+=v; parts.push(`${why} ${v>0?'+':''}${v}`) };
  if(hasTrait('옛 서류 해독')&&skill==='wis'&&/(문자|비문|글씨|글자|해독|기록|두루마리|출석부|문양|명문)/.test(t)) add(2,'옛 서류 해독');
  if(/기숙사 출입/.test(t)&&(G.access||1)>1) add((G.access||1)-1,`출입 권한 ${G.access}등급`);
  if(hasTrait('말발')&&skill==='cha') add(2,'말발');
  if(hasTrait('싸움 경험')&&skill==='str'&&/(싸|공격|베|휘두|막아|맞서|찌르|때리|제압)/.test(t)) add(2,'싸움 경험');
  if(hasTrait('동물 친화')&&/(전동 스쿠터|자전거|동물|짐승|말을|가축)/.test(t)) add(2,'동물 친화');
  if(hasTrait('지독한 호기심')&&skill==='wis') add(1,'지독한 호기심');
  if(hasTrait('밤눈')&&skill==='sur'&&(isDarkTime()||(G.loc==='site'&&G.torch<=0))) add(1,'밤눈');
  if(G.loc==='site'&&G.torch<=0&&!hasTrait('밤눈')&&skill!=='cha') add(-2,'손전등 없음');
  if(G.hp<=Math.ceil(G.maxhp*0.3)) add(-1,'부상');
  try{ branchBonus(skill,t,add) }catch(e){}
  return {b,parts};
}
function checkChance(skill,dc,text){
  const need=DCV[dc]-(G.char.stats[skill]||0)-checkBonus(skill,text).b; let n=0;
  for(let a=1;a<=6;a++) for(let c=1;c<=6;c++) if(a+c>=need) n++;
  return Math.round(n/36*100);
}
function rollCheck(skill,dc,text){
  const d=()=>1+Math.floor(Math.random()*6);
  const st=G.char.stats[skill]||0, bo=checkBonus(skill,text), DC=DCV[dc];
  let a=d(), c=d(), tot=a+c+st+bo.b, rr='';
  if(tot<DC-2&&hasTrait('묘한 운')&&G._jinDay!==G.day){ G._jinDay=G.day; const a2=d(),c2=d(); rr=` → ✨ 묘한 운로 다시 굴림 ${a2}+${c2}`; a=a2; c=c2; tot=a+c+st+bo.b }
  const res=tot>=DC?'success':tot>=DC-2?'partial':'fail';
  try{ sfx('dice'); sfx(res,0.4) }catch(e){}
  try{ wardOnCheck(skill,res) }catch(e){}
  rollCheck.last=res;   // 결과에 따라 갈리는 기능(라쿠나 구역 출석부 등)이 읽음
  const label={success:'성공',partial:'부분 성공',fail:'실패'}[res];
  addLog('fx',`🎲 ${SK[skill]} 판정 (${DCN[dc]} ${DC}): ${a}+${c} + ${SK[skill]} ${st}${bo.parts.length?' · '+bo.parts.join(' · '):''}${rr} = ${tot} → ${label}`);
  let hp=0; const r=G.loc==='site'?curRoom():null, danger=G.fight?G.fight.danger:r?r.danger:(G.loc==='road'?1:0);
  if(skill!=='cha'&&(G.fight||!isHood())){ if(res==='fail') hp=-Math.max(1,danger); else if(res==='partial'&&danger>=2) hp=-1 }
  if(hp){ G.hp=Math.max(0,G.hp+hp); addLog('fx',`체력 ${hp}`) }
  const how={success:'플레이어의 의도대로 해낸다.',partial:'해내기는 하지만 대가나 새로운 문제가 함께 생긴다(시간 지체, 소음, 물건 손상, 상대의 의심 등 — 체력 외의 것으로).',fail:'의도대로 되지 않는다. 그 결과로 상황이 나빠진다.'}[res];
  return `\n[판정 결과 — 게임 코드가 이미 정함, 절대 뒤집지 말 것] ${SK[skill]} 판정 ${label}. ${how}${hp?` 이 결과로 플레이어가 입은 피해(체력 ${hp})는 코드가 이미 반영했다.`:''} effects의 체력은 0으로 둘 것. 판정이나 주사위라는 말은 서술에 쓰지 말 것.`;
}
/* 판정 난이도는 항상 무작위. 장면이 위험할수록 어려움이 잘 나옴 (위험도 0~3: 쉬움·보통·어려움 가중치)
   입력창에서 미리 굴려 보여 주므로(_pendDc) 능력치를 바꿔도 난이도는 그대로, 판정을 하면 새로 굴림 */
const DC_WEIGHTS=[[40,40,20],[33,34,33],[22,38,40],[12,33,55]];
function sceneDanger(){
  try{
    if(G.fight&&G.fight.danger!=null) return Math.max(0,Math.min(3,G.fight.danger));
    if(G.loc==='site'){ const r=curRoom(); if(r) return Math.max(0,Math.min(3,r.danger||0)) }
    if(G.loc==='road'||G.loc==='shelter') return 1;
  }catch(e){}
  return 0;
}
function randDc(){
  const w=DC_WEIGHTS[sceneDanger()], r=Math.random()*100;
  return r<w[0]?'easy':r<w[0]+w[1]?'normal':'hard';
}
let _pendDc=null;
function curDc(){ if(!_pendDc) _pendDc=randDc(); return _pendDc }
function doCheck(text,skill,dc,src){
  if(busy||!G) return;
  dc=(src==='free'&&_pendDc)?_pendDc:randDc(); _pendDc=null;
  addLog('fx',`🎯 이번 판정은 ${DCN[dc]} 난이도입니다 (${DCV[dc]})`);
  addLog('action',text);
  story(text,{src:src||'free',extra:rollCheck(skill,dc,text),checkHP:true,noActionLog:true});
}

/* =========================================================
   5. 공포·배터리 — 상태바, 서술 규칙 (내부 값 calm=진정 여력, battery=배터리)
   ========================================================= */
const NEED_RX={
  NEG:/(않|못|말고|아니|대신)/,
  DRINK:/(?!)/,   // 옛 '물 마시기'(재고를 미리 치르는 행동)는 공포 체계에서는 의미가 없어 끔 — 진정은 장소·구매·이야기 근거로만
  EAT:/(?!)/,     // 옛 '배터리 먹기'도 마찬가지(배터리는 충전으로 오를 뿐 미리 쓰지 않음)
  SOURCE:/(휴게\s?(공간|정자|실|소파)|티\s?코너|정수기|따뜻한\s?(차|음료)|자판기|식수대|저수지\s?둑길|분수)/,
  GAIN_W:/(휴게\s?(공간|정자|실|소파)|티\s?코너|정수기|자판기|따뜻한\s?(차|음료)|진정제|음료(수)?[을를이가]?\s*.{0,10}(발견|찾|얻|줍|건네|받|챙|사|마))/,
  GAIN_F:/((보조배터리|배터리|충전기|충전\s?케이블|멀티탭|콘센트)[을를이가]?\s*.{0,10}(발견|찾|얻|줍|건네|받|챙|꽂|연결)|충전(했|한다|하며|을\s*하))/,
};
/* (옛 마시기·먹기 판정 — 지금은 DRINK·EAT가 끔이라 실행되지 않음) */
function judgeNeeds(t){
  return null;   // 공포·배터리 체계에서는 '미리 마시고 먹는' 판정이 없음 (NEED_RX.DRINK·EAT가 꺼져 있음)
}
function needState(){
  const w=G.calm, f=G.battery;
  const iv=fearInterval(), toW=iv-(G.steps%iv), toF=MOVE_STEPS.battery-(G.steps%MOVE_STEPS.battery);
  if(isHood()) return {w,f,wl:'지구·아지트에서는 공포가 쌓이지 않음',fl:'지구·아지트에서는 닳지 않음',wWarn:false,fWarn:false};
  return {w,f,
    wl:w>=2?'공포 여유 있음':(w===1?`공포가 곧 한계 (약 ${toW}걸음)`:'공포 한계 — 체력 감소 중'),
    fl:f>=2?'배터리 여유 있음':(f===1?`배터리가 곧 방전 (약 ${toF}걸음)`:'방전 — 체력 감소 중'),
    wWarn:w<=1,fWarn:f<=1};
}
on('facts',10,(o,rules)=>{
  const n=needState();
  o.상태.공포상태=`${n.wl} (공포 ${fearNow()}/${fearMax()})`;
  o.상태.배터리상태=`${n.fl} (배터리 ${batteryPct()}%)`;
  rules.push(`공포는 이동하며 자동으로 쌓이고 배터리는 자동으로 닳는다. 공포 여유(한계−현재)가 2 이상이면 심한 공포 증상(떨림·식은땀·호흡 곤란)을 쓰지 말 것(여유가 1이면 '한계에 가까워진다'까지). 공포가 한계에 닿았을 때만 공황 증상을 묘사한다. 배터리도 같다: 0일 때만 방전·연락 두절을 묘사한다.`);
  rules.push(`휴대 용량은 공포 한계 ${capW()}, 보조배터리 팩 ${capF()}, 건전지 ${capT()}이다. 용량을 넘겨 얻는 서술은 하지 말고, '가득 채운다'는 용량까지만 채우는 것이다(effects 수치도 용량 이내).`);
  if(isHood()) rules.push('중앙 캠퍼스 지구·다른 지구·아지트에서는 공포가 쌓이지 않고 배터리도 닳지 않는다(충전기와 사람이 가까이 있다).');
  if((G.demerit||0)>=DEMERIT_WARN) rules.push(`[벌점 ${G.demerit}점 — 외출 금지 경고] 담임과 규율부가 플레이어를 주시한다. 외출·무단 이탈은 더 크게 적발되고 감시가 따라붙는 서술로 반영하라(조사 자체를 막지는 말 것).`);
  rules.push(`[출입 권한 ${G.access||1}등급] 이보다 높은 등급이 필요한 문·구역은 열리지 않는다(서술로 처리하고, 올릴 방법을 단서로 흘릴 것).`);
});
/* 공포가 한계에 가까우면 진정할 곳을 찾는 선택지를 하나 넣어 둠 */

/* =========================================================
   6. 효과 거르기 — AI가 제안한 수치를 코드가 판정 (순서가 곧 우선순위)
   ========================================================= */
/* 10: 판정·이야기로만·사건이 있는 턴 */
on('effects',10,(e,{T})=>{
  const f=T.flags||{};
  if(f.checkHP) e.hp=0;
  if(f.storyOnly){ ['hp','calm','battery','torch','cash'].forEach(k=>e[k]=0); e.items_add=[]; e.items_remove=[]; e.fragment=false; e.materials={} }
  const ev=T.res&&T.res.event;
  if(ev&&ev.type==='calm_source'&&+e.calm>0) e.calm=0;
  if(ev&&ev.type==='merchant'){ ['calm','battery','torch'].forEach(k=>{ if(+e[k]>0) e[k]=0 }); if(+e.cash<0) e.cash=0 }
});
/* 20: 한빛시에서 근거 없는 회복·보급 차단, 구역 한 곳 캐시 상한 90 */
on('effects',20,(e,{T})=>{
  if(!isWild()) return;
  const narr=lastScene(), blocked=[];
  const buying=+e.cash<0||isBuyText(lastAction());
  if(+e.calm>0&&!T.flags.srcOK&&!buying&&!NEED_RX.GAIN_W.test(narr)){ e.calm=0; blocked.push('공포 진정') }
  if(+e.battery>0&&!buying&&!NEED_RX.GAIN_F.test(narr)){ e.battery=0; blocked.push('배터리') }
  const usedItem=Array.isArray(e.items_remove)&&e.items_remove.length>0;
  if(+e.hp>0&&!usedItem){ e.hp=0; blocked.push('체력') }

/* =========================================================
   7. 휴대 용량
   ========================================================= */
function capLv(){ if(!G.cap) G.cap={w:0,f:0,t:0}; if(G.cap.t==null) G.cap.t=0; return G.cap }
function rideCap(){
  try{
    const m=G.ride&&RIDES[G.ride.type]; if(!m||G._rideFed===false) return 0;
    const i=petStage(G.ride.aff||0);
    return (m.capBonus||0)+(i>=3?2:i>=2?1:0);
  }catch(_){ return 0 }
}
function capW(){ return CAP_BASE+CAP_STEP*capLv().w+rideCap() }
function capF(){ return CAP_BASE+CAP_STEP*capLv().f+rideCap()+(petPerk('cat')?1:0) }
function capT(){ return CAP_BASE+CAP_STEP*capLv().t }
function capOf(k){ return k==='calm'?capW():k==='battery'?capF():capT() }
function clampSupplies(before,silent){
  const lost=[];
  ['calm','battery','torch'].forEach(k=>{
    const mx=Math.max(capOf(k),(before&&before[k])||0);
    if(G[k]>mx){ lost.push(`${NM[k]} ${G[k]-mx}`); G[k]=mx }
  });
  if(lost.length&&!silent) addLog('fx',`📦 용량 초과 — ${lost.join(', ')} 사라졌습니다 (상점가에서 용량을 늘릴 수 있습니다)`);
  return lost.length>0;
}

const CONS_RE={calm:/따뜻한\s?차|캔\s?커피|진정\s?음료|진정제|핫팩|음료수?/,battery:/보조\s?배터리|배터리|충전기|충전\s?케이블/,torch:/손전등|건전지/};
const CONS_USE_RE=/바꾸|바꿔|바꾼|변환|마신|마시|마셔|채운|채우|채워|연결|꽂|사용|쓴다|쓰고|먹는|먹어|먹고|꺼내|소비|보충|충전/;
/* 간식: 먹으면 다음 공포 누적 n회를 건너뜀(_wCredit) — 구역·뒷길 같은 밖에서 공포가 오르는 걸 늦춤 */
const SNACKS={'초코바':2,'캐러멜 사탕':1,'에너지 젤리':3};
const snackIdx=t=>{ t=String(t); return G.items.findIndex(it=>SNACKS[it]&&(t.includes(it)||t.includes(it.replace(/\s/g,'')))) };
function eatSnack(i){
  if(busy) return; const it=G.items[i]; if(!SNACKS[it]) return;
  G.items.splice(i,1); G._wCredit=(G._wCredit||0)+SNACKS[it];
  addLog('fx',`🍫 ${it}을(를) 먹었습니다 → 공포 누적 ${SNACKS[it]}회 늦춤 (남은 ${G._wCredit}회)`);
  save(); render(); if(document.querySelector('#modalRoot .modal')) openInv();
}
function consKind(name){ const s=String(name||''); for(const k in CONS_RE) if(CONS_RE[k].test(s)) return k; return null }
function consCount(name){
  const s=String(name||''), m=s.match(/(\d+)\s*(개|통|부대|자루|병)?/);
  if(m&&+m[1]>0&&+m[1]<20) return +m[1];
  if(/(두|둘)\s*(개|통|부대|자루|병)?/.test(s)) return 2;
  if(/(세|셋)\s*(개|통|부대|자루|병)/.test(s)) return 3;
  return 1;
}

function getQ(k){ return k.startsWith('i_')?G.items.filter(x=>x===k.slice(2)).length:k.startsWith('m_')?G.mat[k.slice(2)]:G[k] }
function buy(k,p){
  try{ if(G.cash>=p) sfx('coin') }catch(e){}
  if(['calm','battery','torch'].includes(k)&&G[k]>=capOf(k)) return toast(`${CAP_NAME[k==='calm'?'w':k==='battery'?'f':'t']}이(가) 가득 찼습니다 (${capOf(k)}/${capOf(k)})`);
  if(G.cash<p) return toast('캐시가 부족합니다');
  G.cash-=p;
  if(k.startsWith('i_')) G.items.push(k.slice(2)); else if(k.startsWith('m_')) G.mat[k.slice(2)]++; else G[k]++;
  save(); render(); openShop();
}
function fillSupply(k){
  const cap=capOf(k), need=cap-G[k];
  if(need<=0) return toast('이미 가득 찼습니다');
  const price=need*priceHere(k);
  if(G.cash<price) return toast('캐시가 부족합니다');
  G.cash-=price; G[k]=cap;
  addLog('fx',k==='calm'?`🫧 진정 음료로 공포를 ${need} 가라앉혔습니다 (캐시 -${price})`:`${CAP_NAME[k==='battery'?'f':'t']}을(를) 가득 채웠습니다 (+${need}, 캐시 -${price})`);
  save(); render(); openShop();
}
function buyCap(t){
  const c=capLv(), lv=c[t], tbl=CAP_PRICE[t];
  if(lv>=tbl.length) return;
  const price=tbl[lv];
  if(G.cash<price) return toast('캐시가 부족합니다');
  G.cash-=price; c[t]=lv+1;
  addLog('fx',`${CAP_ICON[t]} ${CAP_NAME[t]} 확장 — 용량 ${capOf(CAP_KEY[t])} (캐시 -${price})`);
  save(); render(); openShop();
}
function openShop(){
  if(spotBlock()) return;
  const goods=SHOP_GOODS.map(([n,k,p])=>[n,k,['calm','battery','torch'].includes(k)?priceHere(k):p]).map(([n,k,p])=>`<div class="shop-row"><span>${n} <span class="muted">(보유 ${getQ(k)})</span></span><button class="small" onclick="buy('${k}',${p})">캐시 ${p}</button></div>`).join('');
  const capRow=t=>{
    const key=CAP_KEY[t], cap=capOf(key), lv=capLv()[t], tbl=CAP_PRICE[t], max=lv>=tbl.length, price=tbl[lv];
    const fill=cap-G[key], fp=fill*priceHere(key);
