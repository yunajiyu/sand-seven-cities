/* 유적 도착: 중단했던 유적이면 이어서, 아니면 새로 생성 */
async function arriveDungeon(){
  const i=G._resumeRuin; G._resumeRuin=null;
  if(i!=null&&G.pausedRuins&&G.pausedRuins[i]){
    const d=G.pausedRuins.splice(i,1)[0];
    const cur=d.rooms.find(r=>r.id===d.cur)||d.rooms.find(r=>(r.lv||0)===0)||d.rooms[0];
    d.cur=cur.id; d.depth=cur.lv||0; d.memoLeft=3;
    G.dungeon=d; G.nextPos=null; G.loc='dungeon'; busy=false;
    const vis=d.rooms.filter(r=>r.visited).length;
    const intro=`다시 「${d.name}」에 도착했다. 횃불을 고쳐 쥐고, 지난번 멈췄던 「${cur.name}」까지 익숙한 길을 따라 되짚어 들어간다. 지금까지 둘러본 구역은 ${vis}곳, 아직 어둠 속에 남은 곳이 있다.`;
    addLog('scene',intro); G.recent.push({role:'scene',text:intro});
    G.choices=['지난번 멈춘 자리에서 주변을 다시 살펴본다','남은 단서가 없는지 떠올려 본다']; G.choiceMeta={};
    G.chronicle.push({day:G.day,text:`「${d.name}」으로 돌아와 탐사를 이어 갔다`});
    save(); render(); return;
  }
  busy=true; render();
  const intro=await genDungeon();
  G.loc='dungeon'; busy=false;
  if(intro){
    addLog('scene',intro); G.recent.push({role:'scene',text:intro});
    G.choices=['입구를 자세히 살펴본다','조심스럽게 안으로 들어간다','주변 모래를 파 본다']; G.choiceMeta={};
    save(); render();
  }else await aiTurn(`유적 「${G.dungeon.name}」의 입구에 도착한다`,'',false);
}

/* 유적 생성: 구조(방) + 사연(고대사 시대) + 별지도 조각 배치 */
/* AI가 준 방 목록 정리: id 보정, 양방향 연결, 고립된 방 잇기, 입구에서의 깊이(lv) 계산 */
function normRooms(list,max){
  const rooms=list.slice(0,max).map((r,i)=>({id:String(r.id||('r'+(i+1))),name:r.name||('방 '+(i+1)),desc:r.desc||'',floor:r.floor?String(r.floor).slice(0,12):undefined,exits:Array.isArray(r.exits)?r.exits.map(String):[],danger:clamp(+r.danger||0,0,3),visited:false}));
  const ids=new Set(rooms.map(r=>r.id));
  rooms.forEach(r=>{ r.exits=r.exits.filter(x=>ids.has(x)&&x!==r.id) });
  rooms.forEach(r=>r.exits.forEach(x=>{ const o=rooms.find(y=>y.id===x); if(!o.exits.includes(r.id)) o.exits.push(r.id) }));
  const start=rooms[0], seen=new Set([start.id]), q=[start]; start.lv=0;
  while(q.length){ const c=q.shift(); c.exits.forEach(x=>{ if(!seen.has(x)){ seen.add(x); const o=rooms.find(y=>y.id===x); o.lv=c.lv+1; q.push(o) } }) }
  rooms.forEach((r,i)=>{ if(!seen.has(r.id)){ const p=rooms[i-1]||start; r.exits.push(p.id); p.exits.push(r.id); r.lv=(p.lv||0)+1; seen.add(r.id) } });
  return rooms;
}
let rivalRaceSetupPending=false;
async function genDungeon(){
  try{ await ensureAncient() }catch(e){ console.warn(e) }
  const era=(G.ancient&&G.ancient.length)?pickEra():null;
  // 별지도 조각 유무는 AI에게 묻기 전에 코드가 정하고, 그대로 알려 준다
  const want=G.nextRuinFrag; G.nextRuinFrag=null;   // 별지도 연구 단서로 이미 정해졌으면 그대로
  const miss=G.ruinsNoFrag||0;
  const hasFrag=G.fragments>=FRAG_GOAL?false:want!=null?want:(miss>=FRAG_MAX_MISS||Math.random()>=FRAG_SKIP);
  G.ruinsNoFrag=hasFrag?0:miss+1;
  G.expeditions=(G.expeditions||0)+1;
  const rich=!!(G.base&&TOWNS[G.base]&&TOWNS[G.base].richRuins);
  let prompt=`${baseName()} 근처 사막에 있는 작은 고대 유적 하나를 새로 만들어라.${rich?' 옛 왕도 자르한 근처라 함정과 수호자가 많고 위험하지만, 값진 유물이 남아 있다.':''} 이것은 플레이어의 ${G.expeditions}번째 원정이다(끝까지 탐사한 유적은 ${G.dungeonsDone}곳).
${hasFrag?'이 유적의 깊은 곳에 이람으로 가는 별지도 조각이 하나 있다(정확한 방은 코드가 정함). 깊은 방의 메모에 푸른 안료의 별자리 같은 흔적을 남겨도 좋다.':'이 유적에는 별지도 조각이 없다. 방 메모(desc)와 intro에 별지도 조각이나 그 흔적을 쓰지 말고, 이 유적만의 보물과 사연에 집중하라.'}
지금까지의 사전 항목 일부: ${G.lexicon.slice(-8).map(e=>e.name).join(', ')}
요구:
- 이름과 주제(예: 진이 봉인된 우물 신전, 사라진 대상의 지하 창고, 별을 섬기던 천문 탑 등)는 이전과 겹치지 않게 독창적으로.
- 방 5~7개. 첫 방 id는 "r1"(입구). 각 방은 1~3개 방과 연결. 깊을수록 위험도 높게.
- desc는 AI 서술용 비밀 메모(함정, 수수께끼, 생물, 유물, 사연 등) 1~2문장.
JSON만 출력:
{"name":"유적 이름","theme":"주제 한 줄","intro":"유적에 도착했을 때 서술 2문단, 2인칭","rooms":[{"id":"r1","name":"방 이름","desc":"비밀 메모","exits":["r2"],"danger":0}]}`;
  if(era) prompt+=loreRequest(era,hasFrag);
  const lead=G._leadRuin&&(G.leads||[]).find(x=>x.id===G._leadRuin); G._leadRuin=null;
  if(lead) prompt+=`\n[소문으로 알게 된 장소] 이 유적의 이름은 반드시 「${lead.name}」이다(위의 '이름은 겹치지 않게' 요구는 무시). 플레이어가 소문·단서로 들은 정보: ${lead.hint||'(자세한 정보 없음)'}. 이 이름과 소문에 어울리는 구조·분위기·사연으로 만들어라.`;
  let d=null;
  try{ d=parseJSON(await callAI(SYS_BASE,prompt,era?2700:1800,'dungeon')) }catch(e){ if(e.message!=='NO_KEY') addLog('sys','AI 연결 실패: '+e.message) }
  const raw=d;
  if(!d||!Array.isArray(d.rooms)||d.rooms.length<3) d=fallbackDungeon();
  if(lead){ d.name=lead.name; G.leads=G.leads.filter(x=>x.id!==lead.id); G.chronicle.push({day:G.day,text:`소문으로 들은 「${lead.name}」에 도착했다`}) }
  const rooms=normRooms(d.rooms,8), start=rooms[0];
  // 별지도 조각: 위에서 정한 대로, 있으면 가장 깊은 방 두 곳 중 하나에
  if(hasFrag){ const deepest=[...rooms].sort((a,b)=>(b.lv||0)-(a.lv||0)||b.danger-a.danger); (deepest[Math.floor(Math.random()*Math.min(2,deepest.length-1))]||deepest[0]).fragment=true }
  if(rich) rooms.forEach(r=>{ if(r.lv>0) r.danger=Math.min(3,r.danger+1) });
  rivalRaceSetupPending=true;
  G.dungeon={rich,name:d.name||'이름 모를 유적',theme:d.theme||'모래에 반쯤 묻힌 고대 건물',rooms,cur:start.id,depth:0,pos:G.nextPos||pickPos()};
  G.nextPos=null;
  start.visited=true;
  addLex({name:G.dungeon.name,cat:'장소',desc:G.dungeon.theme},true);
  if(era) attachLore(era,raw,hasFrag);
  if(rivalRaceSetupPending){ rivalRaceSetupPending=false; rivalRaceSetup(G.dungeon) }
  return d.intro;
}
function fallbackDungeon(){
  const names=['무너진 입구','기둥의 회랑','모래에 잠긴 방','벽화의 방','봉인된 문','깊은 우물','왕의 그림자 방'];
  const rooms=[], n=5+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++) rooms.push({id:'r'+(i+1),name:names[i],desc:'',exits:i>0?['r'+i]:[],danger:Math.min(3,Math.floor(i/2))});
  return {name:rand(['바람의 신전','붉은 모래 창고','별지기의 탑','잊힌 대상의 무덤']),theme:'모래에 반쯤 묻힌 고대 건물',intro:null,rooms};
}

/* 지도 위치 */
function onLand(x,y){
  try{
    if(!onLand.p){ onLand.p=new Path2D(COAST_D); onLand.c=document.createElement('canvas').getContext('2d') }
    return [[0,0],[12,0],[-12,0],[0,12],[0,-12]].every(([dx,dy])=>onLand.c.isPointInPath(onLand.p,x+dx,y+dy));
  }catch(e){ return true }
}
function pickPos(){
  if(G&&G._resumeRuin!=null&&G.pausedRuins&&G.pausedRuins[G._resumeRuin]) return G.pausedRuins[G._resumeRuin].pos;
  const C=basePos();
  const fixed=[KASR,HOME_POS,IRAM_POS,townPos('westport'),townPos('eastport'),...MAP_PLACES,...UNKNOWN_SPOTS,...MOUNTAINS.map(([x,y])=>({x,y})),...(G.mapDone||[]),...(G.leads||[]).map(l=>l.pos)];
  let fallback=null;
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2, r=34+Math.random()*34;   // 대부분 1~2일 거리
    const x=Math.round(C.x+Math.cos(a)*r*1.25), y=Math.round(C.y+Math.sin(a)*r*0.85);
    if(x<24||x>376||y<24||y>244||!onLand(x,y)) continue;
    if(fixed.every(f=>Math.hypot(f.x-x,f.y-y)>26)) return {x,y};
    fallback=fallback||{x,y};
  }
  return fallback||{x:C.x+(C.x>300?-70:70),y:C.y+(C.y>150?-30:30)};
}
function dunPos(){ if(!G.dungeon.pos) G.dungeon.pos=pickPos(); return G.dungeon.pos }
function outsideRuin(){ return !!G&&G.loc==='road'&&!!G.dungeon }
function playerPos(){
  if(G.loc==='home') return HOME_POS;
  if(outsideRuin()){ const p=dunPos(); return {x:p.x+11,y:p.y+9} }
  if(G.loc==='road'&&G.trip){ const a=G.trip.fromPos||KASR, b=G.trip.dest.pos; return {x:(a.x+b.x)/2,y:(a.y+b.y)/2} }
  if(G.loc==='town') return townPos(G.town);
  if(G.loc==='road'){ const b=basePos(), t=G.nextPos||{x:b.x+60,y:b.y-40}; return {x:(b.x+t.x)/2,y:(b.y+t.y)/2} }
  if((G.loc==='dungeon'||G.loc==='camp')&&G.dungeon) return dunPos();
  return KASR;
}

   14. 유적 안 — 이동 · 야영 · 나가기 · 귀환
   ========================================================= */
/* 횃불 0 · 밤눈 특성이 없으면 '어둠' — 이동 2걸음 · 넘어질 위험 · 단서·조각 못 찾음 · 판정 -2 */
const DARK_STUMBLE=0.35;
const CAMP_BLOCK_DANGER=4;   // 방 위험도가 이 값 이상이면 야영 불가 (위험도 최대 3이므로 4면 어디서든 야영 가능)
function inDark(){ return !!G&&G.loc==='dungeon'&&G.torch<=0&&!hasTrait('밤눈') }
function moveTo(id){
  if(busy) return;
  const d=G.dungeon; let r=d&&d.rooms.find(x=>x.id===id); if(!r) return;
  const gate=cityMoveGate(d,r); if(gate.stop) return;   // 석판의 도시: 물때·등반·신기루·소음
  if(gate.id&&gate.id!==r.id){ r=d.rooms.find(x=>x.id===gate.id)||r; id=r.id }
  const first=!r.visited;
  r.visited=true; d.cur=id; d.depth=r.lv||0; G._yuminHere=false;
  G._mv=(G._mv||0)+1; if(G._mv%(d.terrain==='underground'?3:MOVE_STEPS.torch)===0&&G.torch>0) G.torch--;   // 지하 도시는 횃불이 빨리 닳음
  tick();
  if(inDark()){   // 횃불 없이: 더듬어 가느라 걸음이 두 배, 넘어질 위험
    tick();
    let note='[어둠 속 이동] 횃불 없이 벽을 더듬어 이동했다.';
    if(Math.random()<DARK_STUMBLE){ G.hp=Math.max(0,G.hp-1); addLog('fx','🌑 어둠 속에서 발을 헛디뎠습니다 (체력 -1)'); note+=' 도중에 발을 헛디뎌 다쳤다(체력 -1은 코드가 반영함, effects.hp는 0).'; pend(note,{checkHP:true}) }
    else pend(note);
    addLog('sys','🌑 횃불이 없어 더듬어 이동합니다 (2걸음)');
  }
  let ev='';
  if(first&&yuminEventReady()&&Math.random()<0.2) ev=' '+yuminEventText(`유적 「${d.name}」의 ${r.name}`);
  aiTurn(`「${r.name}」(으)로 이동한다`,(first?'[처음 들어서는 방이다. 방의 모습과 첫인상, 눈에 띄는 것을 묘사하라.]':'[이미 와 본 방이다. 짧게 묘사하라.]')+ev);
}
function campHere(){
  if(busy) return;
  const where=G.loc==='dungeon'?curRoom():null;
  if(where&&where.danger>=CAMP_BLOCK_DANGER) return toast('이곳은 너무 위험해서 야영할 수 없습니다');
  sfx('camp');
  const from=G.loc;
  const fed=G.water>0&&G.food>0;
  if(G.water>0) G.water--; if(G.food>0) G.food--;
  const heal=fed?Math.ceil(G.maxhp*0.4):1;
  G.hp=clamp(G.hp+heal,0,G.maxhp);
  G.time='밤'; G.dayStep=0; G.loc='camp'; if(from!=='camp') G._campFrom=from;
  cityCampReset();
  addLog('sys',`야영을 합니다. 물 -1, 식량 -1, 체력 +${heal}${fed?'':' (물이나 식량이 부족해 거의 회복하지 못했습니다)'}`);
  let ex='[야영 장면] 밤의 사막이나 유적 속 야영지. 모닥불, 별, 소리, 생각. 30% 확률로 작은 사건(방문자, 이상한 소리, 꿈, 진의 속삭임)이 생긴다. 사건이 있으면 선택지로 대응하게 하라. 체력 effects는 0으로 두라(회복은 코드가 처리함).';
  if(G.comp&&G.comp.joined){ changeAff(3,null); ex+=' [유민과의 야영] 모닥불 곁에서 유민과 나누는 대화가 장면의 중심이다. 호감도 단계에 맞게: 낮으면 농담과 가벼운 노래, 중간이면 플레이어의 몸 상태를 챙기며 진심 한 조각, 높으면 플레이어의 여정을 담은 노래와 유민 자신의 숨겨온 이야기. 선택지에 유민에게 하는 말을 포함하라.'+relArmText('유민',0.7)+(G.relEvt?'':yuminArcArm(0.7)) }
  else if(yuminEventReady()&&Math.random()<0.35) ex+=' '+yuminEventText('모닥불 불빛을 보고 찾아온 야영지');
  aiTurn('불을 피우고 야영을 한다',ex,false);
}
/* 아침: 야영을 시작한 곳(유적 안 / 사막 길 / 유적 입구 밖)으로 돌아감 */
function breakCamp(){
  const from=G._campFrom; G._campFrom=null;
  G.time='낮'; G.dayStep=0; G.day++;
  if(from==='road'){ G.loc='road'; if(!G.dungeon) addLog('sys',G.trip?`🐪 다시 ${G.trip.dest.name}${josa(G.trip.dest.name,'으로','로')} 향하는 사막 길에 오릅니다.`:'🐪 다시 유적을 향한 사막 길에 오릅니다.') }
  else G.loc=G.dungeon?'dungeon':'city';
  addLog('sys',`날이 밝았습니다. (${G.day}일째)`);
  if(G.loc==='road') rollCaravan('morning');
  G.choices=[]; save(); render();
}
function exitRuin(){
  if(busy||!G||G.loc!=='dungeon'||!G.dungeon) return;
  const d=G.dungeon, steps=Math.min(3,Math.max(1,d.depth||0));
  for(let i=0;i<steps;i++) tick();
  d.exitSteps=steps;
  G.loc='road'; G.choices=[]; if(!(G.comp&&G.comp.joined)) G._yuminHere=false;
  addLog('action','유적 밖으로 나간다');
  addLog('sys',`🚪 「${d.name}」 입구 밖으로 나왔습니다 (${steps}걸음). 유적은 그대로 남아 있어 다시 들어갈 수 있습니다.`);
  G.recent.push({role:'scene',text:`플레이어는 「${d.name}」의 입구 밖 사막으로 나와 있다.`});
  rollCaravan('exit');
  save(); render();
}
function reenterRuin(){
  if(busy||!outsideRuin()) return;
  const d=G.dungeon, steps=d.exitSteps||1;
  for(let i=0;i<steps;i++) tick();
  G.loc='dungeon'; G.choices=[]; if(G.caravan) G.caravan.here=false;
  const r=curRoom();
  addLog('action','유적 안으로 다시 들어간다');
  addLog('sys',`🏛 다시 「${d.name}」 안으로 들어가 「${r?r.name:'입구'}」까지 돌아왔습니다 (${steps}걸음).`);
  G.recent.push({role:'scene',text:`플레이어는 다시 「${d.name}」 안 「${r?r.name:'입구'}」에 있다.`});
  save(); render();
}
function dungeonProg(){
  const d=G.dungeon; if(!d||!Array.isArray(d.rooms)) return null;
  const total=d.rooms.length, vis=d.rooms.filter(r=>r.visited).length;
  const seen=new Set(d.rooms.filter(r=>r.visited).map(r=>r.id));
  d.rooms.forEach(r=>{ if(r.visited) r.exits.forEach(x=>seen.add(x)) });
  const found=[...seen].filter(id=>{ const r=d.rooms.find(x=>x.id===id); return r&&!r.visited }).length;
  return {total,vis,found,hidden:total-vis-found,done:vis>=total};
}
/* 귀환 (떠나온 마을 · 카스르 · 섬은 나루). skipConfirm: 다른 기능(거점 이동 등)이 이미 확인을 받은 경우 */
async function returnToCity(skipConfirm){
  if(busy) return;
  const d=G.dungeon, p=d?dungeonProg():null, rt=returnRoute();
  const cost=`${needText(travelNeedFed(rt.days))}${rt.sea?' · 배편(왕복 삯에 포함)':''}`;
  const msg=!p?`${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost})`:p.done?`모든 구역을 탐사했습니다. ${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost}) 완료한 유적은 다시 올 수 없습니다.`:`아직 ${p.total-p.vis}개 구역이 미탐험입니다 (탐사도 ${p.vis}/${p.total}). 돌아가도 나중에 원정으로 다시 와서 이어 탐사할 수 있습니다. ${rt.name}${josa(rt.name,'으로','로')} 돌아갈까요? (${cost})`;
  if(skipConfirm!==true&&!(await askConfirm(msg))) return;
  closeModal();
  if(d){
    const done=d.rooms.every(r=>r.visited), vis=d.rooms.filter(r=>r.visited).length;
    const st=Math.max(0,Math.ceil(vis/2)-(d.stoneGot||0)); d.stoneGot=(d.stoneGot||0)+st;   // 이어 탐사한 유적은 새로 본 방만큼만
    archiveDungeon();
    if(done&&!d.big) G.dungeonsDone++;
    G.chronicle.push({day:G.day,text:`「${d.name}」 탐사를 ${done?'마치고':'잠시 중단하고'} ${rt.name}${josa(rt.name,'으로','로')} 발길을 돌렸다`});
    addLog('action',`「${d.name}」을(를) 떠나 ${rt.name}${josa(rt.name,'으로','로')} 돌아간다`);
    const wd=st&&Math.random()<0.5?1:0;
    G.mat.stone+=st; G.mat.wood+=wd;
    if(st||wd) addLog('fx',`유적에서 쓸 만한 자재를 챙겼습니다: 🪨돌 +${st}${wd?' · 🪵목재 +1':''}`);
  }else addLog('action',`발길을 돌려 ${rt.name}${josa(rt.name,'으로','로')} 돌아간다`);
  return beginTrip({kind:rt.town?'town':'kasr',key:rt.town||'kasr',name:rt.name,pos:rt.pos,sea:rt.sea,ret:true},rt.days,
    {fromPos:rt.from,fromName:d?d.name:'사막 길',keepFed:true,action:false});
}
/* 유적에서 돌아가는 길: 떠나온 마을(없으면 카스르)까지 지도 거리. 섬의 도시는 배로 그 나루까지 */
function returnRoute(){
  const d=G.dungeon, from=d?dunPos():playerPos();
  const isl=d&&d.big&&d.terrain==='island'&&((G.cities||[]).find(c=>c.id===d.key)||{}).port;
  const town=isl||(G.base&&TOWNS[G.base]?G.base:null);
  const pos=town?townPos(town):KASR;
  return {town,name:town?TOWNS[town].n:'카스르',pos,from,sea:!!isl,days:travelDays(from,pos)};
}

/* 유적 정리: 다 못 본 유적은 '중단한 유적'(최대 3곳)으로, 다 본 유적은 지도에 ✕ + 사전 정리 + 사연 기록 */
function archiveDungeon(){
  const d=G.dungeon; if(!d) return;
  if(d.big){ G.bigRuins=G.bigRuins||{}; if(d.done) delete G.bigRuins[d.key]; else G.bigRuins[d.key]=JSON.parse(JSON.stringify(d)); return }
  const fin=Array.isArray(d.rooms)&&d.rooms.every(r=>r.visited);
  const prev=(G.pausedRuins||[]).map(r=>r.name);
  if(!fin){
    const copy=JSON.parse(JSON.stringify(d));
    if(!copy.pos) copy.pos=dunPos();
    copy.pausedDay=G.day;
    copy.scenes=G.recent.filter(r=>r.role==='scene').slice(-2).map(r=>String(r.text).replace(/\s+/g,' ').slice(0,170));
    G.pausedRuins=(G.pausedRuins||[]).filter(r=>r.name!==copy.name);
    G.pausedRuins.push(copy);
    if(G.pausedRuins.length>3){ const old=G.pausedRuins.shift(); G.mapDone.push({name:old.name,x:old.pos.x,y:old.pos.y}); if(old.lore) finalizeRuin(old) }   // 밀려난 유적도 밝혀낸 만큼 기록
  }else{
    const p=dunPos(); G.mapDone.push({name:d.name,x:p.x,y:p.y}); revealNextPlace(); gainXp(3,'유적 탐사 완료');
    purgeRuinLex(d.name);
  }
  const now=new Set((G.pausedRuins||[]).map(x=>x.name));
  prev.filter(n=>n!==d.name&&!now.has(n)).forEach(purgeRuinLex);
  if(fin&&d.lore) finalizeRuin(d);
}
function revealNextPlace(){
  const c=MAP_PLACES.filter(p=>p.far&&!G.discovered.includes(p.id));
  if(!c.length) return;
  c.sort((a,b)=>Math.hypot(a.x-KASR.x,a.y-KASR.y)-Math.hypot(b.x-KASR.x,b.y-KASR.y));
  const p=c[0]; G.discovered.push(p.id);
  addLex({name:p.n,cat:'장소',desc:`${p.lore||''} (${p.dir||'서쪽'} 먼 땅 — 지금은 소문으로만 아는 곳)`},true,null);
  G.chronicle.push({day:G.day,text:`길손에게서 「${p.n}」의 이야기를 들었다`});
  toast(`🗺 지도에 「${p.n}」이(가) 나타났습니다`);
}

/* 중단한 유적 */
function resumeRuin(i){
  if(busy||!G.pausedRuins||!G.pausedRuins[i]) return;
  if(G.water<1||G.food<1) return toast('원정에는 물과 식량이 최소 1씩 필요합니다');
  closeModal(); G._resumeRuin=i; startExpedition();
}
async function abandonRuin(i){
  const d=G.pausedRuins&&G.pausedRuins[i]; if(!d) return;
  if(!(await askConfirm(`「${d.name}」 탐사를 포기할까요? 포기한 유적은 다시 올 수 없습니다.`))) return;
  G.pausedRuins.splice(i,1);
  G.mapDone.push({name:d.name,x:d.pos.x,y:d.pos.y});   // 먼 땅 소문은 끝까지 탐사했을 때만 알려짐 (포기·밀려남은 해당 없음)
  purgeRuinLex(d.name);
  if(d.lore) finalizeRuin(d);   // 포기해도 밝혀낸 단서만큼은 사연이 남음
  G.chronicle.push({day:G.day,text:`「${d.name}」 탐사를 포기했다`});
  save(); render(); openRuins();
}
function openRuins(){
  const rows=(G.pausedRuins||[]).map((d,i)=>{
    const vis=d.rooms.filter(r=>r.visited).length, cur=d.rooms.find(r=>r.id===d.cur), frag=d.rooms.some(r=>r.fragTaken);
    return `<div class="lex"><div class="h"><b>🏛 ${esc(d.name)}</b><span class="cat">${vis}/${d.rooms.length}구역${frag?' · ★':''}${d.raided?' · 🏴 털림':''}</span></div>
      <div class="muted" style="margin:4px 0;font-size:13px">마지막 위치: ${esc(cur?cur.name:'입구')} · ${d.pausedDay?G.day-d.pausedDay>0?`${G.day-d.pausedDay}일 전 중단`:'오늘 중단':'중단'}</div>
      <div class="row" style="justify-content:flex-end;gap:6px"><button class="small" onclick="abandonRuin(${i})">포기하기</button><button class="small primary" onclick="resumeRuin(${i})">이어서 탐사</button></div></div>`;
  }).join('')||'<p class="muted">중단한 유적이 없습니다.</p>';
  modal('중단한 유적',`<p class="muted">이어서 탐사하면 일반 원정과 같은 비용(식량 -1, 하루 경과)이 들고, 마지막으로 있던 방에서 다시 시작합니다. 최대 3곳까지 보관됩니다.</p>${rows}`);
}
/* 다시 온 유적: 몇 턴 동안 지난 탐사 기록을 AI에게 */
function memoText(d){
  const vis=d.rooms.filter(r=>r.visited).map(r=>r.name);
  const got=[...new Set(d.rooms.flatMap(r=>r.gotItems||[]))];
  const frag=d.rooms.some(r=>r.fragTaken), relic=d.rooms.some(r=>r.relicTaken);
  const names=[d.name,...d.rooms.map(r=>r.name)].filter(n=>n&&n.length>=2);
  const lex=G.lexicon.filter(e=>names.some(n=>e.name.includes(n)||e.desc.includes(n))).slice(-5).map(e=>`${e.name}: ${e.desc.slice(0,60)}`);
  const chr=G.chronicle.filter(c=>c.text.includes(d.name)).slice(-4).map(c=>`${chronLabel(c)} ${c.text}`);
  return `[이어서 탐사 — 지난 탐사 기록] 플레이어는 이 유적을 한 번 탐사하고 돌아갔다가 다시 왔다. 지난 탐사와 모순되게 쓰지 말고, 이미 와 본 곳은 익숙한 곳으로 짧게 묘사하라.\n- 둘러본 구역: ${vis.join(', ')||'입구'}\n- 얻은 것: ${[...got,relic?'유물':'',frag?'별지도 조각':''].filter(Boolean).join(', ')||'특별한 것 없음'}`
    +(d.scenes&&d.scenes.length?`\n- 마지막 장면 요약: ${d.scenes.join(' / ')}`:'')
    +(chr.length?`\n- 연대기: ${chr.join(' / ')}`:'')
    +(lex.length?`\n- 사전: ${lex.join(' / ')}`:'');
}

/* ---------- 방 조사 완료: 같은 방을 여러 번 뒤졌거나, 서술이 '더 없다'고 하면 ---------- */
const ROOM_RX={
  SEARCH:/(살[피핀]|살펴|조사|둘러|찾[아는]|더듬|확인|관찰|들여다|뒤[진져]|탐색|수색|귀를 기울)/,
  NOT_SEARCH:/(마신다|마시|먹는다|먹는|야영|휴식|쉰다|쉬어|잠[을든]|유민|OOC|\/\/|돌아|귀환|나간다|나가|사용한다|꺼낸다|횃불)/,
  NOTHING:/(더\s*(이상\s*)?(찾을|조사할|살필|얻을|건질)[^.!?\n]{0,12}(없|보이지)|(찾을|조사할|얻을|건질)\s*(것|게|건|만한 것)[^.!?\n]{0,8}(없|보이지)|(남은|더 볼)\s*(것|단서|곳)[^.!?\n]{0,8}(없|보이지))/,
  SRCH_CHOICE:/(살[피핀]|살펴|조사|둘러|찾[아는]|더듬|확인|관찰|들여다|뒤[진져]|탐색|수색)/,
};
on('after',30,T=>{
  const room=(T.loc==='dungeon'&&G.loc==='dungeon'&&G.dungeon&&curRoom()===T.room)?T.room:null;
  if(!room||(room.fragment&&!room.fragTaken)) return;     // 별지도 조각이 남은 방은 끝까지 조사 가능
  const act=T.action;
  if(ROOM_RX.SEARCH.test(act)||!ROOM_RX.NOT_SEARCH.test(act)) room.searchN=(room.searchN||0)+(T.flags.viaChoice?0.5:1);
  const limit=(room.relicTaken||(room.gotItems&&room.gotItems.length)||room.fragTaken)?3:5;
  if(!room.exhausted&&(ROOM_RX.NOTHING.test(lastScene())||(room.searchN||0)>=limit)) room.exhausted=true;
});
on('after',35,()=>{ if(G.dungeon&&G.dungeon.memoLeft>0) G.dungeon.memoLeft-- });

/* ---------- 선택지 정리: 위치와 맞지 않는 것 빼기 ---------- */
const LOC_RULES={
  dungeonExit:{re:/(은신처|유적 (밖|바깥)|(밖|바깥)으로|유적을 (나|떠|벗어)|카스르(로|에)|귀환|(낙타|당나귀)[이가]? ?(기다|있는))/,fill:['주변을 더 살핀다','다음 구역으로 이동한다','잠시 숨을 고르며 상황을 정리한다']},
  dungeonMove:{re:/((내려|올라|나아|들어|건너|지나|넘어|걸어|따라|돌아)[가간]|들어서|향[해한]|이동|빠져나|탈출)/,fill:['주변을 꼼꼼히 살핀다','벽과 바닥을 더듬어 단서를 찾는다','숨을 죽이고 소리에 귀를 기울인다']},
  camp:{re:/((통로|방|구역)(으로|로|을|를)?\s*(이동|들어|향|나아)|유적\s*(밖|바깥)|카스르|귀환|깊이\s*(들어|나아))/,fill:['모닥불 곁에서 쉬며 상황을 정리한다','장비를 점검한다','주변 소리에 귀를 기울인다']},
  road:{re:/((성문|시장|여관|찻집)(으로|에|을)?\s*(들어|간다|도착|돌아)|유적\s*(안|내부|깊)|통로(로|를)\s*(들어|지나))/,fill:['주변 사막을 살핀다','잠시 쉬며 물을 아낀다','유적 방향을 가늠해 본다']},
  city:{re:/(유적\s*(안|내부|깊은\s*곳)(으로|에서)|통로(로|를)\s*(들어|지나)|(방|구역)으로\s*(들어|이동))/,fill:['시장 거리를 둘러본다','사람들의 이야기를 엿듣는다']},
  home:{re:/(유적\s*(안|내부|깊은\s*곳)(으로|에서)|통로(로|를)\s*(들어|지나)|(방|구역)으로\s*(들어|이동))/,fill:['거점 주변을 둘러본다','잠시 쉬며 생각을 정리한다']},
};
function dropChoices(arr,R){
  const keep=arr.filter(c=>!R.re.test(String(c)));
  return keep.length===arr.length?arr:fillChoices(keep,R.fill);
}
on('choices',10,arr=>G.loc==='dungeon'?dropChoices(arr,LOC_RULES.dungeonExit):arr);
on('choices',20,arr=>G.loc==='dungeon'?dropChoices(arr,LOC_RULES.dungeonMove):arr);
LOC_RULES.town=LOC_RULES.city;
on('choices',30,arr=>LOC_RULES[G.loc]?dropChoices(arr,LOC_RULES[G.loc]):arr);
on('choices',40,arr=>roomExhausted()?arr.filter(c=>!ROOM_RX.SRCH_CHOICE.test(String(c))):arr);

/* ---------- 장면 설명: 위치 고정 · 탐사 상태 ---------- */
on('context',30,()=>{
  let s='';
  if(G.loc==='dungeon'){
    s+='\n[위치 고정] 플레이어는 지금 유적 내부에 있다. 유적 밖으로 나가거나 은신처·낙타가 있는 곳·카스르로 돌아가는 서술이나 선택지를 만들지 말 것(나가기·귀환은 플레이어가 고정 버튼으로 직접 한다). 이동은 연결된 방 사이에서만.';
    s+='\n[선택지 규칙] choices에는 현재 방 안에서 할 수 있는 행동(관찰, 조사, 대화, 물건 다루기, 함정·장치 조작 등)만 넣어라. 다른 방·계단·통로·출구로 이동하거나 내려가고 올라가는 선택지는 절대 넣지 말 것 — 이동은 플레이어가 고정 버튼으로 한다.';
    if(G.dungeon&&!G.dungeon.rooms.some(r=>r.fragment||r.fragTaken)) s+='\n[비밀] 이 유적에는 별지도 조각이 없다. 별지도 조각이나 그 흔적을 발견하는 서술·선택지를 만들지 말 것. effects.fragment는 false.';
    if(G.dungeon&&G.dungeon.rooms.some(r=>r.fragTaken)) s+='\n[이미 획득] 이 유적의 별지도 조각은 이미 얻었다. 별지도 조각을 또 발견하거나 얻는 서술·선택지를 만들지 말 것. effects.fragment는 false.';
    const p=dungeonProg(); if(p&&p.done) s+='\n[탐사 완료] 이 유적의 모든 구역을 탐사했다. 새로운 방이나 숨은 통로를 만들지 말고, 남은 것이 없다는 분위기로 서술하며 귀환을 암시하라.';
    if(roomExhausted()) s+='\n[조사 완료] 이 방에서는 더 찾을 것이 없다. 관찰·조사·수색 선택지를 만들지 말고, 대화·장치·위험 대처처럼 정말 할 만한 다른 행동이 없으면 choices를 빈 배열 []로 두라. 서술에서도 더 얻을 것이 없음을 분명히 하라.';
    if(G.dungeon&&G.dungeon.memoLeft>0) s+='\n'+memoText(G.dungeon);
  }
  else if(isTown()) s+='\n[위치 고정] 플레이어는 지금 유적 밖(도시/거점)에 있다. 유적 내부를 탐사하는 서술이나 선택지를 만들지 말 것(원정은 고정 버튼으로 시작한다).';
  else if(G.loc==='camp') s+='\n[위치 고정] 플레이어는 지금 야영지에서 쉬고 있다. 방 이동·탐사·도시 복귀 서술이나 선택지를 만들지 말고 휴식, 대화, 장비 점검, 밤의 기척 중심으로. 출발은 고정 버튼으로 한다.';
  else if(G.loc==='road'){
    s+='\n[위치 고정] 플레이어는 지금 사막 길 위에 있다. 유적 내부나 도시 안으로 들어가는 서술·선택지를 만들지 말 것(길을 계속 가는 것은 고정 버튼으로 한다).';
    if(outsideRuin()) s+=`\n[현재 위치] 유적 「${G.dungeon.name}」의 입구 밖 사막이다. 유적 안의 방은 지금 묘사하지 말 것(다시 들어가는 것은 플레이어가 버튼으로 한다).`;
    if(G.caravan&&G.caravan.here) s+=`\n[근처] 「${G.caravan.name}」이(가) 잠시 쉬어 가고 있다. 대화나 배경으로 등장시켜도 된다.`;
  }
  return s;
});
on('facts',20,o=>{ const p=G.loc==='dungeon'?dungeonProg():null; if(p) o.유적탐사도=`${p.vis}/${p.total}구역 탐사`+(p.done?' (모든 구역 탐사 완료 — 새 방·통로를 더 만들지 말 것)':'') });


/* =========================================================
   15. 별지도 조각
   ========================================================= */
const FRAG_RX={
  FOUND:/[^.!?\n]*별지도[^.!?\n]*조각[^.!?\n]*(발견|손에 넣|집어|집었|주워|주웠|줍|획득|얻|챙|손끝에 걸)[^.!?\n]*/,
  LEFT:/(유적(을|에서)\s*(빠져나|벗어났|벗어나|나왔|나섰|떠났)|유적\s*(밖|바깥)(으로|에)\s*(나|서)|입구를\s*(빠져나|나서)|(밖|바깥)으로\s*(빠져나|나왔|나섰)|은신처(로|에)\s*(돌아|도착|들어)|카스르(로|에)\s*(돌아|도착))/,
};
FRAG_RX.NEG=/(아니었|아니다|않았|않는|못했|못한|없었|없다|흔적만|가짜|모조|비슷한|닮은|착각|줄 알았|인 줄)/;
/* 조각을 얻었다는 문장이 있는지 — "…발견했지만 조각은 아니었다" 같은 부정 문장은 빼고 */
function fragFoundIn(text){ return String(text||'').split(/(?<=[.!?\n])/).some(x=>FRAG_RX.FOUND.test(x)&&!FRAG_RX.NEG.test(x)) }
const needFrag=()=>G.fragments<FRAG_GOAL;
const fragAtRisk=()=>G.act<2&&!G.actDone;   // 조각을 빼앗길 수 있는 때 — 1막을 마치면(조각 완성) 더는 잃지 않음
function fragGain(where){
  G.fragments++;
  G.chronicle.push({day:G.day,text:`${where} 별지도 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
  addLog('fx',`★ 별지도 조각 ${G.fragments}/${FRAG_GOAL}`);
  save(); render(); checkState();
}
/* 서술에는 조각을 얻었다고 썼는데 effects.fragment를 빠뜨린 경우 */
on('after',50,T=>{
  if(inDark()||G.loc!=='dungeon'||!G.dungeon||G.fragments!==T.frags||!fragFoundIn(lastScene())) return;
  const cur=curRoom(), real=G.dungeon.rooms.find(r=>r.fragment&&!r.fragTaken);
  if(!real||!cur) return;
  if(real!==cur){ real.fragment=false; cur.fragment=true }
  cur.fragTaken=true; G.fragments++;
  addLog('fx',`★ 별지도 조각 ${G.fragments}/${FRAG_GOAL} (서술에서 획득을 확인해 반영)`);
  G.chronicle.push({day:G.day,text:`「${G.dungeon.name}」에서 별지도 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
  checkState();
});
/* 사막 길·야영지에서 아주 가끔(원정마다 한 번만 굴림) 우연히 */
on('before',20,T=>{
  if(needFrag()&&['road','camp'].includes(G.loc)&&!G._fragTriedTrip&&Math.random()<0.04){
    G._fragTriedTrip=true; G._fragPending=true;
    T.extra+=' [우연한 발견] 이 장면에서 길가나 야영지 근처의 부서진 비석, 모래에 묻힌 짐, 떠돌이의 유품 같은 곳에서 푸른 안료로 별자리가 그려진 별지도 조각을 발견하게 하라. 플레이어가 손에 넣으면 effects.fragment=true.';
  }
});
on('after',55,T=>{
  if(G._fragPending){
    G._fragPending=false;
    if(G.fragments===T.frags&&needFrag()&&fragFoundIn(lastScene())) fragGain('길 위에서');
  }
  if(isTown()) G._fragTriedTrip=false;
});
/* 서술상 유적을 빠져나왔으면 → 입구 밖으로 */
on('after',90,()=>{
  if(G.loc!=='dungeon'||!G.dungeon) return;
  const t=lastScene(); if(!FRAG_RX.LEFT.test(t)||G._leaveAsked===t) return;
  G._leaveAsked=t;
  askConfirm('서술상 유적 밖으로 나온 것 같습니다.\n유적 입구 밖으로 나온 것으로 처리할까요?\n(유적은 그대로 남고, 카스르로 가려면 입구 밖에서 귀환 버튼을 누르세요)').then(ok=>{ if(ok) exitRuin() });
});
/* 숫자에 반영되지 않았을 때 OOC 창에서 수동 반영 */
async function fragManual(){
  if(G.fragments>=FRAG_GOAL) return toast('이미 조각이 모두 모였습니다');
  if(!(await askConfirm('별지도 조각을 +1 수동으로 반영할까요? (소지품의 별지도 조각 아이템은 제거됩니다)'))) return;
  G.fragments++;
  G.items=G.items.filter(n=>!(/별지도/.test(n)&&/조각/.test(n)));
  if(G.dungeon){ const real=G.dungeon.rooms.find(r=>r.fragment&&!r.fragTaken); if(real) real.fragTaken=true }
  G.chronicle.push({day:G.day,text:`별지도 조각을 얻었다 (${G.fragments}/${FRAG_GOAL})`});
  addLog('fx',`★ 별지도 조각 ${G.fragments}/${FRAG_GOAL} (수동 반영)`);
  closeModal(); save(); render(); checkState();
}
/* 시장의 수상한 상인 */
function openMerchant(){
  const m=G.fragMerchant; if(!m) return;
  const ok=G.gold>=m.price;
  modal('수상한 상인',`<p>장막 뒤에서 상인이 점토 조각을 손바닥에 올려 보인다. 푸른 안료로 그려진 별자리가 이람의 별지도 조각과 닮았다.</p>
    <p class="muted">금화: ${G.gold}</p>
    <div class="shop-row"><span>별지도 조각으로 보이는 점토 조각</span><button class="small ${ok?'primary':''}" ${ok?'':'disabled'} onclick="buyFragment()">금화 ${m.price}</button></div>
    <p class="muted" style="font-size:12px">${ok?'':'금화가 부족합니다. 상인은 한동안 시장에 머뭅니다. '}거절하고 떠나도 상인은 시장에 남아 있습니다.</p>`);
}
function buyFragment(){
  const m=G.fragMerchant; if(!m||G.gold<m.price) return;
  G.gold-=m.price; G.fragMerchant=null; G.merchantSold=(G.merchantSold||0)+1;
  closeModal(); fragGain('시장의 수상한 상인에게서');
}

/* 상태 확인: 쓰러짐 → 구조 / 조각 FRAG_GOAL개 → 1막 완료 */
function checkState(){
  if(G.hp<=0){
    sfx('collapse');
    const keep=mountRescueKeep();
    addLog('sys',`당신은 쓰러졌습니다… ${keep>0.5?G.mount.name+'의 도움으로 ':'지나가던 대상에게 '}구조되어 ${baseName()}${josa(baseName(),'으로','로')} 돌아옵니다. 금화의 ${keep>0.5?'4분의 1':'절반'}을 잃었습니다.`);
    G.chronicle.push({day:G.day,text:'원정 중 쓰러져 대상에게 구조되었다'});
    G.gold=Math.floor(G.gold*keep); G.hp=Math.ceil(G.maxhp/2); G.water=Math.max(G.water,2); G.food=Math.max(G.food,2);
    archiveDungeon();
    G.dungeon=null; G.trip=null; if(G.base&&TOWNS[G.base]){ G.loc='town'; G.town=G.base } else { G.loc='city'; G.district='gate' } G.day+=2; G.time='낮'; G.dayStep=0; G.choices=[];
  }
  if(G.fragments>=FRAG_GOAL&&G.act===1&&!G.actDone){ G.actDone=true; const w=()=>{ if(busy) return setTimeout(w,300); actComplete() }; setTimeout(w,0) }   // 진행 중인 턴이 끝난 뒤 실행 (겹침 방지)
}
async function actComplete(){
  addLog('sys','별지도 조각이 모두 모였습니다.');
  await aiTurn(`모은 별지도 조각 ${FRAG_GOAL}개를 맞추어 본다`,'[특별 장면] 조각들이 맞물리며 밤하늘의 별자리와 겹쳐지고, 이람의 입구가 있는 위치가 드러난다. 경이롭고 장엄하게 그려라. 마지막 문장은 다음 여정을 향한 기대감으로 끝내라.',false);
  G.chronicle.push({day:G.day,text:'별지도를 완성해 이람의 입구 위치를 알아냈다 — 1막 완료'});
  addLog('sys','🌙 1막 완료. 카스르 성문(또는 마을)에서 ✨ 이람으로 떠날 수 있습니다.');
  save(); render();
}


/* =========================================================
   16. 유적의 사연 · 고대사
   - 첫 유적 때 세계의 고대사 시대 5~6개를 정함
   - 유적마다 시대 하나 + 사연 + 방마다 단서(📝 탐사 수첩)
   - 탐사를 마치면 사전에는 「유적 이름」(사연 요약)과 「시대」(유적 목록) 두 줄만 남음
   ========================================================= */
let ancientBusy=null;
async function ensureAncient(){
  if(!G||(Array.isArray(G.ancient)&&G.ancient.length)) return;
  if(ancientBusy) return ancientBusy;
  ancientBusy=(async()=>{
    let eras=null;
    try{
      const prompt=`이 게임 세계의 '고대사 뼈대'를 정하라. 앞으로 플레이어가 탐사하는 작은 유적들은 모두 이 시대들 중 하나에 속하게 된다.
숨겨진 진실(플레이어에게 직접 밝히지 말 것): ${G.secret?.truth||''} / ${G.secret?.detail||''}
지역 소문: ${(G.rumors||[]).map(r=>r.region+': '+r.belief).join(' / ')}
요구: 시대 5개. 오래된 순서로. 각 시대에 대표 인물 한 명(이름 포함). 시대들끼리 원인과 결과로 이어지게. 이람과 같은 묻힌 도시가 여럿이라는 사실은 sec에서도 '희미한 암시'로만.
JSON만: {"eras":[{"name":"시대 이름 10자 이내","pub":"사람들에게 알려진 내용 1문장","sec":"숨은 진실 1~2문장","fig":"대표 인물 (호칭+이름)"}]}`;
      const j=parseJSON(await callAI('너는 텍스트 탐험 게임의 세계관 설계자다. JSON만 출력한다.',prompt,1100,'world'));
      if(j&&Array.isArray(j.eras)&&j.eras.length>=4)
        eras=j.eras.slice(0,6).map((x,i)=>({id:'e'+i,name:String(x.name||'').slice(0,14),pub:String(x.pub||''),sec:String(x.sec||''),fig:String(x.fig||'')})).filter(x=>x.name&&x.pub);
    }catch(e){ if(e&&e.message!=='NO_KEY') console.warn(e) }
    if(!eras||eras.length<4) eras=ERA_FALLBACK.map(x=>({...x}));
    eras.forEach(x=>x.ruins=[]);
    G.ancient=eras;
  })();
  try{ await ancientBusy } finally{ ancientBusy=null }
}
function pickEra(){
  const e=G.ancient, min=Math.min(...e.map(x=>x.ruins.length));
  return rand(e.filter(x=>x.ruins.length===min));
}
function loreRequest(era,hasFrag){
  const prev=era.ruins.map(r=>`「${r.name}」: ${r.record}`).join('\n')||'(아직 없음)';
  return `

[추가 요구 — 이 유적의 사연]
이 유적은 세계의 고대사 중 「${era.name}」 시대에 속한다.
- 알려진 내용: ${era.pub}
- 숨은 진실(직접 밝히지 말고 사연 속에 조각으로만): ${era.sec}
- 이 시대의 대표 인물: ${era.fig} (이 유적의 사연에 직접 또는 간접으로 등장시켜라)
- 같은 시대의 이미 탐사된 유적:
${prev}
  → 이미 탐사된 유적과 같은 사람·사건·물건을 하나 이상 이어 언급해서 '조각들이 맞춰지는' 느낌을 줘라.
JSON에 다음 두 필드를 추가하라:
"lore":{"who":"이곳을 만들거나 쓴 사람들","what":"이곳에서 실제로 있었던 일 2~3문장","fate":"이곳이 버려진 이유 1문장","iram":"${hasFrag?'이람·별지도와의 희미한 연결 1문장(정답 금지)':'이 시대의 분위기를 잇는 1문장 — 별자리·점·푸른 안료·별지도·조각은 절대 언급하지 말 것'}","record":"탐사를 마친 플레이어가 사전에 남길 요약 2문장(플레이어가 알게 된 수준으로)"},
"clues":[{"room":"방 id","text":"그 방에서 찾는 구체적인 단서 1문장 — 벽화, 일지, 유골, 봉인 문구, 버려진 물건 등"}]
clues는 3~4개, 서로 다른 방에. 따로 읽으면 수수께끼지만 모아 읽으면 lore.what이 재구성되게. 각 방 desc에도 사연에 맞는 흔적을 반영하라.${hasFrag?'':' 이 유적에는 별지도 조각이 없으므로 clues와 desc 어디에도 별자리·별지도·조각을 연상시키는 단서를 넣지 말 것.'}`;
}
function fallbackLore(era,d,hasFrag){
  const fig=era.fig||'이름 모를 사람';
  return {
    who:`${fig}와 그를 따르던 사람들`,
    what:`${era.pub} 이곳은 그 시대에 ${d.theme}(으)로 쓰였고, ${fig}가 무언가를 이곳에 숨기고 떠났다.`,
    fate:'모래폭풍이 길을 끊은 뒤 아무도 돌아오지 않았다.',
    iram:hasFrag?'벽 어딘가에 별자리와 닮은 점들이 새겨져 있다.':'이 시대 사람들의 생활 흔적이 곳곳에 남아 있다.',
    record:`「${d.name}」은 ${era.name}에 ${d.theme}(으)로 쓰인 곳이다. ${fig}의 흔적이 남아 있다.`,
    clues:[`벽에 「${fig}」라는 이름이 긁혀 새겨져 있다.`,`${era.name}의 양식으로 깎은 문양이 문틀을 두르고 있다.`,'급히 떠난 흔적 — 깨진 그릇과 꺼진 등잔이 그대로 있다.',hasFrag?'바닥 돌판 하나에 별자리처럼 찍힌 점들이 있다.':'문틀 아래에 누군가 급히 새긴 이름의 약자가 있다.']
  };
}
function attachLore(era,j,hasFrag){
  const d=G.dungeon; if(!d||d.lore) return;
  const fb=fallbackLore(era,d,hasFrag);
  const L=(j&&j.lore&&j.lore.what)?j.lore:fb;
  let clues=(j&&Array.isArray(j.clues)?j.clues:[]).map(c=>({room:String(c&&c.room||''),text:String(c&&c.text||'').trim()})).filter(c=>c.text);
  if(clues.length<3) clues=clues.concat(fb.clues.slice(clues.length).map(t=>({room:'',text:t}))).slice(0,4);
  clues=clues.slice(0,4);
  const order=[...d.rooms].sort((a,b)=>(a.lv||0)-(b.lv||0));
  clues.forEach(c=>{
    let r=d.rooms.find(x=>x.id===c.room&&!x.clue);
    if(!r) r=order.find(x=>!x.clue&&x.id!==d.rooms[0].id)||order.find(x=>!x.clue);
    if(r) r.clue={t:c.text,got:false};
  });
  d.lore={era:era.id,eraName:era.name,fig:era.fig,who:String(L.who||fb.who),what:String(L.what||fb.what),fate:String(L.fate||fb.fate),iram:String(L.iram||fb.iram),record:String(L.record||fb.record),recorded:false};
  d.journal=[];
}
on('context',50,()=>{
  const d=G.dungeon, L=d&&d.lore;
  if(!L||(G.loc!=='dungeon'&&G.loc!=='camp')) return '';
  const r=curRoom(), got=d.rooms.filter(x=>x.clue&&x.clue.got).map(x=>x.clue.t);
  let s=`\n[유적의 사연 — 비밀 메모, 한꺼번에 설명하지 말 것] 시대: ${L.eraName} / 관련 인물: ${L.fig} / 만든 이: ${L.who} / 실제 있었던 일: ${L.what} / 버려진 이유: ${L.fate} / 이람과의 연결(희미하게만): ${L.iram}`;
  if(got.length) s+=`\n[플레이어가 이미 찾은 단서] ${got.join(' / ')}`;
  if(r&&r.clue) s+=r.clue.got?`\n[이 방의 단서는 이미 발견됨] ${r.clue.t}`:`\n[이 방에 숨은 단서 — 플레이어가 살펴보거나 조사할 때만 드러냄] ${r.clue.t}`;
  return s;
});
/* 살펴보거나 조사하면 이 방의 단서를 반드시 보여 줌 → 수첩에 기록 */
const INV_RX=/(살펴|조사|읽|들여다|훑|만져|확인|찾아|찾는|뒤진|뒤져|해독|파헤|문양|벽화|비문|기록|둘러|더듬|비춘|비춰)/;
on('before',30,T=>{
  if(G.loc!=='dungeon'||!G.dungeon||!G.dungeon.lore||inDark()) return;   // 어둠 속에서는 단서를 찾지 못함
  const r=curRoom();
  if(r&&r.clue&&!r.clue.got&&INV_RX.test(T.action)){
    T.clueRoom=r;
    T.extra+=`\n[단서 공개 — 반드시] 이번 장면에서 플레이어가 이 단서를 발견한다: "${r.clue.t}" 무엇에 어떻게 남아 있는지 구체적인 모습으로 보여 주되, 의미를 해설하지는 말 것.`;
  }
});
on('after',25,T=>{ if(T.clueRoom&&G.dungeon&&G.dungeon.rooms.includes(T.clueRoom)) revealClue(G.dungeon,T.clueRoom) });
function revealClue(d,r){
  if(r.clue.got) return;
  r.clue.got=true;
  (d.journal=d.journal||[]).push({room:r.name,t:r.clue.t,day:G.day});
  const all=d.rooms.filter(x=>x.clue), got=all.filter(x=>x.clue.got);
  addLog('fx',`📝 탐사 수첩 (${got.length}/${all.length}): ${r.clue.t}`);
  toast(`📝 단서를 수첩에 적었습니다 (${got.length}/${all.length})`);
  if(got.length===all.length){
    addLog('sys',`🏛 모든 단서가 맞춰졌습니다 — 「${d.name}」의 사연이 사전에 기록됩니다.`);
    finalizeRuin(d);
  }
}
function upsertLex(name,cat,desc,extra){
  const ex=G.lexicon.find(x=>x.name===name);
  if(ex){ ex.desc=ex.placeNote?trunc(desc,380)+ex.placeNote:desc; ex.cat=cat; ex.isNew=true; delete ex.ruin; delete ex.arch; Object.assign(ex,extra||{}) }
  else G.lexicon.push(Object.assign({name,cat,desc,isNew:true},extra||{}));
}
function finalizeRuin(d){
  const L=d.lore; if(!L||L.recorded||!G.ancient) return;
  const all=d.rooms.filter(x=>x.clue), got=all.filter(x=>x.clue.got);
  const full=all.length>0&&got.length>=Math.ceil(all.length*0.6);
  const record=full?L.record:`${L.eraName}의 흔적이 남은 유적. 밝혀낸 단서: ${got.map(x=>x.clue.t).join(' / ')||'없음'} — 사연은 아직 다 밝혀지지 않았다.`;
  upsertLex(d.name,'장소',`${record} (시대: ${L.eraName})`,{ruinRec:true});
  const era=G.ancient.find(x=>x.id===L.era);
  if(era){
    era.ruins=era.ruins.filter(x=>x.name!==d.name);
    era.ruins.push({name:d.name,record:full?L.record:record,full,got:got.length,total:all.length});
    upsertLex(L.eraName,'전설',eraEntryDesc(era),{eraRec:true,fav:true});
    linkLegendEra(d.name);
  }
  G.chronicle.push({day:G.day,text:`「${d.name}」의 사연을 ${full?'밝혀냈다':'일부 밝혀냈다'} — ${L.eraName}`});
  if(full) gainXp(1,'유적의 사연');
  L.recorded=true;
  toast(`🏛 사전에 「${d.name}」의 기록이 남았습니다`);
}
function openRuinJournal(){
  const d=G.dungeon, L=d&&d.lore;
  let h='';
  if(L){
    const all=d.rooms.filter(x=>x.clue), got=all.filter(x=>x.clue.got);
    h+=`<p class="muted">「${esc(d.name)}」 · 시대: <b>${esc(L.eraName)}</b> · 단서 ${got.length}/${all.length}</p>`;
    h+=all.map(x=>x.clue.got?`<div class="rj-clue">${esc(x.clue.t)}<div class="muted" style="font-size:12px">${esc(x.name)}</div></div>`
                             :`<div class="rj-clue locked">${x.visited?'이 구역에 아직 찾지 못한 흔적이 있다':'아직 가 보지 않은 구역'} …</div>`).join('');
    h+=`<p class="muted" style="font-size:12px">단서는 방을 👁 살펴보거나 🔍 조사할 때 드러납니다. 60% 이상 모으면 탐사를 마칠 때 사연 전체가 사전에 기록됩니다.</p>`;
  }
  if(Array.isArray(G.ancient)&&G.ancient.length){
    h+=`<h4 style="margin:14px 0 4px">🏛 지금까지 밝혀진 고대사</h4>`;
    const leg=n=>G.lexicon.find(e=>e.name===ruinLegendName(n)), plc=n=>(G.lexicon.find(e=>e.name===n)||{}).places;
    h+=G.ancient.map(e=>e.ruins.length?`<div class="rj-era"><b>${esc(e.name)}</b><div class="muted" style="font-size:13px">${esc(e.pub)}</div>${e.ruins.map(x=>`<div style="font-size:13px;margin-top:6px">· 「${esc(x.name)}」 ${esc(x.record)}${leg(x.name)?`<div class="rj-clue" style="margin:4px 0 0 10px">📜 ${esc(leg(x.name).desc)}</div>`:''}${plc(x.name)?`<div class="muted" style="font-size:12px;margin-left:10px">🧭 둘러본 곳: ${esc(plc(x.name).map(p=>p.n).join(', '))}</div>`:''}</div>`).join('')}</div>`
                                 :`<div class="rj-era muted"><b>???</b> 아직 흔적을 찾지 못한 시대</div>`).join('');
  }
  modal('📝 탐사 수첩',h||'<p class="muted">기록이 없습니다.</p>');
}


/* =========================================================
   17. 사막의 상인 · 물이 있는 곳 (AI 서술의 사건 → 버튼)

function rollCaravan(reason){
  if(!G||G.loc!=='road') return;
  if(G.caravan&&G.caravan.here) return;
  const key=G.day+'|'+reason;
  if(G._caravanRoll===key) return;
  G._caravanRoll=key;
  const p=G.water<=0?0.65:G.water<=1?0.5:0.3;
  if(Math.random()>=p) return;
  const r=()=>Math.floor(Math.random()*3);
  G.caravan={here:true,loc:'road',day:G.day,name:rand(CARAVANS),stock:{water:4+r(),food:4+r(),torch:2+r()},talked:false};
  addLog('sys',`🐫 모래언덕 너머에서 「${G.caravan.name}」이(가) 다가와 잠시 쉬어 갑니다. (🐫 버튼으로 거래할 수 있습니다)`);
}
function caravanHere(){ const c=G&&G.caravan; return !!(c&&c.here&&G.loc===(c.loc||'road')) }
function openCaravan(){
  const c=G.caravan; if(!caravanHere()) return;
  const rows=['water','food','torch'].map(k=>{
    const cap=capOf(k), rm=Math.max(0,cap-G[k]), can=Math.min(rm,c.stock[k],Math.floor(G.gold/PRICE_ROAD[k]));
    return `<div class="shop-row" style="align-items:center;gap:8px;flex-wrap:wrap"><span>${NMI[k]} <span class="muted">개당 🪙${PRICE_ROAD[k]} · 소지 ${G[k]}/${cap} · 상인 재고 ${c.stock[k]}</span></span>
      <span style="display:flex;gap:6px"><button class="small" ${can>0?'':'disabled'} onclick="caravanBuy('${k}',1)">+1</button>
      <button class="small ${can>0?'primary':''}" ${can>0?'':'disabled'} onclick="caravanBuy('${k}',99)">살 수 있는 만큼${can>0?` (+${can} · 🪙${can*PRICE_ROAD[k]})`:''}</button></span></div>`;
  }).join('');
  modal('🐫 '+esc(c.name),`<p class="muted">사막 한가운데라 카스르보다 비쌉니다. 금화 <b>${G.gold}</b></p>${rows}
    <div class="row" style="margin-top:12px"><button class="small" ${c.talked||busy?'disabled':''} onclick="caravanTalk()">🗣 대상과 이야기 나누기 (1걸음 · 소문·길 정보)</button></div>
    <p class="muted" style="font-size:12px;margin-top:8px">대상은 이 자리를 떠나면(유적에 들어가거나 길을 나서면) 함께 떠납니다.</p>`);
}
function caravanBuy(k,n){
  const c=G.caravan; if(busy||!caravanHere()) return;
  const rm=capOf(k)-G[k];
  if(rm<=0) return toast('이미 가득 찼습니다');
  if(c.stock[k]<=0) return toast('상인에게 남은 물건이 없습니다');
  const x=Math.min(n,rm,c.stock[k],Math.floor(G.gold/PRICE_ROAD[k]));
  if(x<=0) return toast('금화가 부족합니다');
  G[k]+=x; c.stock[k]-=x; G.gold-=x*PRICE_ROAD[k];
  addLog('fx',`🐫 대상에게서 ${NMI[k]} +${x} (금화 -${x*PRICE_ROAD[k]})`);
  save(); render(); openCaravan();
}
function caravanTalk(){
  const c=G.caravan; if(busy||!c||!c.here||c.talked) return;
  c.talked=true; closeModal(); tick();
  aiTurn(`「${c.name}」 사람들과 이야기를 나눈다`,`[대상과의 대화] 사막 길에서 쉬어 가는 「${c.name}」 사람들과 이야기를 나눈다. 이들이 지나온 길의 소문(근처 유적의 위험, 다른 탐험대, 진에 관한 이야기, 이람에 관한 엇갈린 믿음 중 하나)을 들려준다. 물건 거래는 플레이어가 상인 버튼으로 하므로 이 장면에서는 effects의 물·식량·횃불·gold를 모두 0으로 둘 것.`+(rivalOn()&&Math.random()<0.6?rivalRumorText():''));
}
/* AI가 낸 사건 → 버튼 */
on('after',60,T=>{
  const ev=T.res&&T.res.event; if(!ev) return;
  const townish=G.loc==='city'||G.loc==='town';   // 도시·마을의 공용 우물도 물 채우기 버튼으로 (하루 한 번)
  if(ev.type==='water_source'&&(isWild()||townish)){
    G.waterSrc={name:ev.name||'물이 있는 곳',loc:G.loc,room:G.dungeon?G.dungeon.cur:null,dist:G.loc==='city'?G.district:null,town:G.loc==='town'?G.town:null,used:false};
    addLog('sys',`💧 「${G.waterSrc.name}」 — 물을 채울 수 있습니다 (💧 버튼${townish?' · 하루 한 번':''})`);
  }
  if(!isWild()) return;
  if(ev.type==='merchant'&&!(G.caravan&&G.caravan.here)){
    const r=()=>Math.floor(Math.random()*3);
    G.caravan={here:true,loc:G.loc==='camp'?'road':G.loc,room:G.dungeon&&G.loc==='dungeon'?G.dungeon.cur:null,day:G.day,name:ev.name||'떠돌이 상인',stock:{water:3+r(),food:3+r(),torch:1+r()},talked:true};
    addLog('sys',`🐫 「${G.caravan.name}」과(와) 거래할 수 있습니다 (🐫 버튼 · 물·식량 🪙${PRICE_ROAD.water} · 횃불 🪙${PRICE_ROAD.torch})`);
  }
});
function fillWaterSrc(viaStory){
  const w=G.waterSrc; if(busy||!w||w.used) return false;
  const townish=!isWild();
  if(townish&&G.cityWaterDay===G.day) return toast('오늘은 이미 공용 우물에서 물을 채웠습니다'), false;
  const need=capW()-G.water; if(need<=0) return toast('물통이 이미 가득 찼습니다'), false;
  G.water=capW(); w.used=true; if(townish) G.cityWaterDay=G.day;
  if(viaStory!==true) tick();
  addLog('fx',`💧 「${w.name}」에서 물을 길어 가득 채웠습니다 (+${need}${viaStory===true?'':', 1걸음'})`);
  if(viaStory!==true){ save(); render() }
  return true;
}
/* "물을 긷는다" 같은 글·선택지로 수원에서 물을 채우려 하면 실제로 물통을 채움 (수원이 지금 곁에 있을 때만) */
function waterFillIntent(t){
  t=String(t||'');
  if(!G||RX.NEG.test(t)||!/물을?\s*(?:가득\s*|듬뿍\s*|한\s*가득\s*)?(긷|길어|퍼\s*올|채운|채워|담)/.test(t)) return false;
  /* 거점 우물(하루 3~6회)·와하 샘터(하루 1번)는 시설이 정한 무료 규칙을 그대로 따름 — 우물이라는 말이 없어도 (거점에서 "물을 채운다") */
  if(!BUY_VERB.test(t)&&((G.loc==='home'&&has('well'))||(G.loc==='town'&&curTown().spring))){
    const home=G.loc==='home', refuse=m=>{ toast(m); pend(` [물 채움 불가] ${m} effects의 water·food·gold·hp는 0.`,{zeroSupply:true,noMoney:true}); return true };
    if(home?wellLeft()<=0:G.townSpringDay===G.day) return refuse(home?`오늘은 우물을 ${wellMax()}번 다 썼습니다.`:'오늘은 이미 샘터에서 물을 채웠습니다.');
    const need=capW()-G.water; if(need<=0) return refuse('물통이 이미 가득 차 있습니다.');
    G.water=capW(); if(home) G.home.wellN=(G.home.wellN||0)+1; else G.townSpringDay=G.day;
    addLog('fx',home?`💧 우물에서 물을 길어 가득 채웠습니다 (+${need}, 무료 · 오늘 ${wellLeft()}회 남음)`:`💧 와하의 샘터에서 물을 가득 채웠습니다 (+${need}, 무료)`);
    pend(' [물 채움 처리 완료] 코드가 이미 플레이어의 물통을 가득 채웠다(무료). 물 긷는 장면만 짧게 서술하고 effects의 water·gold·hp는 0.',{zeroSupply:true,noMoney:true});
    return true;
  }
  clearStaleEvents();   // 다른 곳으로 옮긴 뒤 남은 낡은 수원은 먼저 지움
  const townish=G.loc==='city'||G.loc==='town';
  // AI가 수원 사건을 내지 않았어도, 도시·마을에서 우물·샘에서 물을 채운다는 글이면 공용 우물로 처리 (산다·구입이 들어가면 구매)
  if(!G.waterSrc&&townish&&NEED_RX.SOURCE.test(t)&&!BUY_VERB.test(t))
    G.waterSrc={name:'공용 우물',loc:G.loc,room:null,dist:G.loc==='city'?G.district:null,town:G.loc==='town'?G.town:null,used:false};
  if(!G.waterSrc||G.waterSrc.used) return false;
  if(townish&&G.cityWaterDay===G.day){   // 오늘 이미 채웠으면 더 채우지 못하고, AI가 물을 주지도 못하게
    toast('오늘은 이미 공용 우물에서 물을 채웠습니다');
    pend(' [물 채움 불가] 플레이어는 오늘 이미 이 우물에서 물을 채웠다. 더 채우지 못한다. effects의 water·food·gold·hp는 0.',{zeroSupply:true,noMoney:true});
    G.waterSrc=null;
    return true;
  }
  const ok=fillWaterSrc(true);
  if(ok) pend(' [물 채움 처리 완료] 코드가 이미 플레이어의 물통을 가득 채웠다. 물 긷는 장면만 짧게 서술하고 effects의 water·hp는 0.',{zeroSupply:true});
  return ok;
}
/* 자리를 떠나면 사라지는 것들 (화면 그리기 전에 정리) */
function clearStaleEvents(){
  const c=G.caravan;
  if(c&&c.here){ const L=c.loc||'road'; if(!(G.loc===L||(L==='road'&&G.loc==='camp'))||(L==='dungeon'&&G.dungeon&&c.room&&c.room!==G.dungeon.cur)) c.here=false }
  const w=G.waterSrc;
  if(w&&(w.used||w.loc!==G.loc||(w.room&&G.dungeon&&w.room!==G.dungeon.cur)||(w.dist&&w.dist!==G.district)||(w.town&&w.town!==G.town))) G.waterSrc=null;
}

/* =========================================================
   18. 유민 — 동료 NPC
   ========================================================= */
function yuminLv(){ return affInfo(G.comp.aff).lv }
function affTier(){ const lv=yuminLv(); return [...AFF_TIERS].reverse().find(t=>lv>=t.lv) }
function yuminHere(){ return !!(G.comp&&G.comp.met&&(G.comp.joined||G._yuminHere)) }
function yuminHint(){
  if(!G.comp||!G.comp.met||G.comp.joined) return '';
  const a=yuminLv();
  if(a>=JOIN_LV) return '✨ 동행 제안 가능';
  if(a>=JOIN_LV-3) return '동행이 머지않았다';
  return '';
}
function yuminStatus(){
  let s;
  if(G.comp.joined) s='🐪 동행 중';
  else if(G._yuminHere) s='💬 지금 함께 있음 (동행 전)';
  else { updateYuminSpot(); const sp=YUMIN_SPOTS[G.comp.spot]; s=`📍 ${sp?sp.n:'어딘가'}에 있음` }
  const h=yuminHint();
  return h?`${s} · ${h}`:s;
}
function yuminProfile(){
  if(!G.comp||!G.comp.met) return '';
  const y=G.comp.profile;
  return `
[동료 NPC: ${y.name}]
직업: ${y.job}
외형: ${y.look}
겉 성격: ${y.personality}
말투: ${y.speech.replace("{이름}",vocative(G.char.name))}
  (이름을 알기 전, 첫 만남에서는 "너" 또는 가벼운 별명으로 부른다)
말투 예시 — 톤과 리듬을 참고하되, 사막 세계관에 맞지 않는 단어는 세계관에 맞는 말로 바꿔라. 같은 대사를 그대로 반복하지 말 것:
${y.examples}
금지 말투: ${y.banned}
핵심 패턴: 대화의 깊이를 감지하면 농담하고 빗겨간다. 표면을 유지하는 것은 유민의 선택이지 눈치가 없어서가 아니다. 서술은 그가 알아차렸다는 것을 독자에게 보여줘도 된다.
능력: ${y.ability}
내면과 과거 (서술 전용 — 유민의 대사로 설명하지 말 것): ${y.inner}
회피 패턴: ${y.avoid}`;
}
function yuminState(){
  if(!G.comp||!G.comp.met) return '';
  const y=G.comp.profile, t=affTier();
  const innerRule=yuminLv()<AFF_TIERS[1].lv
    ? '내면은 대사로 절대 드러내지 말고, 서술에서도 아주 드물게 스치는 기색(웃음이 반 박자 늦음, 시선이 잠깐 먼 곳에 머묾) 정도만.'
    : yuminLv()<AFF_TIERS[2].lv
    ? '내면은 서술로만 조금씩 드러낸다(가족이나 혼자라는 화제에 말이 많아지는 모습, 노래 끝에 남는 침묵 등). 유민 본인은 아직 과거를 직접 말하지 않는다.'
    : '과거의 조각(할아버지, 배신, 혼자 떠돈 세월)을 유민이 아주 가끔 직접 꺼낼 수 있다. 다만 꺼낸 직후 회피 패턴으로 가볍게 덮는다. 한 번에 다 털어놓지 않는다.';
  return `
플레이어(${G.char.name})와의 호감 레벨: Lv.${yuminLv()} — ${t.name} 단계: ${t.how}
내면 드러내기 규칙: ${innerRule}${yuminGrowthText()}
동행 상태: ${G.comp.joined?'이미 함께 여행 중':(yuminLv()>=JOIN_LV?'아직 동행하지 않지만 그럴 만큼 가까워졌다. 이야기 흐름상 자연스러우면 유민이 먼저 같이 가겠다고 나서거나(유민답게 핑계를 대며: 마침 그쪽에 볼일이 있다, 노래 소재가 필요하다, 혼자 보내기엔 불안해서는 절대 아니라고 하는 등) 플레이어의 제안을 받아들일 수 있다. 정해지면 effects.companion_join=true. 플레이어가 확실히 원하지 않으면 억지로 따라오지 않는다.':'아직 동행할 만큼 가깝지 않다. 플레이어가 함께 가자고 해도 유민답게 가볍게 미루며 다음 여지를 남긴다. companion_join은 반드시 false.')}
지금 함께 있음: ${yuminHere()?'예 — 장면에 유민의 대사나 행동을 1~2번 자연스럽게 넣어라. 외형은 처음 등장하거나 인상적인 순간에만 한두 가지 특징으로 짧게 묘사하고 매번 반복하지 말 것':'아니오 — 등장시키지 말 것'}
규칙: 유민은 처음 만난 날부터 쌓인 관계만큼만 친하다. 오래 알던 사이처럼 굴지 않는다. 플레이어가 유민의 과거나 감정을 캐물으면 회피 패턴으로 반응하되, 호감도가 높을수록 회피 사이로 진심이 조금 더 새어 나온다. 이런 장면에서 진심 어린 반응을 이끌어 내면 호감도를 올리고, 무례하게 몰아붙이면 내린다. 유민이 함께 있을 때만 effects.affinity로 호감도 변화(-5~+5)를 제안하라.`;
}
/* 이번 장면에 유민 정보를 통째로 보낼지: 함께 있거나, 최근 장면·행동에서 이름이 나올 때만. 아니면 한 줄 */
function yuminNeeded(text){
  if(yuminHere()) return true;

}

}

function lvNotice(name,before,after){

function changeAff(d,fx){
  const b=yuminLv();

}

/* ---------- 유민의 위치: 하루 단위로 카스르 안 장소 · 손님방 · 카스르 밖을 옮겨 다님 ---------- */
function spotHere(){ if(G.loc==='town'&&G.town==='south') return 'nomad'; return G.loc==='city'?curDistrict():(G.loc==='home'&&has('guest'))?'guestroom':'road' }
function nearPlayer(){
  if(G.loc==='city') return curDistrict();
  if(G.loc==='home') return has('guest')?'guestroom':'market';
  if(G.loc==='town'&&G.town==='south') return 'nomad';
  return 'road';
}
function updateYuminSpot(){
  if(!G||!G.comp||!G.comp.met) return;
  const c=G.comp, CITY=Object.keys(YUMIN_SPOTS).filter(k=>YUMIN_SPOTS[k].kind==='city'), WILD=['road','nomad'];
  if(c.joined){ c.spot='with'; c.spotDay=G.day; return }
  if(!YUMIN_SPOTS[c.spot]){ c.spot=(c.spot==='with')?nearPlayer():'market'; c.spotDay=G.day; return }
  if(c.spotDay==null){ c.spotDay=G.day; return }
  if(c.spotDay===G.day) return;
  const days=Math.min(3,Math.max(1,G.day-c.spotDay)); c.spotDay=G.day;
  const other=list=>{ const l=list.filter(k=>k!==c.spot); return rand(l.length?l:list) };
  for(let i=0;i<days;i++){
    if(Math.random()>=0.4) continue;
    const aff=yuminLv(), guest=has('guest');
    const wC=aff<10?50:aff<30?60:55, wW=aff<10?40:aff<30?20:5, wG=guest?(aff<10?10:aff<30?20:40):0;
    let r=Math.random()*(wC+wW+wG);
    c.spot=(r-=wC)<0?other(CITY):(r-=wW)<0?other(WILD):'guestroom';
  }
}
function yuminWhereText(){ const s=YUMIN_SPOTS[G.comp.spot]; if(!s) return '어딘가'; return s.kind==='wild'?`카스르 밖 「${s.n}」`:s.kind==='home'?`거점의 「${s.n}」`:`카스르의 「${s.n}」` }
/* 지금 이 자리에서 만날 수 있는가 (유민 / 다른 인물) */
/* 인물은 마지막으로 만난 곳에 머묾: 'city:시장' 같은 카스르 장소 · 'home' · 'wild'(사막·유적에서 만남 — 다시 찾아갈 수 없음) */
function placeKey(){ return G.loc==='city'?'city:'+curDistrict():G.loc==='home'?'home':G.loc==='town'?'town:'+G.town:'wild' }
function npcWhere(name){ return getRel(name).where||'city:market' }   // 위치 기록이 없던 예전 인물은 시장에 있는 것으로
function npcWhereText(name){ const w=npcWhere(name); if(w.startsWith('town:')) return (TOWNS[w.slice(5)]||{n:'먼 마을'}).n; return w==='home'?`거점 「${G.home.name||'오아시스의 집'}」`:w==='wild'?'사막 어딘가 (만난 곳에서 헤어짐)':`카스르의 「${(DISTRICTS[w.slice(5)]||DISTRICTS.market).n}」` }
on('applied',65,e=>{ (Array.isArray(e.relations)?e.relations:[]).forEach(x=>{ const nm=x&&x.name&&String(x.name).trim().slice(0,30); if(nm&&nm!=='유민'&&G.rel[nm]) G.rel[nm].where=placeKey() }) });
on('facts',85,o=>{ const n=Object.keys(G.rel||{}).filter(n=>n!=='유민'&&G.rel[n].where).slice(-8); if(n.length) o.인물위치=n.map(k=>`${k}: ${npcWhereText(k)}`).join(' / ') });
function canMeetHere(name){
  if(name!=='유민'){ const w=npcWhere(name); return G.loc==='city'?(!spotOn()&&w==='city:'+curDistrict()):G.loc==='home'?w==='home':G.loc==='town'?w==='town:'+G.town:false }
  const c=G.comp; if(!c||!c.met) return false;
  if(c.joined||G._yuminHere) return true;
  updateYuminSpot();
  const s=YUMIN_SPOTS[c.spot]; if(!s) return false;
  if(G.loc==='city') return !spotOn()&&s.kind==='city'&&c.spot===curDistrict();
  if(G.loc==='home') return has('guest')&&c.spot==='guestroom';
  if(G.loc==='town') return s.town===G.town;
  return false;
}
function yuminFindLabel(){
  updateYuminSpot();
  if(G.comp.joined) return '🎵 유민과 이야기';
  return canMeetHere('유민')?`🎵 유민에게 가기 (${(YUMIN_SPOTS[G.comp.spot]||{n:'손님방'}).n})`:'🎵 유민 찾기 (지도에서 위치 확인)';
}
on('facts',80,o=>{ if(G.comp&&G.comp.met) o.유민위치=G.comp.joined?'플레이어와 동행 중':yuminWhereText() });

/* ---------- 만남 · 대화 · 동행 ---------- */
async function meetYumin(place){
  G.comp.met=true; G._yuminHere=true; getRel('유민');
  G.comp.spot=spotHere(); G.comp.spotDay=G.day;
  addLex({name:'유민',cat:'인물',desc:'떠돌이 음유시인. 느긋하고 장난스러운 성격으로, 처음 본 사람에게도 먼저 말을 건다.'},false,null);
  G.chronicle.push({day:G.day,text:`${place}에서 떠돌이 음유시인 유민을 처음 만났다`});
  const unheard=G.rumors.filter(r=>!G.heardRumors.includes(r.region));
  let rumor='';
  if(unheard.length){ const r=rand(unheard); G.heardRumors.push(r.region); rumor=`흘리듯 알려주는 소문: ${r.region} 사람들의 믿음 — "${r.belief}". 이 소문이 그 지역의 전설이라는 것이 서술에서 분명히 드러나게 하라.` }
  await aiTurn(place.includes('길')?'뜨거운 사막 길을 걷는다':'시장 거리를 걷는다', `[첫 만남] ${place}에서 떠돌이 음유시인 유민이 플레이어에게 먼저 말을 건다. 플레이어가 아는 척하지 않아도 유민이 다가온다. 둘은 서로 처음 보는 사이다. 유민은 장난스럽게 거리를 두며 짧은 노래 한 소절을 부르고, 자기 이름을 밝힌다. ${rumor} 선택지에는 유민에게 말을 걸거나 대꾸하는 행동을 포함하라.`, false);
}
function talkYumin(){
  if(busy) return;
  if(!G.comp.joined&&!canMeetHere('유민')) return toast(`유민은 지금 ${yuminWhereText()}에 있는 것 같습니다. 지도의 🎵 표시를 확인해 보세요.`);
  migrate();
  G._yuminHere=true; tick();
  let extra='[유민과 대화] 유민이 노래 한 곡과 함께 소식을 들려준다.', likeKey=null;
  if(G.comp.lastTalkDay!==G.day){
    const locked=Object.keys(YUMIN_LIKES).filter(k=>!G.comp.likes[k]);
    if(locked.length&&Math.random()<0.6) likeKey=rand(locked);
    G.comp.lastTalkDay=G.day; changeAff(2,null);
    const unheard=G.rumors.filter(r=>!G.heardRumors.includes(r.region));
    if(unheard.length){ const r=rand(unheard); G.heardRumors.push(r.region); extra+=` 노래에 실린 소문: ${r.region} 사람들의 믿음 — "${r.belief}". 이것이 그 지역의 전설이라는 것이 드러나게 하라.` }
    else extra+=' 다음 원정에 쓸 만한 힌트(유적의 위험, 별지도에 관한 단서, 적대 세력의 움직임 등)를 노래에 담아 준다.';
    if(rivalOn()&&G.rival.news.some(x=>!x.heard)) extra+=rivalRumorText();
  }else extra+=' 오늘은 이미 소문을 들었으니, 가벼운 수다와 호감도 단계에 맞는 대화.';
  extra+=relArmText('유민',0.6); if(!G.relEvt) extra+=yuminArcArm(0.6);
  if(likeKey) extra+=` [취향 단서] 대화 중 유민이 ${YUMIN_LIKES[likeKey].story}을(를) 유난히 좋아한다는 사실이 자연스럽게 드러나는 대목을 넣어라(왜 좋아하는지 사연 한 줄, 직접 말하지 않고 슬쩍 흘려도 좋다). 플레이어가 알아챌 수 있게 분명하게.`;
  let action='시장에서 유민을 찾아 말을 건다';
  if(isWild()||G.loc==='town') action='유민에게 말을 건다';
  else if(G.loc==='home') action=G.comp.joined?'거점에서 유민에게 말을 건다':'손님방의 유민에게 말을 건다';
  else if(!G.comp.joined){ const s=YUMIN_SPOTS[G.comp.spot]; if(s&&s.kind==='city'){ action=`${s.n}에서 유민을 찾아 말을 건다`; extra+=` [장소] 지금 유민은 카스르의 ${s.n}에 있다. 장면의 배경을 그곳으로 하라.` } }
  if(likeKey) pend('',{likeKey});
  aiTurn(action,extra);
}
on('after',70,T=>{
  const k=T.flags.likeKey; if(!k||!G.comp||G.comp.likes[k]) return;

  G.chronicle.push({day:G.day,text:`유민이 ${YUMIN_LIKES[k].n}을(를) 좋아한다는 것을 알게 되었다`});
});
function joinYumin(fx){

function proposeJoinYumin(){
  if(busy||G.comp.joined||yuminLv()<JOIN_LV||!canMeetHere('유민')) return;

/* ---------- 유민의 능력: 동행 중 유적에서 노래(위기 때) · 경고 · 길 안내 ---------- */
function yuminSkillCheck(){
  if(!G.comp||!G.comp.joined||G.loc!=='dungeon'||!G.dungeon) return '';
  const d=G.dungeon, r=curRoom(); if(!r) return '';
  if(G.steps-G.comp.lastSkill>=6){
    const crisis=G.hp<=Math.ceil(G.maxhp*0.35);
    if(crisis||r.danger>=2||Math.random()<0.2){
      G.comp.lastSkill=G.steps;
      addLog('sys','🎵 유민이 노래를 부르기 시작합니다…');
      if(crisis){ G.hp=Math.min(G.maxhp,G.hp+2); addLog('fx','바람이 당신을 감쌉니다 (체력 +2)') }
      return `
[유민 능력 자동 발동] 유민이 노래를 불러 바람과 모래를 부린다. 버릇대로 과하게 써서 상황이 크게 뒤집힌다(적이 날아가거나, 숨은 통로가 드러나거나, 천장의 모래가 쏟아지는 등 예상 못한 부작용 포함). ${crisis?'플레이어가 위기에 처해 있으니 결과적으로 플레이어를 구하는 방향으로.':''} 노래 가사 한두 줄을 직접 지어 넣어라. 발동 직후 유민다운 농담 한마디.`;
    }
  }
  if(G.steps-(G.comp.lastHelp==null?-99:G.comp.lastHelp)<4||Math.random()>0.35) return '';
  const nexts=r.exits.map(id=>d.rooms.find(x=>x.id===id)).filter(x=>x&&!x.visited), opts=[];
  const risky=nexts.find(x=>x.danger>=2);
  if(risky) opts.push({log:`🎵 유민이 "${risky.name}" 쪽에서 불길한 기척을 느낍니다`,
    ai:`[유민의 경고] 유민이 귀를 기울이다 "${risky.name}" 방향에서 위험한 기척(함정·수호자·무너질 바닥 등 위험도 ${risky.danger}/3에 맞는 것)을 감지하고 짧게 경고한다. 직접적 사실을 다 말하지는 말고 유민답게 농담 섞어 한두 마디.`});
  if(r.fragment&&!r.fragTaken&&!r.exhausted) opts.push({log:'🎵 유민이 이 방 어딘가에서 이상한 울림을 느낍니다',
    ai:'[유민의 직감] 유민이 이 방의 어딘가(벽, 바닥, 천장 중 하나)에서 노래가 이상하게 울린다며 가리킨다. 별지도 조각이 있다는 말은 하지 말고, 조사할 만한 곳을 한 곳 짚어 주는 식으로.'});
  if(r.exhausted) opts.push({log:'🎵 유민이 이 방은 더 볼 게 없다고 말합니다',ai:'[유민의 조언] 유민이 이 방은 이미 다 뒤진 것 같다며 다른 방으로 가자고 한다.'});
  if(nexts.length) opts.push({log:'🎵 유민이 아직 안 가 본 길을 가리킵니다',
    ai:`[유민의 길 안내] 유민이 아직 가 보지 않은 통로 중 한쪽(${nexts.map(x=>x.name).join(', ')} 중 하나)을 가리키며 바람의 방향이 다르다고 말한다. 확실한 정보는 아니고 유민의 감이다.`});
  if(!opts.length) return '';
  const o=risky?opts[0]:rand(opts);
  G.comp.lastHelp=G.steps;
  addLog('sys',o.log);
  return '\n'+o.ai;
}

/* ---------- 선물: 하루 한 번 · 취향(💝)은 대화로 알아감 ---------- */
const likeOf=name=>Object.keys(YUMIN_LIKES).find(k=>YUMIN_LIKES[k].re.test(String(name)));

  if(busy||!G.comp.met) return;

  });
  if(G.mat.relic>0) rows.push(`<div class="shop-row"><span>🏺 고대 유물 <span class="muted">(보유 ${G.mat.relic})</span></span><button class="small" onclick="giveYumin('r')">선물</button></div>`);
  rows.push(`<div class="shop-row"><span>💍 은반지 <span class="muted">(시장에서 구입)</span></span><button class="small" ${G.gold>=40?'':'disabled'} onclick="giveYumin('b')">🪙40 · 선물</button></div>`);
  Object.keys(YUMIN_LIKES).filter(k=>L[k]).forEach(k=>{ const b=YUMIN_LIKES[k].buy; rows.push(`<div class="shop-row"><span>${YUMIN_LIKES[k].ic} ${b.name} <span class="muted">(시장에서 구입 · 💝 좋아함)</span></span><button class="small" ${G.gold>=b.cost?'':'disabled'} onclick="giveYumin('p','${k}')">🪙${b.cost} · 선물</button></div>`) });
  const taste=Object.keys(YUMIN_LIKES).map(k=>L[k]?`${YUMIN_LIKES[k].ic} ${YUMIN_LIKES[k].n}`:'🔒 ???').join(' · ');
  modal('유민에게 선물하기',`<p class="muted">하루에 한 번만 선물할 수 있고, 유민은 선물을 받으면 어색해하며 농담으로 넘기려 합니다. 청혼 때 쓸 반지나 장신구는 남겨 두세요.</p>
    <p style="margin:8px 0"><b>💝 유민의 취향</b> <span class="muted">(대화하며 알아가면 열립니다)</span><br>${taste}</p>${rows.join('')}`);
}
function giveYumin(kind,i){
  if(busy||G.comp.lastGiftDay===G.day) return;
  migrate();
  const L=G.comp.likes, ACC=/반지|목걸이|팔찌|귀걸이|장신구/;
  let name='', v=3, k=null;
  if(kind==='i'){ name=G.items[i]; if(!name) return; v=ACC.test(name)?5:3; k=likeOf(name); G.items.splice(i,1) }
  else if(kind==='r'){ if(G.mat.relic<1) return; G.mat.relic--; name='고대 유물'; v=4 }
  else if(kind==='b'){ if(G.gold<40) return; G.gold-=40; name='은반지'; v=5 }
  else if(kind==='p'){ const b=YUMIN_LIKES[i]&&YUMIN_LIKES[i].buy; if(!b||G.gold<b.cost||!L[i]) return; G.gold-=b.cost; name=b.name; k=i }
  else return;
  if(k) v=8;
  const first=k&&!L[k];
  if(k) L[k]=true;
  G.comp.lastGiftDay=G.day; G._yuminHere=true;
  changeAff(v,null);
  G.chronicle.push({day:G.day,text:`유민에게 ${name}${josa(name,'을','를')} 선물했다${k?' (몹시 기뻐했다)':''}`});
  closeModal(); save(); render();
  if(k) toast(`💝 유민이 크게 기뻐합니다!${first?` (새 취향 발견: ${YUMIN_LIKES[k].n})`:''}`);
  aiTurn(`유민에게 ${name}${josa(name,'을','를')} 선물한다`,
    `[선물] 플레이어가 유민에게 ${name}${josa(name,'을','를')} 건넨다. ${k?`이것은 유민이 유난히 좋아하는 ${YUMIN_LIKES[k].story}이다. 평소의 농담 가면이 잠깐 깨질 만큼 기뻐하며, 왜 좋아하는지 사연을 한 줄 흘린다.`:'유민은 어색해하며 농담으로 넘기려 한다.'} 호감 단계(${affTier().name})에 맞는 진심이 조금 새어 나온다. 코드가 이미 호감도 +${v}를 반영했으니 effects.affinity는 0으로 둘 것. 소지품은 이미 정리했으니 items_remove도 비울 것.`);
}

/* 조용한 순간에 다음 장을 시작할지 (인연 이벤트·재회 이벤트가 없는 턴에만) */
function yuminArcArm(prob){

on('applied',66,e=>{

  if(a.active.setup) return;
  const nx=YUMIN_ARC[a.active.ch];
  if(x.result==='success'){
    a.done.push({ch:a.active.ch,day:G.day}); a.ch=a.active.ch+1; a.active=null;

   19. 인연 — 호감 · 관계 단계 · 연애 · 결혼
   ========================================================= */
function getRel(name){
  if(!G.rel) G.rel={};
  return G.rel[name]||(G.rel[name]={aff:10,stage:0,adult:name==='유민'?true:undefined,cool:0});
}
function relAff(name){ return name==='유민'?G.comp.aff:getRel(name).aff }
function relLv(name){ return affInfo(relAff(name)).lv }
function affPct(name){ return affInfo(relAff(name)).pct }
function addAffTo(name,d){ if(name==='유민') changeAff(d,null); else { const r=getRel(name), b=affInfo(r.aff).lv; r.aff=clamp(r.aff+Math.round(d*AFF_RATE),0,AFF_MAX); lvNotice(name,b,affInfo(r.aff).lv) } }
function otherPartner(name){ return Object.entries(G.rel||{}).some(([n,r])=>n!==name&&r.stage>=4) }
function spouseName(){ const e=Object.entries(G.rel||{}).find(([n,r])=>r.stage===6); return e?e[0]:null }
function relCheck(name){
  const r=getRel(name);
  for(;;){
    const nx=STAGES[r.stage+1];
    if(!nx||nx.event||relLv(name)<nx.lv) break;
    r.stage++;
    G.chronicle.push({day:G.day,text:`${name}${josa(name,'과','와')} ${nx.msg}`});
    toast(`🤝 ${name}: ${nx.n}`);
  }
}
function hasGift(){ return G.items.some(i=>/반지|목걸이|팔찌|귀걸이/.test(i))||G.mat.relic>=1 }
function takeGift(){
  const i=G.items.findIndex(x=>/반지|목걸이|팔찌|귀걸이/.test(x));
  if(i>=0) return G.items.splice(i,1)[0];
  G.mat.relic--; return '고대 유물';
}
function relConds(name){
  const r=getRel(name), nx=STAGES[r.stage+1];
  if(!nx) return {nx:null,c:[],note:'가장 깊은 인연에 이르렀습니다.'};
  if(nx.romance&&r.adult===false) return {nx,c:[],note:'이 인물과의 관계는 우정까지만 이어집니다.'};
  const c=[];
  if(nx.lv) c.push([`호감 레벨 Lv.${nx.lv} 이상 (현재 Lv.${relLv(name)})`,relLv(name)>=nx.lv]);
  if(nx.romance&&r.adult===undefined) c.push(['이 인물을 좀 더 알아야 함',false]);
  if(nx.id>=4) c.push(['다른 연인이나 배우자가 없을 것',!otherPartner(name)]);
  if(nx.event==='heart'||nx.event==='confess') c.push([`이벤트: ${EVT_LABEL[nx.event]} (함께 시간을 보내다 보면 일어남)`,false]);
  if(nx.event==='propose'){ c.push(['거점이 있을 것',has('land')]); c.push(['선물: 반지나 장신구, 또는 유물 1개',hasGift()]) }
  if(nx.event==='wedding'){ c.push([`약혼 후 3일이 지날 것 (${Math.max(0,G.day-(r.engagedDay||G.day))}일 지남)`,G.day-(r.engagedDay||G.day)>=3]); c.push(['혼례 비용 금화 100',G.gold>=100]) }
  if(r.cool&&G.day<r.cool) c.push([`사이가 잠시 어색함 (${r.cool}일째에 풀림)`,false]);
  return {nx,c,note:''};
}
function relArmed(name){
  const r=getRel(name), nx=STAGES[r.stage+1];
  if(!nx||!nx.event||nx.manual||G.relEvt) return false;
  if(r.cool&&G.day<r.cool) return false;
  if(relLv(name)<nx.lv) return false;
  if(nx.romance&&r.adult!==true) return false;
  if(nx.id>=4&&otherPartner(name)) return false;
  return true;
}
function yuminRomanceNote(type){
  if(type==='heart') return ' 유민은 이런 순간에 농담으로 빠져나가려 한다. 그 회피 사이로 진심이 새어 나오는 장면이어야 한다. 유민이 스스로 말을 멈추는 순간을 만들어라.';
  if(type==='confess') return ' 유민은 먼저 고백하지 않는다. 플레이어가 마음을 건네면 처음엔 말이 많아지고 화제를 돌린다. 플레이어가 그 회피를 알아차리고 몰아붙이지 않고 기다려 줄 때에만 유민이 도망치지 않고 머무르기를 택한다.';
  if(type==='propose') return ' 유민에게 누군가와 앞날을 약속하는 건 가장 두려운 일이다. 농담으로 받아치려다 결국 진심으로 대답하는 장면.';
  return '';
}
function relEventIntro(name,type){
  const n1=`${name}${josa(name,'이','가')}`, n2=`${name}${josa(name,'과','와')}`;
  let t='';
  if(type==='heart') t=`[인연 이벤트: 둘만의 시간 — ${name}] ${n2} 단둘이 있게 되는 조용한 순간이 찾아온다. ${n1} 평소 보이지 않던 속마음이나 약한 모습을 내비친다. 플레이어가 진심으로 반응하면 둘 사이의 공기가 달라진다. 이번 장면에서는 결말을 내지 말고 플레이어의 대답을 기다려라. 선택지에 진심으로 다가가는 말, 가볍게 넘기는 말 등을 섞어라.`;
  if(type==='confess') t=`[인연 이벤트: 고백의 순간 — ${name}] ${n2} 플레이어 사이의 감정이 더 이상 숨길 수 없게 되는 장면. 고백은 플레이어가 하거나 ${n1} 할 수 있다. 이번 장면에서는 결말을 내지 말고 플레이어의 대답을 기다려라.`;

function relArmText(name,prob){
  if(!G.comp.met&&name==='유민') return '';

  const nx=STAGES[getRel(name).stage+1];

function relEvtText(){
  if(!G.relEvt||G._relSetup) return '';
  const {name,type}=G.relEvt, n1=`${name}${josa(name,'이','가')}`;
  return `
[진행 중인 인연 이벤트: ${EVT_LABEL[type]} — ${name}] 이 장면에 ${n1} 함께 있다. 플레이어의 행동과 말을 보고 결말이 났으면 effects.relation_event={"name":"${name}","result":"success"} 또는 "fail", 아직이면 "pending". 쉽게 success를 주지 말 것: 플레이어가 진심을 보이고 상대의 마음에 닿는 말이나 행동을 했을 때만 success. 무례하거나 무심하거나 장난으로 넘기면 fail.${name==='유민'?yuminRomanceNote(type):''}`;

    addAffTo(name,-8); r.cool=G.day+3;
    G.chronicle.push({day:G.day,text:`${name}${josa(name,'과','와')}의 사이가 잠시 어색해졌다`});
    fx.push(`${name}${josa(name,'과','와')}의 사이가 어색해졌다`);

function relBlock(text){

  rules.push(`플레이어를 이름으로 부르는 대사에서는 성을 붙이지 말고 이름만 쓴다. 예: "${g}${hasBatchim(g)?'아':'야'}"(O), "${G.char.name}${hasBatchim(G.char.name)?'아':'야'}"(X). 성까지 붙이는 경우는 공식 문서·소개 장면에 한정한다.`);

/* =========================================================
   20-1. 떡밥 장부 — 아직 풀리지 않은 이야기
   - 사전 추출(3장면마다) 때 같은 AI가 새 떡밥을 적고, 풀린 떡밥을 닫음 (호출이 늘지 않음)
   - 서술 AI에게는 매 턴 2~3개를 '자연스러우면 회수'로 넘김 (억지로 풀지 않게)
   - G.threads=[{id,text,day,status:'open'|'closed',closedDay,shown}]
   ========================================================= */
const THREAD_MAX=12, THREAD_PROMPT=3;
function threadsOpen(g){ g=g||G; return (g.threads||[]).filter(t=>t.status==='open') }
function threadsRequest(g){
  const open=threadsOpen(g);
  return `
[열린 이야기 정리 — 사전과 별도]
'열린 이야기'는 플레이어가 장면에서 직접 보거나 들은 것 중 아직 풀리지 않은 것이다: 인물이 한 약속이나 부탁, 답이 나오지 않은 수수께끼, 인물의 미해결 사정, 예고된 위협, 다시 만나자고 한 사람. 사소한 묘사·이미 끝난 일·플레이어가 모르는 비밀은 넣지 않는다.
- threads_new: 이번 장면들에서 새로 생긴 열린 이야기(최대 2개, 각 40자 이내, 누가·무엇을이 드러나게). 아래 목록과 겹치면 넣지 말 것. 없으면 [].
- threads_closed: 아래 목록 중 이번 장면들에서 분명히 풀렸거나 끝난 것의 id. 없으면 [].
[현재 열린 이야기 목록]
${open.map(t=>`${t.id}: ${t.text}`).join('\n')||'(없음)'}`;
}
function applyThreads(g,r){
  if(!g.threads) g.threads=[];
  const closed=new Set((Array.isArray(r.threads_closed)?r.threads_closed:[]).map(String));
  let nc=0, nn=0;
  g.threads.forEach(t=>{ if(t.status==='open'&&closed.has(t.id)){ t.status='closed'; t.closedDay=g.day; nc++ } });
  (Array.isArray(r.threads_new)?r.threads_new:[]).slice(0,2).forEach(x=>{
    const text=String(x&&(x.text||x)||'').trim().slice(0,60); if(text.length<4) return;
    if(threadsOpen(g).some(t=>t.text===text)) return;
    g.threadN=(g.threadN||0)+1;
    g.threads.push({id:'t'+g.threadN,text,day:g.day,status:'open',shown:0}); nn++;
  });
  // 너무 많이 쌓이면 가장 오래된 것부터 '흐지부지'로 닫음
  const open=threadsOpen(g);
  if(open.length>THREAD_MAX) open.slice(0,open.length-THREAD_MAX).forEach(t=>{ t.status='faded'; t.closedDay=g.day });
  g.threads=g.threads.filter(t=>t.status==='open'||g.day-(t.closedDay||g.day)<=30).slice(-40);   // 닫힌 기록은 한 달만 보관
  if(nn) toast(`🧵 열린 이야기 ${nn}개가 적혔습니다`);
  if(nc) toast(`🧵 열린 이야기 ${nc}개가 풀렸습니다`);
}
/* 이번 턴에 서술 AI에게 넘길 것: 지금 장면에 이름이 나온 것 → 오래 언급 안 된 것 순 */
function pickThreads(text){
  const open=threadsOpen(); if(!open.length) return [];
  const hit=t=>t.text.split(/[\s,·.()「」'"]+/).filter(w=>w.length>=2).some(w=>text.includes(w));
  return [...open].sort((a,b)=>(hit(b)-hit(a))||((a.shown||0)-(b.shown||0))||(a.day-b.day)).slice(0,THREAD_PROMPT);
}
function threadsBlock(text){
  const list=pickThreads(text); if(!list.length) return '';
  list.forEach(t=>t.shown=(t.shown||0)+1);
  return `\n[열린 이야기 — 아직 풀리지 않은 것. 지금 장면과 자연스럽게 이어질 때만 하나를 이어 가거나 매듭지어라. 억지로 끌어오지 말고, 이번 장면과 무관하면 무시해도 된다. 목록이 있다는 사실은 서술에 드러내지 말 것]\n${list.map(t=>'- '+t.text).join('\n')}`;
}
function closeThread(id){ const t=(G.threads||[]).find(x=>x.id===id); if(!t) return; t.status='closed'; t.closedDay=G.day; _sigR=''; save(); renderSides(); if(document.getElementById('thrList')) openThreads() }
function reopenThread(id){ const t=(G.threads||[]).find(x=>x.id===id); if(!t) return; t.status='open'; delete t.closedDay; _sigR=''; save(); renderSides(); openThreads() }
function addThread(){
  const el=document.getElementById('thrNew'); const v=(el&&el.value||'').trim().slice(0,60); if(!v) return;
  applyThreads(G,{threads_new:[{text:v}]}); _sigR=''; save(); renderSides(); openThreads();
}
function threadsSideHTML(){
  const open=threadsOpen();
  return `<div class="sec"><h4>🧵 열린 이야기 <button class="small" onclick="openThreads()">관리</button></h4>${open.slice(-5).reverse().map(t=>`<div class="ch"><span class="d">${t.day}일</span><span>${esc(t.text)}</span></div>`).join('')||'<div class="muted">아직 없습니다. 이야기 속 약속·수수께끼가 자동으로 적힙니다.</div>'}${open.length>5?`<div class="muted" style="font-size:12px">외 ${open.length-5}개</div>`:''}</div>`;
}
function openThreads(){
  const all=G.threads||[], open=all.filter(t=>t.status==='open'), done=all.filter(t=>t.status!=='open').slice(-15).reverse();
  modal('🧵 열린 이야기',`<p class="muted">이야기 속에서 생긴 약속·수수께끼·인물의 사정 중 아직 풀리지 않은 것입니다. 사전을 정리할 때 함께 적히고, 풀리면 자동으로 닫힙니다. 이야기꾼은 매 장면 몇 개를 참고해 자연스러울 때 이어 갑니다(최대 ${THREAD_MAX}개).</p>
    <div id="thrList">${open.map(t=>`<div class="shop-row" style="gap:8px"><span><span class="muted">${t.day}일 ·</span> ${esc(t.text)}</span><button class="small" onclick="closeThread('${t.id}')">✓ 닫기</button></div>`).join('')||'<p class="muted">열린 이야기가 없습니다.</p>'}</div>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="thrNew" placeholder="직접 적기 (예: 하킴이 은화를 갚겠다고 했다)" maxlength="60"><button class="small" onclick="addThread()">추가</button></div>
    ${done.length?`<h4 style="margin:14px 0 4px">최근에 닫힌 것</h4>${done.map(t=>`<div class="shop-row muted" style="gap:8px"><span>${t.status==='faded'?'💨':'✓'} ${esc(t.text)}</span><button class="small" onclick="reopenThread('${t.id}')">다시 열기</button></div>`).join('')}`:''}`);
}

/* =========================================================
   20. 사전 — 별도 AI가 정리 (3턴마다 한 번, 또는 장소를 옮길 때)
   ========================================================= */
const LEX_CATS=['인물','장소','전설','물건','세력'];
/* ruinName: 이 항목이 생긴 유적 이름 (탐사를 마치면 인물·세력·즐겨찾기 말고는 정리됨 — 장소·전설은 합치고 물건은 삭제).
   undefined면 지금 유적 안에 있을 때 그 유적으로 표시 */
function addLex(e,silent,ruinName){
  if(!e||!e.name||!e.desc) return;
  const cat=LEX_CATS.includes(e.cat)?e.cat:'전설';
  const ex=G.lexicon.find(x=>x.name===e.name);
  if(ex){
    if(ex.desc.includes(e.desc)) return;
    ex.desc=(ex.desc+' '+e.desc).slice(-500); ex.isNew=true;
    if(!silent) toast(`📜 사전 갱신: ${e.name}`);
    return;
  }
  const x={name:e.name,cat,desc:e.desc,isNew:!silent};
  const rn=ruinName!==undefined?ruinName:((G.dungeon&&(G.loc==='dungeon'||G.loc==='camp'))?G.dungeon.name:null);
  if(rn) x.ruin=rn;
  G.lexicon.push(x);
  if(!silent) toast(`📜 사전에 새 항목: ${e.name}`);
}
/* 사전 추출 대기열 — G._lexQ = {key, ruin, items:[{a:행동, n:서술}]} (저장에 함께 남음) */
function lexKey(){ if(G.dungeon&&['dungeon','camp','road'].includes(G.loc)) return 'ruin:'+G.dungeon.name; return G.loc==='town'?'town:'+G.town:G.loc }
function queueLex(narr,action){
  if(!G) return;
  const key=lexKey();
  if(G._lexQ&&G._lexQ.items.length&&G._lexQ.key!==key) flushLex();
  if(!G._lexQ||G._lexQ.key!==key) G._lexQ={key,ruin:key.startsWith('ruin:')?G.dungeon.name:null,items:[]};
  G._lexQ.items.push({a:String(action||'').slice(0,200),n:String(narr||'')});
  if(G._lexQ.items.length>=LEX_EVERY) flushLex();
}
/* 장소를 옮겼으면(화면을 그릴 때 확인) 이전 장소에서 쌓인 장면을 정리 */
function lexMovedCheck(){ const q=G&&G._lexQ; if(!busy&&q&&q.items.length&&q.key!==lexKey()) flushLex() }
function flushLex(){
  const q=G&&G._lexQ; if(!q||!q.items.length) return;
  G._lexQ={key:q.key,ruin:q.ruin,items:[]};
  extractLex(q).catch(e=>console.warn(e));
}
async function extractLex(q){
  const g=G;
  const names=g.lexicon.map(e=>e.name).slice(-80).join(', ')||'(없음)';
  const scenes=q.items.map((x,i)=>`(${i+1}) 플레이어: ${x.a}\n${x.n}`).join('\n\n');
  const prompt=`다음은 텍스트 탐험 게임의 최근 장면들이다. 이 장면들에서 새로 등장했거나 새로 알게 된 인물, 장소, 전설, 물건, 세력만 뽑아 사전 항목으로 정리하라.
- 이미 사전에 있는 대상이면 반드시 같은 이름을 쓰고, desc에는 이번에 새로 알게 된 내용만 쓴다.
- 플레이어 캐릭터(${g.char.name}) 자신은 넣지 않는다. 몬스터·동물은 '인물'로 넣지 않는다.${q.ruin?`
- 이 장면들은 유적 「${q.ruin}」 안의 일이다. 방 이름·문양·사소한 물건은 넣지 말고, 인물과 오래 간직할 만한 물건, 세계의 전설에 이어지는 것만 넣는다.`:''}
- 새 정보가 없으면 빈 배열. 최대 6개.
[이미 있는 항목 이름] ${names}
[관련 항목]
${relevantLex(scenes)}
[장면]
${scenes}
${threadsRequest(g)}
JSON만 출력: {"lexicon":[{"name":"이름","cat":"인물|장소|전설|물건|세력","desc":"플레이어가 알게 된 내용 1~2문장"}],"threads_new":[{"text":"열린 이야기 한 줄"}],"threads_closed":["t1"]}`;
  let r=null;
  try{ r=parseJSON(await callAI('너는 게임 사전을 정리하는 서기다. JSON 하나만 출력한다.',prompt,1000,'lex')) }catch(e){ return }
  if(G!==g||!r) return;
  applyThreads(g,r);
  if(!Array.isArray(r.lexicon)){ save(); render(); return }
  // 이 장면들의 유적이 아직 진행 중(또는 중단)이면 그 유적 표시, 이미 끝난 유적이면 인물·물건만 남김
  const active=!!q.ruin&&((g.dungeon&&g.dungeon.name===q.ruin)||(g.pausedRuins||[]).some(d=>d.name===q.ruin));
  r.lexicon.slice(0,6).forEach(e=>{
    if(!e||!e.name||e.name===g.char.name) return;
    if(q.ruin&&!active&&e.cat==='전설'){ mergeRuinLegend(q.ruin,[e]); return }
    if(q.ruin&&!active&&e.cat==='장소'){ mergeRuinPlaces(q.ruin,[e]); return }   // 끝난 유적의 장소 → 「유적 이름」 기록에 합침   // 끝난 유적의 전설 → 요약 항목에 합침
    if(q.ruin&&!active&&!['인물','물건'].includes(e.cat)) return;
    addLex(e,false,q.ruin&&active?q.ruin:null);
  });
  save(); render();
}
/* 유적 탐사를 마치거나 포기하면, 그 유적에서 생긴 항목 정리
   - 인물·세력·즐겨찾기: 그대로 남김 (물건은 삭제)
   - 전설: 「유적 이름의 전설」 한 항목으로 요약해 남김 (고대사 시대 항목과 연결)
   - 장소: 「유적 이름」 항목에 '둘러본 곳' 한 줄로 합침
   - 세력: 지움 */
function ruinLegendName(ruin){ return `${ruin}의 전설` }
function mergeRuinLegend(ruin,list){
  list=list.filter(e=>e&&e.desc); if(!list.length) return null;
  const name=ruinLegendName(ruin);
  let x=G.lexicon.find(e=>e.name===name);
  const add=list.map(e=>`${e.name}: ${e.desc}`).filter(t=>!x||!x.desc.includes(t));
  if(!add.length) return x;
  const text=add.join(' / ');
  if(x){ x.desc=trunc(x.desc+' / '+text,400); x.isNew=true; x.sumPending=(x.sumPending||0)+add.length }
  else{ x={name,cat:'전설',desc:trunc(text,400),isNew:true,ruinLegend:ruin,sumPending:add.length}; G.lexicon.push(x) }
  if(x.sumPending>=2) summarizeRuinLegend(x);   // 두 개 이상 모였으면 AI가 한 문단으로 다듬음
  linkLegendEra(ruin);
  return x;
}
/* 유적의 장소 항목(방·구역) → 「유적 이름」 항목 끝에 '둘러본 곳: 이름(짧은 설명)' 한 줄로 */
function setPlaceNote(x,note){
  const base=x.placeNote&&x.desc.endsWith(x.placeNote)?x.desc.slice(0,-x.placeNote.length):x.desc;
  x.placeNote=note; x.desc=trunc(base,380)+note;
}
function mergeRuinPlaces(ruin,list){
  list=list.filter(e=>e&&e.name&&e.name!==ruin); if(!list.length) return null;
  let x=G.lexicon.find(e=>e.name===ruin);
  if(!x){ x={name:ruin,cat:'장소',desc:'사막의 유적.',isNew:true}; G.lexicon.push(x) }
  const places=x.places||[];
  list.forEach(e=>{ if(!places.some(p=>p.n===e.name)) places.push({n:e.name,d:trunc(String(e.desc||'').replace(/\s+/g,' '),28)}) });
  x.places=places.slice(-6);
  setPlaceNote(x,` · 둘러본 곳: ${x.places.map(p=>`${p.n}(${p.d})`).join(', ')}`);
  x.isNew=true;
  return x;
}
/* 「유적 이름의 전설」 ↔ 고대사 시대: 시대 항목에 전설 이름을 적고, 전설 항목에 시대를 기록 */
function ruinEra(ruin){ return (G.ancient||[]).find(e=>e.ruins.some(r=>r.name===ruin)) }
function eraEntryDesc(era){
  const list=era.ruins.map(x=>`「${x.name}」${x.full?'':'(일부)'}`).join(', ');
  const legends=era.ruins.map(x=>ruinLegendName(x.name)).filter(n=>G.lexicon.some(e=>e.name===n));
  return `${era.pub} 이 시대의 흔적이 남은 유적: ${list}.`+(era.ruins.filter(x=>x.full).length>=2?` 여러 유적에서 「${era.fig}」의 이름이 되풀이해 나온다.`:'')+(legends.length?` 관련 전설: ${legends.map(n=>`「${n}」`).join(', ')}.`:'');
}
function linkLegendEra(ruin){
  const era=ruinEra(ruin), x=G.lexicon.find(e=>e.name===ruinLegendName(ruin));
  if(!era||!x) return;
  x.era=era.name;
  upsertLex(era.name,'전설',eraEntryDesc(era),{eraRec:true,fav:true});
}
const legendBusy=new Set();
async function summarizeRuinLegend(x){
  if(legendBusy.has(x.name)) return; legendBusy.add(x.name);
  const g=G, before=x.desc;
  try{
    const r=parseJSON(await callAI('너는 게임 사전을 정리하는 서기다. 사실을 지어내지 말고 주어진 내용만 요약한다. JSON만 출력한다.',
      `다음은 유적 「${x.ruinLegend}」에서 플레이어가 알게 된 전설 조각들이다. 겹치는 내용은 합치고 핵심만 남겨 2~3문장(200자 이내)의 한 문단으로 요약하라. 등장하는 고유 이름은 그대로 쓴다.
${before}
JSON만: {"text":"..."}`,500,'lex'));
    if(G===g&&r&&r.text&&String(r.text).trim()&&x.desc===before){ x.desc=String(r.text).trim().slice(0,300); x.sumPending=0; save(); render() }
  }catch(e){}
  finally{ legendBusy.delete(x.name) }
}
function purgeRuinLex(name){
  if(!name||!G||!Array.isArray(G.lexicon)) return 0;
  const gone=e=>e.ruin===name&&!e.fav&&e.cat!=='인물'&&e.cat!=='세력';   // 인물·세력·즐겨찾기만 남기고, 물건은 합치지 않고 삭제
  const legends=G.lexicon.filter(e=>gone(e)&&e.cat==='전설'), places=G.lexicon.filter(e=>gone(e)&&e.cat==='장소');
  const b=G.lexicon.length;
  G.lexicon=G.lexicon.filter(e=>!gone(e));
  const n=b-G.lexicon.length;
  const L=legends.length?mergeRuinLegend(name,legends):null;
  const P=places.length?mergeRuinPlaces(name,places):null;
  if(n>0) toast(`📜 「${name}」의 사전 항목 ${n}개를 정리했습니다${P?` · 장소는 「${name}」 기록에`:''}${L?` · 전설은 「${L.name}」로`:''} 합침`);
  return n;
}
/* 오래된 장소·전설·물건 항목이 40개를 넘으면 모음 항목으로 요약하고 원본은 보관 */
let lexCompacting=false;
async function lexCompact(force){
  if(lexCompacting||!G||!Array.isArray(G.lexicon)) return;
  if(!force&&SET.lexAuto===false) return;
  const g=G;
  const cand=G.lexicon.filter(e=>!e.arch&&!e.fav&&!e.sum&&!e.ruin&&['장소','전설','물건'].includes(e.cat));
  if(!force&&cand.length<=40) return;
  if(force&&cand.length<6) return toast('정리할 오래된 항목이 아직 많지 않습니다');
  const batch=cand.slice(0,force?Math.min(30,cand.length-3):20);
  lexCompacting=true;
  if(force) toast('🧹 사전을 정리하는 중…');
  let merged=0, groups=0;
  try{
    for(const cat of ['장소','전설','물건']){
      const part=batch.filter(e=>e.cat===cat);
      if(part.length<3) continue;

async function maybeSummarize(){

중요한 인물, 장소, 약속, 단서, 플레이어의 선택을 우선 남기고, 사소한 묘사는 버려라. 700자 이내, 한국어 평문.
[기존 요약]
${G.summary||'(없음)'}
[이후 장면]
${txt}
JSON만: {"summary":"..."}`;
  try{
    const r=parseJSON(await callAI('너는 게임 기록을 정리하는 서기다. JSON만 출력한다.',prompt,900,'summary'));
    if(r&&r.summary) G.summary=r.summary;

}
function chronLabel(c){ return (c.tier&&c.to>c.day)?`${c.day}~${c.to}일`:`${c.day}일` }
function chronTierMark(c){ return c.tier==='month'?'월간':c.tier==='week'?'주간':c.tier==='day'?'요약':'' }
async function condenseChron(items,from,to,lim){
  if(items.length===1) return items[0].text;
  const span=from===to?`${from}일차`:`${from}~${to}일차`;
  const prompt=`다음은 ${span}의 연대기 기록이다. 중요한 사건·인물·약속·단서·획득/상실을 남기고 사소한 것은 버려, ${lim}자 이내 한국어 평문 한두 문장으로 합쳐라.
${items.map(x=>'- '+x.text).join('\n')}
JSON만: {"text":"..."}`;
  try{
    const r=parseJSON(await callAI('너는 게임 기록을 정리하는 서기다. JSON만 출력한다.',prompt,400,'chron'));
    if(r&&r.text&&String(r.text).trim()) return String(r.text).trim();
  }catch(e){}
  return items.map(x=>x.text).join(' / ').slice(0,lim+40);
}
function replaceChronGroup(g,grp,digest){
  const arr=g.chronicle, pos=arr.findIndex(c=>grp.includes(c)); if(pos<0) return;
  let ins=0; for(let i=0;i<pos;i++) if(!grp.includes(arr[i])) ins++;
  const keep=arr.filter(c=>!grp.includes(c)); keep.splice(ins,0,digest); g.chronicle=keep;
}
let chronBusy=false;
async function compactChronicle(){
  if(chronBusy||!G||!Array.isArray(G.chronicle)) return;
  chronBusy=true; const g=G; let changed=false;
  try{
    for(let n=0;n<400;n++){   // 지난 날의 개별 기록 → 하루 요약
      const raw=g.chronicle.filter(c=>!c.tier&&c.day<g.day); if(!raw.length) break;
      const d=raw[0].day, grp=raw.filter(c=>c.day===d);
      const text=await condenseChron(grp,d,d,80); if(G!==g) return;
      replaceChronGroup(g,grp,{day:d,to:d,tier:'day',text}); changed=true;
    }
    for(let n=0;n<100;n++){   // 한 주(7일 블록)가 끝나고 한 주 더 지나면 → 주간 요약
      const ds=g.chronicle.filter(c=>c.tier==='day'); let w=null;
      for(const c of ds){ const k=Math.floor((c.day-1)/7); if(g.day>7*(k+2)){ w=k; break } }
      if(w===null) break;
      const grp=ds.filter(c=>Math.floor((c.day-1)/7)===w), from=grp[0].day, to=grp[grp.length-1].to;
      const text=await condenseChron(grp,from,to,120); if(G!==g) return;
      replaceChronGroup(g,grp,{day:from,to,tier:'week',text}); changed=true;
    }
    for(let n=0;n<50;n++){    // 한 달(30일 블록) → 월간 요약
      const ws=g.chronicle.filter(c=>c.tier==='week'); let m=null;
      for(const c of ws){ const k=Math.floor((c.day-1)/30); if(g.day>30*(k+2)){ m=k; break } }
      if(m===null) break;
      const grp=ws.filter(c=>Math.floor((c.day-1)/30)===m), from=grp[0].day, to=grp[grp.length-1].to;
      const text=await condenseChron(grp,from,to,160); if(G!==g) return;
      replaceChronGroup(g,grp,{day:from,to,tier:'month',text}); changed=true;
    }
  }catch(e){ console.warn('연대기 압축 실패',e) }
  finally{ chronBusy=false }
  if(changed&&G===g){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(G)) }catch(e){} render() }
}

    <p class="muted" style="margin-top:8px">체크를 끄면 잠시 꺼 두고, 삭제하면 완전히 지웁니다. 입력창에서 <b>//</b> 또는 <b>OOC:</b> 로 시작하는 글을 보내도 이 창이 열립니다.</p>

}
