<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모래 아래의 도시</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3e7cf; --panel:#fbf4e4; --ink:#3a2a1a; --muted:#7a6248; --line:#d9c39c;
  --accent:#a8452b; --accent2:#2f6f73; --gold:#b8862b; --danger:#b23a2a; --ok:#3d7a3a;
  --shadow:0 2px 10px rgba(80,50,20,.12);
  --map-sea:#e9dec6; --map-land:#fbf6ea; --map-line:#b49a72;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1510; --panel:#251d16; --ink:#efe2c8; --muted:#b39a78; --line:#4a3a2a;
    --accent:#e07a52; --accent2:#5fb0b4; --gold:#e0b04a; --danger:#e0604c; --ok:#7cc06f;
    --shadow:0 2px 10px rgba(0,0,0,.4);
    --map-sea:#141009; --map-land:#3a2f24; --map-line:#8a7352;
  }
}
:root[data-theme="dark"]{
  --map-sea:#141009; --map-land:#3a2f24; --map-line:#8a7352;
  --bg:#1b1510; --panel:#251d16; --ink:#efe2c8; --muted:#b39a78; --line:#4a3a2a;
  --accent:#e07a52; --accent2:#5fb0b4; --gold:#e0b04a; --danger:#e0604c; --ok:#7cc06f;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,.serif{font-family:'Gowun Batang',serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:4px 10px;font-size:13px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-weight:500;margin:12px 0 4px}

/* title */
#title{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
#title h1{font-size:34px;margin:0 0 6px;color:var(--accent)}
#title .sub{color:var(--muted);margin-bottom:28px}
#title .btns{display:flex;flex-direction:column;gap:10px;width:240px;margin:0 auto}

/* creation */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.stat-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.stat-row .nm{width:90px}
.stat-row .val{width:28px;text-align:center;font-weight:700}

/* game */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;max-width:860px;margin:0 auto}
.stats .st{white-space:nowrap}
.stats .low{color:var(--danger);font-weight:700}
.where{max-width:860px;margin:2px auto 0;font-size:13px;color:var(--muted)}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 12px}
#log .inner{max-width:860px;margin:0 auto}
.entry{margin:0 0 14px}
.entry.scene p{margin:0 0 8px;font-family:'Gowun Batang',serif;font-size:16px}
.entry.scene strong{font-weight:700;background:linear-gradient(transparent 62%,rgba(214,170,80,.3) 0)}
.entry.scene em{font-style:italic;opacity:.92}
.entry.action{color:var(--accent2);font-weight:500;font-size:14px}
.entry.action::before{content:'▸ '}
.entry.sys{color:var(--muted);font-size:13px;border-left:3px solid var(--line);padding-left:8px}
.entry.fx{font-size:13px;color:var(--gold)}
.controls{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px}
.controls .inner{max-width:860px;margin:0 auto}
.choices{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.choices button{text-align:left}
.fixed{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fixed button{font-size:13px;padding:6px 10px}
.hscroll{display:flex;flex-wrap:nowrap;gap:6px;flex:0 0 100%;width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.hscroll button{flex:0 0 auto;white-space:nowrap}
.free{display:flex;gap:6px}
.free input{flex:1}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px}
.loading{color:var(--muted);font-style:italic;padding:6px 0}
.loading::after{content:'';animation:dots 1.2s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}


/* ---------- 3단 레이아웃 ---------- */
#game{display:grid;grid-template-columns:268px minmax(0,1fr) 288px;height:100vh;height:100dvh}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.tb .stats{max-width:none;margin:0;flex:1}
.dup{display:none}
.only-narrow{display:none}
.scrim{display:none}
.side{background:var(--panel);overflow-y:auto;min-height:0}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.sidehead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.sidehead b{font-family:'Gowun Batang',serif;font-size:16px}
.sbody{padding:12px 14px 28px}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side .name{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;line-height:1.3}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:14px}
.grid2>div{display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px}
.bio{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0}
.ch{font-size:13px;margin-bottom:6px;display:flex;gap:8px}
.ch .d{color:var(--muted);white-space:nowrap}
.side details{border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-bottom:5px;background:var(--bg)}
.side summary{cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.side details p{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.nw{color:var(--accent);font-size:11px;font-weight:700}
.lt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lt button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sbtn{display:flex;flex-direction:column;gap:6px}

/* ---------- 지도 영역 ---------- */
.mapbox{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.maphead .wt{font-size:13px;color:var(--muted)}
.maptabs{display:none;gap:6px}
.maptabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mapcols{display:flex;gap:10px;align-items:stretch}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
.cmap{flex:0 1 auto;min-width:0;display:flex;align-items:center}
.locp{flex:1 1 200px;min-width:200px}
.cmapsvg,.roomsvg{width:100%;height:auto;display:block}
.roomsvg{max-height:175px}
.cmapsvg{height:clamp(150px,23vh,215px);width:auto;max-width:100%;margin:0 auto}
.mapwrap{position:relative;height:clamp(160px,25vh,240px);aspect-ratio:3/2;max-width:100%;margin:0 auto;cursor:zoom-in;border-radius:10px;overflow:hidden}
.mapwrap .mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.mapwrap .mapovl,.mapwrap .mapovl svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .zoomhint{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(42,29,19,.72);color:#f6ead2;border-radius:10px;padding:1px 8px}
.mapwrap.big{height:auto;width:min(100%,calc((86vh - 130px)*1.5));cursor:default}
.modal.wide{max-width:min(1100px,96vw)}
@media (min-width:1001px){.choices{display:grid;grid-template-columns:1fr 1fr}.choices .loading{grid-column:1/-1}}
.locp h5{margin:2px 4px 0;font-family:'Gowun Batang',serif;font-size:15px}
.locp .sub{margin:0 4px 4px;font-size:12px;color:var(--muted)}
.locl{margin:6px 4px;padding-left:18px;font-size:13px}
.mapcap{font-size:12px;margin-top:5px}
.mapbox.collapsed .mapcols,.mapbox.collapsed .mapcap{display:none}
.mapbox.collapsed{padding-bottom:6px}
.mapbox.collapsed .maphead{margin-bottom:0}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- 좁은 화면: 사이드바는 서랍 ---------- */
@media (max-width:1000px){
  #game{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;width:min(86vw,320px);z-index:15;transition:transform .22s ease,visibility .22s;box-shadow:var(--shadow);visibility:hidden}
  .side.left{left:0;transform:translateX(-104%)}
  .side.right{right:0;transform:translateX(104%)}
  .side.open{transform:none;visibility:visible}
  .only-narrow{display:inline-block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:14}
  .scrim.on{display:block}
}
@media (max-width:760px){
  .maptabs{display:flex}
  .maphead .wt{display:none}
  .mapbox[data-tab="cont"] .locp{display:none}
  .mapbox[data-tab="loc"] .cmap{display:none}
  .cmap{flex:1}
  .cmapsvg{width:100%;height:auto;max-height:190px}
  .mapwrap{height:auto;width:100%;max-height:230px}
  .mapcap{display:none}
  .fixed button{padding:5px 9px}
}

/* ---------- 좁은 화면: 선택지 목록에만 높이 제한 (본문이 가려지지 않게) — 칩 줄과 입력줄은 항상 보임 ---------- */
@media (max-width:760px){
  .choices{max-height:22dvh;overflow-y:auto;overscroll-behavior:contain}
  #log{min-height:160px}
}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0}
.modal .body{padding:12px 16px;overflow-y:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font-size:13px;padding:4px 10px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lex{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.lex .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lex .cat{font-size:12px;color:var(--muted)}
.lex .new{color:var(--accent);font-size:12px;font-weight:700}
.chron{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.chron .d{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:.95}
.shop-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:520px){ .stats{font-size:13px;gap:4px 10px} #title h1{font-size:28px} }

/* ---------- 상단 부가 줄 · 글자 크기 · 상단바 접기 ---------- */
#topExtra{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 12px 4px;flex-wrap:wrap}
#usageChip{font-size:12px;color:var(--muted);cursor:pointer;padding:2px 0;text-align:right;user-select:none}
#usageChip:hover{color:var(--accent)}
#fontCtl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
#fontCtl button{padding:1px 8px;font-size:12px}
#fsLabel{min-width:38px;text-align:center;cursor:pointer;user-select:none}
#log .entry.scene p{font-size:calc(16px*var(--fs,1))}
#log .entry.action{font-size:calc(14px*var(--fs,1))}
#log .entry.sys,#log .entry.fx{font-size:calc(13px*var(--fs,1))}
.choices button{font-size:calc(15px*var(--fs,1))}
.topbar.folded .where,.topbar.folded #topExtra,.topbar.folded #needBar{display:none}
.topbar.folded{padding-top:4px;padding-bottom:4px}
#topFold{flex:0 0 auto;min-width:34px}
#needBar{max-width:860px;margin:3px auto 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
#needBar .nb{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#needBar .pips{letter-spacing:1px;font-size:11px}
#needBar .warn{color:var(--danger);font-weight:600}
#needBar .ok{color:var(--ok);font-weight:600}

/* ---------- 넓은 화면: 사이드바 접기 · 가장자리 손잡이 ---------- */
.only-wide{display:inline-block}
@media (max-width:1000px){ .only-wide{display:none} }
@media (min-width:1001px){
  #game{grid-template-columns:var(--wl,268px) minmax(0,1fr) var(--wr,288px);transition:grid-template-columns .2s ease}
  #game.hideL{--wl:0px} #game.hideR{--wr:0px}
  #game.hideL #sideL,#game.hideR #sideR{visibility:hidden;overflow:hidden;border-width:0}
  .tb .only-narrow{display:inline-block}
  #game.hideL .sideTab.l,#game.hideR .sideTab.r{display:block}
}
@media (prefers-reduced-motion:reduce){ #game{transition:none} }
.sideTab{display:none;position:fixed;top:50%;transform:translateY(-50%);z-index:12;padding:14px 5px;font-size:13px;line-height:1.1;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);writing-mode:vertical-rl}
.sideTab.l{left:0;border-radius:0 10px 10px 0;border-left:0}
.sideTab.r{right:0;border-radius:10px 0 0 10px;border-right:0}
.sideTab:hover{color:var(--accent)}

/* ---------- 좁은 화면 ---------- */
.main{overflow-y:auto}
#log{min-height:110px}
@media (max-width:760px){
  #topExtra{display:none}
  .mapwrap{max-height:min(230px,24dvh)}
  #game .free{flex-wrap:wrap} #game .free input{flex:1 1 100%} #game .free button{flex:1 1 0;white-space:nowrap}
}
@media (max-height:520px) and (max-width:1000px){ .mapwrap{max-height:26dvh} }

/* ---------- 지도: 비율 상자 (Safari에서도 접히지 않게) · 벡터 그림 ---------- */
.mapwrap{height:auto;aspect-ratio:auto;width:calc(clamp(160px,25vh,240px)*1.5);max-width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mapwrap::before{content:'';display:block;padding-top:66.6667%}
.mapwrap .mapimg,.mapwrap .mapovl,.mapwrap .mapovl svg{top:0;left:0}
.mapwrap.big{width:min(100%,calc((86vh - 130px)*1.5));cursor:default}
@media (max-width:760px){ .cmap{display:block} .mapwrap{width:100%} }
.mapwrap .mapart{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .mapart svg{width:100%;height:100%;display:block}

/* ---------- 선택지·버튼 표시 ---------- */
.lbl{grid-column:1/-1;flex:0 0 100%;font-size:11.5px;color:var(--muted);margin:2px 2px 0;letter-spacing:.2px}
.fixed button.mv{border-style:dashed}
.choices .lbl+button{margin-top:0}
#intentChip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}
#intentChip .q{flex:1 1 100%}
#intentChip select{width:auto;padding:3px 6px;font-size:13px}
.cbadge{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-right:6px;color:var(--muted);vertical-align:1px}
.cbadge.ck{border-color:var(--gold);color:var(--gold)}
.cbadge.sys{border-color:var(--accent2);color:var(--accent2)}

.maphead{flex-wrap:wrap}
.maphead button{white-space:nowrap}
@media (max-width:760px){ #zoomLbl{min-width:22px!important} .maptabs button,.maphead button{padding:4px 8px} }
/* ---------- 탐사 수첩 ---------- */
.rj-clue{border-left:3px solid var(--gold);padding:4px 10px;margin:6px 0;background:var(--bg);border-radius:0 8px 8px 0}
.rj-clue.locked{border-left-color:var(--line);color:var(--muted)}
.rj-era{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.rj-era b{font-family:'Gowun Batang',serif}

.dc-scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:10px;overflow:hidden;background:linear-gradient(#f3dfb0,#d9b673);border:1px solid var(--line,#ccc);user-select:none;touch-action:none}
.dc-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dc-base,.dc-it img{image-rendering:pixelated}
.dc-note{position:absolute;left:8px;top:6px;font-size:12px;opacity:.7}
.dc-it{position:absolute;transform:translate(-50%,-50%)}
.dc-it.mv{cursor:grab;touch-action:none}
.dc-it.sel{outline:2px dashed #e0402f;outline-offset:2px}
.dc-it img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.dc-fb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:clamp(18px,4vw,34px);pointer-events:none}
</style>
</head>
<body>

<!-- 타이틀 -->
<section id="title">
  <div>
    <h1>모래 아래의 도시</h1>
    <div class="sub serif">별지도 조각을 모아, 모래에 삼켜진 황금 도시 이람을 찾아라</div>
    <div class="btns">
      <button class="primary" onclick="startCreation()">새 여정</button>
      <button id="btnContinue" onclick="continueGame()">이어하기</button>
      <button onclick="openGuide()">📖 게임 가이드</button>
      <button onclick="openSettings()">AI 설정</button>
      <button onclick="importSave()">저장 파일 불러오기</button>
      <button class="small themeBtn" onclick="cycleTheme()">🌓 자동</button><button class="small sfxBtn" onclick="cycleSfx()">🔊 보통</button>
    </div>
    <p class="muted" style="margin-top:20px" id="aiStatus"></p>
  </div>
</section>

<!-- 캐릭터 생성 -->
<section id="create" class="hidden">
  <div class="wrap">
    <div class="card">
      <h2 style="margin-top:0">여행자 만들기</h2>
      <label>이름</label>
      <input id="cName" maxlength="20" placeholder="예: 라일라">
      <label>출신 (고향)</label>
      <div class="opt-grid" id="originGrid"></div>
      <label>능력치 <span class="muted" id="ptsLeft"></span></label>
      <div id="statBox"></div>
      <label>특성 <span class="muted">(2개까지)</span></label>
      <div class="opt-grid" id="traitGrid"></div>

const lvCost=n=>Math.round(10+1.1*(n-1));   // 레벨 n-1 → n 에 필요한 점수
const lvTotal=n=>{ let t=0; for(let i=1;i<=n;i++) t+=lvCost(i); return t };
const AFF_MAX=lvTotal(MAX_LV);
function affInfo(a){
  a=Math.max(0,+a||0); let lv=0, rest=a;
  while(lv<MAX_LV&&rest>=lvCost(lv+1)){ rest-=lvCost(lv+1); lv++ }
  const need=lv>=MAX_LV?1:lvCost(lv+1);
  return {lv,cur:rest,need,pct:lv>=MAX_LV?100:Math.round(rest/need*100)};
}
/* 예전 저장본 점수를 지금 점수로 옮김: tbl = [[옛 값, 새 점수], …] 사이를 직선으로 이음 */
function remapAff(a,tbl){
  a=Math.max(0,+a||0);
  for(let i=1;i<tbl.length;i++){ if(a<=tbl[i][0]){ const [x0,y0]=tbl[i-1],[x1,y1]=tbl[i]; return Math.round(y0+(y1-y0)*(a-x0)/(x1-x0)) } }
  return tbl[tbl.length-1][1];
}

function askConfirm(msg,okLabel='확인'){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.style.zIndex=50;
    bg.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-label="확인" style="max-width:420px"><div class="body"><p style="white-space:pre-line;margin:4px 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="small" data-r="0">취소</button><button class="small primary" data-r="1">${esc(okLabel)}</button></div></div></div>`;
    const prev=document.activeElement;
    const done=v=>{ document.removeEventListener('keydown',key,true); bg.remove(); try{ prev&&prev.focus&&prev.focus() }catch(e){} res(v) };
    const key=ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); done(false) } };
    document.addEventListener('keydown',key,true);
    bg.addEventListener('click',ev=>{ if(ev.target===bg) done(false); const b=ev.target.closest('button[data-r]'); if(b) done(b.dataset.r==='1') });
    document.body.appendChild(bg);
    const ok=bg.querySelector('[data-r="1"]'); if(ok) ok.focus();
  });
}

/* opt.cache: 시스템 프롬프트(매 턴 같은 앞부분)를 캐시 — 서술 턴에서만 씀 (짧거나 한 번뿐인 호출에 붙이면 쓰기 비용만 늘어남) */
async function callAI(system,user,maxTokens=1200,role='story',opt){
  opt=opt||{};
  const c=roleCfg(role), key=(SET.keys||{})[c.provider];
  if(!key){
    const any=Object.values(SET.keys||{}).some(Boolean);
    throw new Error(any?`「${roleName(role)}」에 쓸 ${provLabel(c.provider)} 키가 없습니다 (AI 설정에서 입력)`:'NO_KEY');
  }
  const errMsg=(d,r)=>(d&&d.error&&d.error.message)||(Array.isArray(d)&&d[0]&&d[0].error&&d[0].error.message)||('HTTP '+r.status);
  if(c.provider==='anthropic'){
    // Claude 5 계열은 생각(adaptive thinking) 토큰도 max_tokens에 포함되므로 여유를 둡니다.
    const is5=/claude-(sonnet|opus|fable|mythos)-5/.test(c.model);
    const body={model:c.model,max_tokens:is5?maxTokens+2000:maxTokens,system:opt.cache?[{type:'text',text:system,cache_control:{type:'ephemeral'}}]:system,messages:[{role:'user',content:(opt.cache&&opt.stable>0&&opt.stable<user.length)?[{type:'text',text:user.slice(0,opt.stable),cache_control:{type:'ephemeral'}},{type:'text',text:user.slice(opt.stable)}]:user}]};
    if(is5) body.output_config={effort:c.effort||'low'};
    const hdr={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    if(SET.wsId) hdr['anthropic-workspace-id']=SET.wsId;
    const send=()=>fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:hdr,body:JSON.stringify(body)});
    let r=await send(), d=await r.json();
    if(!r.ok&&body.output_config&&/output_config|effort/i.test(errMsg(d,r))){ delete body.output_config; r=await send(); d=await r.json() }
    if(!r.ok) throw new Error(errMsg(d,r));
    try{ const u=d.usage||{}; trackUsage(role,c.model,u.input_tokens,u.output_tokens,u.cache_read_input_tokens,u.cache_creation_input_tokens) }catch(e){}
    return (d.content||[]).map(x=>x.text||'').join('');
  }
  const base=(c.provider==='custom'?(SET.baseUrl||''):(PRESETS[c.provider]&&PRESETS[c.provider].baseUrl)||'').replace(/\/$/,'');
  const body={model:c.model,max_tokens:maxTokens,temperature:0.9,messages:[{role:'system',content:system},{role:'user',content:user}]};
  if(c.provider==='gemini'){ body.max_tokens=Math.max(maxTokens*2,3000); body.reasoning_effort=c.effort||'low' }
  const send=()=>fetch(base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify(body)});
  let r=await send(), d=await r.json();
  if(!r.ok&&body.reasoning_effort&&/reasoning|thinking/i.test(JSON.stringify(d))){ delete body.reasoning_effort; r=await send(); d=await r.json() }
  if(!r.ok) throw new Error(errMsg(d,r));
  try{ const u=d.usage||{}, ct=(u.prompt_tokens_details&&u.prompt_tokens_details.cached_tokens)||0; trackUsage(role,c.model,u.prompt_tokens,(u.total_tokens&&u.prompt_tokens)?Math.max(u.total_tokens-u.prompt_tokens,u.completion_tokens||0):u.completion_tokens,0,0,ct) }catch(e){}
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
}

const USAGE_KEY='sand7_usage';
function priceOf(model){   // 100만 토큰당 [입력, 출력] 달러. 없는 모델은 비용 "?"
  const m=String(model||'');
  if(/claude-sonnet-5/.test(m)) return [2,10];
  if(/claude-opus-5/.test(m)) return [4,20];
  if(/claude-opus-4-6/.test(m)) return [5,25];
  if(/claude-haiku-4-5/.test(m)) return [1,5];
  if(/gemini-3\.8-flash/.test(m)) return Date.now()<Date.parse('2027-01-01T00:00:00+09:00')?[0.75,3.75]:[1.5,7.5];
  if(/gemini-3\.5-flash-lite/.test(m)) return [0.30,2.50];
  if(/gemini-3\.5-flash/.test(m)) return [1.5,9];
  return null;
}
let USAGE=(function(){ try{ const u=JSON.parse(localStorage.getItem(USAGE_KEY)||'null'); if(u&&u.roles) return u }catch(e){} return {roles:{},since:Date.now()} })();
let USAGE_TURN={in:0,out:0,cost:0,unk:false};
function saveUsage(){ try{ localStorage.setItem(USAGE_KEY,JSON.stringify(USAGE)) }catch(e){} }
function fmtCost(c){ return c<0.01?'$'+c.toFixed(4):'$'+c.toFixed(c<1?3:2) }

/* cr: 캐시에서 읽은 입력(단가 0.1배) · cw: 캐시에 새로 쓴 입력(1.25배) — Anthropic은 둘 다 inTok과 따로 옴
   cg: OpenAI 호환 제공자가 자동 캐시한 입력 수 (inTok 안에 포함 · 기록만) */
const CACHE_READ=0.1, CACHE_WRITE=1.25;
function trackUsage(role,model,inTok,outTok,cr,cw,cg){
  inTok=+inTok||0; outTok=+outTok||0; cr=+cr||0; cw=+cw||0; cg=+cg||0;
  const p=priceOf(model), cost=p?((inTok+cr*CACHE_READ+cw*CACHE_WRITE)*p[0]+outTok*p[1])/1e6:0;
  const r=USAGE.roles[role]||(USAGE.roles[role]={calls:0,in:0,out:0,cost:0,unk:0});
  r.calls++; r.in+=inTok+cr+cw; r.out+=outTok; r.cost+=cost; if(!p) r.unk++;
  r.cr=(r.cr||0)+cr+cg; r.cw=(r.cw||0)+cw;
  USAGE_TURN.cr=(USAGE_TURN.cr||0)+cr+cg;
  inTok+=cr+cw;
  USAGE_TURN.in+=inTok; USAGE_TURN.out+=outTok; USAGE_TURN.cost+=cost; if(!p) USAGE_TURN.unk=true;
  saveUsage(); updateUsageChip();
}
function usageTotal(){
  const t={calls:0,in:0,out:0,cost:0,unk:0};
  for(const k in USAGE.roles){ const r=USAGE.roles[k]; t.calls+=r.calls; t.in+=r.in; t.out+=r.out; t.cost+=r.cost; t.unk+=r.unk }
  return t;
}
function updateUsageChip(){
  const el=document.getElementById('usageChip'); if(!el) return;
  const t=usageTotal();
  if(!t.calls){ el.textContent='💰 사용량'; el.title='토큰 사용량 (눌러서 자세히 보기)'; return }
  el.textContent=`💰 이번 턴 ${fmtCost(USAGE_TURN.cost)} · 누적 ${fmtCost(t.cost)}${t.unk?'+':''}`;
  el.title=`이번 턴 입력 ${USAGE_TURN.in} · 출력 ${USAGE_TURN.out} 토큰 (눌러서 자세히 보기)`;
}

/* ---------- 4-4. 프롬프트 ---------- */
const SYS_BASE=`너는 중동풍 텍스트 탐험 게임 「모래 아래의 도시」의 이야기꾼이다.
세계관: 천일야화풍 사막 세계. 교역 도시 카스르, 동쪽 오아시스 와하, 남쪽 유목민의 천막들, 북쪽 옛 왕도 자르한, 진(정령), 고대 유적. 사막 서쪽 너머에는 초원과 숲이 펼쳐진 서쪽 땅(숲속 성 하르다, 서쪽 성채, 바닷가 포구 등)이 있다 — 3막 전에는 아직 길이 열리지 않은 소문의 땅이라 여행자·교역품·소문으로만 등장시키고 플레이어가 그곳에 가는 서술은 하지 않는다. 3막부터는 길이 열리지만, 그곳으로 떠나거나 도착하는 것은 게임(여행 버튼)이 처리한다. 전설에 따르면 하룻밤 사이 모래에 삼켜진 황금 도시 이람의 신전에 석판이 있고, 그 석판에 왕의 보물이 묻힌 곳의 좌표가 새겨져 있다. 플레이어는 별지도 조각을 모아 이람의 입구를 찾는 중이다(1막).
아직 플레이어가 모르는 것: 이람 같은 묻힌 도시가 일곱 개라는 사실. 1막에서는 절대 직접 말하지 말고, 아주 희미한 암시만 허용한다.
규칙:
- 반드시 한국어, 플레이어를 '당신'으로 부르는 2인칭 현재형 서술.
- 서술은 2~4문단, 350~700자. 감각적 묘사(빛, 냄새, 소리, 열기)를 쓰되 장황하지 않게.
- 서술 안에서 중요한 부분(핵심 단서·고유명사·얻거나 잃은 물건·분명한 위험·중대한 결정)은 **이렇게 굵게**, 소리·속삭임·속마음·강조는 *이렇게 기울여* 표시한다. 한 문단에 많아야 한두 곳, 남발하지 않는다. 별표(*) 표기 외의 마크다운(제목·목록·인용)은 쓰지 않고, narration 외의 필드(choices·chronicle 등)에는 별표를 쓰지 않는다.
- 플레이어의 출신, 특성, 배경 이야기를 자연스럽게 엮어라.
- 숫자 상태(체력, 물 등)는 게임 코드가 관리한다. 너는 effects로 변화만 제안하라.
- 숨겨진 진실은 [숨겨진 진실] 항목의 지시를 따른다. 결말 전에는 절대 직접 밝히지 말고, 단서와 소문으로만 흘려라.
- 인물과의 관계는 [인연] 단계를 지켜라. 단계를 건너뛰어 고백하거나 연인처럼 굴지 않는다. 호감은 쉽게 오르지 않는다.
- 연애 묘사는 설렘과 감정 중심으로 품위 있게 쓰고, 성적인 묘사는 하지 않는다. 아이나 청소년 인물과는 어떤 연애 감정도 묘사하지 않는다.
- 출력은 오직 JSON 하나. 다른 텍스트 금지.`;

/* 서술 AI에게 주는 출력 형식. 선택지는 종류(type)를, 상인·수원은 사건(event)으로 받는다. 사전은 별도 AI가 정리. */
const TURN_SCHEMA=`출력 JSON 형식:
{
 "narration": "서술 (문단은 \\n\\n로 구분)",
 "choices": [{"text":"다음 행동 25자 이내","type":"story|check|rest|camp|return|exit|trade","skill":"str|wis|cha|sur (check일 때만)","dc":"easy|normal|hard (check일 때만)"}],
 "event": null,
 "effects": {"hp":0,"water":0,"food":0,"torch":0,"gold":0,"affinity":0,"companion_join":false,"relations":[],"relation_event":null,"materials":{"stone":0,"wood":0,"cloth":0,"relic":0},"items_add":[],"items_remove":[],"fragment":false},
 "chronicle": "이번 장면이 이야기상 중요하면 한 줄 요약, 아니면 빈 문자열"
}
effects 범위(한 장면): ${Object.entries(FX_LIMIT).map(([k,[a,b]])=>`${k} ${a}~+${b}`).join(', ')}. 물건을 살 때만 water·food·torch를 산 만큼 넣는다. 범위를 넘는 값은 코드가 잘라 낸다. 아이템은 이야기상 실제로 얻거나 잃을 때만.
금화 보상은 절제한다: 작은 발견 +5~15, 큰 발견 +20~40 정도이고, 유적 한 곳을 통틀어 얻는 금화 합계가 ${RUIN_GOLD_CAP} 이하가 되도록 조절한다. 재물을 얻은 장면이 아니면 gold는 0.
물·식량·횃불·금화는 effects 수치로만 관리하고 items_add에 넣지 않는다(물주머니·빵·횃불 같은 소모품도 마찬가지). 소지품 목록에 있는 물건을 쓰거나 다른 것으로 바꾸거나 잃으면 반드시 items_remove에 소지품에 적힌 이름 그대로 넣는다.
companion_join은 유민이 지금 장면에 있고, 이야기 흐름 속에서 유민이 함께 가기로 분명히 정해진 순간에만 true.
relations: 이번 장면에서 플레이어와 실제로 대화하거나 교류한 인물(유민 제외)마다 {"name":"사전에 쓴 것과 같은 이름","delta":호감 변화,"adult":성인이면 true, 아이·청소년이면 false}. 교류가 없으면 빈 배열. 호감은 쉽게 오르지 않는다: 스쳐 가는 대화 0, 즐거운 대화 1, 도움이나 진심 2~3, 큰 은혜 4~5, 무례 -2~-5. 사람처럼 대화가 통하는 인물만 넣고 몬스터·동물·괴물·정령·사물은 넣지 말 것.
relation_event: 진행 중인 인연 이벤트가 있을 때만 {"name":"..","result":"success|fail|pending"}, 없으면 null.
yumin_arc: [유민의 사연] 장면이 진행 중일 때만 effects 안에 {"result":"success|fail|pending","canon":"이번 장면에서 새로 드러난 유민의 과거 사실 1~2문장(없으면 빈 문자열)"}, 아니면 넣지 않는다.
materials는 유적에서 플레이어가 실제로 쓸 만한 석재, 목재, 천, 고대 유물을 챙겼을 때만 (각 0~2, 유물 0~1).
사전(lexicon)은 별도로 자동 정리되므로 JSON에 넣지 않는다. 새 인물·장소·전설은 서술에 분명히 담아라.
[선택지·사건 규칙]
- choices는 3~4개의 객체. type: 결과가 불확실하고 실패하면 대가가 있는 행동(기어오르기, 해독, 설득, 함정 피하기, 몰래 지나가기 등)은 "check"와 알맞은 skill·dc. 쉬기/잠자기는 "rest", 야영은 "camp", 카스르 귀환은 "return", 유적 밖으로 나가기는 "exit", 사고팔기는 "trade". 그 밖의 관찰·대화·묘사 중심 행동은 "story". 능력치: str=힘·몸, wis=지식·해독·추리, cha=설득·흥정·속임, sur=생존·추적·은신·함정.
- 유적 안에서는 return·exit 선택지를 만들지 말 것(이동·귀환은 고정 버튼이 있다).
- event: 이 장면에서 상인이 물건을 팔겠다고 나서면 {"type":"merchant","name":"상인 이름 짧게"}, 마실 물이 있는 곳(우물·샘·오아시스·물웅덩이·빗물 고인 곳)을 발견하면 {"type":"water_source","name":"짧은 이름"}, 플레이어가 가 볼 만한 구체적인 장소의 이름과 가는 길(소문·지도·단서)을 새로 알게 되면 {"type":"place_lead","name":"장소 이름 14자 이내","hint":"어디에 있고 어떻게 가는지 한 줄"}(이미 알려진 장소·마을·도시는 제외, 한 장면에 하나), 아니면 null. 상인·물 사건은 물·식량·횃불을 effects로 직접 주지 말 것 — 게임이 거래·물 채우기 버튼을 띄운다.
- [판정 결과] 지시가 있으면 그 결과를 그대로 따른다.`;

function narrCfg(){
  const k=(SET&&SET.narrLen)||'m';
  if(k==='custom'){
    let a=Math.round(+SET.narrMin)||5, b=Math.round(+SET.narrMax)||10;
    a=clamp(a,1,40); b=clamp(Math.max(a,b),a,40);
    const p1=Math.max(1,Math.ceil(a/6)), p2=Math.max(1,Math.ceil(b/5));
    return {n:'직접 설정',s:[a,b],c:[a*45,b*60],p:p1===p2?`${p1}문단`:`${p1}~${p2}문단`,tok:clamp(b*85+500,800,3400)};
  }
  return NARR_LEVELS[k]||NARR_LEVELS.m;
}
function sysBase(){
  const c=narrCfg(), base=SYS_BASE+actNote();
  if(!SET||!SET.narrLen||SET.narrLen==='m') return base;
  return base.replace(/서술은 2~4문단, 350~700자/,`서술은 ${c.p}, ${c.s[0]}~${c.s[1]}문장(대략 ${c.c[0]}~${c.c[1]}자). 이 분량을 반드시 지킨다`).replace('장황하지 않게','군더더기 없이');
}
function toneHint(){
  const deep=G.dungeon?(G.dungeon.depth||0):0, parts=[];
  if(G.act===1) parts.push('전체 분위기: 경이롭고 활기찬 천일야화풍 모험. 다만 위험과 미스터리의 기척을 깔아 둘 것.');
  if(G.time==='밤') parts.push('지금은 밤: 긴장감 있고 으스스하게.');
  if(deep>=3) parts.push('유적 깊은 곳: 어둡고 섬뜩한 생존 분위기.');
  return parts.join(' ');
}

/* 확정 사실: 기본 + facts 훅. 훅은 (o, rules) 를 받아 o를 고치거나 rules에 규칙 문장을 넣는다 */
function stateFacts(){
  const c=G.char;
  const o={
    캐릭터:{이름:c.name,출신:c.origin,고향:c.region,능력치:{체력:c.stats.str,지혜:c.stats.wis,매력:c.stats.cha,생존술:c.stats.sur},특성:c.traits,배경:c.bio||'(없음)'},
    상태:{체력:`${G.hp}/${G.maxhp}`,물:`${G.water}/${capW()}`,식량:`${G.food}/${capF()}`,횃불:`${G.torch}/${capT()}`,금화:G.gold,소지품:G.items,별지도조각:`${G.fragments}/${FRAG_GOAL}`},
    날짜:`${G.day}일째 ${G.time}`,
    알려진지명:MAP_PLACES.filter(p=>p.far&&G.discovered.includes(p.id)).map(p=>`${p.n}(${p.lore||''} 소문으로만 아는 먼 땅)`).join(' / ')||'없음',
    거점:has('land')?`${G.home.name||'오아시스의 집'} — 시설: ${FAC.filter(f=>has(f.id)).map(f=>f.n).join(', ')}`:'없음',
    탈것:G.mount?`${MOUNTS[G.mount.type].n} 「${G.mount.name}」 (${G._mountFed===false?'사료를 못 먹어 지쳐 있음':'원기 왕성'}) — 평소 거점 마구간에 있고 원정에 데려간다. 사막 이동 장면에서 가끔(매번은 아님) 자연스럽게 등장시킬 것`:'없음',
    자재:MATS.map(m=>`${m.n} ${G.mat[m.k]}`).join(', ')+(G.mat.relic?` (유물 등급: ${relicText()})`:''),
  };
  const rules=[];
  run('facts',o,rules);
  if(rules.length) o.서술규칙=rules.join(' ');
  return o;
}
/* 현재 장면: 기본 + context 훅 (훅은 덧붙일 문장을 돌려줌) */
function sceneContext(){
  let s;
  if(G.loc==='city') s='현재 위치: 교역 도시 카스르 (안전한 거점).';
  else if(G.loc==='town'){ const t=curTown(); s=`현재 위치: ${t.n} — ${t.desc} 카스르에서 ${townDays(G.town)}일 거리.` }
  else if(G.loc==='home') s=`현재 위치: 플레이어의 거점 「${G.home.name||'오아시스의 집'}」 — 카스르 외곽 오아시스 가장자리. 지어진 시설: ${FAC.filter(f=>has(f.id)).map(f=>f.n).join(', ')}.`;
  else if(G.loc==='road') s='현재 위치: 카스르에서 유적으로 가는 사막 길. 뜨거운 모래바람, 낙타 발자국, 멀리 보이는 바위 언덕.';
  else if(G.loc==='camp') s=`현재 위치: ${G.dungeon?G.dungeon.name+' 안의 야영지':'사막의 야영지'}.`;
  else{
    const d=G.dungeon, r=curRoom();
    const exits=r.exits.map(id=>(d.rooms.find(x=>x.id===id)||{}).name).join(', ');
    s=`현재 위치: 유적 「${d.name}」 (주제: ${d.theme}) / 방: ${r.name} (깊이 ${d.depth}, 위험도 ${r.danger}/3)\n방의 설정 메모: ${r.desc}\n연결된 방: ${exits}`;
    if(r.fragment&&!r.fragTaken) s+=`\n[비밀] 이 방에는 별지도 조각이 숨어 있다. 플레이어가 주의 깊게 조사하거나 장애물(함정, 수수께끼, 수호자)을 넘기면 발견하게 하고, 그때 effects.fragment를 true로 하라. 쉽게 주지는 말 것.`;
    if(G.torch<=0) s+=hasTrait('밤눈')?'\n횃불이 다 떨어졌지만 플레이어는 밤눈이 밝아 희미하게나마 볼 수 있다.':'\n[어둠] 횃불이 다 떨어져 거의 아무것도 보이지 않는다. 손으로 더듬어 움직인다. 이 상태에서는 단서나 별지도 조각을 찾아내지 못한다(effects.fragment는 false). 빛을 구하는 선택지를 하나 넣어라.';
  }
  for(const h of HOOKS.context){ try{ const add=h.fn(); if(add) s+=add }catch(e){ console.warn('[context]',e) } }
  return s;
}
function relevantLex(text){
  const hits=G.lexicon.filter(e=>text.includes(e.name));
  const favs=G.lexicon.filter(e=>e.fav&&!e.arch).slice(-3);
  const recent=G.lexicon.filter(e=>!e.arch).slice(-6);
  return [...new Set([...hits,...favs,...recent])].slice(0,14).map(e=>`- [${e.cat}] ${e.name}: ${e.desc}`).join('\n')||'(없음)';
}
/* 프롬프트는 '거의 안 변하는 앞부분'(숨겨진 진실·줄거리·연대기·유민 프로필)과 '매 턴 바뀌는 뒷부분'으로 나눠 이어 붙임.

`;
  const vol=`[확정 사실 — 이와 모순되게 쓰지 말 것]

[현재 상황]
${ctx}

/* ---------- 4-5. AI 응답 정리 ---------- */
function callName(){   // 성을 뺀 이름 ("박도현" → "도현")
  const DOUBLE=['남궁','황보','제갈','사공','선우','독고','서문','동방'];
  try{
    if(G.char.callName) return String(G.char.callName).trim();
    const n=String(G.char.name||'').trim();
    if(!/^[가-힣]{3,4}$/.test(n)) return '';
    if(n.length===4&&DOUBLE.includes(n.slice(0,2))) return n.slice(2);
    return n.slice(1);
  }catch(_){ return '' }
}
function fixCalling(t){
  const n=String(G.char.name||'').trim(), g=callName();
  if(!g||!t||typeof t!=='string'||n===g) return t;
  const v=g+(hasBatchim(g)?'아':'야');
  return t.split(n+'아').join(v).split(n+'야').join(v);
}
/* 선택지 객체 → 글자 + 종류 정보(G.choiceMeta), 사건(event) 추출, 호칭 교정 */
function normalizeTurn(r){
  if(!r||typeof r!=='object') return r;
  if(r.narration) r.narration=fixCalling(String(r.narration));
  if(Array.isArray(r.choices)){
    const meta={};
    r.choices=r.choices.map(c=>{
      if(c&&typeof c==='object'){
        const text=fixCalling(stripMd(String(c.text||'')).trim()); if(!text) return null;
        const type=CHOICE_TYPES.includes(c.type)?c.type:'story';
        const m={type};
        if(type==='check'){ m.skill=SK[c.skill]?c.skill:'sur'; m.dc=DCV[c.dc]?c.dc:'normal' }
        meta[text]=m; return text;
      }
      return typeof c==='string'?fixCalling(c):null;
    }).filter(Boolean);
    G.choiceMeta=meta;
  }
  r.event=(r.event&&typeof r.event==='object'&&['merchant','water_source','place_lead'].includes(r.event.type))?{type:r.event.type,name:String(r.event.name||'').slice(0,20),hint:String(r.event.hint||'').slice(0,80)}:null;
  return r;
}
function metaOf(c){
  const M=G&&G.choiceMeta; if(!M) return null; c=String(c);
  if(M[c]) return M[c];
  const k=Object.keys(M).find(k=>c.startsWith(k)); return k?M[k]:null;
}

/* ---------- 4-6. 한 턴의 처리 흐름 ----------
   before 훅 → 행동 기록 → 프롬프트 → 서술 AI → 응답 정리 → 효과 적용 → 선택지 정리
   → 사전 추출 예약 → 줄거리 요약 → 상태 확인 → after 훅 → 저장·화면                    */
let curTurn=null;     // 진행 중인 턴의 정보 (훅들이 공유)
async function aiTurn(action,extra='',showAction=true){
  if(busy||!G) return;
  const T=curTurn={action:String(action||''),extra:extra||'',showAction,g:G,loc:G.loc,room:curRoom(),frags:G.fragments,flags:{}};
  run('before',T);
  busy=true;
  if(T.showAction) addLog('action',T.action);
  G.recent.push({role:'action',text:T.action});
  T.extra+=yuminSkillCheck();
  render();
  let res=null;
  try{ const up=buildPrompt(T.action,T.extra); res=normalizeTurn(parseJSON(await callAI(sysBase()+'\n\n'+TURN_SCHEMA,up,narrCfg().tok,'story',{cache:true,stable:buildPrompt.stableLen}))) }
  catch(e){ if(e.message!=='NO_KEY') addLog('sys','AI 연결 실패: '+e.message+' (기본 서술로 대체합니다)') }
  if(G!==T.g){ busy=false; return }
  const ok=!!(res&&res.narration);
  if(!ok){ res=fallbackTurn(T.action); G.choiceMeta={} }
  T.res=res;
  addLog('scene',res.narration);
  G.recent.push({role:'scene',text:stripMd(res.narration)});
  applyEffects(res.effects||{},T);
  G._evtTurn=false;
  if(G.relEvt){ if(G._relSetup) G._relSetup=false; else if(++G.relEvt.turns>=4){ getRel(G.relEvt.name).cool=G.day+1; G.relEvt=null } }
  if(res.chronicle&&String(res.chronicle).trim()) G.chronicle.push({day:G.day,text:stripMd(String(res.chronicle).trim())});
  G.choices=(res.choices||[]).slice(0,4);
  busy=false;
  if(ok) queueLex(stripMd(res.narration),T.action);
  await maybeSummarize();
  checkState();
  run('after',T);
  sanitizeChoices();
  curTurn=null;
  save(); render();
}

    home:{lines:['오아시스의 바람이 야자잎을 흔든다. 흙벽 오두막에는 돌아올 곳의 냄새가 배어 있다.','물 긷는 소리가 멀리서 들린다. 이곳에서는 잠시 숨을 돌려도 좋다.'],choices:['거점 주변을 둘러본다','잠시 쉬며 생각을 정리한다']},
    camp:{lines:['모닥불이 낮게 탁탁 튄다. 불빛 너머로 별이 쏟아지고, 어둠 속에서 모래가 속삭이듯 스친다.','불가에 앉아 있자니 하루의 피로가 천천히 가라앉는다. 멀리서 바람 소리만 들릴 뿐이다.'],choices:['모닥불 곁에서 쉬며 상황을 정리한다','장비를 점검한다','주변 소리에 귀를 기울인다']},
    road:{lines:['뜨거운 모래바람이 얼굴을 스친다. 발자국은 곧 모래에 묻혀 사라진다.','저 멀리 바위 언덕이 아지랑이 속에서 일렁인다.'],choices:['주변 사막을 살핀다','잠시 쉬며 물을 아낀다','방향을 가늠해 본다']},
    dungeon:{lines:['횃불이 흔들리며 벽의 문양이 살아 움직이는 듯 보인다. 모래가 천장 틈으로 가늘게 흘러내린다.','어디선가 바람이 지나가는 소리가 들린다. 이 유적은 아직 무언가를 숨기고 있다.','발밑의 돌판이 살짝 꺼진다. 당신은 숨을 멈추고 주위를 살핀다.'],choices:['주변을 자세히 조사한다','벽의 문자를 읽어본다','조용히 귀를 기울인다']},

/* ---------- 4-7. 효과 적용 ----------
   AI가 제안한 효과 e 를 effects 훅들이 차례로 거른 뒤(코드가 판정), 실제로 반영하고, applied 훅이 뒷정리 */
function applyEffects(raw,T){
  T=T||curTurn||{flags:{}};
  const e=Object.assign({},raw||{});
  const snap={water:G.water,food:G.food,torch:G.torch,gold:G.gold,relic:G.mat.relic,items:G.items.slice(),frags:G.fragments,loc:G.loc};
  const ctx={T,snap,fx:[],after:[]};
  for(const h of HOOKS.effects){ try{ h.fn(e,ctx) }catch(err){ console.warn('[effects]',err) } }
  const fx=ctx.fx;
  const num=k=>{ let [lo,hi]=FX_LIMIT[k]; if(ctx.buy&&k!=='hp'&&k!=='gold') hi=FX_BUY_MAX;
    const v=clamp(Math.round(+e[k]||0),lo,hi); if(v){ G[k]+=v; fx.push(`${FX_NAME[k]} ${v>0?'+':''}${v}`) } };
  ['hp','water','food','torch','gold'].forEach(num);
  G.hp=clamp(G.hp,0,G.maxhp); ['water','food','torch','gold'].forEach(k=>G[k]=Math.max(0,G[k]));
  if(e.materials&&G.loc==='dungeon'){
    const d=G.dungeon; if(d) d.matGot=d.matGot||0;
    MATS.forEach(m=>{ let v=clamp(Math.round(+e.materials[m.k]||0),0,m.k==='relic'?1:2);
      if(v&&m.k!=='relic'&&d){ v=Math.max(0,Math.min(v,RUIN_MAT_CAP-d.matGot)); d.matGot+=v }   // 유적 한 곳에서 이야기로 얻는 자재 상한
      if(v>0){ G.mat[m.k]+=v; fx.push(`${m.i}${m.n} +${v}`) } });
  }
  (Array.isArray(e.relations)?e.relations:[]).slice(0,4).forEach(x=>{
    if(!x||!x.name||x.name==='유민'||x.name===G.char.name) return;
    const nm=String(x.name).trim().slice(0,30), r=getRel(nm);
    if(typeof x.adult==='boolean'&&r.adult===undefined) r.adult=x.adult;
    const d=clamp(Math.round(+x.delta||0),-5,5);
    if(d){ addAffTo(nm,d); fx.push(d>0?`${nm}${josa(nm,'과','와')} 조금 가까워졌다`:`${nm}${josa(nm,'과','와')} 조금 서먹해졌다`) }
    r.lastSeen=G.day; relCheck(nm);
  });
  const re=e.relation_event;
  if(re&&G.relEvt&&!G._relSetup&&re.name===G.relEvt.name&&(re.result==='success'||re.result==='fail')) resolveRelEvt(re.result==='success',fx);
  const af=clamp(Math.round(+e.affinity||0),-5,5);
  if(af&&yuminHere()) changeAff(af,fx);
  if(e.companion_join&&G.comp.met&&!G.comp.joined&&yuminHere()&&yuminLv()>=JOIN_LV&&!G._evtTurn) joinYumin(fx);
  (e.items_add||[]).slice(0,3).forEach(it=>{ if(it&&!G.items.includes(it)){ G.items.push(it); fx.push(`획득: ${it}`) } });
  (e.items_remove||[]).forEach(it=>{ const i=G.items.indexOf(it); if(i>=0){ G.items.splice(i,1); fx.push(`잃음: ${it}`) } });
  if(e.fragment&&G.loc==='dungeon'&&G.dungeon){
    const r=curRoom();
    if(r&&r.fragment&&!r.fragTaken){
      r.fragTaken=true; G.fragments++;
      fx.push(`★ 별지도 조각 ${G.fragments}/${FRAG_GOAL}`);
      G.chronicle.push({day:G.day,text:`「${G.dungeon.name}」에서 별지도 조각을 찾았다 (${G.fragments}/${FRAG_GOAL})`});
    }
  }
  if(fx.length) addLog('fx',fx.join(' · '));
  for(const h of HOOKS.applied){ try{ h.fn(e,ctx) }catch(err){ console.warn('[applied]',err) } }
}

/* ---------- 4-8. 시간 흐름 ----------
   걸음 1 = 행동 1. 유적·야영지 안의 행동(soft)은 2번에 1걸음.
   도시·거점에서는 시간만 흐르고 물·식량·체력은 줄지 않음.
   미리 마시거나 먹었으면(credit) 다음 자동 소비 1회를 건너뜀. */
function thirstInterval(){
  let v=(hasTrait('물을 아껴 마심')?MOVE_STEPS.waterFrugal:MOVE_STEPS.water)+(mountOn()?mountDef().thirst:0);
  if(petPerk('fox')) v+=1;
  return v;
}
function tick(soft){
  if(soft){ G._softN=(G._softN||0)+1; if(G._softN%2===1) return }
  G.steps++;
  if(!isTown()){
    if(G.steps%thirstInterval()===0){
      if(G._wCredit>0) G._wCredit--;
      else if(G.water>0) G.water--;
      else { G.hp--; addLog('fx','목이 타들어 갑니다 (체력 -1)') }
    }
    if(G.steps%MOVE_STEPS.food===0){
      if(G._fCredit>0) G._fCredit--;
      else if(G.food>0) G.food--;
      else { G.hp--; addLog('fx','허기가 몰려옵니다 (체력 -1)') }
    }
  }
  // 낮·밤은 따로 센다: 쉬거나 야영하면 이 카운터가 0부터 다시 시작 (일어나자마자 밤이 되지 않게)
  G.dayStep=(G.dayStep||0)+1;
  if(G.dayStep>=MOVE_STEPS.half){ G.dayStep=0; G.time=G.time==='낮'?'밤':'낮'; if(G.time==='낮') G.day++ }
}

/* ---------- 4-9. 선택지 정리 (턴 끝·화면 그릴 때마다, 여러 번 해도 결과가 같음) ---------- */
function sanitizeChoices(){
  if(!G||!Array.isArray(G.choices)) return;
  let a=G.choices.slice();
  for(const h of HOOKS.choices){ try{ const r=h.fn(a); if(Array.isArray(r)) a=r }catch(e){ console.warn('[choices]',e) } }
  G.choices=a.slice(0,4);
}
/* 빠진 자리를 채울 선택지 (방이 다 조사됐으면 채우지 않음) */
function fillChoices(arr,fill,min=3){
  for(const f of fill){ if(arr.length>=min||roomExhausted()) break; if(!arr.includes(f)) arr.push(f) }
  return arr;
}
function roomExhausted(){ try{ if(!G||G.loc!=='dungeon') return false; const r=curRoom(); return !!(r&&r.exhausted) }catch(_){ return false } }

};
/* 다섯 구역(시장·찻집·여관·성문·오아시스) 중 한 곳으로 '간다'는 문장이면 그 구역 키, 아니면 null.
   장소 이름 바로 뒤에 이동 동사가 올 때만 (예: "시장에서 찻집으로 간다" → teahouse). 직접 입력·AI 선택지·임시 장소 판정이 함께 씀 */
function districtMove(t){
  if(!G||G.loc!=='city') return null;
  t=String(t||'');
  if(/(에서\s*(쉰|묵|잔|마신|듣|산다|거닌))/.test(t)) return null;
  const hit=IX.DIST_KEYS.find(([k,re])=>re.test(t)&&new RegExp(re.source+'[가-힣\\s]{0,6}'+IX.DIST_VERB.source).test(t));
  return hit?hit[0]:null;
}
/* ---------- 임시 장소: 다섯 구역 밖의 곳(대장간·사원·골목 등)으로 가면 G.spot={name}만 기록하고 구역은 그대로 ----------
   G.spot이 있는 동안: 구역 전용 기능(소문·숙박·상점·원정 출발·거점 이동)은 막히고, 구역으로 돌아가는 버튼이 나옴.
   구역으로 이동(goDistrict)하거나 카스르를 떠나면 비워짐 */
const SPOT_STOP=/^(안|밖|안쪽|바깥|뒤|앞|옆|위|아래|저쪽|이쪽|그쪽|거기|여기|그곳|이곳|저곳|근처|주변)$/;
const SPOT_EXCL=/(카스르|도시|거점|집|와하|천막|자르한|이람|나루|항구|유적|사막|원정|동굴|성채|하르다|등대|포구|숲길|절벽|야자|돌문|마을|서쪽|동쪽|남쪽|북쪽|구역|장소|출구|입구)/;
function spotOn(){ return !!(G&&G.spot&&G.loc==='city') }
function spotMove(t){
  if(!G||G.loc!=='city') return null;
  t=String(t||'');
  if(RX.NEG.test(t)||districtMove(t)) return null;
  const m=t.match(/([가-힣]{2,8}?(?:\s[가-힣]{2,8}?)?)(?:으로|로)\s*(?:간다|가자|가기로|가려|향한다|향해|들어간다|들어서|들른다|들러|이동|걸어간다|걸어가|걸음을\s*옮|발걸음)/)
    ||t.match(/([가-힣]{2,8}?(?:\s[가-힣]{2,8}?)?)에\s*(?:들른다|들러|들어간다|들어서|도착)/);
  if(!m) return null;
  const n=m[1].replace(/^(천천히|조용히|서둘러|곧장|바로|다시|이제|먼저|잠시|일단|슬쩍|몰래)\s+/,'').trim();
  if(n.length<2||SPOT_STOP.test(n)||SPOT_EXCL.test(n)) return null;
  return n.slice(0,16);
}
function setSpot(name){
  if(!G||G.loc!=='city'||!name) return;
  if(G.spot&&G.spot.name===name) return;
  G.spot={name:String(name).slice(0,16)}; G._yuminHere=false;
  addLog('sys',`📍 ${G.spot.name} (임시 장소) — 소문·숙박·상점 같은 구역 전용 기능은 구역으로 돌아가야 쓸 수 있습니다.`);
}
function spotBlock(){ if(spotOn()){ toast('임시 장소에서는 할 수 없습니다. 먼저 구역으로 돌아가세요'); return true } return false }
const waitDays=t=>{ const m=String(t).match(/(\d+)\s*일/); if(m) return Math.min(3,Math.max(1,+m[1])); if(/사흘/.test(t)) return 3; if(/이틀|며칠/.test(t)) return 2; return 1 };
const inRuin=()=>!!G.dungeon&&['dungeon','camp','road'].includes(G.loc);
const itemIn=t=>G.items.findIndex(it=>it&&String(it).length>=2&&t.includes(it));
function sleepHere(){ const L=G.loc; if(L==='city'||L==='town') cityRest(); else if(L==='home') homeRest(); else if(L==='camp') breakCamp(); else campHere() }
function sleepLabel(){ const L=G.loc; return L==='city'||L==='town'?'🛏 여관에서 쉬기 (🪙10 · 하루 경과)':L==='home'?'🛏 거점에서 쉬기 (하루 경과)':L==='camp'?'🌅 아침까지 쉬기':'⛺ 야영 (물·식량 -1, 밤이 지남)' }

/* 글로 쓴 행동 → 게임 기능. 위에서부터 처음 맞는 것 하나만.
   run()이 false를 돌려주면 '수정만 하고 이야기로 계속'(예: 기다리기, 물건 버리기) */
const INTENTS=[
  {id:'exit',confirm:true,label:()=>'🚪 유적 밖으로 나가기',
   when:t=>G.loc==='dungeon'&&G.dungeon&&IX.EXIT.test(t)&&!IX.HOMEWARD.test(t), run:()=>{ exitRuin() }},
  {id:'reenter',confirm:true,label:()=>'🏛 유적으로 다시 들어가기',
   when:t=>outsideRuin()&&IX.REENTER.test(t), run:()=>{ reenterRuin() }},
  {id:'caravan',
   when:t=>G.caravan&&G.caravan.here&&G.loc===(G.caravan.loc||'road')&&IX.CARAVAN_BUY.test(t), run:()=>{ openCaravan() }},
  {id:'district',
   when:t=>!!districtMove(t),
   run:t=>{ const k=districtMove(t); addLog('action',t); if(curDistrict()===k&&!G.spot) toast(`이미 ${DISTRICTS[k].n}에 있습니다`); else goDistrict(k) }},
  {id:'home',confirm:true,label:()=>'🏠 거점으로 이동',
   when:t=>IX.HOME.test(t),
   run:t=>{
     if(G.loc==='home') return toast('이미 거점에 있습니다');
     if(G.loc==='town') return toast('거점은 카스르 근처에 있습니다. 먼저 카스르로 돌아가세요');
     if(!has('land')) return toast('아직 거점이 없습니다. 카스르에서 거점 부지를 구입해야 합니다');
     addLog('action',t);
     if(inRuin()) returnToCity(true);
     if(G.loc==='city'||(G.loc==='road'&&!G.trip&&!G.dungeon)) goHome();
   }},
  {id:'city',when:t=>G.loc==='home'&&IX.CITY.test(t), run:t=>{ addLog('action',t); enterCity(false) }},
  {id:'travel',confirm:true,label:t=>travelLabel(t),
   when:t=>isTown()&&!!travelTarget(t)&&travelTarget(t).kind!=='far', run:t=>{ travelByText(t) }},
  {id:'farplace',   // 아직 소문으로만 아는 곳 — 이동하지 않고 이야기로만
   when:t=>isTown()&&!!travelTarget(t)&&travelTarget(t).kind==='far',
   run:()=>{ toast('그곳은 아직 소문으로만 아는 곳이라 갈 수 없습니다'); pend('\n[이동 불가] 플레이어가 말한 곳은 아직 소문으로만 아는 먼 땅이다. 실제로 길을 떠나거나 도착하는 서술은 하지 말고, 그곳을 그리워하거나 소문을 떠올리는 정도로만.',{zeroSupply:true}); return false }},
  {id:'lead',confirm:true,label:t=>`📍 「${(leadByText(t)||{}).name}」 찾아 떠나기 (소문의 장소)`,
   when:t=>isTown()&&!!leadByText(t), run:t=>{ const l=leadByText(t); addLog('action',t); startLead(l.id) }},
  {id:'go',confirm:true,label:()=>'🐪 유적 원정 떠나기 (거리만큼 일수 · 하루마다 물·식량 1)',
   when:t=>isTown()&&!(G.loc==='town'&&curTown().west)&&IX.GO.test(t), run:t=>{ addLog('action',t); startExpedition() }},
  {id:'spot',confirm:true,label:t=>`📍 ${spotMove(t)} (임시 장소)로 이동`,
   when:t=>!!spotMove(t), run:t=>{ setSpot(spotMove(t)); return false }},   // 장소만 기록하고 이야기로 계속
  {id:'return',confirm:true,label:()=>{ const r=returnRoute(); return `↩ ${r.name}${josa(r.name,'으로','로')} 귀환 (${r.days}일 · 하루마다 물·식량 1)` },
   when:t=>inRuin()&&IX.RET.test(t), run:t=>{ addLog('action',t); returnToCity() }},
  {id:'useItem',
   when:t=>{ const i=itemIn(t); return i>=0&&!!consKind(G.items[i])&&IX.USEV.test(t) }, run:t=>{ addLog('action',t); useItem(itemIn(t)) }},
  {id:'sleep',confirm:true,label:sleepLabel,
   when:t=>IX.SLEEP.test(t)&&!IX.SLEEP_NEG.test(t)&&['city','town','home','road','dungeon','camp'].includes(G.loc),
   run:t=>{ addLog('action',t); addLog('sys','🌙 밤을 보내는 행동은 게임의 휴식 기능으로 처리되어 시간이 흐릅니다.'); G.choices=[]; sleepHere(); save(); render() }},
  {id:'wait',confirm:true,label:()=>'⏳ 시간 보내기 (날짜·물·식량이 계산됨)',
   when:t=>IX.WAIT.test(t),
   run:t=>{   // 시간만 처리하고 장면은 이야기로 계속
     const n=waitDays(t);
     G.day+=n; G.time='낮'; G.dayStep=0;
     let note=`${n}일이 지났다`;
     if(isWild()){
       for(let i=0;i<n;i++){
         if(!mountNoWater()||i%2===1){ if(G.water>0) G.water--; else G.hp=Math.max(1,G.hp-1) }   // 먹인 낙타: 물 절반 (여행과 같음)
         if(G.food>0) G.food--; else G.hp=Math.max(1,G.hp-1);
       }
       note+=mountNoWater()?` (물 -${Math.floor(n/2)} · 식량 -${n})`:` (물·식량 -${n}씩)`;
     }
     addLog('sys',`⏳ ${note}. (${G.day}일째)`);
     pend(` [시간 경과 ${n}일은 게임이 이미 처리했다. 물·식량·체력 effects는 0.]`,{zeroSupply:true});
     return false;
   }},
  {id:'drop',
   when:t=>itemIn(t)>=0&&IX.DROPV.test(t),
   run:t=>{ const i=itemIn(t), it=G.items[i]; G.items.splice(i,1); addLog('fx',`잃음: ${it}`); pend(` [소지품 처리 완료] 「${it}」은(는) 이미 소지품에서 제거했다. items_remove에 넣지 말 것.`); return false }},
];

function freeAct(){
  const inp=document.getElementById('freeInput'); if(!inp) return;
  const v=inp.value.trim(); if(!v||busy||!G) return;
  if(RX.OOC.test(v)){ inp.value=''; const m=v.match(/^\s*(?:\/\/|\(\(|\(?\s*ooc\s*[:：)]?)\s*(.*)$/i); return openOoc(m?m[1].replace(/\)+\s*$/,''):'') }
  inp.value='';
  act(v,{src:'free'});
}
function pickChoice(i){
  if(busy||!G) return;
  const c=G.choices&&G.choices[i]; if(!c) return;
  const m=metaOf(c);
  if(m){
    if(m.type==='check') return doCheck(c,m.skill,m.dc,'choice');
    if(m.type==='story'&&waterFillIntent(c)) return story(c,{src:'choice'});
    if(m.type!=='story'&&runChoiceType(m.type,c)) return;
    if(m.type==='story'&&isTown()&&!RX.NEG.test(c)&&leadByText(c)){ addLog('action',c); return startLead(leadByText(c).id) }   // 소문의 장소로 가는 선택지
    if(m.type==='story'&&G.loc==='city'&&!RX.NEG.test(c)){   // 선택지 글이 다른 곳으로 가는 것이면 실제 장소도 옮김
      const k=districtMove(c);
      if(k){ if(k!==curDistrict()||spotOn()) goDistrict(k) }          // 다섯 구역 중 한 곳 (임시 장소도 함께 해제)
      else{ const n=spotMove(c); if(n) setSpot(n) }                   // 구역 밖 장소 → 임시 장소
    }
    return story(c,{src:'choice'});
  }
  act(c,{src:'choice'});
}
function pickFixed(a){ if(busy||!G) return; story(a,{src:'fixed'}) }

function act(text,opt={}){
  const t=String(text);
  if(waterFillIntent(t)) return story(t,opt);   // 수원 앞에서 물을 긷는 글 → 실제로 채운 뒤 이야기로
  const it=RX.NEG.test(t)?null:INTENTS.find(x=>{ try{ return x.when(t) }catch(_){ return false } });
  if(it&&spotOn()&&['go','travel','sleep','home'].includes(it.id)){ spotBlock(); return }   // 임시 장소에서는 구역 전용 행동 불가
  if(it){
    if(opt.src==='free'&&it.confirm&&!opt.confirmed) return showSysChip(t,it);
    if(it.run(t)!==false) return;
  }
  if(opt.src==='free'&&!opt.confirmed){ const ck=checkIntent(t); if(ck) return showCheckChip(t,ck) }
  story(t,opt);
}
/* 이야기로 진행: 물·식량 판정 → 걸음 → 서술 AI */
function story(t,opt={}){
  if(busy||!G) return;
  const soft=(opt.src==='choice'||opt.src==='fixed')&&(G.loc==='dungeon'||G.loc==='camp');
  const j=judgeNeeds(t);
  if(j){ j.logs.forEach(l=>addLog('fx',l)); pend(j.note,j.flags) }
  if(G.loc!=='city') tick(soft);
  pend(opt.extra||'',{storyOnly:!!opt.storyOnly,checkHP:!!opt.checkHP,viaChoice:opt.src==='choice'});
  aiTurn(t,'',!opt.noActionLog);
}
/* AI 선택지의 종류 → 게임 기능 */
function runChoiceType(type,text){
  const L=G.loc, say=()=>addLog('action',text);
  if(type==='rest'){ say(); sleepHere(); return true }
  if(type==='camp'&&['road','dungeon'].includes(L)){ say(); campHere(); return true }
  if(type==='return'&&inRuin()){ say(); returnToCity(); return true }
  if(type==='exit'&&L==='dungeon'){ exitRuin(); return true }
  if(type==='trade'){
    if(G.caravan&&G.caravan.here&&L===(G.caravan.loc||'road')){ openCaravan(); return true }
    if(L==='city'||L==='town'){ say(); openShop(); return true }
  }
  return false;
}

/* ---------- 확인 칩 ---------- */
let chipText='', chipIntent=null;
function hideChip(){ const c=document.getElementById('intentChip'); if(c) c.remove() }
function chip(html){
  hideChip();
  const row=document.querySelector('#game .free'); if(!row) return null;
  const d=document.createElement('div'); d.id='intentChip'; d.innerHTML=html;
  row.parentNode.insertBefore(d,row); return d;
}
function showSysChip(t,it){
  chipText=t; chipIntent=it;
  chip(`<span class="q">이 행동은 게임 기능 <b>${it.label(t)}</b>(으)로 처리할 수 있습니다.</span>
    <button class="small primary" onclick="intentRun()">기능으로 실행</button>
    <button class="small" onclick="intentStory()">이야기로만 진행 (시간·자원 변화 없음)</button>
    <button class="small" onclick="intentCancel()">취소</button>`);
}
function showCheckChip(t,ck){
  chipText=t; chipIntent=null;
  const opt=Object.keys(SK).map(k=>`<option value="${k}" ${k===ck.skill?'selected':''}>${SK[k]} (${G.char.stats[k]})</option>`).join('');
  const dco=Object.keys(DCV).map(k=>`<option value="${k}" ${k===ck.dc?'selected':''}>${DCN[k]} ${DCV[k]}</option>`).join('');
  const d=chip(`<span class="q">🎲 결과가 불확실한 행동입니다. 판정하고 진행할까요? <span class="muted" id="ckP"></span></span>
    <select id="ckS" aria-label="능력치">${opt}</select><select id="ckD" aria-label="난이도">${dco}</select>
    <button class="small primary" onclick="intentCheck()">🎲 판정하고 진행</button>
    <button class="small" onclick="intentRun()">판정 없이 진행</button>
    <button class="small" onclick="intentCancel()">취소</button>`);
  const upd=()=>{ const p=document.getElementById('ckP'); if(p) p.textContent=`성공 확률 약 ${checkChance(document.getElementById('ckS').value,document.getElementById('ckD').value,t)}%` };
  if(d){ d.querySelectorAll('select').forEach(s=>s.onchange=upd); upd() }
}
function intentRun(){ const t=chipText; hideChip(); chipText=''; if(t) act(t,{src:'free',confirmed:true}) }
function intentStory(){
  const t=chipText; hideChip(); chipText=''; if(!t) return;
  story(t,{src:'free',storyOnly:true,extra:'\n[시스템 처리 없음] 플레이어는 이 행동을 게임 기능 없이 이야기로만 진행하기로 했다. 장소 이동·시간 경과·거래·휴식 효과를 만들지 말고, 의도와 분위기·짧은 장면으로만 서술. effects는 모두 0.'});
}
function intentCheck(){
  const t=chipText; if(!t) return;
  const s=document.getElementById('ckS').value, d=document.getElementById('ckD').value;
  hideChip(); chipText='';
  doCheck(t,s,d,'free');
}
function intentCancel(){ hideChip(); chipText='' }
on('before',1,()=>hideChip());

/* ---------- 판정: 2d6 + 능력치 + 특성 보너스 vs 난이도 ---------- */
const CHECK_RX=[
  ['str',/(기어오르|기어올라|올라탄|매달|밀어붙|밀친|들어올|부순|부숴|힘껏|억지로|뛰어넘|건너뛴|잡아당|비틀어|열어젖|버틴다|버텨|맞서 싸|공격한|베어|휘두른|제압)/],
  ['wis',/(해독|읽어\s*낸|풀어\s*본|수수께끼|암호|비문을|문자를\s*읽|기억해\s*낸|추리|장치를\s*분석|원리를|맞춰\s*본)/],
  ['cha',/(설득|흥정|속인|속여|거짓말|협박|달랜|구슬|위협|값을\s*깎|매혹|꼬드|부추)/],
  ['sur',/(함정을|추적|발자국|숨는다|숨어서|몰래|살금|피해\s*간|피한다|기척을|방향을\s*잡|길을\s*찾|해체|해제|응급|붕대|지혈|미끄러지지)/],
];
function checkIntent(t){
  for(const [k,re] of CHECK_RX) if(re.test(t)){ const r=G.loc==='dungeon'?curRoom():null; return {skill:k,dc:r&&r.danger>=2?'hard':'normal'} }
  return null;
}
function checkBonus(skill,text){
  const parts=[]; let b=0; const t=String(text||'');
  const add=(v,why)=>{ b+=v; parts.push(`${why} ${v>0?'+':''}${v}`) };
  if(hasTrait('고대 문자 해독')&&skill==='wis'&&/(문자|비문|글씨|글자|해독|기록|두루마리|석판|문양|명문)/.test(t)) add(2,'고대 문자 해독');
  if(hasTrait('은빛 혀')&&skill==='cha') add(2,'은빛 혀');
  if(hasTrait('전투 경험')&&skill==='str'&&/(싸|공격|베|휘두|막아|맞서|찌르|때리|제압)/.test(t)) add(2,'전투 경험');
  if(hasTrait('낙타와 친함')&&/(낙타|당나귀|동물|짐승|말을|가축)/.test(t)) add(2,'낙타와 친함');
  if(hasTrait('지독한 호기심')&&skill==='wis') add(1,'지독한 호기심');
  if(hasTrait('밤눈')&&skill==='sur'&&(G.time==='밤'||(G.loc==='dungeon'&&G.torch<=0))) add(1,'밤눈');
  if(G.loc==='dungeon'&&G.torch<=0&&!hasTrait('밤눈')&&skill!=='cha') add(-2,'횃불 없음');
  if(G.hp<=Math.ceil(G.maxhp*0.3)) add(-1,'부상');
  try{ westBonus(skill,t,add) }catch(e){}
  return {b,parts};
}
function checkChance(skill,dc,text){
  const need=DCV[dc]-(G.char.stats[skill]||0)-checkBonus(skill,text).b; let n=0;
  for(let a=1;a<=6;a++) for(let c=1;c<=6;c++) if(a+c>=need) n++;
  return Math.round(n/36*100);
}
function rollCheck(skill,dc,text){
  const d=()=>1+Math.floor(Math.random()*6);
  const st=G.char.stats[skill]||0, bo=checkBonus(skill,text), DC=DCV[dc];
  let a=d(), c=d(), tot=a+c+st+bo.b, rr='';
  if(tot<DC-2&&hasTrait('진의 총애')&&G._jinDay!==G.day){ G._jinDay=G.day; const a2=d(),c2=d(); rr=` → ✨ 진의 총애로 다시 굴림 ${a2}+${c2}`; a=a2; c=c2; tot=a+c+st+bo.b }
  const res=tot>=DC?'success':tot>=DC-2?'partial':'fail';
  try{ sfx('dice'); sfx(res,0.4) }catch(e){}
  try{ cityOnCheck(skill,res) }catch(e){}
  rollCheck.last=res;   // 결과에 따라 갈리는 기능(이람 석판 등)이 읽음
  const label={success:'성공',partial:'부분 성공',fail:'실패'}[res];
  addLog('fx',`🎲 ${SK[skill]} 판정 (${DCN[dc]} ${DC}): ${a}+${c} + ${SK[skill]} ${st}${bo.parts.length?' · '+bo.parts.join(' · '):''}${rr} = ${tot} → ${label}`);
  let hp=0; const r=G.loc==='dungeon'?curRoom():null, danger=G.fight?G.fight.danger:r?r.danger:(G.loc==='road'?1:0);
  if(skill!=='cha'&&(G.fight||!isTown())){ if(res==='fail') hp=-Math.max(1,danger); else if(res==='partial'&&danger>=2) hp=-1 }
  if(hp){ G.hp=Math.max(0,G.hp+hp); addLog('fx',`체력 ${hp}`) }
  const how={success:'플레이어의 의도대로 해낸다.',partial:'해내기는 하지만 대가나 새로운 문제가 함께 생긴다(시간 지체, 소음, 물건 손상, 상대의 의심 등 — 체력 외의 것으로).',fail:'의도대로 되지 않는다. 그 결과로 상황이 나빠진다.'}[res];
  return `\n[판정 결과 — 게임 코드가 이미 정함, 절대 뒤집지 말 것] ${SK[skill]} 판정 ${label}. ${how}${hp?` 이 결과로 플레이어가 입은 피해(체력 ${hp})는 코드가 이미 반영했다.`:''} effects.hp는 0으로 둘 것. 판정이나 주사위라는 말은 서술에 쓰지 말 것.`;
}
function doCheck(text,skill,dc,src){
  if(busy||!G) return;
  addLog('action',text);
  story(text,{src:src||'free',extra:rollCheck(skill,dc,text),checkHP:true,noActionLog:true});
}

/* =========================================================

const NEED_RX={

  EAT:/(식량을?\s*(먹|꺼내|씹)|(빵|대추야자|말린\s*과일|육포|건포도|말린\s*대추|비상식)[을를]?\s*(먹|씹|꺼내)|끼니를|허기를\s*(달랜|채운|해소)|배를\s*채운|음식을\s*먹|밥을\s*먹)/,

  GAIN_W:/(오아시스|우물|샘|물웅덩이|수원|빗물|저수조|물(병|통|주머니|단지)[을를이가]?\s*.{0,10}(발견|찾|얻|줍|주웠|건네|받|챙|채운|채웠))/,
  GAIN_F:/((식량|빵|대추|열매|고기|과일|말린|육포|보급품|자루|도시락)[을를이가]?\s*.{0,10}(발견|찾|얻|줍|주웠|건네|받|챙))/,
};
/* 마시기·먹기: 지금 1 소비 → 다음 자동 소비 1회 면제. 물이 없으면 실패. 수원 앞이면 줄지 않음 */
function judgeNeeds(t){
  if(!G||!t) return null;
  t=String(t);
  if(RX.OOC.test(t)) return null;
  const drink=NEED_RX.DRINK.test(t), eat=NEED_RX.EAT.test(t);
  if((!drink&&!eat)||NEED_RX.NEG.test(t)) return null;
  const notes=[], logs=[], flags={};
  const atSource=isTown()||(NEED_RX.SOURCE.test(t)&&NEED_RX.SOURCE.test(lastScene()))||(G.waterSrc&&!G.waterSrc.used);
  if(drink){
    if(atSource){
      flags.srcOK=true;
      notes.push('[행동 판정 — 수원] 이곳에는 마실 물이 넉넉하다. 플레이어의 물주머니 수치는 줄지 않는다. 물주머니를 채우는 행동까지 했다면 effects.water +1~+2까지 허용, 아니면 0.');
    }else if(G.water>0){
      G.water--; G._wCredit=Math.min(2,(G._wCredit||0)+1);
      logs.push(`💧 물 -1 · 지금 마신 만큼 다음 자동 소비 1회를 건너뜁니다 (남은 물 ${G.water})`);
      notes.push(`[행동 판정 — 코드가 이미 처리] 플레이어는 가진 물을 마셨다(물 ${G.water+1}→${G.water}). 목을 축이는 서술은 해도 되지만 effects.water·food·hp는 반드시 0.`);
    }else{
      logs.push('💧 마실 물이 없습니다 — 물주머니가 비어 있습니다');
      notes.push('[행동 판정 — 실패] 물이 0이다. 플레이어는 물을 마시지 못한다(빈 물주머니를 기울여도 아무것도 나오지 않는다). 갈증이 풀리는 서술 금지. effects.water·hp는 0. 선택지에 물을 구할 방법을 하나 넣어라.');
    }
  }
  if(eat){
    if(isTown()){
      notes.push('[행동 판정] 도시·거점에서의 식사는 식량 수치에 영향을 주지 않는다. effects.food·hp는 0.');
    }else if(G.food>0){
      G.food--; G._fCredit=Math.min(2,(G._fCredit||0)+1);
      logs.push(`🍞 식량 -1 · 지금 먹은 만큼 다음 자동 소비 1회를 건너뜁니다 (남은 식량 ${G.food})`);
      notes.push(`[행동 판정 — 코드가 이미 처리] 플레이어는 가진 식량을 먹었다(식량 ${G.food+1}→${G.food}). effects.water·food·hp는 반드시 0.`);
    }else{
      logs.push('🍞 먹을 식량이 없습니다');
      notes.push('[행동 판정 — 실패] 식량이 0이다. 플레이어는 먹을 것이 없다. 허기가 풀리는 서술 금지. effects.food·hp는 0.');
    }
  }
  return {note:'\n'+notes.join(' '),logs,flags};

function needState(){

on('facts',10,(o,rules)=>{

on('effects',20,(e,{T})=>{

/* 21: 도시·마을·거점 — 이야기로 얻는 금화는 하루 합계 TOWN_GOLD_DAY까지, 체력 회복은 쉼·치료가 있을 때만 */
const TOWN_GOLD_DAY=30, HEAL_RX=/(쉬|쉰|휴식|잠|눕|여관|치료|의원|약사|약초|붕대|연고|상처를\s*(감|닦|싸)|간호|돌봐|목욕|찜질|기도)/;
on('effects',21,(e,ctx)=>{

    if(!G._goldDay||G._goldDay.day!==G.day) G._goldDay={day:G.day,got:0};
    const g=Math.max(0,Math.min(Math.round(+e.gold),TOWN_GOLD_DAY-G._goldDay.got));
    if(g<+e.gold) addLog('sys',`⚖ 이야기로 얻는 금화는 하루 🪙${TOWN_GOLD_DAY}까지입니다 (유물·물건을 팔면 상한 없음)`);

    const used=new Set();

      n=String(n||''); if(!n) return n;

      if(i<0&&n.length>=2) i=G.items.findIndex((x,k)=>!used.has(k)&&x&&(String(x).includes(n)||n.includes(String(x))));
      if(i>=0){ used.add(i); return G.items[i] }

    });

/* 40: 물·식량·횃불 구매는 게임 정가로 (유적 밖) */
on('effects',40,(e,ctx)=>{

  let budget=G.gold, cost=0; const got={};

    got[k]=n; budget-=n*U(k); cost+=n*U(k);

/* 70: 소모품 아이템은 수치로 (물주머니 → 물) */
on('effects',70,(e,ctx)=>{
  ctx.consAdd=[];
  if(Array.isArray(e.items_add)){
    const keep=[];
    e.items_add.forEach(it=>{ const k=consKind(it); if(!k){ keep.push(it); return } if(!(+e[k]>0)) ctx.consAdd.push([k,consCount(it),String(it)]) });
    e.items_add=keep;
  }
  const removed=new Set((Array.isArray(e.items_remove)?e.items_remove:[]).map(String));
  ['water','food','torch'].forEach(k=>{
    let gain=Math.max(0,Math.round(+e[k]||0));
    if(!gain||!CONS_USE_RE.test(ctx.T.action||'')) return;
    for(let i=0;i<G.items.length&&gain>0;i++){
      const it=G.items[i]; if(consKind(it)!==k||removed.has(it)) continue;
      const n=consCount(it);
      if(n<=gain){ removed.add(it); gain-=n } else { G.items[i]=String(it).replace(/\d+/,String(n-gain)); gain=0 }
    }
  });
  e.items_remove=[...removed];
});

/* =========================================================
   7. 휴대 용량
   ========================================================= */
function capLv(){ if(!G.cap) G.cap={w:0,f:0,t:0}; if(G.cap.t==null) G.cap.t=0; return G.cap }
function mountCap(){
  try{
    const m=G.mount&&MOUNTS[G.mount.type]; if(!m||G._mountFed===false) return 0;
    const i=petStage(G.mount.aff||0);
    return (m.capBonus||0)+(i>=3?2:i>=2?1:0);
  }catch(_){ return 0 }
}
function capW(){ return CAP_BASE+CAP_STEP*capLv().w+mountCap() }
function capF(){ return CAP_BASE+CAP_STEP*capLv().f+mountCap()+(petPerk('cat')?1:0) }
function capT(){ return CAP_BASE+CAP_STEP*capLv().t }
function capOf(k){ return k==='water'?capW():k==='food'?capF():capT() }
function clampSupplies(before,silent){
  const lost=[];
  ['water','food','torch'].forEach(k=>{
    const mx=Math.max(capOf(k),(before&&before[k])||0);
    if(G[k]>mx){ lost.push(`${NM[k]} ${G[k]-mx}`); G[k]=mx }
  });
  if(lost.length&&!silent) addLog('fx',`📦 휴대 용량 초과 — ${lost.join(', ')} 버려졌습니다 (상점에서 용량을 늘릴 수 있습니다)`);
  return lost.length>0;
}

const CONS_RE={water:/물\s?주머니|물\s?부대|물\s?병|수통|물통|가죽\s?부대/,food:/식량|도시락|건빵|육포|말린\s?대추|^대추|^빵|빵$/,torch:/횃불/};
const CONS_USE_RE=/바꾸|바꿔|바꾼|변환|마신|마시|마셔|채운|채우|채워|따라|따른|붓|부어|옮겨|사용|쓴다|쓰고|먹는|먹어|먹고|씹|꺼내|소비|보충/;
function consKind(name){ const s=String(name||''); for(const k in CONS_RE) if(CONS_RE[k].test(s)) return k; return null }
function consCount(name){
  const s=String(name||''), m=s.match(/(\d+)\s*(개|통|부대|자루|병)?/);
  if(m&&+m[1]>0&&+m[1]<20) return +m[1];
  if(/(두|둘)\s*(개|통|부대|자루|병)?/.test(s)) return 2;
  if(/(세|셋)\s*(개|통|부대|자루|병)/.test(s)) return 3;
  return 1;
}
function useItem(i){
  if(busy) return;
  const it=G.items[i], k=consKind(it); if(!it||!k) return;
  if(G[k]>=capOf(k)) return toast('가득 차서 쓸 수 없습니다');
  const n=consCount(it);
  G[k]+=n; G.items.splice(i,1);
  addLog('fx',`${it} 사용 → ${NM[k]} +${n}`);
  save(); render(); if(document.querySelector('#modalRoot .modal')) openInv();
}
function itemChipHTML(it,i){
  const k=consKind(it);
  return `<span class="chip">${esc(it)}${k?` <a href="#" onclick="event.preventDefault();useItem(${i})" style="color:var(--accent2);text-decoration:none" title="${NM[k]}으로 바꾸기">사용</a>`:''}</span>`;
}
function itemSellPrice(name){
  let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))>>>0;
  let p=5+h%8;
  if(/반지|목걸이|팔찌|귀걸이|보석|황금|순금|은제|금제|금화|은화|왕관|인장|유물|조각상|향료|비단/.test(name)) p+=12;
  else if(/두루마리|문서|지도|열쇠|도자기|항아리|단검|장검|칼|나침반|등잔/.test(name)) p+=4;
  return p;
}
function sellItem(i){
  const it=G.items[i]; if(!it) return;
  if(consKind(it)) return toast('소모품은 "사용"으로 수치에 더하세요');

  G.lexicon=G.lexicon.filter(e=>!(e.cat==='물건'&&nm.length>=2&&(e.name===it||e.name===nm||nm.includes(e.name)||e.name.includes(nm))));
  const del=before-G.lexicon.length;
  addLog('fx',`상인에게 「${it}」을(를) 팔았습니다 (금화 +${p})`+(del?` · 사전에서 ${del}건 삭제`:''));
  toast(`🪙 +${p}`+(del?` · 사전 ${del}건 삭제`:''));
  save(); render(); openShop();
}

  const keys=n=>{ n=n.replace(/\(.*?\)|[x×]\s*\d+/g,'').trim(); const w=n.split(/\s+/).filter(Boolean); const k=[n]; if(w.length>1&&w[w.length-1].length>=2) k.push(w[w.length-1]); return k.filter(x=>x.length>=2) };

function buy(k,p){
  try{ if(G.gold>=p) sfx('coin') }catch(e){}
  if(['water','food','torch'].includes(k)&&G[k]>=capOf(k)) return toast(`${CAP_NAME[k==='water'?'w':k==='food'?'f':'t']}이(가) 가득 찼습니다 (${capOf(k)}/${capOf(k)})`);
  if(G.gold<p) return toast('금화가 부족합니다');
  G.gold-=p;
  if(k.startsWith('i_')) G.items.push(k.slice(2)); else if(k.startsWith('m_')) G.mat[k.slice(2)]++; else G[k]++;
  save(); render(); openShop();
}
function fillSupply(k){
  const cap=capOf(k), need=cap-G[k];
  if(need<=0) return toast('이미 가득 찼습니다');
  const price=need*priceHere(k);
  if(G.gold<price) return toast('금화가 부족합니다');
  G.gold-=price; G[k]=cap;
  addLog('fx',`${CAP_NAME[k==='water'?'w':k==='food'?'f':'t']}을(를) 가득 채웠습니다 (+${need}, 금화 -${price})`);
  save(); render(); openShop();
}
function buyCap(t){
  const c=capLv(), lv=c[t], tbl=CAP_PRICE[t];
  if(lv>=tbl.length) return;
  const price=tbl[lv];
  if(G.gold<price) return toast('금화가 부족합니다');
  G.gold-=price; c[t]=lv+1;
  addLog('fx',`${CAP_ICON[t]} ${CAP_NAME[t]} 확장 — 용량 ${capOf(CAP_KEY[t])} (금화 -${price})`);
  save(); render(); openShop();
}
function openShop(){
  if(spotBlock()) return;
  const goods=SHOP_GOODS.map(([n,k,p])=>[n,k,['water','food','torch'].includes(k)?priceHere(k):p]).map(([n,k,p])=>`<div class="shop-row"><span>${n} <span class="muted">(보유 ${getQ(k)})</span></span><button class="small" onclick="buy('${k}',${p})">금화 ${p}</button></div>`).join('');
  const capRow=t=>{
    const key=CAP_KEY[t], cap=capOf(key), lv=capLv()[t], tbl=CAP_PRICE[t], max=lv>=tbl.length, price=tbl[lv];
    const fill=cap-G[key], fp=fill*priceHere(key);
    const mb=(t!=='t'&&mountCap())?` <span class="muted">· 탈것 +${mountCap()}</span>`:'';
    return `<div class="shop-row" style="gap:8px;align-items:center;flex-wrap:wrap"><span>${CAP_ICON[t]} ${CAP_NAME[t]} <span class="muted">(${G[key]}/${cap})</span>${mb}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="small" ${fill>0?'':'disabled'} onclick="fillSupply('${key}')">가득 채우기${fill>0?` +${fill} 🪙${fp}`:''}</button>
      ${max?'<span class="muted">최대 용량</span>':`<button class="small ${G.gold>=price?'primary':''}" onclick="buyCap('${t}')">확장 ${lv*CAP_STEP+CAP_BASE}→${lv*CAP_STEP+CAP_BASE+CAP_STEP} 🪙${price}</button>`}</span></div>`;
  };
  let mt=`<h4 style="margin:14px 0 4px">탈것 시장</h4>`;
  if(G.mount){
    const d=MOUNTS[G.mount.type];
    mt+=`<div class="shop-row"><span>🐪 ${esc(G.mount.name)} <span class="muted">(${d.n})</span></span><button class="small" onclick="sellMount()">팔기 🪙${Math.floor(d.price/2)}</button></div><p class="muted">탈것은 한 마리만 둘 수 있습니다. 다른 동물로 바꾸려면 먼저 파세요.</p>`;
  }else if(!has('stable')) mt+=`<p class="muted">거점에 <b>마구간</b>을 지어야 당나귀나 낙타를 들일 수 있습니다. (거점 짓기 → 마구간)</p>`;
  else mt+=Object.entries(MOUNTS).filter(([k,d])=>!d.locked||hasWest(d.locked)).map(([k,d])=>`<div class="shop-row" style="gap:10px;align-items:flex-start"><div><b>${d.n}</b><br><span class="muted">${d.desc}<br>사료: 원정마다 식량 ${d.feed}</span></div><button class="small ${G.gold>=mountPrice(k)?'primary':''}" onclick="buyMount('${k}')">금화 ${mountPrice(k)}${mountPrice(k)<d.price?' (할인)':''}</button></div>`).join('');
  const sells=G.items.map((it,i)=>consKind(it)?'':`<div class="shop-row"><span>${esc(it)}</span><button class="small" onclick="sellItem(${i})">팔기 🪙${itemSellPrice(it)}</button></div>`).join('');
  modal('시장',`<p class="muted">금화: <b id="shopGold">${G.gold}</b></p>${goods}
    <h4 style="margin:14px 0 4px">휴대 용량</h4>${capRow('w')}${capRow('f')}${capRow('t')}
    <p class="muted" style="font-size:12px">물·식량·횃불은 용량까지만 들고 다닐 수 있고 초과분은 버려집니다.${G.loc==='town'?` ${curTown().n}: ${curTown().perk}.`:''} 가격 — 카스르·거점: 물 🪙${PRICE_TOWN.water} · 식량 🪙${PRICE_TOWN.food} · 횃불 🪙${PRICE_TOWN.torch}. 사막 길에서 가끔 만나는 대상 상인(🐫 버튼)이나 이야기 속 상인에게 사면 물·식량 🪙${PRICE_ROAD.water} · 횃불 🪙${PRICE_ROAD.torch}.</p>
    ${mt}
    ${decorShopHTML()}
    <h4 style="margin:14px 0 4px">물건 팔기</h4>${sells||'<p class="muted">팔 수 있는 물건이 없습니다.</p>'}
    <p class="muted">팔면 사전의 같은 이름 「물건」 항목도 함께 지워집니다. 물주머니 같은 소모품은 소지품에서 "사용"하세요.</p>`);
}

function goHome(){
  if(busy||spotBlock()) return;
  if(!has('land')) return openBuild();
  G.loc='home'; G._yuminHere=false; G.choices=[];
  addLog('sys',`거점 「${G.home.name||'오아시스의 집'}」에 도착했습니다.`);
  save(); render();
}
function openBuild(){
  const rows=FAC.map(f=>{
    const done=has(f.id), locked=f.req&&!has(f.req);
    const btn=done?'<span class="muted">완성</span>'
      :locked?`<span class="muted">${FAC.find(x=>x.id===f.req).n} 필요</span>`
      :`<button class="small ${canPay(f.cost)?'primary':''}" ${canPay(f.cost)?'':'disabled'} onclick="build('${f.id}')">${f.id==='land'?'구입':'짓기'} ${costText(f.cost)}</button>`;
    return `<div class="shop-row" style="gap:10px;align-items:flex-start"><div><b>${done?'✅ ':''}${f.n}</b><br><span class="muted">${f.desc}</span></div><div style="white-space:nowrap">${btn}</div></div>`;
  }).join('');
  modal('거점 짓기',`<p class="muted">보유: 🪙${G.gold} · ${MATS.map(m=>`${m.i}${m.n} ${G.mat[m.k]}`).join(' · ')}<br>돌은 유적을 탐사하고 돌아올 때 모이고, 돌·목재·천 모두 시장에서도 살 수 있습니다. 유물은 유적 깊은 곳에서 찾으세요.</p>
    ${has('land')?`<label>거점 이름</label><input value="${esc(G.home.name)}" placeholder="오아시스의 집" onchange="G.home.name=this.value.trim();save();render()">`:''}
    ${rows}`);
}
function build(id){
  if(busy) return;
  const f=FAC.find(x=>x.id===id);
  if(!canPay(f.cost)) return toast('재료가 부족합니다');
  sfx('build');
  pay(f.cost); G.home.built[id]=true;
  G.chronicle.push({day:G.day,text:id==='land'?'카스르 외곽 오아시스에 작은 거점을 마련했다':`거점에 ${f.n}을(를) 지었다`});
  toast(`🏠 ${f.n} 완성`);
  closeModal();
  G.loc='home'; G._yuminHere=false;
  aiTurn(id==='land'?'오아시스 가장자리의 땅을 사들인다':`거점에 ${f.n}을(를) 짓는다`,
    `[건설 장면] ${id==='land'?'처음으로 갖게 된 내 땅. 흙벽 오두막, 야자수, 오아시스 물빛, 이웃(대추 농부, 물 긷는 아이 등)과의 첫 만남.':`새로 지은 ${f.n}의 모습과 쓰임새. 일꾼, 자재, 완성된 순간의 감각.`} 2문단으로 짧게. 플레이어에게 이곳이 조금씩 '돌아올 곳'이 되어 가는 느낌. 숫자 effects는 모두 0.`);
}
function homeRest(){
  if(busy) return;
  const first=G.home.lastRestDay!==G.day;
  G.home.lastRestDay=G.day;
  G.hp=G.maxhp; G.day++; G.time='낮'; G.dayStep=0;
  if(has('garden')&&first){ const gf=Math.min(2,Math.max(0,capF()-G.food)); G.food+=gf; addLog('fx',gf?`정원의 대추 — 식량 +${gf}`:'정원의 대추 — 식량 자루가 가득 차 있습니다') }
  addLog('sys',`거점에서 푹 쉬었습니다. 체력이 모두 회복되었습니다. (${G.day}일째 아침)`);
  if(G.mount) petGain(G.mount,1,G.mount.name);
  (G.pets||[]).forEach(p=>petGain(p,1,p.name));
  // 유민은 동행 중이거나, 손님방이 있고 실제로 손님방에 머물 때만 함께 쉼
  updateYuminSpot();
  const withYumin=G.comp.met&&(G.comp.joined||(has('guest')&&G.comp.spot==='guestroom'));
  if(withYumin&&first){
    G._yuminHere=true; changeAff(3,null);
    aiTurn('거점에서 하룻밤을 보낸다',relArmText('유민',0.6)+(G.relEvt?'':yuminArcArm(0.6))+`[거점의 밤] ${G.comp.joined?'함께 여행 중인':'손님방에 머무는'} 유민과 거점에서 보내는 조용한 저녁과 아침. 집이라는 공간이 유민에게 어떤 감정을 건드리는지(오래 혼자였던 사람) 서술로만 살짝 비추고, 대사는 회피 패턴과 호감도 단계에 맞게. 체력 effects는 0.`,false);
  }else{ save(); render() }
}
/* 유물 감정·판매: 거점 작업실(정가) 또는 자르한 골동품상(20% 더) */
function relicPrice(g){ const m=(G.loc==='town'&&curTown().relicBuy||1)*(hasWest('swport')?1.25:1); return Math.round(RELIC_GRADES[g].p*m) }
function appraise(){
  relicSync();
  if(G.mat.relic<1) return toast('감정할 유물이 없습니다');
  const where=G.loc==='town'?`${curTown().n}의 골동품상`:'작업실';
  modal('🏺 유물 감정',`<p class="muted">${where}에서 유물을 감정해 팝니다. 등급이 높을수록 값이 오릅니다.${G.loc==='town'?' (작업실보다 20% 더 쳐 줍니다)':''}</p>`+
    RELIC_GRADES.map((r,g)=>`<div class="shop-row"><span>🏺 ${r.n} <span class="muted">(보유 ${G.relicG[g]})</span></span><button class="small ${G.relicG[g]?'primary':''}" ${G.relicG[g]?'':'disabled'} onclick="sellRelic(${g})">팔기 🪙${relicPrice(g)}</button></div>`).join('')+
    `<p class="muted" style="font-size:12px">시설을 지을 때나 선물할 때는 흔한 유물부터 씁니다.</p>`);
}
function sellRelic(g){
  relicSync();
  if(!(G.relicG[g]>0)) return;
  const p=relicPrice(g);
  G.relicG[g]--; G.mat.relic--; G.gold+=p;
  addLog('fx',`🏺 ${RELIC_GRADES[g].n}을(를) 감정해 넘겼습니다 (금화 +${p})`);
  save(); render(); appraise();
}
/* 별지도 서재 연구: 일정 확률(매와 친하면 더 높게)로 조각의 위치 단서 */
function studyMap(){
  if(busy) return;
  if(G.home.lastStudyDay===G.day) return toast('오늘은 이미 연구했습니다. 내일 다시 해 보세요');
  G.home.lastStudyDay=G.day;
  let extra=`[연구 장면] 지금까지의 연대기, 사전, 모은 별지도 조각(${G.fragments}/${FRAG_GOAL})을 바탕으로 이람에 관한 새로운 단서 하나를 발견한다. 1막이므로 일곱 도시는 아주 희미한 암시만 허용. 발견한 단서를 전설처럼 서술에 분명히 담아라. 숫자 effects는 0.`;
  const p=petPerk('hawk')?0.5:0.35;
  if(G.fragments<FRAG_GOAL&&Math.random()<p){
    let clue='';
    const pr=(G.pausedRuins||[]).find(d=>d.rooms.some(r=>r.fragment&&!r.fragTaken)&&!d.clued);
    if(pr){ const room=pr.rooms.find(r=>r.fragment&&!r.fragTaken); pr.clued=true; clue=`중단한 유적 「${pr.name}」의 「${room.name}」 쪽에 별지도 조각이 있다` }
    else if(G.nextRuinFrag==null){ G.nextRuinFrag=Math.random()<0.5; clue=G.nextRuinFrag?'다음에 찾아갈 유적 어딘가에 별지도 조각이 있다':'다음에 찾아갈 유적에는 별지도 조각이 없다. 다른 곳에서 찾아야 한다' }
    if(clue){
      extra+=` [연구 단서] 이번 연구로 다음 사실이 드러난다: ${clue}. 별자리 문양과 기록을 짚어 가며 이 사실을 서술에 분명히 담아라.`;
      G.chronicle.push({day:G.day,text:`별지도 연구로 단서를 얻었다: ${clue}`});
      addLog('fx',`🌌 연구 단서: ${clue}`);
    }
  }
  aiTurn('별지도 서재에서 모은 조각과 기록을 연구한다',extra);
}
function wellMax(){ return has('well2')?6:3 }
function wellLeft(){ if(G.home.wellDay!==G.day){ G.home.wellDay=G.day; G.home.wellN=0 } return Math.max(0,wellMax()-(G.home.wellN||0)) }
function wellLabel(){ return `💧 우물에서 물 채우기 (오늘 ${wellLeft()}/${wellMax()}회 남음)` }
function wellFill(){
  if(busy||G.loc!=='home'||!has('well')) return;
  if(wellLeft()<=0) return toast(`오늘은 우물을 ${wellMax()}번 다 썼습니다. 내일 다시 이용할 수 있습니다`);
  const need=capW()-G.water;
  if(need<=0) return toast(`물통이 이미 가득 찼습니다 (${G.water}/${capW()})`);
  G.water=capW(); G.home.wellN=(G.home.wellN||0)+1;
  addLog('fx',`💧 우물에서 물을 길어 가득 채웠습니다 (+${need}, 무료 · 오늘 ${wellLeft()}회 남음)`);
  save(); render();
}
function storeStock(){ const s=G.home.stock||(G.home.stock={}); ['food','water','torch'].forEach(k=>{ if(typeof s[k]!=='number') s[k]=0 }); return s }
function storeCaps(){ return has('store2')?STORE_CAPS.big:STORE_CAPS.base }
function storeHTML(){
  const s=storeStock(), C=storeCaps(), NAME={food:'🍞 식량',water:'💧 물',torch:'🔥 횃불'};
  const rows=['food','water','torch'].map(k=>{
    const room=capOf(k)-G[k], canIn=G[k]>0&&s[k]<C[k], canOut=s[k]>0&&room>0;
    return `<div class="shop-row" style="align-items:center"><span>${NAME[k]}<br><span class="muted" style="font-size:12px">소지 ${G[k]}/${capOf(k)} · 보관 ${s[k]}/${C[k]}</span></span>
      <span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
        <button class="small" ${canIn?'':'disabled'} onclick="storeMove('${k}','in',1)">맡김 +1</button>
        <button class="small" ${canIn?'':'disabled'} onclick="storeMove('${k}','in',99)">전부</button>
        <button class="small" ${canOut?'':'disabled'} onclick="storeMove('${k}','out',1)">꺼냄 -1</button>
        <button class="small" ${canOut?'':'disabled'} onclick="storeMove('${k}','out',99)">가득</button></span></div>`;
  }).join('');
  return `<p class="muted">거점에 식량·물·횃불을 맡겨 두었다가 원정 전에 꺼낼 수 있습니다.${has('store2')?' (확장됨)':' 시설 짓기에서 큰 저장고로 확장할 수 있습니다.'}</p>${rows}
    <p class="muted" style="font-size:12px;margin-top:8px">원정에는 물과 식량이 최소 1씩 필요하니 전부 맡기지 않도록 주의하세요.</p>`;
}
function openStore(){ if(has('store')) modal('📦 저장고',storeHTML()) }
function storeMove(k,dir,n){
  if(!has('store')||!['food','water','torch'].includes(k)) return;
  const s=storeStock(), C=storeCaps(), NAME={food:'🍞 식량',water:'💧 물',torch:'🔥 횃불'};
  if(dir==='in'){ const x=Math.min(n,G[k],C[k]-s[k]); if(x<=0) return; G[k]-=x; s[k]+=x; addLog('fx',`📦 저장고에 ${NAME[k]} ${x}개를 맡겼습니다`) }
  else{ const x=Math.min(n,s[k],capOf(k)-G[k]); if(x<=0) return; G[k]+=x; s[k]-=x; addLog('fx',`📦 저장고에서 ${NAME[k]} ${x}개를 꺼냈습니다`) }
  save(); render();
  if(document.querySelector('#modalRoot .modal')) modal('📦 저장고',storeHTML());
}

   12. 탈것 · 동물 친구
   ========================================================= */
function mountDef(){ return G&&G.mount?MOUNTS[G.mount.type]:null }
function mountOn(){ return !!(mountDef()&&G._mountFed&&isWild()) }
function mountNoWater(){ return !!(mountDef()&&mountDef().noWater&&G._mountFed) }
function mountCarry(){
  const m=mountDef(); if(!m||!G._mountFed) return '';
  G.mat.stone+=1; let t=`${G.mount.name}${josa(G.mount.name,'이','가')} 짐을 날랐습니다: 🪨돌 +1`;
  if(m.carry>=2){ const k=Math.random()<0.5?'wood':'cloth'; G.mat[k]+=1; t+=k==='wood'?' · 🪵목재 +1':' · 🧵천 +1' }
  return t;
}
function mountRescueKeep(){ const m=mountDef(); return (m&&m.rescue&&G._mountFed&&isWild())?0.75:0.5 }
function buyMount(type){
  const d=MOUNTS[type]; if(!d||G.mount) return;
  if(!has('stable')) return toast('마구간이 필요합니다');
  if(G.gold<mountPrice(type)) return toast('금화가 부족합니다');
  G.gold-=mountPrice(type); G.mount={type,name:d.n,aff:10}; G._mountFed=true;
  G.chronicle.push({day:G.day,text:`시장에서 ${d.n}${josa(d.n,'을','를')} 사서 거점 마구간에 들였다`});
  toast(`🐪 ${d.n}${josa(d.n,'을','를')} 들였습니다`);
  save(); render(); openShop();
}
async function sellMount(){
  if(!G.mount) return;
  const d=MOUNTS[G.mount.type];
  if(!(await askConfirm(`${G.mount.name}${josa(G.mount.name,'을','를')} 금화 ${Math.floor(d.price/2)}에 팔까요?`))) return;
  G.gold+=Math.floor(d.price/2);
  G.chronicle.push({day:G.day,text:`${G.mount.name}${josa(G.mount.name,'을','를')} 팔았다`});
  G.mount=null; G._mountFed=false; save(); render(); openShop();
}
function petStage(a){ let i=0; PET_STAGES.forEach((s,k)=>{ if(a>=s[0]) i=k }); return i }
function petStageName(a){ return PET_STAGES[petStage(a)][1] }
function petPerk(kind){ return !!G&&(G.pets||[]).some(p=>p.kind===kind&&p.aff>=45) }
function petGain(o,d,label){
  const before=petStage(o.aff||0);
  o.aff=Math.max(0,Math.min(100,(o.aff||0)+d));
  const after=petStage(o.aff);
  if(after>before){ toast(`🐾 ${label}와(과)의 관계: ${PET_STAGES[after][1]}`); G.chronicle.push({day:G.day,text:`${label}${josa(label,'과','와')} '${PET_STAGES[after][1]}'가 되었다`}) }
}
function careAnimal(i){

function adoptPet(k){

async function startExpedition(leadId){
  if(busy||spotBlock()) return;
  if(G.loc==='town'&&curTown().west) return toast('서쪽 땅에는 탐사할 유적이 없습니다. 전설을 쫓아 보세요');
  if(G.water<1||G.food<1) return toast('원정에는 물과 식량이 최소 1씩 필요합니다');
  const lead=typeof leadId==='string'?(G.leads||[]).find(x=>x.id===leadId):null;   // 소문으로 알게 된 장소를 찾아가는 원정
  G._leadRuin=lead?lead.id:null;
  const resume=lead?null:(G._resumeRuin!=null&&G.pausedRuins&&G.pausedRuins[G._resumeRuin]);
  const fromPos=curPos(), fromName=curPlaceName();
  const bonus=[];
  if(has('workshop')){ G.torch+=1; bonus.push('횃불 +1') }
  const sp=spouseName(); if(sp){ G.food+=1; bonus.push(`${sp}${josa(sp,'이','가')} 챙겨 준 도시락 식량 +1`) }
  clampSupplies(null,false);
  G._yuminHere=false;
  G.base=G.loc==='town'?G.town:null;   // 원정을 떠난 곳 (돌아올 곳)
  const pos=lead?lead.pos:pickPos(), days=travelDays(fromPos,pos), n=travelNeed(days);
  /* 원정 길의 유민 (예전 규칙): 아직 못 만났으면 35%, 사연이 무르익었으면 50% */
  const event=!G.comp.met&&Math.random()<0.35?'yumin':yuminEventReady()&&Math.random()<0.5?'yuminEvt':null;
  const hadMount=!!G.mount;
  const p=beginTrip({kind:'ruin',name:lead?`「${lead.name}」`:resume?`「${resume.name}」`:'유적',pos,base:G.base},days,
    {fromPos,fromName,event,action:lead?`「${lead.name}」${josa(lead.name,'으로','로')} 길을 떠난다`:resume?`「${resume.name}」${josa(resume.name,'으로','로')} 다시 원정을 떠난다`:'유적을 찾아 사막으로 원정을 떠난다'});
  if(bonus.length) addLog('fx',`거점에서 챙긴 보급: ${bonus.join(' · ')}`);
  if(hadMount&&G.mount){
    if(!n.feed) addLog('fx',`${G.mount.name}에게 줄 사료가 모자라 지쳐 있습니다 — 이번 원정에서는 탈것의 이점이 없습니다`);
    else if(mountNoWater()) addLog('fx',`${G.mount.name}${josa(G.mount.name,'이','가')} 물을 나릅니다 — 물 소모 절반`);
    petGain(G.mount,G._mountFed?2:-2,G.mount.name);
  }
  save(); render();
  await p;
}
