<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>텍스트 모험 선택</title>
<style>
:root{--bg:#f4f1ea;--ink:#222;--muted:#666;--card:#fff;--line:#d8d2c4;--a:#2a6f93}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--ink:#e8e8ee;--muted:#9aa3b5;--card:#1a2030;--line:#2c3550;--a:#7fd0ee}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
main{width:min(720px,100%);padding:24px 16px}
h1{font-size:22px;margin:0 0 6px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.grid{display:grid;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
a.card:hover{border-color:var(--a)}
.card b{font-size:18px}
.card span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.5}
footer{margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>🎲 AI 텍스트 모험</h1>
  <p class="sub">플레이할 게임을 고르세요. 각 게임은 별도 파일이고 세이브도 따로 저장됩니다.</p>
  <div class="grid">
    <a class="card" href="hanbit.html"><b>🔦 출석부에 없는 구역</b><span>한빛 기숙학원 7반 괴담 조사 기록. 공포·배터리·벌점을 관리하며 지워진 일곱 구역을 찾습니다.</span></a>
    <a class="card" href="sand_seven_cities.html"><b>🏜 모래 아래의 일곱 도시</b><span>원작. 사막 위 도시 카스르에서 출발해 석판이 가리키는 묻힌 도시를 찾는 모험입니다.</span></a>
  </div>
  <footer>API 키와 설정은 두 게임이 공유합니다 (같은 경로에서 열 때).</footer>
</main>
</body>
</html>
