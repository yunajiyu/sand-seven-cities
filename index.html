/* =========================================================
   23. 되돌리기 (직전 행동 1번) · 턴 시작 처리
   ========================================================= */
const UNDO_KEY='sand7_undo';
try{ const u=JSON.parse(localStorage.getItem(UNDO_KEY)||'null'); if(u&&u.snap){ undoSnap=u.snap; undoLabel=u.label||'' } }catch(e){}
function persistUndo(){
  try{ if(undoSnap) localStorage.setItem(UNDO_KEY,JSON.stringify({snap:undoSnap,label:undoLabel})); else localStorage.removeItem(UNDO_KEY) }catch(e){}   // 공간이 모자라면 이번 접속 동안만
}
function resetUndo(){ undoSnap=null; stableSnap=null; undoLabel=''; persistUndo(); updateUndoBtn() }
function updateUndoBtn(){
  const b=document.getElementById('undoBtn'); if(!b) return;
  const ok=!!undoSnap&&!busy&&!!G&&!G.fight;
  b.disabled=!ok;
  b.title=ok?`되돌리기: 「${undoLabel}」 이전 상태로`:'되돌릴 행동이 없습니다';
}
async function undoLast(){
  if(busy||!undoSnap||(G&&G.fight)) return;
  if(!(await askConfirm(`「${undoLabel}」 행동을 되돌릴까요?\n(이야기와 소지품이 그 행동 이전 상태로 돌아갑니다. 이미 쓴 AI 사용량은 돌아오지 않습니다.)`))) return;
  let g=null; try{ g=JSON.parse(undoSnap) }catch(e){}
  if(!g||!g.char){ toast('되돌릴 수 없습니다'); resetUndo(); return }
  G=g; migrate(); undoSnap=null; undoLabel=''; persistUndo();
  chronLastDay=null;
  renderLogAll();
  save(); render(); toast('↩ 직전 행동을 되돌렸습니다');
}
/* 턴이 시작될 때: 되돌리기 기준점(마지막 저장 상태) · 이번 턴 사용량 초기화 */
on('before',-10,T=>{
  undoSnap=stableSnap||snapG(); undoLabel=T.action.replace(/\s+/g,' ').slice(0,28); persistUndo();
  USAGE_TURN={in:0,out:0,cost:0,unk:false,cr:0}; updateUsageChip();
});

/* =========================================================
   30. 카스르 밖의 마을 — 와하 · 천막들 · 자르한
   카스르 성문에서 '먼 길 떠나기'. 마을에서도 유적 원정을 떠날 수 있고, 원정을 마치면 그 마을로 돌아옴
   ========================================================= */
function curTown(){ return TOWNS[G.town]||TOWNS.east }
function townPos(id){ const t=TOWNS[id]; if(t&&t.pos) return t.pos; const p=MAP_PLACES.find(x=>x.id===id); return p?{x:p.x,y:p.y}:KASR }
function townOpen(id){ const t=TOWNS[id]; return !!t&&(t.west?G.act>=3:(!t.port||G.act>=3||(G.townVisited||[]).includes(id))) }
function basePos(){ return G&&G.base&&TOWNS[G.base]?townPos(G.base):KASR }
function baseName(){ return G&&G.base&&TOWNS[G.base]?TOWNS[G.base].n:'카스르' }
function priceHere(k){ return G&&G.loc==='town'?curTown().price[k]:(isTown()?PRICE_TOWN:PRICE_ROAD)[k] }
function mountPrice(k){ return Math.round(MOUNTS[k].price*((G&&G.loc==='town'&&curTown().mountDisc)||1)) }
function returnBase(){
  if(G.base&&TOWNS[G.base]){ G.loc='town'; G.town=G.base; G.dungeon=null; G._yuminHere=false; G.choices=[]; save(); render() }
  else enterCity(false);
}

/* =========================================================
   33. 여행 — 카스르 · 마을 · 항구 · 이람 · 석판의 도시 사이의 모든 이동
   - 일수 = 지도 거리 ÷ DAY_DIST (반올림, 최소 1일)
   - 하루마다 물·식량 1 (사료를 먹은 낙타가 있으면 물은 절반) + 출발 때 탈것 사료 1회
   - 이틀 이상 걸리는 육로에서는 가끔 길 위의 사건(대상 상인 · 유민 · 도적) — 길 한가운데서 멈춤
   ========================================================= */
function curPos(){ return G.loc==='town'?townPos(G.town):G.loc==='home'?HOME_POS:KASR }
function curPlaceName(){ return G.loc==='town'?curTown().n:G.loc==='home'?(G.home.name||'거점'):'카스르' }
/* 날랜 탈것(말)은 사료를 먹여 원기 왕성할 때만 빠름: 길 위(귀환 포함)에서는 떠날 때 먹인 상태 그대로, 마을에서 떠날 때는 사료 1을 줄 식량이 있어야 함 */
function mountFast(){ const m=G&&G.mount&&MOUNTS[G.mount.type]; if(!m||!m.fast||!G._mountFed) return false; return isWild()||G.food>=m.feed+1 }
function travelDays(a,b){ const f=mountFast()?0.75:1; return Math.max(1,Math.round(Math.hypot(a.x-b.x,a.y-b.y)*f/DAY_DIST)) }
function townDays(id){ return travelDays(KASR,townPos(id)) }
function travelNeed(days){
  const m=mountDef(), feed=m&&G.food-days>=m.feed?m.feed:0, camel=!!(m&&m.noWater&&feed);
  return {days,water:camel?Math.floor(days/2):days,food:days,feed};
}
/* 여행 도중·귀환길: 탈것은 떠날 때 이미 먹였음 — 사료 없이, 먹인 낙타면 물 절반 */
function travelNeedFed(days){ return {days,water:mountNoWater()?Math.floor(days/2):days,food:days,feed:0} }
function needText(n){ return `${n.days}일 · 물 -${n.water} · 식량 -${n.food}${n.feed?` · 사료 -${n.feed}`:''}` }
/* 걸린 날만큼 소비. keepFed: 여행 도중(두 번째 구간)이라 탈것은 이미 먹였음. 모자라면 그만큼 체력 */
function travelPay(n,keepFed){
  const m=mountDef();
  if(!keepFed){ G._mountFed=false; if(m&&n.feed){ G.food-=n.feed; G._mountFed=true } }
  const lack=Math.max(0,n.water-G.water)+Math.max(0,n.food-G.food);
  G.water=Math.max(0,G.water-n.water); G.food=Math.max(0,G.food-n.food);
  if(lack){ G.hp=Math.max(1,G.hp-lack); addLog('fx',`목마름과 허기 속에 걸었습니다 (체력 -${lack})`) }
  G.day+=n.days; G.time='낮'; G.dayStep=0;
  G.dungeon=null; G._yuminHere=false; G.choices=[]; G.base=null;
  return `물 -${n.water}, 식량 -${n.food}${n.feed?`, 사료 -${n.feed}`:''}`;
}
/* 지금 있는 곳에서 갈 수 있는 곳 */
function tripDests(){
  const here=G.loc==='town'?G.town:G.loc==='city'||G.loc==='home'?'kasr':null, out=[];
  if(here!=='kasr') out.push({kind:'kasr',key:'kasr',name:'카스르',ic:'🏙',pos:KASR,desc:'사막 교역로가 만나는 도시. 거점이 가까이 있다.'});
  Object.entries(TOWNS).forEach(([id,t])=>{ if(id!==here&&townOpen(id)) out.push({kind:'town',key:id,name:t.n,ic:t.ic,pos:townPos(id),desc:t.desc,perk:t.perk}) });
  if(G.actDone&&G.act<3) out.push({kind:'big',key:'iram',name:'이람',ic:'✨',pos:IRAM_POS,desc:'별지도가 가리킨 전설의 황금 도시. 큰 유적이다.'});
  return out;
}
function openTravel(){
  if(!isTown()||spotBlock()) return;
  const rows=tripDests().map(d=>{
    const n=travelNeed(travelDays(curPos(),d.pos)), ok=G.water+G.food>0;
    return `<div class="lex"><div class="h"><b>${d.ic} ${d.name}</b><span class="cat">${n.days}일 거리${d.kind==='town'&&!(G.townVisited||[]).includes(d.key)?' · 처음':''}</span></div>
      <div class="muted" style="font-size:13px">${d.desc||''}</div>${d.perk?`<div style="font-size:13px;margin-top:4px">✨ ${d.perk}</div>`:''}
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted">${needText(n)}${G.water<n.water||G.food<n.food+n.feed?' <b style="color:var(--danger)">· 모자람 (모자란 만큼 체력 감소)</b>':''}</span>
      <button class="small primary" ${busy?'disabled':''} onclick="${d.kind==='big'?`startBig('${d.key}')`:d.kind==='kasr'?'travelBack(true)':`travelTo('${d.key}')`}">떠나기</button></div></div>`;
  }).join('');
  modal('🐫 길 떠나기',`<p class="muted">지금 있는 곳: <b>${curPlaceName()}</b>. 여행 일수는 지도 거리로 정해지고, 하루마다 물·식량이 1씩 듭니다(사료를 먹은 낙타가 있으면 물은 절반). 이틀 이상 걸리는 길에서는 대상 상인·유민·도적을 만날 수도 있습니다. 거점은 카스르 바로 옆입니다.</p>${rows}${G.act>=3?`<div class="row" style="margin-top:8px"><button class="small" onclick="openCities()">🗺 석판의 도시들 보기</button></div>`:''}`);
}
/* 여행 시작: 사건이 생기면 길 한가운데(사막 길)에서 멈추고, 아니면 바로 도착
   dest.kind: kasr · town · big · ruin(유적 원정)   dest.ret: 유적에서 돌아가는 길(조용히 도착)
   opt: {fromPos, fromName, keepFed(귀환길 — 사료 없음), event('yumin'|'yuminEvt' 강제 만남), action(행동 기록 문구)} */
function beginTrip(dest,days,opt){
  opt=opt||{};
  const n=opt.keepFed?travelNeedFed(days):travelNeed(days), from=opt.fromName||curPlaceName(), fromPos=opt.fromPos||curPos(), base=G.loc==='town'?G.town:null;
  const ev=opt.event||(!dest.sea&&n.days>=2&&Math.random()<TRIP_EVENT);
  const first=!ev?n.days:n.days>=2?Math.floor(n.days/2):0;
  const n1={days:first,water:Math.round(n.water*first/n.days),food:first,feed:n.feed};
  sfx('travel');
  if(opt.action!==false) addLog('action',opt.action||`${dest.name}${josa(dest.name,'으로','로')} 길을 떠난다`);
  dest.base=dest.base!==undefined?dest.base:base;
  const cost=travelPay(n1,opt.keepFed);
  G.base=dest.kind==='ruin'?dest.base:dest.ret&&dest.kind==='town'?dest.key:null;   // 길에서 쓰러지면 돌아갈 곳
  const how=dest.sea?'⛵ 바닷길로':'🐪 사막을 건너';
  if(!ev){ addLog('sys',`${how} ${n.days}일 만에 ${dest.name}${dest.ret?josa(dest.name,'으로','로')+' 돌아왔습니다':'에 도착했습니다'}. (${cost})`); return arriveDest(dest) }
  G.trip={dest,left:n.days-first,water:n.water-n1.water,from,fromPos};
  G.loc='road'; G.nextPos=dest.ret?null:dest.pos;
  addLog('sys',first?`🐪 ${from}에서 ${first}일째 — ${dest.name}까지 ${G.trip.left}일 남았습니다. (${cost})`:`🐪 ${from}${josa(from,'을','를')} 나서자마자 — ${dest.name}까지 ${G.trip.left}일 거리입니다.${n.feed?` (${cost})`:''}`);
  return tripEvent(opt.event);
}
async function continueTrip(){
  const t=G.trip; if(busy||!t||t.bandit) return;
  const n=travelNeedFed(t.left);
  if(!(await askConfirm(`${t.dest.name}${josa(t.dest.name,'으로','로')} 계속 갈까요? (${needText(n)})`))) return;
  const cost=travelPay(n,true); G.trip=null;
  addLog('sys',`🐪 ${n.days}일 더 걸어 ${t.dest.name}${t.dest.ret?josa(t.dest.name,'으로','로')+' 돌아왔습니다':'에 도착했습니다'}. (${cost})`);
  return arriveDest(t.dest);
}
function arriveDest(d){
  sfx('arrive');
  G.trip=null; G.nextPos=null;
  if(d.ret){   // 유적에서 돌아옴 — 조용히 도착 (예전 귀환과 같음)
    const mc=mountCarry(); if(mc) addLog('fx',mc);
    G.base=d.kind==='town'?d.key:null; return returnBase();
  }
  if(d.kind==='ruin'){ G.base=d.base||null; G.loc='road'; G.nextPos=d.pos; return arriveDungeon() }
  if(d.kind==='kasr') return enterCity(false);
  if(d.kind==='town') return arriveTown(d.key);
  if(d.kind==='big') return enterBig(d.key,d.base);
}
function arriveTown(id){
  const t=TOWNS[id];
  G.loc='town'; G.town=id; G.dungeon=null;
  if(!G.discovered.includes(id)) G.discovered.push(id);
  G.townVisited=G.townVisited||[];
  const first=!G.townVisited.includes(id); if(first) G.townVisited.push(id);
  if(first) G.chronicle.push({day:G.day,text:`처음으로 ${t.n}에 발을 들였다`});
  const reg=(MAP_PLACES.find(p=>p.id===id)||{}).region, r=G.rumors.find(x=>x.region===reg);
  let extra=`[도착 장면] ${t.n}에 ${first?'처음 ':''}도착했다. ${t.desc} 이곳의 풍경·냄새·사람들을 그려라. 사람들의 말투와 풍습을 카스르와 다르게. 숫자 effects는 0.`;
  if(r&&!G.heardRumors.includes(reg)){ G.heardRumors.push(reg); extra+=` 이곳 사람들이 믿는 보물 소문: "${r.belief}" — 누군가의 말로 자연스럽게 들려줘라.` }
  aiTurn(`${t.n}에 도착한다`,extra,false);
}
async function travelTo(id,skipConfirm){
  const t=TOWNS[id]; if(busy||!t||!townOpen(id)||!isTown()) return;
  if(G.loc==='town'&&G.town===id) return toast(`이미 ${t.n}에 있습니다`);
  const days=travelDays(curPos(),townPos(id));
  if(skipConfirm!==true&&!(await askConfirm(`${t.n}${josa(t.n,'으로','로')} 떠날까요? (${needText(travelNeed(days))})`))) return;
  closeModal();
  beginTrip({kind:'town',key:id,name:t.n,pos:townPos(id)},days);
}
async function travelBack(skipConfirm){
  if(busy||G.loc!=='town') return;
  const days=travelDays(curPos(),KASR);
  if(skipConfirm!==true&&!(await askConfirm(`카스르로 돌아갈까요? (${needText(travelNeed(days))})`))) return;
  closeModal();
  beginTrip({kind:'kasr',key:'kasr',name:'카스르',pos:KASR},days);
}

/* ---------- 길 위의 사건 ---------- */
function tripEvent(force){
  const t=G.trip, wst=!!(WEST[t.dest.key]||Object.keys(WEST).some(id=>TOWNS[id].n===t.from)), where=`${t.dest.name}${josa(t.dest.name,'으로','로')} ${t.dest.ret?'돌아가는':'가는'} ${wst?'길':'사막 길'}`;
  if(force){   // 원정 길의 유민 만남 (예전 원정 규칙 그대로)
    rollCaravan('trip');
    if(force==='yumin'&&!G.comp.met) return meetYumin(where);
    if(yuminEventReady()) return aiTurn('뜨거운 사막 길을 걷는다',yuminEventText(where),false);
  }
  const opts=[['merchant',40],['bandit',35]];
  if(G.comp&&!G.comp.joined) opts.push(['yumin',25]);
  if(rivalOn()&&G.act<4) opts.push(['rival',20]);
  let x=Math.random()*opts.reduce((a,o)=>a+o[1],0), k=opts[0][0];
  for(const o of opts){ if((x-=o[1])<0){ k=o[0]; break } }
  if(k==='merchant'){
    const r=()=>Math.floor(Math.random()*3);
    G.caravan={here:true,loc:'road',day:G.day,name:rand(CARAVANS),stock:{water:4+r(),food:4+r(),torch:2+r()},talked:false};
    addLog('sys',`🐫 길 위에서 「${G.caravan.name}」을(를) 만났습니다 (🐫 버튼으로 거래)`);
    return aiTurn('사막 길을 걷는다',`[길 위의 만남] ${where}에서 「${G.caravan.name}」이(가) 쉬어 가고 있다. 그들의 모습과 짧은 대화. 거래는 플레이어가 버튼으로 한다. effects는 0.`,false);
  }
  if(k==='rival'){
    const R=G.rival, first=!R.known; R.known=true;
    addLog('sys',`🏴 길 위에서 적대 세력 「${R.name}」과(와) 마주쳤습니다`);
    fightStart('road');
    return aiTurn('사막 길을 걷는다',`[길 위의 마주침 — 적대 세력] ${where}에서 「${R.name}」의 무리와 마주친다. ${first?`처음 보는 무리다. 우두머리는 ${R.leader}. 겉모습: ${R.look}.`:'전에 소문으로 들은 그 무리다.'} ${fragAtRisk()?'그들은 별지도 조각을 빼앗으려는 악한 적대 세력이다. 플레이어가 가진 조각을 내놓으라고 협박하며 길을 막아서는 장면.':'그들은 이람과 왕의 보물을 노리는 악한 적대 세력이다. 별지도는 이미 완성되었으므로 조각을 내놓으라는 요구는 하지 말고, 길을 막고 위협하며 시비를 거는 장면.'} 싸움이 막 벌어지려는 순간에서 멈추고 결말은 쓰지 말 것 — 대응(${fragAtRisk()?'싸우기·도망·흥정·조각 내주기':'싸우기·도망·흥정'})은 플레이어가 버튼으로 고른다. choices는 빈 배열 []. 그들의 숨은 목적(${R.motive})은 직접 말하지 말고 섬뜩한 말끝에 살짝 비치게만. 그들 가운데 이름 있는 인물이 플레이어와 말을 섞으면 relations에 넣어라. 물·식량·금화 effects는 0.`,false);
  }
  if(k==='yumin'){
    if(!G.comp.met) return meetYumin(where);
    if(yuminEventReady()) return aiTurn('사막 길을 걷는다',yuminEventText(where),false);
    G._yuminHere=true; G.comp.spot='road'; G.comp.spotDay=G.day;

const TRAVEL_VERB='(으로|로|에|를|을)?\\s*(간다|가자|가기로|가려|떠난|떠나|향한|향해|돌아간|돌아가|이동|여행|출발)';
const TRAVEL_NAMES=[['kasr',/카스르/],['east',/와하/],['south',/천막/],['north',/자르한/],['westport',/서쪽\s*(만의\s*)?나루|서쪽\s*항구/],['eastport',/동쪽\s*(해안의\s*)?나루|동쪽\s*항구/],['iram',/이람/],
  ['cities',/(섬의\s*도시|지하\s*도시|바위산\s*도시|마른\s*호수|석판의\s*도시|섬으로)/],
  ['hillcastle',/하르다|숲속\s*성/],['lighthouse',/등대/],['port',/푸른\s*만|포구/],['westfort',/서쪽\s*성채|성채\s*마을/],['woodvil',/숲길\s*마을/],['cliff',/절벽/],['swport',/남서\s*항구/],['palmgate',/야자\s*숲|돌문/],
  ['far',/(서쪽\s*땅)/]];
function travelTarget(t){
  const hit=([k,re])=>new RegExp(re.source+'[가-힣\\s]{0,8}'+TRAVEL_VERB).test(t);
  const found=(G.cities||[]).find(c=>c.found&&new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[가-힣\\s]{0,8}'+TRAVEL_VERB).test(t));
  if(found) return {kind:'big',key:found.id,name:found.name};
  const e=TRAVEL_NAMES.find(hit); if(!e) return null;
  const k=e[0];
  if(k==='far') return {kind:'far'};
  if(k==='cities') return G.act>=3?{kind:'cities'}:{kind:'far'};
  if(k==='kasr') return G.loc==='town'?{kind:'kasr',key:'kasr',name:'카스르',pos:KASR}:null;
  if(k==='iram') return G.actDone&&G.act<3?{kind:'big',key:'iram',name:'이람',pos:IRAM_POS}:G.act>=3?null:{kind:'far'};
  if(!townOpen(k)) return {kind:'far'};
  if(G.loc==='town'&&G.town===k) return null;
  return {kind:'town',key:k,name:TOWNS[k].n,pos:townPos(k)};
}
function travelLabel(t){
  const d=travelTarget(t); if(!d) return '';
  if(d.kind==='cities') return '🗺 석판의 도시 목록 열기';

/* 등급별 개수의 합계를 G.mat.relic에 맞춤. 시설 짓기·선물로 줄었으면 흔한 것부터 뺌 */
function relicSync(tot){
  if(!G||!G.mat) return;
  if(!Array.isArray(G.relicG)) G.relicG=[0,0,0,0];
  tot=tot==null?(G.mat.relic||0):tot;
  let s=G.relicG.reduce((a,b)=>a+b,0);
  if(s<tot) G.relicG[0]+=tot-s;
  for(let g=0;s>tot&&g<4;g++){ const x=Math.min(G.relicG[g],s-tot); G.relicG[g]-=x; s-=x }
}
function relicText(){ relicSync(); return RELIC_GRADES.map((r,g)=>G.relicG[g]?`${r.s} ${G.relicG[g]}`:'').filter(Boolean).join(' · ') }
/* 방의 위험도가 높을수록, 자르한 근처 유적일수록 좋은 등급 */
function relicRoll(){
  const r=curRoom(), odds=RELIC_ODDS[clamp(r?r.danger:1,0,3)];
  let x=Math.random()*100, g=0;
  for(;g<3;g++){ if((x-=odds[g])<0) break }
  if(G.dungeon&&G.dungeon.rich&&g<3&&Math.random()<0.35) g++;
  return g;
}
on('applied',15,(e,{snap})=>{
  const n=G.mat.relic-snap.relic; if(n<=0) return;
  relicSync(snap.relic);
  for(let i=0;i<n;i++){ const g=relicRoll(); G.relicG[g]++; addLog('fx',`🏺 ${RELIC_GRADES[g].n}을(를) 얻었습니다 (감정가 🪙${RELIC_GRADES[g].p})`) }
});

  if(key==='iram') return {key,terrain:'iram',pos:IRAM_POS,name:'이람',req:{},reqText:'특별한 준비 없음'};

/* 가는 길: 섬은 가까운 나루에서 배로(바닷길), 나머지는 지금 있는 곳에서 육로 */

async function startBig(key,skipConfirm){

const TIDE_MAX=14, NOISE_HUNT=3, MIRAGE_P=0.4;
function cityRule(){ const d=G&&G.dungeon; return d&&d.big&&CITY_TYPES[d.terrain]?d.terrain:null }
/* 도착할 때(새로 들어가거나 이어서 들어갈 때) */
function cityArrive(d){

/* 판정 결과에 따라 (rollCheck가 부름) */
function cityOnCheck(skill,res){
  if(cityRule()!=='underground'||G.loc!=='dungeon') return;
  if(res!=='success') noiseAdd(res==='fail'?2:1,res==='fail'?'판정 실패의 소란':'어설픈 몸놀림');

function noiseAdd(n,why){
  const d=G.dungeon, b=d.noise||0; d.noise=b+n;
  addLog('fx',`👂 소음 +${n} (${why}) — ${d.noise}/${NOISE_HUNT}`);
  if(b<NOISE_HUNT&&d.noise>=NOISE_HUNT) addLog('sys','👁 어둠 속에서 무언가가 소리를 따라 움직이기 시작합니다. 이동할 때마다 몸을 숨겨야 합니다 (야영하면 가라앉음)');
}
/* 방 이동 전에: 막히면 {stop:true}, 다른 곳으로 가게 되면 {id} */
function cityMoveGate(d,r){
  const t=cityRule(); if(!t||G.loc!=='dungeon') return {};
  const cur=curRoom()||{}, first=!r.visited;
  if(t==='island'&&(d.tideLeft||0)<=0&&(r.lv||0)>=2){
    toast('🌊 바닷물이 차올라 그쪽 회랑은 잠겨 있습니다. 야영해 밤을 넘기면 물이 빠집니다'); return {stop:true};
  }
  if(t==='mountain'&&first&&(r.lv||0)>(cur.lv||0)){
    const text=`「${r.name}」 쪽 바위벽을 기어오른다`;
    const note=rollCheck('str',r.danger>=2?'hard':'normal',text);
    if(rollCheck.last==='fail'){
      addLog('action',text);
      story(text,{extra:note+' [등반 실패] 플레이어는 위로 오르지 못하고 원래 있던 구역에 그대로 있다. 다른 구역으로 이동한 것처럼 쓰지 말 것. 다시 시도할 여지를 남겨라.',checkHP:true,noActionLog:true});
      return {stop:true};
    }
    pend(note+` [등반] 바위벽을 올라 「${r.name}」에 닿았다. 거센 바람과 아찔한 높이를 짧게 그려라.`,{checkHP:true});
    return {};
  }
  if(t==='oasis'&&first&&Math.random()<MIRAGE_P){
    const note=rollCheck('sur','normal','길을 찾');
    if(rollCheck.last==='fail'){
      const back=d.rooms.filter(x=>x.visited&&x.id!==cur.id);
      const to=back.length?rand(back):null;
      addLog('sys',`🌫 신기루에 홀려 ${to?`「${to.name}」(으)로 되돌아갔습니다`:'제자리를 맴돌았습니다'}`);
      if(!to){ addLog('action',`「${r.name}」 쪽으로 가려 한다`); story(`「${r.name}」 쪽으로 가려 한다`,{extra:note+' [신기루] 소금 바닥 위에 어른거리는 신기루에 홀려 길을 잃고 한참을 헤매다 제자리로 돌아왔다. 다른 구역에 도착한 것처럼 쓰지 말 것.',checkHP:true,noActionLog:true}); return {stop:true} }
      pend(note+` [신기루] 플레이어는 「${r.name}」 쪽으로 가려 했지만 소금 바닥 위의 신기루에 홀려 이미 와 본 「${to.name}」(으)로 되돌아왔다. 헛걸음의 허탈함과 어른거리는 환영을 그려라.`,{checkHP:true});
      tick(); return {id:to.id};
    }
    pend(note+' [신기루] 소금 바닥 위에 신기루가 어른거렸지만, 플레이어는 그것이 환영임을 알아보고 제 길을 찾았다.',{checkHP:true});
    if(rollCheck.last==='partial') tick();
    return {};
  }
  if(t==='underground'){
    let note='';
    if((d.noise||0)>=NOISE_HUNT){
      note=rollCheck('sur','normal','몰래 숨어');
      note+=rollCheck.last==='success'?' [추적자] 뒤를 밟던 무언가를 따돌리고 숨죽여 이동했다.':' [추적자] 어둠 속에서 뒤를 밟던 무언가가 덮쳐 왔다. 정체는 똑똑히 보이지 않게, 짧고 섬뜩하게.';
    }
    if(first&&r.danger>=2) noiseAdd(1,'위험한 구역의 메아리');
    if(note) pend(note,{checkHP:true});
    return {};
  }
  return {};
}

const RIVAL_START_DAY=3, RIVAL_PACE=[3,6], RIVAL_STEP=20, RIVAL_CITY_STEP=25, RIVAL_RACE_P=0.35, RIVAL_RACE_TURNS=12, RIVAL_FRAG_CAP=6;

/* 하루가 지날 때마다 (화면을 그릴 때 확인 — 여러 번 불려도 결과가 같음) */
function rivalTick(){
  if(!G||!G.char) return;
  if(!G.rival){ if(G.day>=RIVAL_START_DAY) rivalEnsure(); return }
  const R=G.rival; if(R.lastDay==null) R.lastDay=G.day;
  if(G.act>=4||R.defeated){ R.lastDay=G.day; return }
  while(R.lastDay<G.day){
    R.lastDay++;
    const before=R.prog;
    R.prog+=RIVAL_PACE[0]+Math.floor(Math.random()*(RIVAL_PACE[1]-RIVAL_PACE[0]+1));
    const step=G.act>=3?RIVAL_CITY_STEP:RIVAL_STEP;
    if(Math.floor(R.prog/step)>Math.floor(before/step)) rivalEvent();
  }
}

function rivalEvent(){
  const R=G.rival;
  if(G.act>=3&&G.cities){   // 3막: 아직 못 찾은 도시 하나에 먼저 닿음
    const c=G.cities.filter(x=>!x.found&&!x.rival); if(!c.length) return;
    const t=rand(c); t.rival=G.day; R.cities++;

    return;
  }
  const paused=(G.pausedRuins||[]).filter(d=>!d.raided);
  const withFrag=paused.filter(d=>d.rooms.some(r=>r.fragment&&!r.fragTaken));
  if(withFrag.length&&Math.random()<0.6){   // 중단한 유적의 별지도 조각을 빼앗김

    addLog('sys',`🏴 소식: 중단해 둔 유적 「${d.name}」이(가) 누군가에게 털렸다는 이야기가 들려옵니다`);
    return;
  }
  if(paused.length&&Math.random()<0.4){   // 유물만 쓸어 감
    const d=rand(paused); d.raided=G.day; d.rooms.forEach(r=>{ r.relicTaken=true });
    rivalNews(`「${R.name}」이(가) 「${d.name}」의 유물을 쓸어 갔다`,`「${R.name}」이(가) 「${d.name}」의 유물을 가져갔다`);
    addLog('sys',`🏴 소식: 「${d.name}」의 유물이 누군가에게 털렸다고 합니다`);
    return;

    return;
  }
  const near=rand(['카스르 남쪽','와하로 가는 길목','자르한 폐허 근처','모래언덕 너머']);
  rivalNews(`「${R.name}」이(가) ${near}의 작은 유적을 도굴하고 지나갔다`,null);
}

/* ---------- 적대 세력과의 전투 ----------

function rollIntent(){
  const F=G.fight, pool=['strike','surround','charge'];
  if(F.morale<=Math.ceil(F.max/2)) pool.push('waver','waver');
  if(fragAtRisk()&&G.fragments>0&&F.kind!=='heart') pool.push('snatch');
  let k=rand(pool); if(k===F.intent&&Math.random()<0.6) k=rand(pool);   // 같은 의도가 연달아 나오기 어렵게
  F.intent=k;

    if(res==='success'){ F.morale-=A.hit; out=A.hit>1?'크게 밀어붙인다':'적을 밀어낸다' }

    else out='공격이 막히고 반격을 받는다';
  }
  if(I.bad===k&&res!=='success'){ hurt(FIGHT_PUNISH,`적의 「${I.n.slice(2)}」에 그대로 걸려든다`); out+=` — 적이 노리던 수에 걸려들어 크게 다친다` }
  if(I.snatch&&res!=='success'&&G.fragments>0&&fragAtRisk()){ G.fragments--; rivalSteal(); addLog('fx',`💎 적이 별지도 조각 하나를 낚아챘습니다 (${G.fragments}/${FRAG_GOAL})`); out+=' — 그 틈에 적이 별지도 조각 하나를 낚아챈다' }
  F.morale=Math.max(0,F.morale);
  if(F.morale!==before) addLog('fx',`⚔ 적의 기세 ${before} → ${F.morale}`);
  if(F.morale<=0) return fightEnd('win',A.text,note+` [전투] ${out}. 이 합으로 적이 무너진다.`);
  if(G.hp<=0) return fightEnd('lose',A.text,note);
  fightRound(A.text,note+` [전투 — 한 합] 적의 의도는 「${I.n}」였다. ${out}. 적의 기세 ${F.morale}/${F.max}.`);
}
/* 유민의 노래: 판정 없이 기세 -2 — 하지만 버릇대로 과하게 써서 판이 뒤집힘 (절반 확률로 부작용) */
function fightSong(){

  F.yumin=true; const b=F.morale; F.morale=Math.max(0,F.morale-2);
  addLog('action','유민에게 눈짓한다'); addLog('fx',`🎵 유민의 노래 — 적의 기세 ${b} → ${F.morale}`);
  let side='';

    const opts=['supply','hurt']; if(G.dungeon&&G.loc==='dungeon') opts.push('collapse');

    if(k==='collapse'){ const r=curRoom(); if(r) r.exhausted=true; addLog('fx','🪨 바람에 천장이 무너져 이 방은 더 조사할 수 없게 되었습니다'); side=' 부작용: 바람에 천장 일부가 무너져 이 방이 잔해에 묻힌다.' }
  }
  const t=`[유민의 노래] 유민이 노래로 바람과 모래를 불러 적을 휩쓴다. 버릇대로 과하게 써서 판이 크게 뒤집힌다.${side} 가사 한두 줄과 유민다운 농담(부작용이 있었다면 머쓱한 사과 섞인 농담) 한마디.`;
  if(F.morale<=0) return fightEnd('win','유민에게 눈짓한다',t+' 이 노래로 적이 무너진다.');
  if(G.hp<=0) return fightEnd('lose','유민에게 눈짓한다',t);
  fightRound('유민에게 눈짓한다',t+` 적의 기세 ${F.morale}/${F.max}.`);

function fightRetreat(){
  const F=G.fight; if(busy||!F) return;
  const text=F.kind==='road'?'짐 일부를 버리고 틈을 보아 물러난다':'틈을 보아 물러난다';
  addLog('action',text);
  const note=rollCheck('sur','normal',text+' 피해 간');
  if(rollCheck.last==='success'||rollCheck.last==='partial'){
    if(G.hp<=0) return fightEnd('lose',text,note);
    let extra=' [전투] 플레이어는 싸움에서 빠져나온다.';
    if(F.kind==='road'){ const w=Math.min(FIGHT_ESCAPE_LOSS,G.water), f=Math.min(FIGHT_ESCAPE_LOSS,G.food); G.water-=w; G.food-=f; addLog('fx',`🎒 달아나며 짐을 버렸습니다 (물 -${w} · 식량 -${f})`); extra+=' 쫓아오지 못하게 짐 일부를 내던지고 달아났다.' }
    return fightEnd('escape',text,note+extra);
  }
  if(G.hp<=0) return fightEnd('lose',text,note);
  fightRound(text,note+` [전투] 물러나려 했지만 길이 막혀 붙잡힌다. 적의 기세 ${F.morale}/${F.max}.`);
}

/* 결말: win · lose · flee(적이 물러남) · escape(내가 빠져나옴) · yield(조각을 내줌) */
function fightEnd(result,text,extra){
  const F=G.fight, R=G.rival, kind=F.kind; G.fight=null;
  sfx(result==='win'||result==='flee'?'win':result==='lose'?'lose':'notify');
  const loot=[], d=G.dungeon;
  if(result==='win'||result==='flee'){
    R.prog=Math.max(0,R.prog-(result==='win'?15:5));
    if(result==='win'){
      if(kind==='road'){ const g=15+Math.floor(Math.random()*16); G.gold+=g; loot.push(`금화 +${g}`);
        if(fragAtRisk()&&R.stolen>0&&Math.random()<0.35&&rivalReturn(1)) loot.push('빼앗겼던 별지도 조각 하나') }
      if(kind==='camp'){
        const n=fragAtRisk()?rivalReturn(FIGHT_CAMP_LOOT):0, g=FIGHT_CAMP_GOLD[R.campWins?1:0];
        R.campWins=(R.campWins||0)+1; G.gold+=g; loot.push(`금화 +${g}`); if(n) loot.push(`빼앗겼던 별지도 조각 ${n}개`);
        if(R.leader_st==='well'&&Math.random()<0.5){ R.leader_st='hurt'; loot.push(`우두머리 ${R.leader}에게 상처를 입힘`) }
      }
      if(kind==='heart'){ const c=(G.cities||[]).find(x=>d&&x.id===d.key); if(c) c.rival=false; loot.push('심장을 되찾음') }
      if(kind==='boss'){
        R.leader_st='down'; R.defeated=true;
        const c=(G.cities||[]).find(x=>d&&x.id===d.key); if(c) c.rival=false;
        loot.push(`우두머리 ${R.leader}이(가) 쓰러짐`);
        rivalNews(`「${R.name}」의 우두머리 ${R.leader}이(가) 쓰러지고 무리가 흩어졌다`,`「${R.name}」의 우두머리 ${R.leader}을(를) 쓰러뜨렸다 — 적대 세력이 흩어졌다`);
      }
      gainXp(kind==='boss'?6:kind==='road'||kind==='ruin'?2:3,'전투 승리');
    }
    if(kind==='ruin'&&d&&d.rival) d.rival.done=true;   // 이기거나 쫓아내면 경주 끝 — 조각은 아직 유적에
    if(kind!=='boss') G.chronicle.push({day:G.day,text:`적대 세력 「${R.name}」을(를) ${result==='win'?'물리쳤다':'물러나게 했다'}${loot.length?` — ${loot.join(', ')}`:''}`});
    addLog('fx',`🏴 ${result==='win'?'승리':'적이 물러남'}${loot.length?' · '+loot.join(' · '):''}`);
    if(loot.length) toast(`🏴 ${loot.join(' · ')}`);
  }else if(result==='lose'){
    if(fragAtRisk()&&G.fragments>0){ G.fragments--; rivalSteal(); loot.push('별지도 조각 하나를 빼앗김') }
    if(kind==='ruin'&&d&&d.rival){ d.rival.left=0 }
    G.chronicle.push({day:G.day,text:`적대 세력 「${R.name}」에게 졌다${loot.length?' — '+loot.join(', '):''}`});
    if(loot.length) addLog('fx',`🏴 ${loot.join(' · ')}`);
  }else if(result==='escape'){
    if(kind==='ruin'&&d&&d.rival) d.rival.left=Math.min(d.rival.left,2);
    addLog('fx','🏃 싸움에서 빠져나왔습니다');
  }else if(result==='yield'){
    G.fragments--; rivalSteal();
    G.chronicle.push({day:G.day,text:`적대 세력 「${R.name}」에게 별지도 조각을 내주고 길을 지났다`});
    addLog('fx',`💎 별지도 조각 -1 (${G.fragments}/${FRAG_GOAL})`);
    if(kind==='ruin'&&d&&d.rival) d.rival.done=true;
  }
  if(kind==='camp') R.raidCool=G.day+FIGHT_CAMP_COOL;
  const how={win:kind==='boss'
      ?`플레이어가 결전에서 이겼다. 우두머리 ${R.leader}이(가) 마침내 쓰러진다 — 죽음이든 패배를 인정하고 사막으로 사라지는 것이든, 그의 숨은 목적(${R.motive})이 마지막 말에 드러나게 장엄하고 긴장감 있게 그려라. 무리는 흩어진다.`
      :`플레이어가 이겼다. ${loot.length?`얻은 것: ${loot.join(', ')}. `:''}적이 흩어지거나 쓰러지는 마지막 장면. 우두머리 ${R.leader}은(는) 죽거나 붙잡히지 않는다 — 그 자리에 없었다면 남긴 흔적이나 전갈로, 있었다면 원한 섞인 한마디를 남기고 달아난다.`,
    flee:'적이 물러났다. 언젠가 다시 오겠다는 위협을 남기고 흩어진다.',
    lose:`플레이어가 졌다. ${loot.length?loot.join(', ')+'. ':''}의식이 흐려지는 순간에서 끝내라(구조는 게임이 처리함).`,
    escape:'플레이어가 싸움에서 빠져나와 몸을 숨긴다. 뒤에서 그들의 고함이 멀어진다.',
    yield:`플레이어가 별지도 조각 하나를 내주었다. ${R.leader}의 무리가 비웃으며 조각을 챙겨 길을 비킨다.`}[result];
  pend('',{fightTurn:true});
  story(text,{storyOnly:true,checkHP:true,noActionLog:true,extra:(extra||'')+` [전투 결말 — 코드가 정함] ${how} effects는 모두 0.`});
}

/* ---------- 성장 — 경험을 쌓아 최대 체력·능력치를 올림 ----------

const GROW_XP=6, HP_GROW=3, STAT_GROW_COST=2, STAT_MAX=6;
function gainXp(n,why){
  if(!G||n<=0) return;
  const before=Math.floor((G.xp||0)/GROW_XP);
  G.xp=(G.xp||0)+n;

function addLog(type,text){
  try{ sfxLog(type,text) }catch(e){}
  G.log.push({type,text});

  appendLogEl({type,text}); scrollLog();

function mdLite(t){
  return esc(t).replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+?)\*/g,'<em>$1</em>').replace(/\*+/g,'');
}

function appendLogEl(l){
  const el=document.createElement('div'); el.className='entry '+l.type;
  if(l.type==='scene') el.innerHTML=String(l.text).split(/\n+/).filter(Boolean).map(p=>`<p>${mdLite(p)}</p>`).join('');
  else el.textContent=l.text;
  document.getElementById('logInner').appendChild(el);
}
function scrollLog(){ const lg=document.getElementById('log'); lg.scrollTop=lg.scrollHeight }
function renderLogAll(){ document.getElementById('logInner').innerHTML=''; G.log.forEach(appendLogEl); scrollLog() }

  rivalTick(); fragXpCheck();
  clearStaleEvents();
  relicSync();
  sanitizeChoices();

function whereText(){

function fragDist(){
  const d=G.dungeon, fr=d.rooms.find(r=>r.fragment&&!r.fragTaken);
  if(!fr) return null;
  const dist={[fr.id]:0}, q=[fr];
  while(q.length){ const c=q.shift(); c.exits.forEach(x=>{ if(dist[x]===undefined){ dist[x]=dist[c.id]+1; q.push(d.rooms.find(y=>y.id===x)) } }) }
  return dist;
}

/* 대륙 그림: 해안선·지명 좌표 위에 지형을 코드로 그림 (한 번 만들어 재사용) */
/* 대륙 그림: 단색 지도 — 바다와 땅, 해안선만 (섬은 석판을 해독한 뒤 나타남). 색은 테마 변수 */
const MAPART=(function(){
  let cache=null;
  return function(isl){
    isl=isl||[]; const key=JSON.stringify(isl);
    if(cache&&cache.key===key) return cache.s;
    const SC=MAP_SC, f=n=>Math.round(n*10)/10;
    const C=COAST_PX.map(([x,y])=>[x*SC,y*SC]);
    const smooth=pts=>{ const n=pts.length; let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
      for(let i=0;i<n;i++){ const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
        d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}` }
      return d+'Z' };
    const blob=(x,y)=>{ const pts=[]; for(let i=0;i<10;i++){ const a=i/10*Math.PI*2, r=(i%2?7.5:10)+(i%3); pts.push([x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*0.8]) } return smooth(pts) };
    let s=`<svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
    s+=`<rect x="${VB.x}" y="${VB.y}" width="${VB.w}" height="${VB.h}" style="fill:var(--map-sea)"/>`;
    const land=d=>`<path d="${d}" style="fill:var(--map-land);stroke:var(--map-line);stroke-width:1.2;stroke-linejoin:round"/>`;
    s+=land(smooth(C));
    isl.forEach(p=>{ s+=land(blob(p.x,p.y)) });
    // 지형 기호 — 지명 표식 자리는 비워 둠
    const marks=[KASR,HOME_POS,IRAM_POS,...MAP_PLACES,...UNKNOWN_SPOTS];
    const free=(x,y)=>marks.every(m=>Math.hypot(m.x-x,m.y-y)>13);
    const sym='fill:none;stroke:var(--map-line);stroke-width:1;stroke-linejoin:round;stroke-linecap:round';
    let mt='';
    [...MOUNTAINS,[1150*SC,175*SC],[1240*SC,180*SC],[1330*SC,330*SC]].forEach(([x,y],i)=>{ if(!free(x,y)) return; const m=i<MOUNTAINS.length?5.5:4.2; mt+=`M${f(x-m)} ${f(y+m*.6)}L${f(x)} ${f(y-m)}L${f(x+m)} ${f(y+m*.6)}` });
    s+=`<path d="${mt}" style="${sym}"/>`;
    let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646 };
    let tr='';
    [[560,170,70],[470,300,50],[420,700,60],[290,700,40],[590,640,38],[330,255,30]].forEach(([cx,cy,r])=>{
      const X=cx*SC, Y=cy*SC, R=r*SC;
      for(let k=0;k<7;k++){ const a=rnd()*Math.PI*2, d=Math.sqrt(rnd())*R, x=X+Math.cos(a)*d, y=Y+Math.sin(a)*d*.8; if(!free(x,y)) continue;
        tr+=`M${f(x)} ${f(y+1.2)}v2.2M${f(x-2.2)} ${f(y+.4)}a2.2 2.2 0 1 1 4.4 0a2.2 2.2 0 1 1 -4.4 0` }
    });
    s+=`<path d="${tr}" style="${sym}"/>`;
    s+=`<rect x="${VB.x+.6}" y="${VB.y+.6}" width="${VB.w-1.2}" height="${VB.h-1.2}" style="fill:none;stroke:var(--map-line);stroke-width:1.2"/></svg>`;
    cache={key,s}; return s;
  };
})();

function roomSVG(){
  const d=G.dungeon, W=260, H=150;
  const vis=new Set(d.rooms.filter(r=>r.visited).map(r=>r.id)), show=new Set(vis);
  d.rooms.forEach(r=>{ if(vis.has(r.id)) r.exits.forEach(x=>show.add(x)) });
  const lvs=[...new Set(d.rooms.filter(r=>show.has(r.id)).map(r=>r.lv||0))].sort((a,b)=>a-b);
  const groups={}; d.rooms.filter(r=>show.has(r.id)).forEach(r=>{ const k=r.lv||0; (groups[k]=groups[k]||[]).push(r) });
  const pos={}, li={};
  lvs.forEach((k,j)=>{ li[k]=j; groups[k].forEach((r,i)=>{ pos[r.id]={x:lvs.length>1?32+(W-64)*j/(lvs.length-1):W/2,y:26+(H-56)*(i+0.5)/groups[k].length} }) });
  const fd=has('study')?fragDist():null;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="roomsvg" role="img" aria-label="유적 내부 지도">`;
  d.rooms.forEach(r=>{ if(!show.has(r.id)) return; r.exits.forEach(x=>{ if(r.id<x&&show.has(x)&&(vis.has(r.id)||vis.has(x))){ const a=pos[r.id],b=pos[x]; s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:var(--line);stroke-width:2.5"/>` } }) });
  d.rooms.forEach(r=>{
    if(!show.has(r.id)) return;
    const p=pos[r.id], cur=r.id===d.cur;
    if(!vis.has(r.id)){
      s+=`<circle cx="${p.x}" cy="${p.y}" r="9" style="fill:var(--bg);stroke:var(--muted);stroke-width:1.3;stroke-dasharray:3 3"/>`+svgText(p.x,p.y+4,'?',11,'var(--muted)');
      if(fd&&fd[r.id]!==undefined&&fd[d.cur]!==undefined&&fd[r.id]<fd[d.cur]) s+=svgText(p.x+14,p.y-8,'✧',12,'var(--gold)',700);
    }else{
      const done=!!r.exhausted||r.exits.every(id=>{ const o=d.rooms.find(y=>y.id===id); return !o||o.visited });
      if(cur) s+=`<circle class="pulse" cx="${p.x}" cy="${p.y}" r="9" style="fill:var(--accent)"/>`;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="9" style="fill:${cur?'var(--accent)':(done?'#5a8f5f':'#d49a3a')};stroke:var(--panel);stroke-width:2"/>`;
      if(r.fragTaken) s+=svgText(p.x,p.y+4,'★',11,'#fff',700,'middle',false);
      else if(done&&!cur) s+=svgText(p.x,p.y+4,'✓',11,'#fff',700,'middle',false);
      s+=svgText(p.x,li[r.lv||0]%2?p.y-14:p.y+23,trunc(r.name,6),9);
    }
  });
  return s+`</svg><div class="muted" style="font-size:11px;margin:2px 4px"><span style="color:#5a8f5f">●</span> 탐사 완료(더 찾을 것 없음/길 모두 확인) · <span style="color:#d49a3a">●</span> 더 조사 가능 · <span style="color:var(--accent)">●</span> 현재 · ? 미지${fd?' · ✧ 별지도 쪽':''}</div>`;
}

let _dd=null;
function decorDown(ev,id){
  const sc=document.getElementById('dcScene'); if(!sc) return;
  ev.preventDefault(); const el=ev.currentTarget; try{ el.setPointerCapture(ev.pointerId) }catch(e){}
  _dd={id,el,sc,x:null,y:null};
  el.onpointermove=decorMove; el.onpointerup=decorUp; el.onpointercancel=decorUp;
}
function decorMove(ev){
  if(!_dd) return;
  const r=_dd.sc.getBoundingClientRect();
  const x=clamp((ev.clientX-r.left)/r.width*100,2,98), y=clamp((ev.clientY-r.top)/r.height*100,2,98);
  _dd.el.style.left=x+'%'; _dd.el.style.top=y+'%'; _dd.el.style.zIndex=Math.round(y*10); _dd.x=x; _dd.y=y;
}
function decorUp(){
  if(!_dd) return; const d=_dd; _dd=null;
  if(d.fac){
    if(d.x!=null){ const o=facSlot(d.id); SET.facSlots=SET.facSlots||{}; SET.facSlots[d.id]={x:Math.round(d.x*10)/10,y:Math.round(d.y*10)/10,w:o.w}; saveSettings() }
    updateFacInfo(); return;
  }
  if(d.x!=null){ decorSt().placed[d.id]={x:Math.round(d.x*10)/10,y:Math.round(d.y*10)/10}; save() }

/* =========================================================
   37. 효과음 — 파일 없이 Web Audio로 만든 짧은 소리
   - sfx('이름') 하나로 재생. 브라우저는 사용자가 한 번 누른 뒤부터 소리를 허용하므로 첫 클릭 전에는 조용함
   - 음량: 끔 · 작게 · 보통 · 크게 (상단 🔊 버튼, 브라우저에 저장)
   - 나중에 실제 효과음 파일로 바꾸려면 SFX[이름]만 파일 재생으로 교체하면 됨
   ========================================================= */
const SFX_LV=[['끔',0],['작게',0.3],['보통',0.6],['크게',1]];
let _ac=null, _master=null, _sfxDay=null, _sfxLast={};
function sfxVol(){ const v=SET.sfxVol; return v==null?0.6:+v }
function sfxLabel(){ const v=sfxVol(), l=SFX_LV.find(x=>x[1]===v)||SFX_LV[2]; return (v?'🔊 ':'🔇 ')+l[0] }
function updateSfxBtn(){ document.querySelectorAll('.sfxBtn').forEach(b=>{ b.textContent=sfxLabel(); b.title='효과음 크기 바꾸기 (끔 → 작게 → 보통 → 크게)' }); if(_master) _master.gain.value=sfxVol() }
function cycleSfx(){
  const i=SFX_LV.findIndex(x=>x[1]===sfxVol());
  SET.sfxVol=SFX_LV[(i+1)%SFX_LV.length][1]; saveSettings(); updateSfxBtn();
  sfx('coin');
}
function sfxCtx(){
  if(!_ac){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    _ac=new C(); _master=_ac.createGain(); _master.gain.value=sfxVol(); _master.connect(_ac.destination);
  }
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
/* 음 하나: 시작 t, 길이 d, 파형, 세기 g, 끝 주파수 f2(있으면 미끄러짐) */
function tone(c,t,f,d,type,g,f2){
  const o=c.createOscillator(), a=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+0.008); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(a); a.connect(_master); o.start(t); o.stop(t+d+0.02);
}
/* 서서히 커졌다 줄어드는 음: 석판·결말 같은 화음용 (d 길이의 앞 40%는 커지는 구간) */
function swell(c,t,f,d,g){
  const o=c.createOscillator(), a=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f,t);
  a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+d*0.4); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(a); a.connect(_master); o.start(t); o.stop(t+d+0.02);
}
/* 갈색 잡음(저음이 센 부드러운 잡음) 한 번: 모닥불 */
function brown(c,t,d,g,f){
  const n=Math.max(1,Math.floor(c.sampleRate*d)), buf=c.createBuffer(1,n,c.sampleRate), ch=buf.getChannelData(0);
  let last=0; for(let i=0;i<n;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; ch[i]=last*3.5 }
  const s=c.createBufferSource(); s.buffer=buf;
  const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f||400;
  const a=c.createGain(); a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g,t+d*0.2); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl); fl.connect(a); a.connect(_master); s.start(t);
}
/* 잡음 한 번: 주사위·망치·바람 같은 소리 */
function noise(c,t,d,g,type,f,f2){
  const n=Math.max(1,Math.floor(c.sampleRate*d)), buf=c.createBuffer(1,n,c.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=buf;
  const fl=c.createBiquadFilter(); fl.type=type||'bandpass'; fl.frequency.value=f||1500; if(f2){ fl.frequency.setValueAtTime(f||1500,t); fl.frequency.exponentialRampToValueAtTime(f2,t+d) }
  const a=c.createGain(); a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl); fl.connect(a); a.connect(_master); s.start(t);
}

/* 우선순위(작을수록 먼저): 큰 사건 → 판정 결과 → 금화 → 소비·상태 → 알림. 같은 순간(약 60ms)에 여러 개가 요청되면 위에서 두 개만 냄.
   주사위 소리는 판정 결과와 한 쌍이라 따로 세지 않음. 클릭음은 항상 바로 냄 */
const SFX_PRI={collapse:0,ending:0,tablet:0,fightstart:0,win:0,lose:0,bandit:0,fragment:1,relic:1,levelup:1,
  success:2,partial:2,fail:2,coin:3,spend:3,hurt:4,heal:4,water:4,eat:4,build:4,travel:4,arrive:4,camp:4,newday:5,scene:6,notify:6,error:5};
let _sfxQ=[], _sfxTimer=null;
function sfx(name,delay){
  if(!sfxVol()||!SFX[name]) return;
  const now=Date.now(); if(_sfxLast[name]&&now-_sfxLast[name]<60) return; _sfxLast[name]=now;   // 같은 소리는 연달아 겹치지 않게
  if(name==='click') return sfxPlay(name,0);
  _sfxQ.push({name,delay:delay||0});
  if(!_sfxTimer) _sfxTimer=setTimeout(sfxFlush,60);
}
function sfxFlush(){
  _sfxTimer=null;
  const q=_sfxQ; _sfxQ=[];
  const main=q.filter(x=>x.name!=='dice').sort((a,b)=>(SFX_PRI[a.name]??9)-(SFX_PRI[b.name]??9)).slice(0,2);
  const diceIt=q.find(x=>x.name==='dice');
  if(diceIt&&main.some(x=>['success','partial','fail'].includes(x.name))) sfxPlay('dice',diceIt.delay);
  main.forEach(x=>sfxPlay(x.name,x.delay));
}
function sfxPlay(name,delay){
  try{ const c=sfxCtx(); if(c) SFX[name](c,c.currentTime+(delay||0)) }catch(e){}
}
/* 기록(addLog)의 효과 줄에서 알맞은 소리를 고름 — 위에서부터 처음 맞는 것 하나 */
function sfxLog(type,text){
  if(type==='scene') return sfx('scene');
  if(type!=='fx') return;
  const t=String(text||'');
  if(/★ 별지도 조각/.test(t)) return sfx('fragment');
  if(/🏺.*얻었습니다/.test(t)) return sfx('relic');
  if(/💪|❤ 최대 체력|성장 포인트/.test(t)) return sfx('levelup');
  if(/체력 -|🩸|목이 타들|허기가|🌑|차오른 물|길을 잃음|빼앗김|낚아챘/.test(t)) return sfx('hurt');
  if(/금화 \+|🪙.*\+|환불/.test(t)) return sfx('coin');
  if(/금화 -|배 삯|통행세|🪙.*-|정가 결제|확장 —/.test(t)) return sfx('spend');
  if(/체력 \+|정원의 대추/.test(t)) return sfx('heal');
  if(/🍞 식량 -1|사용 → 식량/.test(t)) return sfx('eat');
  if(/💧 물 -1|💧.*(채웠|\+)|사용 → 물/.test(t)) return sfx('water');
  sfx('notify');
}

   - 이름이 AI가 정한 장소라 코드가 미리 알 수 없던 곳도 같은 방식으로 처리. 이름을 직접 적어 추가할 수도 있음
   - 가면 그 이름의 유적이 새로 만들어지고, 도착하면 소문 목록에서 빠짐
   G.leads=[{id,name,hint,pos,day}] (최대 LEAD_MAX개, 넘치면 오래된 것부터 지움)
   ========================================================= */
const LEAD_MAX=6;
function leadKnown(name){
  const n=String(name||'').replace(/\s+/g,'');
  if(!n) return true;
  const same=x=>String(x||'').replace(/\s+/g,'')===n;
  if(['카스르','이람'].some(same)||Object.values(DISTRICTS).some(d=>same(d.n))||same(G.home&&G.home.name)||(G.cities||[]).some(c=>c.found&&same(c.name))) return true;
  return (G.leads||[]).some(l=>same(l.name))||MAP_PLACES.some(p=>same(p.n))||Object.values(TOWNS).some(t=>same(t.n))
    ||(G.pausedRuins||[]).some(d=>same(d.name))||(G.mapDone||[]).some(d=>same(d.name))||(G.dungeon&&same(G.dungeon.name));
}
function addLead(name,hint,quiet){
  if(!G) return false;
  name=String(name||'').trim().slice(0,14); hint=String(hint||'').trim().slice(0,80);
  if(name.length<2||leadKnown(name)) return false;
  if(!Array.isArray(G.leads)) G.leads=[];
  G.leads.push({id:'l'+(G.leadN=(G.leadN||0)+1),name,hint,pos:pickPos(),day:G.day});
  while(G.leads.length>LEAD_MAX) G.leads.shift();
  upsertLex(name,'장소',`${hint||'가는 길을 알게 된 곳.'} (소문으로 알게 된 장소 — 지도에 표시됨)`);
  G.chronicle.push({day:G.day,text:`「${name}」으로 가는 길을 알게 되었다`});
  if(!quiet){
    addLog('sys',`🗺 「${name}」이(가) 지도에 표시되었습니다 — 카스르 성문이나 마을의 「📍 소문의 장소」에서 찾아갈 수 있습니다.`);
    toast(`🗺 「${name}」이(가) 지도에 표시되었습니다`);
  }
  _sigM=''; return true;
}
on('after',61,T=>{ const ev=T.res&&T.res.event; if(ev&&ev.type==='place_lead') addLead(ev.name,ev.hint) });
on('facts',72,(o,rules)=>{
  if(!(G.leads||[]).length) return;
  o.소문의장소=G.leads.map(l=>`${l.name}${l.hint?'('+l.hint+')':''}`);
  rules.push('「소문의장소」는 플레이어가 이미 가는 길을 아는 곳이다. 이 장소로 떠나거나 도착하는 서술은 하지 말 것(원정 버튼이 처리). 다시 새로 알려 주는 event(place_lead)도 만들지 말 것.');
});
function leadByText(t){
  t=String(t||'');
  if(!/(간다|가자|가기로|가려|향한다|향해|떠난다|떠나|찾아|출발|이동|나선다|들어간다|걸어간다)/.test(t)) return null;
  const n=s=>String(s).replace(/\s+/g,'');
  return (G.leads||[]).find(l=>n(t).includes(n(l.name)))||null;
}
async function startLead(id){
  if(busy||!isTown()||spotBlock()) return;
  const l=(G.leads||[]).find(x=>x.id===id); if(!l) return;
  if(G.loc==='town'&&curTown().west) return toast('서쪽 땅에서는 소문의 장소로 원정을 떠날 수 없습니다');
  const days=travelDays(curPos(),l.pos), n=travelNeed(days);
  if(!(await askConfirm(`「${l.name}」${josa(l.name,'으로','로')} 떠날까요? (${needText(n)})`,'떠난다'))) return;
  closeModal(); startExpedition(l.id);
}
function removeLead(id){ G.leads=(G.leads||[]).filter(x=>x.id!==id); _sigM=''; save(); render(); openLeads() }
function addLeadManual(){
  const el=document.getElementById('leadName'); const v=(el&&el.value||'').trim();
  if(!v) return;
  const h=document.getElementById('leadHint');
  if(!addLead(v,h&&h.value.trim())) return toast('이미 알고 있는 장소이거나 이름이 올바르지 않습니다');
  save(); render(); openLeads();
}
function openLeads(){
  if(!G) return;
  const rows=(G.leads||[]).map(l=>{
    const days=isTown()?travelDays(curPos(),l.pos):null;
    return `<div class="lex"><div class="h"><b>📍 ${esc(l.name)}</b><span class="cat">${days?days+'일 거리':'—'}</span></div>
      <div class="muted" style="font-size:13px">${esc(l.hint||'가는 길을 알게 된 곳')}</div>
      <div class="row" style="justify-content:flex-end;gap:6px;margin-top:6px"><button class="small" onclick="removeLead('${l.id}')">지우기</button><button class="small primary" ${isTown()&&!busy?'':'disabled'} onclick="startLead('${l.id}')">🐪 찾아 떠나기</button></div></div>`;
  }).join('')||'<p class="muted">아직 소문으로 알게 된 장소가 없습니다. 이야기 속에서 가는 길을 알게 되면 여기에 기록되고 지도에 표시됩니다.</p>';
  modal('📍 소문의 장소',`<p class="muted" style="font-size:13px">이야기에서 가는 길을 알게 된 곳입니다. 카스르나 마을에서 일반 원정과 같은 비용(거리만큼 일수, 하루마다 물·식량 1)으로 찾아가면, 그 이름의 유적이 열립니다.</p>${rows}
    <h4 style="margin:14px 0 4px">직접 적기</h4>
    <div class="row" style="gap:6px;flex-wrap:wrap"><input id="leadName" placeholder="장소 이름 (예: 통곡의 회랑)" maxlength="14" style="flex:1;min-width:140px"><input id="leadHint" placeholder="가는 길·소문 (선택)" maxlength="80" style="flex:2;min-width:160px"><button class="small primary" onclick="addLeadManual()">추가</button></div>
    <p class="muted" style="font-size:12px">이야기에서 알게 됐는데 지도에 안 뜬 장소가 있으면 이름을 적어 추가하세요.</p>`);
}
/* 지도 표식 */
function leadsMapSVG(){
  return (G.leads||[]).map(l=>`<g transform="translate(${l.pos.x} ${l.pos.y})"><path d="M0 -7 L7 0 L0 7 L-7 0Z" style="fill:var(--bg);stroke:var(--gold);stroke-width:1.8;stroke-dasharray:3 2"/>${svgText(0,3.5,'!',9,'var(--gold)',900,'middle',false)}</g>`+lab(l.pos.x,l.pos.y+20,trunc(l.name,8),11.5,'var(--ink)',700)).join('');
}

/* =========================================================
   29. 시작 · 캐릭터 만들기 · 저장 파일
   ========================================================= */
function show(id){
  ['title','create','game'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
  if(id==='title') refreshTitle();
  if(id==='game') applySides();
}
function startCreation(){
  draft={origin:null,stats:{str:1,wis:1,cha:1,sur:1},traits:[]};
  document.getElementById('cName').value='';
  document.getElementById('cBio').value='';
  renderCreation(); show('create');
}
function renderCreation(){
  document.getElementById('originGrid').innerHTML=ORIGINS.map(o=>
    `<div class="opt ${draft.origin===o.id?'sel':''}" onclick="draft.origin='${o.id}';renderCreation()"><b>${o.name}</b><span>${o.desc}<br>고향: ${o.region}</span></div>`).join('');
  const used=Object.values(draft.stats).reduce((a,b)=>a+b,0)-4;
  document.getElementById('ptsLeft').textContent=`(남은 점수 ${POINTS-used})`;
  document.getElementById('statBox').innerHTML=STATS.map(s=>
    `<div class="stat-row"><span class="nm">${s.n}</span>
     <button class="small" onclick="adjStat('${s.k}',-1)">−</button>
     <span class="val">${draft.stats[s.k]}</span>
     <button class="small" onclick="adjStat('${s.k}',1)">+</button></div>`).join('');
  document.getElementById('traitGrid').innerHTML=TRAITS.map(t=>
    `<div class="opt ${draft.traits.includes(t.id)?'sel':''}" onclick="togTrait('${t.id}')"><b>${t.n}</b><span>${t.d}</span></div>`).join('');
}
function adjStat(k,d){
  const used=Object.values(draft.stats).reduce((a,b)=>a+b,0)-4, nv=draft.stats[k]+d;
  if(nv<1||nv>5||(d>0&&used>=POINTS)) return;
  draft.stats[k]=nv; renderCreation();
}
function togTrait(id){
  const i=draft.traits.indexOf(id);
  if(i>=0) draft.traits.splice(i,1);
  else if(draft.traits.length<2) draft.traits.push(id);
  else toast('특성은 2개까지 고를 수 있습니다');
  renderCreation();
}
async function finishCreation(){
  const name=document.getElementById('cName').value.trim();
  if(!name) return toast('이름을 입력해 주세요');
  if(!draft.origin) return toast('출신을 골라 주세요');
  const o=ORIGINS.find(x=>x.id===draft.origin);
  const stats={...draft.stats};
  for(const k in o.bonus) stats[k]+=o.bonus[k];
  const maxhp=10+stats.str*2;
  resetUndo();
  G={
    v:1,
    char:{name,origin:o.name,region:o.region,stats,traits:draft.traits.map(id=>TRAITS.find(t=>t.id===id).n),bio:document.getElementById('cBio').value.trim()},
    hp:maxhp,maxhp,water:4+(o.water||0),food:4,torch:3+(o.torch||0),gold:o.gold||30,
    items:[...(o.items||[])],
    fragments:0,act:1,day:1,time:'낮',loc:'city',steps:0,
    dungeon:null,dungeonsDone:0,
    secret:null,rumors:[],heardRumors:[],
    chronicle:[],lexicon:[],summary:'',recent:[],
    log:[],choices:[],
  };
  migrate();
  show('game'); renderLogAll();
  addLog('sys','세계를 빚는 중입니다… (보물의 정체와 각 지역의 전설을 정하고 있습니다)');
  busy=true; render();
  await genWorld();
  busy=false;
  G.log=G.log.filter(l=>!(l.type==='sys'&&/^세계를 빚는 중입니다/.test(l.text))); renderLogAll();
  enterCity(true);
}
async function genWorld(){
  const regions=ORIGINS.map(o=>o.region);
  const prompt=`새 게임의 숨겨진 설정을 정하라.
1) 이람 석판이 가리키는 '왕의 보물'의 진짜 정체를 다음 셋 중 하나로 고르거나 둘을 섞어 정하라: ${TRUTHS.join(' / ')}. 구체적 사연 2~3문장을 붙여라.
2) 다음 네 지역 사람들은 보물의 정체를 각기 다르게 믿는다. 지역마다 그 지역 사람들이 믿는 소문을 2문장으로 써라. 어떤 소문은 진실의 조각을, 어떤 소문은 오해를 담게 하라: ${regions.join(', ')}
3) 플레이어 캐릭터: ${G.char.name} (${G.char.origin}, 고향 ${G.char.region}). 배경: ${G.char.bio||'없음'}
출력은 JSON만:
{"truth":"정체 한 줄","detail":"구체 사연","rumors":[{"region":"지역명","belief":"소문"}],"opening":"카스르에 도착한 첫 장면 서술 2~3문단, 2인칭, 플레이어 배경과 고향 소문을 엮을 것"}`;
  let w=null;
  try{ w=parseJSON(await callAI(SYS_BASE,prompt,1500,'world')) }catch(e){ if(e.message!=='NO_KEY') addLog('sys','AI 연결 실패: '+e.message+' (기본 설정으로 진행합니다)') }
  if(!w||!w.truth){
    w={truth:rand(TRUTHS),detail:'오래전 왕은 그것을 지키기 위해 도시째 모래 아래로 숨겼다.',rumors:regions.map(r=>({region:r,belief:`${r} 사람들은 이람의 보물이 ${rand(TRUTHS)}라고 믿는다.`})),opening:null};
  }
  G.secret={truth:w.truth,detail:w.detail};
  G.rumors=(w.rumors||[]).map(r=>({region:r.region,belief:r.belief}));
  const home=G.rumors.find(r=>r.region===G.char.region)||G.rumors[0];
  if(home){ addLex({name:`${home.region}의 전설`,cat:'전설',desc:home.belief},true); G.heardRumors.push(home.region) }
  addLex({name:'이람',cat:'장소',desc:'하룻밤 사이 모래에 삼켜졌다는 황금 도시. 신전의 석판에 왕의 보물이 묻힌 곳의 좌표가 새겨져 있다고 한다.'},true);
  addLex({name:'카스르',cat:'장소',desc:'사막 교역로가 만나는 도시. 시장, 찻집, 여관이 있다.'},true);
  G.openingText=w.opening;
}
function continueGame(){
  try{ G=JSON.parse(localStorage.getItem(SAVE_KEY)) }catch(e){ G=null }
  if(!G) return toast('저장된 게임이 없습니다');
  migrate(); busy=false; show('game'); setTitle(G.act>=3); renderLogAll(); render();
}
function toTitle(){ save(); show('title') }
function exportSave(){
  const blob=new Blob([JSON.stringify(G,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`모래도시_${G.char.name}_${G.day}일.json`; a.click();
}
function importSave(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const g=JSON.parse(r.result); if(!g||!g.char) throw 0; resetUndo(); G=g; migrate(); save(); busy=false; show('game'); setTitle(G.act>=3); renderLogAll(); render() }catch(e){ toast('파일을 읽을 수 없습니다') } };
    r.readAsText(f) };
  inp.click();
}

/* 시작: 화면 설정 적용 · 공용 이벤트 */
document.addEventListener('toggle',ev=>{
  const d=ev.target;
  if(!(d instanceof HTMLDetailsElement)||!d.dataset.n||!d.closest('#sideR')) return;
  const n=d.dataset.n;
  if(d.open){ openLexSet.add(n); const e=G&&G.lexicon.find(x=>x.name===n); if(e&&e.isNew){ e.isNew=false; save(); render() } }
  else openLexSet.delete(n);
},true);
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape') return;
  if(document.getElementById('modalRoot').innerHTML) closeModal(); else closeSides();
});
window.addEventListener('resize',()=>{ applySides(); if(G&&!document.getElementById('game').classList.contains('hidden')){ _sigM=''; renderMapPanel() } });
applyFontScale(); applyTheme(); applyTopFold(); applySides(); updateUsageChip(); updateUndoBtn();
show('title');

</script>
